<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Умный поиск · Прототип по макетам Figma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8FC; --panel:#fff; --panel2:#FAFBFE;
  --line:#E6E9F1; --line2:#EEF1F7;
  --ink:#1B1E2B; --ink2:#4A5064; --ink3:#7A8296; --ink4:#A3AAB9;
  --blue:#2F5CE0; --blue-d:#2449C4; --blue-l:#EEF2FE; --blue-l2:#E3EAFD;
  --bub:#DCE7F9;
  --green:#1E9E5A; --green-bg:#E7F7EF;
  --red:#E5484D; --red-bg:#FDECEC;
  --amber:#B8760A; --amber-bg:#FFF4DE;
  --purple-bg:#EFF1FE; --purple:#5B5BD6;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Exo 2',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#D7DBE8;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

.app{height:100vh;display:flex;flex-direction:column}
.top{height:52px;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 18px;gap:14px;flex:none}
.logo{line-height:1.15}
.logo .n1{font-weight:800;font-size:15px;letter-spacing:-.01em}
.logo .n2{font-size:10.5px;color:var(--ink3)}
.top .sp{flex:1}
.ticons{display:flex;align-items:center;gap:4px}
.tic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--ink3);font-size:15px;position:relative}
.tic:hover{background:var(--blue-l);color:var(--blue)}
.tic .dot{position:absolute;top:1px;right:0px;background:var(--red);color:#fff;font-size:8.5px;
  font-weight:700;padding:1px 3px;border-radius:99px;line-height:1.3}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--green-bg);color:var(--green);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-left:4px;
  cursor:pointer;position:relative}
.avatar:hover{background:#D7F3E3}

.body{flex:1;display:flex;min-height:0}

.nav{width:230px;background:var(--panel);border-right:1px solid var(--line);flex:none;
  display:flex;flex-direction:column;transition:width .2s ease;overflow:hidden}
.nav.col{width:60px}
.nav .nsc{flex:1;overflow-y:auto;padding:12px 10px 14px}
.nnew{display:flex;align-items:center;justify-content:center;gap:8px;
  padding:10px;border:1px solid var(--line);border-radius:var(--r);color:var(--blue);
  font-size:13.5px;font-weight:600;background:var(--panel);margin-bottom:14px;width:100%}
.nnew:hover{border-color:var(--blue);background:var(--blue-l)}
.nrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;width:100%;
  text-align:left;color:var(--ink2);font-size:13.5px;white-space:nowrap;margin-bottom:1px}
.nrow:hover{background:var(--panel2)}
.nrow.on{background:var(--blue-l);color:var(--blue);font-weight:600}
.nrow .ic{width:17px;text-align:center;font-size:15px;flex:none;opacity:.85}
.nrow .tx{flex:1;overflow:hidden;text-overflow:ellipsis}
.nrow .cnt{font-size:11px;font-weight:700;background:var(--line2);color:var(--ink3);
  padding:1px 7px;border-radius:99px;flex:none}
.nrow.on .cnt{background:#fff;color:var(--blue)}
.nrow .chev{font-size:10px;color:var(--ink4);flex:none;transition:transform .15s}
.nrow .chev.open{transform:rotate(180deg)}
.nsub{padding-left:10px;margin-bottom:6px}
.nsubrow{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 16px;border-radius:8px;width:100%;
  text-align:left;font-size:13px;color:var(--ink2);white-space:nowrap}
.nsubrow:hover{background:var(--panel2)}
.nsubrow.on{background:var(--blue-l);color:var(--blue);font-weight:600}
.nsubrow .tx{flex:1;overflow:hidden;text-overflow:ellipsis}
.nsubrow .cnt{font-size:10.5px;font-weight:700;color:var(--ink4);flex:none}
.nav.col .tx,.nav.col .cnt,.nav.col .chev,.nav.col .nnew span{display:none}
.nav.col .nrow,.nav.col .nnew{justify-content:center;padding:9px 0}
.nav.col .nsub{display:none}
.navfoot{padding:8px;border-top:1px solid var(--line);flex:none}
.collapseb{width:100%;display:flex;align-items:center;justify-content:center;padding:7px;
  border-radius:7px;color:var(--ink4);font-size:13px}
.collapseb:hover{background:var(--panel2);color:var(--ink2)}

.cont{flex:1;min-width:0;display:flex;overflow:hidden}

/* ===== START ===== */
.start{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(180deg,#FBFBFE 0%,#F2F4FD 60%,#EFF1FC 100%)}
.start .in{width:100%;max-width:820px}
.start h1{font-size:32px;font-weight:700;letter-spacing:-.025em;text-align:center;margin-bottom:24px}
.qbox{background:#fff;border:1.5px solid var(--blue);border-radius:12px;padding:6px 6px 6px 18px;
  display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(47,92,224,.07)}
.qbox input{flex:1;border:none;outline:none;padding:12px 0;font-size:15px;background:none;color:var(--ink)}
.qbox input::placeholder{color:var(--ink4)}
.sendb{width:40px;height:40px;border-radius:9px;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.sendb:hover{background:var(--blue-d)}
.tip{margin-top:12px;background:#fff;border:1.5px solid var(--blue);border-radius:12px;
  padding:12px 16px;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--ink)}
.tip .x{color:var(--ink3);font-size:17px;padding:2px 5px;border-radius:6px;flex:none;margin-left:auto}
.tip .x:hover{background:var(--line2);color:var(--ink)}
.exam{margin-top:14px;text-align:center;font-size:13.5px;color:var(--ink3)}
.exam a{color:var(--blue);cursor:pointer;text-decoration:none}
.exam a:hover{text-decoration:underline}

/* ===== ONBOARD ===== */
.onb{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:60px;
  background:linear-gradient(180deg,#FBFBFE 0%,#F2F4FD 100%)}
.onb .in{max-width:640px;width:100%}
.onb h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-bottom:14px}
.onb .lead{font-size:14.5px;color:var(--ink2);line-height:1.6;margin-bottom:26px}
.onb .feat{display:flex;gap:14px;margin-bottom:20px}
.onb .fic{width:38px;height:38px;border-radius:9px;background:var(--blue-l);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.onb .ft{font-size:14.5px;font-weight:700;margin-bottom:3px}
.onb .fd{font-size:13px;color:var(--ink3);line-height:1.5}
.onb .go{margin-top:10px}

/* ===== CHAT ===== */
.chatcol{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);border-right:1px solid var(--line);
  transition:flex-basis .15s ease}
.chatcol.narrow{flex:0 1 340px}
.chatsc{flex:1;overflow-y:auto;padding:0 24px}
/* Отступы сверху/снизу — не padding, а пустые блоки внутри прокрутки (v9):
   прилипшие поиск и низ панели «Настроить поиск» встают вплотную к краю
   чата, и в полосе padding под ними не просвечивают карточки. */
.chatsc::before{content:'';display:block;height:20px}
.chatsc::after{content:'';display:block;height:10px}
.chatin{padding:10px 24px 18px;flex:none}
.tabox{background:#fff;border:1.5px solid var(--blue);border-radius:12px;padding:11px 13px;
  display:flex;flex-direction:column;gap:8px;min-height:80px}
.tabox textarea{border:none;outline:none;resize:none;flex:1;font-size:14px;background:none;
  color:var(--ink);min-height:36px}
.tarow{display:flex;align-items:center;gap:8px}
.tarow .sp{flex:1}

.m{margin-bottom:16px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.m.me{display:flex;justify-content:flex-end}
.m.me .b{background:var(--bub);border-radius:12px;padding:10px 15px;font-size:13.5px;max-width:78%;line-height:1.5}
.m.bot .b{font-size:13.5px;line-height:1.6;max-width:92%}
.m.bot .b b{font-weight:600}
.typing{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:13px;margin-bottom:16px}
.tdots{display:flex;gap:3px}
.tdots i{width:6px;height:6px;border-radius:50%;background:var(--blue);opacity:.35;animation:bnc 1s infinite}
.tdots i:nth-child(2){animation-delay:.15s}
.tdots i:nth-child(3){animation-delay:.3s}
@keyframes bnc{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

.sendb.muted{background:var(--panel2);color:var(--ink4);cursor:default}
.sendb.muted:hover{background:var(--panel2)}

.chiprow{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)}
.chiprow .lbl{font-size:11px;color:var(--ink4);width:100%;margin-bottom:1px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;
  font-size:12.5px;color:var(--ink2);font-weight:500}
.chip:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-l)}
.chip.muted{color:var(--ink4)}
/* «Назад» раньше был обычным чипом в общем ряду с вариантами ответа —
   визуально выглядел как ещё один вариант ответа, хотя по смыслу это
   навигация. Теперь стоит отдельной строкой НАД вариантами, со своим
   отступом и обводкой — не перепутать с ответом. */
.backrow{margin-top:6px}
.tipi{color:var(--ink4);cursor:help;font-size:12px}
.chip.back{border-color:var(--line);color:var(--ink3);font-weight:600;background:var(--panel2)}
.chip.back:hover{border-color:var(--ink2);color:var(--ink);background:var(--panel)}
.chip.prompt{border-style:dashed;color:var(--blue);background:var(--blue-l)}
.chip.prompt:hover{border-style:solid}

.ctac{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  display:flex;align-items:center;gap:12px;margin-top:10px;max-width:380px;cursor:pointer}
.ctac:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(47,92,224,.1)}
.ctac .ic{width:36px;height:36px;border-radius:9px;background:var(--blue-l);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.ctac .tx{flex:1;font-size:13.5px;font-weight:600;color:var(--blue)}
.ctac .cn{font-size:13.5px;color:var(--ink3);font-weight:600}

/* Применённые критерии над/под CTA — можно отменить конкретный (✕) или
   вернуться на шаг назад (← Назад), не открывая модалку «Критерии подбора». */
.critchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-width:420px}
.critchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:#fff;border-radius:99px;padding:5px 6px 5px 12px;font-size:12px;color:var(--ink2)}
.critx{border:none;background:var(--panel2);color:var(--ink3);width:17px;height:17px;border-radius:50%;
  font-size:11px;line-height:1;cursor:pointer;flex:none}
.critx:hover{background:var(--red);color:#fff}

.blist{margin-top:10px;padding-left:2px}
.blist li{font-size:13px;color:var(--ink2);margin-bottom:4px;list-style:none;padding-left:14px;position:relative}
.blist li::before{content:'•';position:absolute;left:2px;color:var(--ink4)}

.zerolink{color:var(--blue);text-decoration:none;font-weight:600;cursor:pointer}
.zerolink:hover{text-decoration:underline}
.infob{background:var(--blue-l);color:var(--ink2);border-radius:9px;padding:10px 13px;
  font-size:12.5px;line-height:1.5;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}

/* ===== RIGHT: Ход подбора ===== */
.rp{width:270px;flex:none;padding:14px 14px 14px 0;overflow-y:auto}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.pcard .t{font-size:13px;font-weight:700;margin-bottom:10px}
.prow2{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:8px}
.prow2 .l{color:var(--ink3)}
.prow2 .v{font-weight:700;color:var(--amber)}
.plist{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.pitem{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);padding:3px 0}
.pitem .nm{width:18px;height:18px;border-radius:5px;background:var(--blue-l);color:var(--blue);
  font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.pitem.ok .nm{background:var(--green-bg);color:var(--green)}
.pcta{margin-top:11px;width:100%;background:var(--blue);color:#fff;border-radius:9px;padding:9px;
  font-size:13px;font-weight:600;text-align:center}
.pcta:hover{background:var(--blue-d)}

/* ===== GRID ===== */
.gcol{width:620px;flex:1 1 620px;max-width:920px;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
.gh{padding:13px 15px 0;flex:none}
.gh1{display:flex;align-items:center;gap:9px}
.gh1 .x{width:24px;height:24px;border-radius:7px;color:var(--ink3);display:flex;
  align-items:center;justify-content:center;font-size:15px;flex:none}
.gh1 .x:hover{background:var(--line2);color:var(--ink)}
.gh1 .t{font-size:14.5px;font-weight:700;flex:1;letter-spacing:-.01em;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.gh1 .c{font-size:14.5px;color:var(--ink3);font-weight:600;flex:none}
.gh1 .kb{color:var(--ink4);font-size:15px;padding:2px 4px}
.gh2{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}
.gbtn{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);
  border-radius:99px;font-size:12.5px;color:var(--ink2);font-weight:500;background:#fff}
.gbtn:hover{border-color:var(--blue);color:var(--blue)}
.gbtn .bdg{background:var(--blue);color:#fff;font-size:10px;font-weight:700;
  padding:1px 6px;border-radius:99px;margin-left:1px}
.gsc{flex:1;overflow-y:auto;padding:10px 15px 60px;margin-top:8px}
.gpager{flex:none;display:flex;align-items:center;justify-content:center;gap:16px;
  padding:10px 15px;border-top:1px solid var(--line)}
.gpbtn{padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;
  font-size:12.5px;font-weight:600;color:var(--ink2)}
.gpbtn:hover{border-color:var(--blue);color:var(--blue)}
.gpbtn:disabled{opacity:.35;pointer-events:none}
.gpinfo{font-size:12px;color:var(--ink3);font-weight:500}
.prow{border-radius:10px;padding:10px 10px;cursor:pointer;display:flex;gap:10px;margin-bottom:2px;
  border:1px solid transparent}
.prow:hover{background:var(--panel2)}
.prow.on{background:var(--blue-l);border-color:var(--blue-l2)}
.cb{width:16px;height:16px;border:1.5px solid #C5CBDA;border-radius:5px;flex:none;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700;background:#fff}
.cb.on{background:var(--blue);border-color:var(--blue)}
.pin{flex:1;min-width:0}
.pr1{display:flex;gap:8px;align-items:flex-start}
.pr1 .nm{flex:1;font-size:12.5px;font-weight:600;line-height:1.4;letter-spacing:-.005em}
.pr1 .pz{font-size:12.5px;font-weight:600;white-space:nowrap;text-align:right}
.pr1 .pz.no{color:var(--ink3);font-weight:500;font-size:11.5px}
.pr2{display:flex;gap:6px;align-items:baseline;margin-top:3px;font-size:11px;color:var(--ink3);flex-wrap:wrap}
.pr3{display:flex;align-items:center;gap:6px;margin-top:4px}
.days{font-size:11px;color:var(--ink3);white-space:nowrap;font-weight:500}
.urg{color:var(--red);font-weight:600;font-size:11px}
.bulkbar{position:absolute;left:15px;right:15px;bottom:14px;background:var(--ink);color:#fff;
  border-radius:11px;padding:10px 14px;display:flex;align-items:center;gap:16px;
  box-shadow:0 8px 26px rgba(27,30,43,.25)}
.gcol{position:relative}
.bicon{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#fff;font-weight:500}
.bicon:hover{color:#8CB0FF}
.bicon.pri{font-weight:700}
.bulkbar .sp{flex:1}
.bcount{font-size:12px;color:#B9BFCC;font-weight:600}
.bx{color:#B9BFCC;font-size:16px}
.bx:hover{color:#fff}

/* ===== CARD ===== */
.ccol{width:420px;flex:none;background:#fff;display:flex;flex-direction:column;overflow:hidden;animation:slid .2s ease}
@keyframes slid{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.ch1{padding:13px 15px;display:flex;align-items:center;gap:8px;flex:none;flex-wrap:wrap}
.regn{border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:11.5px;color:var(--ink2);
  font-weight:500;display:flex;align-items:center;gap:5px}
.tagok{background:var(--green-bg);color:var(--green);font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px}
.ch1 .lot{font-size:12px;color:var(--ink3)}
.ch1 .sp{flex:1}
.csc{flex:1;overflow-y:auto;padding:0 16px 16px}
.ctit{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.35;margin-bottom:8px}
.ccust{font-size:13px;color:var(--blue);text-decoration:none;display:inline-block;margin-bottom:14px}
.ccust:hover{text-decoration:underline}
/* Аккуратнее, чем было: тонкая линия-разделитель между строками (а не
   голый список), значение справа обрезается многоточием, если слишком
   длинное (было — просто переносилось как попало и «плыло»), первая
   колонка не занимает больше половины ширины даже у длинных названий
   критериев. */
.ktab{width:100%;border-collapse:collapse;margin-bottom:12px}
.ktab tr{border-bottom:1px solid var(--line2)}
.ktab tr:last-child{border-bottom:none}
.ktab td{padding:8px 0;font-size:13px;vertical-align:baseline}
.ktab td:first-child{color:var(--ink3);padding-right:10px;max-width:55%}
.ktab td:last-child{text-align:right;font-weight:600;padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.morea{font-size:13px;color:var(--blue);cursor:pointer;display:inline-block;margin-bottom:14px}
.morea:hover{text-decoration:underline}
.docbox{background:var(--purple-bg);border-radius:12px;padding:13px 15px;margin-bottom:12px}
.docbox .dt{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:8px}
.spark{color:var(--purple);font-size:14px}
.docbox ul{padding-left:15px}
.docbox li{font-size:12.5px;color:var(--ink2);line-height:1.5;margin-bottom:4px}
.docbox a{color:var(--blue);text-decoration:none}
.docbox a:hover{text-decoration:underline}
.allcrit{font-size:12.5px;color:var(--blue);cursor:pointer;font-weight:500}
.allcrit:hover{text-decoration:underline}
.cfoot{padding:13px 15px;border-top:1px solid var(--line);display:flex;gap:8px;flex:none}
.bigb{flex:1;background:var(--blue);color:#fff;border-radius:10px;padding:11px;font-size:13.5px;
  font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.bigb:hover{background:var(--blue-d)}
.sqb{width:44px;border:1px solid var(--line);border-radius:10px;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;font-size:15px}
.sqb:hover{border-color:var(--blue);color:var(--blue)}

/* ===== FULL PAGES: Подборки / Шаблоны ===== */
.fpage{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--panel)}
.fph{padding:26px 32px 0;flex:none;display:flex;align-items:center;gap:16px}
.fph h1{font-size:26px;font-weight:700;letter-spacing:-.02em;flex:1}
.fbtn{display:flex;align-items:center;gap:8px;padding:9px 16px;background:var(--blue);color:#fff;
  border-radius:9px;font-size:13.5px;font-weight:600}
.fbtn:hover{background:var(--blue-d)}
.ftabs{display:flex;gap:22px;padding:18px 32px 0;border-bottom:1px solid var(--line);flex:none}
.ftab{padding-bottom:11px;font-size:13.5px;color:var(--ink3);font-weight:500;display:flex;gap:6px;
  border-bottom:2px solid transparent}
.ftab.on{color:var(--blue);border-color:var(--blue);font-weight:600}
.flist{flex:1;overflow-y:auto;padding:18px 32px}
.frow{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px 18px;margin-bottom:9px;
  display:flex;align-items:center;gap:13px;cursor:pointer}
.frow:hover{border-color:var(--blue)}
.frow.on{border-color:var(--blue);background:var(--blue-l)}
.frow .fi{width:36px;height:36px;border-radius:9px;background:var(--blue-l);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.frow .ftx{flex:1;min-width:0}
.frow .fn{font-size:14.5px;font-weight:600}
.frow .fmeta{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink4);margin-top:2px}
.frow .fdate{font-size:12.5px;color:var(--ink3);white-space:nowrap}
.fkb{color:var(--ink4);font-size:16px;padding:2px 4px;border-radius:6px;flex:none}
.fkb:hover{background:var(--line2);color:var(--ink)}

/* ===== side detail panel for folders/templates ===== */
.dcol{width:460px;flex:none;background:#fff;border-left:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;animation:slid .2s ease}
.dh{padding:16px 18px;display:flex;align-items:center;gap:10px;flex:none;border-bottom:1px solid var(--line)}
.dh .t{font-size:16px;font-weight:700;flex:1;letter-spacing:-.01em}
.dh .x{width:26px;height:26px;border-radius:7px;color:var(--ink3);display:flex;align-items:center;justify-content:center;font-size:16px}
.dh .x:hover{background:var(--line2);color:var(--ink)}
.dsc{flex:1;overflow-y:auto;padding:18px}
.frule{display:flex;padding:11px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.frule .fl{width:150px;color:var(--ink3);flex:none}
.frule .fo{width:80px;color:var(--ink4);flex:none}
.frule .fv{font-weight:600;color:var(--ink)}
.dactions{display:flex;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}
.dact{font-size:13px;color:var(--blue);font-weight:500;display:flex;align-items:center;gap:6px}
.dact:hover{text-decoration:underline}
.dact.pri{background:var(--blue-l);color:var(--blue);padding:9px 15px;border-radius:9px}
.dact.pri:hover{text-decoration:none;background:var(--blue-l2)}
.dact.danger{color:var(--red);margin-left:auto}

.efield{margin-bottom:14px}
.esearch{border:1px solid var(--line);border-radius:9px;padding:10px 13px;font-size:13px;color:var(--ink2);
  background:var(--panel2);display:flex;align-items:center;gap:8px;margin-bottom:16px}
.econd{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.econd .en{font-size:12.5px;color:var(--ink4);width:16px;flex:none}
.esel{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px;
  color:var(--ink2);display:flex;align-items:center;justify-content:space-between;background:#fff}
.esel.op{flex:0 0 90px}
.eadd{display:flex;align-items:center;gap:7px;color:var(--blue);font-size:13px;font-weight:500;margin:6px 0 20px}
.eadd:hover{text-decoration:underline}
.esave{background:var(--blue);color:#fff;padding:9px 18px;border-radius:9px;font-size:13.5px;font-weight:600}
.esave:hover{background:var(--blue-d)}
.ecancel{color:var(--ink3);font-size:13.5px;margin-left:12px}
.ecancel:hover{color:var(--ink)}

.req{display:none;font-size:9px;font-weight:700;color:var(--purple);background:var(--purple-bg);
  padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:1px}
body.reqs .req{display:inline-block}

/* ===== rail: progress + criteria link ===== */
:root{--rust:#9A3412;--rust-bg:#FBE4DA}
.pbar{height:6px;border-radius:99px;background:var(--rust-bg);overflow:hidden;margin-top:9px}
.pbar i{display:block;height:100%;border-radius:99px;transition:width .3s ease}
.pcrit{margin-top:13px;font-size:12.5px;color:var(--blue);font-weight:600;cursor:pointer;display:inline-block}
.pcrit:hover{text-decoration:underline}

/* ===== shared dropdown component (stable open/close) ===== */
.esel{position:relative}
.ddwrap{position:relative;display:inline-flex}
.ddtrig{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;
  font-size:12.5px;color:var(--ink2);gap:6px}
.ddmenu{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line);
  border-radius:9px;box-shadow:0 10px 28px rgba(27,30,43,.16);z-index:20;max-height:230px;overflow-y:auto;
  padding:4px;min-width:170px}
.ddmenu.up{top:auto;bottom:calc(100% + 4px)}
.ddopt{padding:7px 9px;font-size:12.5px;color:var(--ink2);border-radius:6px;white-space:nowrap}
.ddopt:hover{background:var(--blue-l);color:var(--blue)}
.ddopt.on{color:var(--blue);font-weight:600}
/* Выбор ПОЛЯ критерия — тот же .ddmenu, но со своим поиском сверху и
   группами по блокам (просьба заказчика, 18.08.2026): раньше это был
   сплошной нечитаемый список из ~35 названий. Список групп прокручивается
   отдельно от поля поиска, которое остаётся закреплено сверху. */
.fddmenu{padding:6px;min-width:250px;max-height:none;overflow:visible;display:flex;flex-direction:column;gap:6px}
.fddsearch{border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:12.5px;color:var(--ink);width:100%}
.fddsearch:focus{outline:2px solid var(--blue);outline-offset:1px}
.fddlist{max-height:260px;overflow-y:auto;padding-right:2px}
.fddgrp{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink4);
  padding:7px 9px 3px;margin-top:4px}
.fddgrp:first-child{margin-top:0}
.fddopt{white-space:normal}

/* ===== criteria modal ===== */
.modalbg{position:fixed;inset:0;background:rgba(27,30,43,.42);z-index:200;display:flex;
  align-items:center;justify-content:center;padding:24px}
/* ---------- спотлайт-тур по интерфейсу ----------
   Затемнение — НЕ один полноэкранный div с "дыркой" через clip-path (это
   ломается, если подсвечиваемый элемент лежит внутри overflow:hidden/auto
   родителя — .carw, например, живёт внутри прокручиваемой .chatsc). Вместо
   этого — 4 отдельных тёмных прямоугольника вокруг getBoundingClientRect()
   цели: работает всегда, независимо от вложенности и overflow. */
.tourlay{position:fixed;inset:0;z-index:1400;pointer-events:none}
.tourdim{position:fixed;background:rgba(15,17,26,.55);pointer-events:auto;transition:all .2s ease}
.tourring{position:fixed;border:2px solid var(--blue);border-radius:10px;
  box-shadow:0 0 0 4px rgba(47,92,224,.22);pointer-events:none;transition:all .2s ease}
/* Раньше сама подсвеченная область оставалась «дыркой» и в буквальном
   смысле кликабельной — можно было случайно взаимодействовать с реальным
   интерфейсом прямо во время тура (просьба заказчика, «заблокируй всё во
   время динамического онбординга»). Прозрачный блокирующий слой поверх
   ТОЙ ЖЕ области, что и .tourring, — сама подсветка видна как раньше
   (фон не меняем), но клик по ней теперь не доходит до настоящего
   элемента снизу, а просто листает тур дальше — так же, как клик по
   затемнению вокруг. */
.tourhole{position:fixed;background:transparent;pointer-events:auto;cursor:pointer}
.tourbub{position:fixed;background:#fff;border-radius:12px;padding:14px 16px;
  box-shadow:0 12px 32px rgba(27,30,43,.3);pointer-events:auto;z-index:1401}
.tourhead{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-weight:700;font-size:13.5px;margin-bottom:6px}
.tourdots{display:flex;gap:4px;flex:none}
.tourdots i{width:5px;height:5px;border-radius:50%;background:var(--line);display:block}
.tourdots i.on{background:var(--blue);width:14px;border-radius:3px}
.tourtext{font-size:12.5px;color:var(--ink2);line-height:1.5;margin-bottom:12px}
.tourfoot{display:flex;justify-content:flex-end;gap:8px}
/* Пропустить — не кнопка-конкурент, а мелкая ссылка: не должна случайно
   заменить собой основное действие (реальный ответ/переход к списку). */
.tourskip{font-size:11.5px;color:var(--ink4);text-decoration:underline dotted}
.tourskip:hover{color:var(--ink2)}
.modalcard{background:#fff;border-radius:16px;width:100%;max-width:740px;max-height:86vh;
  overflow-y:auto;box-shadow:0 20px 60px rgba(27,30,43,.3);padding:20px 22px}
.mhead{display:flex;align-items:center;margin-bottom:14px}
.mtitle{font-size:17px;font-weight:700;flex:1;letter-spacing:-.01em}
.mx{font-size:18px;color:var(--ink3);width:28px;height:28px;border-radius:8px;display:flex;
  align-items:center;justify-content:center;flex:none}
.mx:hover{background:var(--line2);color:var(--ink)}
.mrow0{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:11px 14px;margin-bottom:14px;font-size:13px;color:var(--ink2)}
.mrow0 .mquery{flex:1}
.mrow0 .mcount{font-weight:700}
.crow{display:flex;align-items:center;gap:7px;padding:6px 4px;border-radius:9px;margin-bottom:7px}
.crow.warn{background:#FFF8EC}
.cidx{width:15px;color:var(--ink4);font-size:12.5px;flex:none}
.cdelta{color:var(--ink4);font-size:12px;width:58px;text-align:right;flex:none}
.ctotal{font-weight:700;font-size:13px;width:54px;text-align:right;flex:none}
.cwarn{color:var(--amber);flex:none;font-size:14px}
.ctrash{color:var(--ink4);font-size:14px;width:27px;height:27px;border-radius:7px;display:flex;
  align-items:center;justify-content:center;flex:none}
.ctrash:hover{background:var(--red-bg);color:var(--red)}
.mfoot{display:flex;align-items:center;margin-top:16px;gap:14px}
.sp2{flex:1}
.eval{font-size:12.5px;color:var(--ink2)}

/* ===== модалка «Сохранить процедуры» ===== */
.sffield{border:1.5px solid var(--line);border-radius:10px;padding:10px 13px;margin-bottom:14px;transition:border-color .15s}
.sffield.on{border-color:var(--blue)}
.sflabel{font-size:11.5px;color:var(--ink3);margin-bottom:4px}
.sfrow{display:flex;align-items:center;gap:8px}
.sfrow input{border:none;outline:none;flex:1;font-size:13.5px;color:var(--ink);background:none}
.sfrow input:disabled{color:var(--ink4)}
.sfclear{color:var(--ink4);font-size:15px;width:22px;height:22px;border-radius:6px;flex:none;
  display:flex;align-items:center;justify-content:center}
.sfclear:hover{background:var(--line2);color:var(--ink)}
.sflist{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto}
.sfitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  border:1.5px solid var(--line);cursor:pointer}
.sfitem:hover{border-color:var(--blue-l2);background:var(--panel2)}
.sfitem.on{border-color:var(--blue);background:var(--blue-l)}
.sfi{font-size:16px;flex:none}
.sftx{flex:1;font-size:13.5px;font-weight:600;color:var(--ink)}
.sfcnt{font-size:12px;color:var(--ink3);flex:none}
.sfdate{font-size:12px;color:var(--ink4);flex:none;width:52px;text-align:right}
.sffoot{display:flex;gap:10px;margin-top:18px}
.sfbtn{flex:1;padding:11px;border-radius:9px;font-size:13.5px;font-weight:600;
  border:1px solid var(--line);color:var(--ink2)}
.sfbtn:hover{border-color:var(--blue);color:var(--blue)}
.sfbtn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.sfbtn.pri:hover{background:var(--blue-d)}

/* ===== LANDING: открытая часть Росэлторг (точка входа до онбординга) ===== */
.land{height:100vh;overflow-y:auto;background:radial-gradient(circle at 78% 8%,rgba(255,255,255,.06),transparent 45%),
  linear-gradient(165deg,#0B1440 0%,#132873 46%,#0E1C58 100%);color:#fff}
.ltop{display:flex;align-items:center;gap:26px;padding:16px 34px;border-bottom:1px solid rgba(255,255,255,.08)}
.ltop .llogo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:.01em;flex:none}
.ltop .llogo .lm{width:26px;height:26px;border:1.5px solid #fff;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-size:13px}
.lmenu{display:flex;align-items:center;gap:22px;flex:1;font-size:13.5px;color:rgba(255,255,255,.78);flex-wrap:wrap}
.lmenu a{white-space:nowrap;cursor:default}
.lmenu a:hover{color:#fff}
.licons{display:flex;align-items:center;gap:6px;flex:none}
.licons .tic{color:rgba(255,255,255,.8);position:relative}
.licons .tic:hover{background:rgba(255,255,255,.1);color:#fff}
.licons .dot{position:absolute;top:1px;right:0;background:var(--red);color:#fff;font-size:8.5px;font-weight:700;
  padding:1px 3px;border-radius:99px;line-height:1.3}
.lava{width:30px;height:30px;border-radius:50%;background:var(--green-bg);color:var(--green);display:flex;
  align-items:center;justify-content:center;font-size:11.5px;font-weight:700;margin-left:2px}
.lhero{padding:56px 24px 40px;text-align:center;max-width:900px;margin:0 auto}
.ltoggle{display:inline-flex;align-items:center;gap:12px;font-size:13.5px;color:rgba(255,255,255,.9);margin-bottom:26px}
.ltoggle .lsw{width:38px;height:22px;border-radius:99px;background:var(--blue);position:relative;flex:none}
.ltoggle .lsw i{position:absolute;top:2px;left:18px;width:18px;height:18px;border-radius:50%;background:#fff}
.lhero h1{font-size:38px;font-weight:700;letter-spacing:-.02em;margin-bottom:26px}
.ltabs{display:inline-flex;background:rgba(255,255,255,.08);border-radius:10px;padding:4px;gap:2px;margin-bottom:22px}
.ltabs button{padding:9px 20px;border-radius:8px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,.75)}
.ltabs button.on{background:#fff;color:var(--ink)}
.lbanner{background:linear-gradient(90deg,#3653D4,#6B4FE0);border-radius:13px;padding:15px 16px 15px 20px;
  display:flex;align-items:center;gap:16px;max-width:640px;margin:0 auto;cursor:pointer;
  box-shadow:0 10px 30px rgba(30,50,160,.35)}
.lbanner:hover{box-shadow:0 14px 36px rgba(30,50,160,.5)}
.lbanner .lbtxt{flex:1;text-align:left}
.lbanner .lbtxt b{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700}
.lbanner .lbtxt span{display:block;font-size:12.5px;color:rgba(255,255,255,.85);margin-top:3px}
.lbtn{background:#fff;color:var(--ink);font-weight:600;font-size:13px;padding:9px 18px;border-radius:8px;flex:none}
.lbtn:hover{background:#EDF0FA}
.lstd{margin-top:14px;font-size:12.5px;color:rgba(255,255,255,.55)}
.lcards{display:flex;gap:14px;padding:0 24px 40px;max-width:1120px;margin:0 auto;overflow-x:auto}
.lcard{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;
  width:160px;height:170px;flex:none;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;
  font-size:12.5px;font-weight:600;position:relative;overflow:hidden}
.lcard.big{width:300px;background:#EEF1FA;color:var(--ink)}
.lcard .lci{position:absolute;top:14px;right:14px;font-size:26px;opacity:.9}

/* ===== ЧИСЛО СРАЗУ: счётчик в ответах бота ===== */
.ncount{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.ncount.zero{color:var(--red)}
.qhead{font-weight:600}
.chip .cnt{color:var(--ink4);font-weight:600;margin-left:6px;font-variant-numeric:tabular-nums}
.chip.fix{border-color:var(--blue);color:var(--blue)}
.chip.fix:hover{background:var(--blue-l)}
.chip.ghost{border-style:dashed;color:var(--ink3)}
.chip.ghost:hover{border-style:solid}

/* ===== COMPOSER-ЛОТОК: быстрые условия рядом с полем ввода =====
   Не отдельная панель фильтров: лоток свёрнут по умолчанию, открывается
   кнопкой «+», заполненные чипы лежат над полем ввода как вложения к
   письму и уходят в чат одним сообщением вместе с текстом. */
.cmp{position:relative}
.cmpatt{display:flex;flex-wrap:wrap;gap:6px}
.cmpatt:empty{display:none}
.achip{display:inline-flex;align-items:center;gap:6px;background:var(--blue-l);color:var(--blue);
  border:1px solid var(--blue-l2);border-radius:99px;padding:4px 5px 4px 11px;font-size:12px;font-weight:600;position:relative}
.achip .an{cursor:pointer}
.achip .ax{width:17px;height:17px;border-radius:50%;background:#fff;color:var(--blue);font-size:11px;line-height:1;flex:none}
.achip .ax:hover{background:var(--red);color:#fff}
.cmpplus{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);color:var(--ink2);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;background:#fff}
.cmpplus:hover,.cmpplus.on{border-color:var(--blue);color:var(--blue);background:var(--blue-l)}
.cmpplus .pl{transition:transform .15s}
.cmpplus.on .pl{transform:rotate(45deg)}
.tfield{position:relative;display:inline-flex}
.tfield>button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:12.5px;
  color:var(--ink2);font-weight:500;display:flex;align-items:center;gap:5px}
.tfield>button:hover,.tfield.open>button{border-color:var(--blue);color:var(--blue);background:var(--blue-l)}
.tfield.filled>button{border-color:var(--blue);color:var(--blue)}
.tfield>button .car{font-size:9px;color:var(--ink4)}
/* Инлайн-попап значений прямо у чипа — как автодополнение, не сообщение бота. */
.tpop{position:absolute;left:0;z-index:40;background:#fff;border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 28px rgba(27,30,43,.18);padding:5px;min-width:210px;max-width:280px}
.tpop.down{top:calc(100% + 5px)}
.tpop.up{bottom:calc(100% + 5px)}
.tpop .tph{font-size:10.5px;color:var(--ink4);padding:4px 8px 5px;font-weight:600}
.tpop input{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12.5px;margin-bottom:4px;outline:none}
.tpop input:focus{border-color:var(--blue)}
.tpop .tpl{max-height:230px;overflow-y:auto}
.topt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 9px;border-radius:6px;
  font-size:12.5px;color:var(--ink2)}
.topt:hover{background:var(--blue-l);color:var(--blue)}
.topt.on{color:var(--blue);font-weight:600}
.topt .th{margin-left:auto;font-size:11px;color:var(--ink4);font-variant-numeric:tabular-nums}
/* ===== ПАЛИТРА УСЛОВИЙ («+» или «/» в поле ввода) =====
   Настоящий инлайн-слэш, как в Slack/Notion: «/запрос» печатается прямо
   в поле сообщения (не в отдельной строке поиска — её здесь больше нет),
   список — лёгкий ПЛАВАЮЩИЙ попап поверх композера (.cmp уже
   position:relative), а не блок, раздвигающий разметку. Список полей →
   клик по полю в ТОМ ЖЕ попапе заменяется выбором значения → выбор
   возвращает список для следующего поля, попап не закрывается — можно
   набрать несколько условий подряд. Живая фильтрация по вводу — прямой
   правкой innerHTML попапа (см. composerType), без render() на каждую
   букву, чтобы не терять фокус и курсор в поле ввода (тот же приём, что
   и у filterFieldOpts выше). */
.pal{position:absolute;left:0;right:0;z-index:45;background:#fff;border:1px solid var(--line);
  border-radius:10px;box-shadow:0 10px 28px rgba(27,30,43,.18);padding:6px;max-width:340px}
.pal.down{top:calc(100% + 6px)}
.pal.up{bottom:calc(100% + 6px)}
.palempty{padding:16px 10px;font-size:12px;color:var(--ink4);text-align:center}
.pallist{max-height:250px;overflow-y:auto;padding-right:2px}
.palgrp{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.03em;color:var(--ink4);padding:8px 6px 4px}
.palgrp:first-child{padding-top:2px}
.palopt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 8px;border-radius:6px;
  font-size:12.5px;color:var(--ink2)}
.palopt:hover{background:var(--blue-l);color:var(--blue)}
.palopt.filled{color:var(--blue);font-weight:600}
.palval{margin-left:auto;font-size:11px;color:var(--ink4);font-weight:500}
.palopt.filled .palval{color:var(--blue)}
/* Выбор значения конкретного поля — «страница назад» внутри той же панели. */
.palback{font-size:12px;color:var(--ink3);font-weight:600;margin-bottom:8px;display:inline-flex;align-items:center;gap:4px}
.palback:hover{color:var(--ink)}
.paledn{font-size:13px;font-weight:700;margin-bottom:8px}
.palnumrow{display:flex;gap:6px;align-items:center}
.palnumrow select,.palnumrow input{border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:12.5px;outline:none}
.palnumrow select{flex:none;background:#fff;color:var(--ink2)}
.palnumrow input{flex:1;min-width:0}
.palnumrow input:focus,.palnumrow select:focus{border-color:var(--blue)}
.palgo{background:var(--blue);color:#fff;border-radius:7px;padding:7px 14px;font-size:12.5px;font-weight:600;flex:none}
.palerr{color:var(--red);font-size:12px;margin-top:7px}
.palgo:hover{background:var(--blue-d)}
/* Панель «Все фильтры» в чате — компактные строки «группа: пилюли в строку»
   (не колонки со стопками — те получались громоздкими: 41 пилюля одна под
   другой, 14.09.2026). Клик по пилюле — выпадающий список прямо под ней
   (.tpop, тот же компонент, что у «Сузить:»), а не подмена всей панели
   редактором. Выбранное значение пишется в саму пилюлю («Аванс: от 30%» ✕),
   отдельной строки чипов под панелью нет. Критерии из документации свёрнуты
   в одну пилюлю «17 критериев ▾» — раскрываются по клику. Подсказка поля —
   в заголовке выпадающего списка текстом, а не в ⓘ на пилюле: на телефоне
   ховера нет, а в момент выбора значения она нужнее всего. */
.fgpanel{display:flex;flex-direction:column}
/* Верхняя строка панели (v12): текст бота слева, поиск справа. */
.fgtop{display:flex;align-items:center;gap:8px 20px;margin-bottom:12px}
.fglead{flex:1;min-width:0}
.chatcol.narrow .fgtop{flex-wrap:wrap}
.fgrow{display:flex;gap:10px;align-items:flex-start}
.fglab{flex:none;width:108px;font-size:11.5px;color:var(--ink3);font-weight:600;padding-top:6px;line-height:1.25}
.fgpills{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.fgpill>button{max-width:100%;text-align:left}
.fgpill.filled>button{background:var(--blue-l);border-color:var(--blue);color:var(--blue);font-weight:600}
.fgpill .fgx{margin-left:3px;color:var(--blue);opacity:.55;font-size:10px;padding:0 2px}
/* Пилюля всегда в одну строку: длинное значение («Способ проведения:
   Продажа посредством публичного предложения») обрезается многоточием,
   полный текст — в подсказке. Иначе пилюля переносилась в овал и панель
   вырастала на каждый выбор. */
.fgpill{max-width:100%}
.fgpill>button{max-width:100%;min-width:0;white-space:nowrap}
.fgpill .fgt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fgpill .fgx:hover{opacity:1}
.fgmore>button{border-style:dashed;color:var(--ink3)}
.fgpop{min-width:250px;max-width:310px;overflow-y:auto;overscroll-behavior:contain}
.fgpop.fgright{left:auto;right:0}
.fgpop .fgh{font-size:12.5px;font-weight:700;padding:5px 8px 2px;color:var(--ink)}
.fgpop .fgtip{font-size:11.5px;color:var(--ink3);padding:0 8px 7px;line-height:1.35}
.fgpop .palnumrow{padding:0 3px 3px}
.fgpop .palerr{padding:0 6px 4px}
/* Низ панели (v10): поиск по параметрам, сколько закупок будет, «Сбросить»
   и «Применить» — одной строкой. Прилипает к низу чата на случай, если
   экран всё-таки ниже панели. Кнопка есть всегда (неактивна без выбора) —
   высота низа от выбора не меняется. */
.fgfoot{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;
  margin-top:10px;padding:8px 0 6px;background:var(--bg);border-top:1px solid var(--line)}
.fgfoot .fgsum{font-size:12.5px;color:var(--ink2);line-height:1.35;min-width:0}
.fgfoot .fgsum b{font-weight:700;color:var(--ink)}
.fgfoot .fgsum .fgwas{color:var(--ink4);margin-left:4px}
.fgfoot .fgsum .fgzero{color:var(--red);font-weight:700}
.fgfoot .fgsum.muted{color:var(--ink4)}
.fgfoot>button{flex:none;white-space:nowrap}
.fgfoot .sp{flex:1}
.chatcol.narrow .fgfoot .fgsum{flex-basis:100%}
.fgreset{font-size:12px;color:var(--ink3);font-weight:600}
.onbhint{margin-top:8px;font-size:12.5px;color:var(--ink3);line-height:1.4}
.onbnext{margin:6px 0 0;padding-left:18px;line-height:1.5}
.qwait{margin-top:8px;font-size:12.5px;color:var(--ink3)}
.fgfoot .palgo:disabled{opacity:.45;cursor:default}
.fgreset:hover{color:var(--ink)}
.fgsearch{display:flex;align-items:center;gap:6px;flex:none;width:300px;height:30px;padding:0 9px;
  border:1px solid var(--line);border-radius:8px;background:#fff}
.fgsearch:focus-within{border-color:var(--blue)}
.fgsearch .ic{color:var(--ink4);font-size:12px;flex:none}
.fgsearch input{flex:1;min-width:0;border:none;outline:none;font-size:12.5px;background:transparent;color:var(--ink)}
.fgsearch .fgfound{flex:none;font-size:11px;color:var(--ink4);white-space:nowrap}
.fgsearch .fgfound.none{color:var(--red)}
.chatcol.narrow .fgsearch{width:100%}
.fg-collapsed{display:none}
.fgxtra{display:none}
.fgpill.fgdim{opacity:.25;pointer-events:none}
/* Значение выбрано в панели, но ещё не применено к поиску (лежит в
   S.panelTray, ждёт «Применить N») — визуально отличаем от уже реально
   применённого (.filled), чтобы было видно, что это черновик. */
.fgpill.queued>button{background:var(--amber-bg);border-color:var(--amber);color:var(--amber);font-weight:600}
.fgpill.queued .fgx{color:var(--amber)}
@media (max-width:620px){.fgrow{flex-direction:column;gap:5px}.fglab{width:auto;padding-top:0}}
/* ---------- «Настроить поиск» в чате (v10, 29.09.2026) ----------
   Сообщение-панель «Настроить поиск» (allFiltersPanelHtml) — часть чата, а
   НЕ отдельная модалка (та осталась как в v6, см. renderCritModal).
   История: v7 — карточки по образцу карусели критериев v3, страницами по 4,
   значение — во всплывающем окошке прямо у пилюли (.tpop/.fgpop); v8 —
   значение второй строкой, размер пилюли от выбора не зависит; v9 — все
   карточки сразу, но панель выше экрана.
   v10 — требования заказчика (29.09.2026):
   • все блоки и критерии помещаются на экране без прокрутки и листания:
     без карточек-подложек (только заголовок блока), пилюли 30px, блоки
     разложены по колонкам так, чтобы самая высокая колонка была как можно
     ниже, а число колонок — под ширину и высоту чата (см. fgLayout; числа
     там — те же, что здесь: FG.pillH = высота пилюли и т.д.);
   • значение — под названием, мелким шрифтом; место под него
     зарезервировано, выбор не двигает ни одну пилюлю;
   • несколько значений — сколько влезает и «+N», полный список — в тултипе
     при наведении (.fgtt, fgTipShow). */
.m.bot .b:has(.fgpanel){max-width:100%}
.fgcols{display:grid;column-gap:18px;row-gap:14px;align-items:start}
.fgblk{min-width:0}
.fghead{height:16px;margin-bottom:4px;font-size:12px;font-weight:700;line-height:16px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fgplist{display:flex;flex-direction:column;gap:3px}
/* Пилюля одной высоты — пустая и со значением: у пустой название по
   центру (длинное переносится на вторую строку), у заполненной — название
   сверху, значение мелко под ним.
   v11 (29.09.2026, «грязновато, тяжело, между краем и названием нет места»):
   высота 38px вместо 30 — у двух строк ~5px воздуха сверху и снизу, а не
   1px (высоту колонки держит fgLayout, см. FG.pillH); выбранное — светлой
   заливкой и тёмным названием, а не сплошной синей плашкой с белым текстом;
   крестик — только при наведении, поверх конца строки, и не отнимает у
   текста место. Высота задаётся переменной --fgph: на тесном экране
   fgLayout может взять пилюлю ниже, чтобы всё влезло. */
.crslpill{display:flex;min-width:0}
.crslpill>button{position:relative;display:flex;align-items:center;width:100%;min-width:0;height:var(--fgph,38px);
  text-align:left;border:1px solid #D3DCF7;border-radius:8px;padding:0 10px;
  font-size:12px;font-weight:500;color:var(--blue);background:#fff}
.crslpill>button:hover, .crslpill.open>button{background:var(--blue-l);border-color:#9FB3EF}
.crslpill .fgt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px}
.crslpill .fgl{line-height:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crslpill .fgl:only-child{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:14px}
.crslpill .fgv{display:flex;align-items:center;gap:4px;min-width:0;font-size:10.5px;font-weight:600;line-height:12px}
.crslpill .fgv1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.crslpill .fgmore{flex:none;font-size:9.5px;font-weight:700;line-height:13px;padding:0 5px;border-radius:6px;background:rgba(47,92,224,.12)}
.crslpill .fgx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:10.5px;background:inherit;opacity:0;transition:opacity .12s}
.crslpill:hover .fgx{opacity:1}
.crslpill .fgx:hover{background:rgba(27,30,43,.08)}
/* Применено — светлая синяя заливка, название тёмное, значение синее. */
.crslpill.filled>button{background:var(--blue-l);border-color:#A9BCF3;color:var(--ink2)}
.crslpill.filled .fgv{color:var(--blue)}
.crslpill.filled .fgx{color:var(--blue)}
/* Выбрано, но ещё не применено — то же, в янтарном. */
.crslpill.queued>button{background:var(--amber-bg);border-color:#EACB8C;color:var(--ink2)}
.crslpill.queued .fgv{color:var(--amber)}
.crslpill.queued .fgx{color:var(--amber)}
.crslpill.queued .fgmore{background:rgba(184,118,10,.14)}
/* Применённое значение, которое в черновике снимают: до «Применить» поиск
   не меняется, поэтому пилюля показывает зачёркнутое значение — видно, что
   именно уйдёт; ↺ возвращает как было. */
.crslpill.unset>button{background:#fff;border-style:dashed;border-color:#EACB8C;color:var(--ink3)}
.crslpill.unset .fgv{color:var(--amber)}
.crslpill.unset .fgv1{text-decoration:line-through;font-weight:500}
.crslpill.unset .fgx{color:var(--amber);font-size:13px}
/* Поиск не прячет и не переставляет пилюли — только приглушает
   неподходящие: всё остаётся на своих местах. */
.crslpill.fgdim{opacity:.28}
/* Вариант, при котором ничего не останется, — не прячем, но приглушаем. */
.fgpop .topt.zero{color:var(--ink4)}
.fgpop .topt.zero .th{color:var(--red)}
/* Несколько значений — галочками; окошко не закрывается на каждом выборе. */
.fgpop .fgchk .ck{width:14px;height:14px;flex:none;border:1.5px solid var(--ink4);border-radius:4px;
  display:inline-flex;align-items:center;justify-content:center;font-size:10px;line-height:1;color:#fff}
.fgpop .fgchk.on .ck{background:var(--blue);border-color:var(--blue)}
.fgpop .fgchk.on .ck::after{content:'✓'}
/* Низ окошка с «Готово» прилипает — длинный список прокручивается под ним. */
.fgpopfoot{position:sticky;bottom:-5px;display:flex;align-items:center;gap:8px;margin:4px -5px -5px;padding:7px 9px;
  border-top:1px solid var(--line);background:#fff;font-size:11.5px;color:var(--ink3)}
.fgpopfoot .sp{flex:1}
.fgpopfoot .palgo{padding:5px 12px}
/* Тултип со всеми значениями — один на страницу, живёт в body, вне render(). */
.fgtt{position:fixed;z-index:400;display:none;max-width:280px;padding:8px 11px;border-radius:8px;
  background:#1B1E2B;color:#fff;font-size:12px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.22);pointer-events:none}
.fgtt .h{font-weight:700;margin-bottom:3px}
.fgtt ul{margin:0;padding-left:16px}
.fgtt .s{margin-top:5px;color:#C9CEDB;font-size:11px}
/* Список закупок открыт — колонка чата узкая: подпись группы над пилюлями,
   чтобы значение в пилюле не обрезалось до «Способ провед…». */
.chatcol.narrow .fgrow{flex-direction:column;gap:5px}
.chatcol.narrow .fglab{width:auto;padding-top:0}
.crow .ctotal{white-space:nowrap;width:auto}
.chiprow+.chiprow{border-top:none;padding-top:0;margin-top:8px}
.start .cmpbox{background:#fff;border:1.5px solid var(--blue);border-radius:12px;padding:8px 8px 8px 14px;
  display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 10px rgba(47,92,224,.07)}
.start .cmprow{display:flex;align-items:center;gap:10px}
.start .cmprow input{flex:1;border:none;outline:none;padding:10px 0;font-size:15px;background:none;color:var(--ink)}
.m.me .mchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;justify-content:flex-end}
.m.me .mchips:first-child{margin-top:0}
.m.me .mchips span{background:#fff;border-radius:99px;padding:2px 9px;font-size:11.5px;color:var(--blue);font-weight:600}
.m.me .mchips span.mdel{color:var(--ink3);text-decoration:line-through;font-weight:500}

/* ===== RAIL: ход подбора по числу ===== */
.rnum{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
.rnum b{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rnum span{font-size:12.5px;color:var(--ink3)}
.rscale{position:relative;height:6px;border-radius:99px;background:var(--line2);margin:6px 0 4px}
.rscale .zone{position:absolute;top:0;bottom:0;background:var(--green);opacity:.55;border-radius:99px}
.rscale .mk{position:absolute;top:-4px;width:3px;height:14px;border-radius:2px;background:var(--ink);transform:translateX(-1px)}
.rscalel{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink4);margin-bottom:10px}
.rsub{font-size:12px;color:var(--ink3);margin:10px 0 6px}
.rsub b{color:var(--ink);font-weight:600}

/* ===== GRID: условия и необязательное сужение ===== */
.gh{position:relative;z-index:5}
.gh3{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.gh3 .gl{font-size:11px;color:var(--ink4);font-weight:600;margin-right:2px}
.gh3 .critchip{padding:3px 5px 3px 10px}
.gzero{padding:26px 10px;text-align:center;color:var(--ink3);font-size:13px;line-height:1.55}
.gzero .chiprow{justify-content:center;border-top:none}
/* ---------- v13: окошки выбора по способам ввода из «Критерии УПП (12)» ----------
   Классы с префиксом fx — чтобы не пересечься со старыми .chip/.chiprow. */
.fxpop{min-width:290px;max-width:330px;display:flex;flex-direction:column;gap:9px;padding:9px 10px}
.fxpop .fgh{padding:0}
.fxpop .fgtip{padding:0}
.fxhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fxreset{font-size:12px;color:var(--ink3);font-weight:600}
.fxreset:hover{color:var(--ink)}
.fxdep{font-size:11.5px;color:var(--amber);background:var(--amber-bg);border-radius:7px;padding:5px 8px}
.fxoff{opacity:.45;pointer-events:none}
.fxn{font-size:10.5px;color:var(--ink4);font-weight:500;margin-left:5px;font-variant-numeric:tabular-nums}
.fxseg{display:flex;flex-wrap:wrap;gap:3px;background:var(--line2);border-radius:9px;padding:3px}
.fxseg button{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12.5px;padding:5px 9px;border-radius:7px;color:var(--ink2);line-height:1.25}
.fxseg button .fxn{margin:0}
.fxseg button.on{background:#fff;color:var(--blue);font-weight:600;box-shadow:0 1px 3px rgba(27,30,43,.12)}
.fxseg button.zero{color:var(--ink4)}
.fxchips{display:flex;flex-wrap:wrap;gap:5px}
.fxchip{font-size:12.5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink2);white-space:nowrap}
.fxchip:hover{border-color:#C3D0F6}
.fxchip.on{border-color:var(--blue);background:var(--blue-l);color:var(--blue);font-weight:600}
.fxchip.on::before{content:'✓ '}
.fxchip.zero{color:var(--ink4)}
.fxunk{display:flex;align-items:flex-start;gap:7px;font-size:11.5px;color:var(--ink3);cursor:pointer;user-select:none;line-height:1.35}
.fxunk input{accent-color:var(--blue);margin:1px 0 0;flex:none}
.fxsw{display:flex;align-items:center;gap:9px;font-size:12.5px;cursor:pointer;user-select:none;color:var(--ink2)}
.fxsw i{width:32px;height:18px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.fxsw i::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.fxsw.on i{background:var(--blue)}
.fxsw.on i::after{left:16px}
.fxinp{border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12.5px;outline:none;background:#fff;width:100%;min-width:0;margin:0}
.fxinp:focus{border-color:var(--blue)}
.fxrow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3)}
.fxrow .fxinp{flex:1}

const MONTHS_RU=['янв.','февр.','мар.','апр.','мая','июн.','июл.','авг.','сен.','окт.','нояб.','дек.'];

  const base=new Date(2026,7,10);

   закупки на миллионы, а не только на сотни тысяч, как было раньше (базовый
   диапазон на запрос — 60 000–950 000, самая дорогая фиксированная категория
   — максимум 3.1 млн). Обычное равномерное распределение внутри одного
   диапазона это никогда не даст — сверху всегда будет то же самое макс.
   значение диапазона. Добавляем ~28% шанс попасть в отдельный «крупный»
   ценовой сегмент (от полутора базовых максимумов и минимум 2 млн — до
   45 млн), независимо от базового диапазона категории/запроса. */
function genPrice(rnd, baseMin, baseMax){
  if(rnd()<0.28){
    const bigMin = Math.max(baseMax*1.5, 2000000);
    const bigMax = Math.max(bigMin*3, 45000000);
    return Math.round((bigMin+rnd()*(bigMax-bigMin))/100)*100+0.99;
  }
  return Math.round((baseMin+rnd()*(baseMax-baseMin))/100)*100+0.99;
}
function mulberry32(seed){
  return function(){

    t=t+Math.imul(t^t>>>7,61|t)^t;

  };

const PAYMENT_EVENTS=['подписание актов','приемка','поставка','счет'];

/* Поиск процедуры по id раньше везде делался как PROCS.find(p=>p.id===id) —

   id→процедура даёт O(1) поиск независимо от того, сколько запросов уже
   было сделано. */
const PROCS_BY_ID = new Map();
const VARIANTS_PER_ITEM=6; /* 43 названия × 6 = ~258 процедур, без повторов текста внутри одного названия */
let _custCursor=0;
/* Одна процедура со всеми ~40 полями. Раньше этот блок был продублирован
   дословно в двух генераторах (демо-категории CATS и пакет под запрос) —
   теперь один, чтобы корреляции ниже не разъехались между ними.
   Корреляции (допущение синтетической базы, не статистика ЕИС):
   • аванс чаще бывает в крупных закупках, в мелких (до 300 тыс.) — редко;
   • мелкую закупку с авансом заказчик всегда страхует обеспечением заявки.
   Отсюда реальный конфликт условий «до 300 тыс. + аванс + без обеспечения»:
   каждая пара условий что-то находит, а все три вместе — ничего (сценарий
   «починки нуля», см. zeroCore()). */
function makeProc(rnd, o){
  const g=pickGeo(rnd);
  const cust=CUSTOMERS[_custCursor%CUSTOMERS.length]; _custCursor++;
  const tt=pickTT(rnd);
  const urgent=rnd()<0.06;
  const noPrice=rnd()<0.1;
  const nmck=noPrice?null:genPrice(rnd, o.pMin, o.pMax);
  const days=urgent?0.5:Math.round(1+rnd()*40);
  const pubDays=Math.round(rnd()*45); /* сколько дней назад опубликована — для сортировки «Дата публикации» */
  /* Приём заявок открывается в день публикации или чуть позже — реальное
     поле для критерия «Дата начала приёма заявок». */
  const appStartDays=Math.max(0, pubDays-Math.floor(rnd()*4));
  const orderType=o.orderType;
  const small = nmck!=null && nmck<=300000;
  const advProb = nmck==null ? 0.2 : small ? 0.1 : nmck<=1000000 ? 0.25 : 0.4;
  const hasAdvance = rnd()<advProb;
  const paymentType = hasAdvance ? (rnd()<0.5?'аванс':'комбо') : (rnd()<0.5?'отсрочка':'постоплата');
  const prepaidExpense=paymentType==='аванс'?(30+Math.floor(rnd()*70)):(paymentType==='комбо'?(10+Math.floor(rnd()*50)):0);
  const paymentEvent=PAYMENT_EVENTS[Math.floor(rnd()*PAYMENT_EVENTS.length)];
  const paymentStages=PAYMENT_STAGES[Math.floor(rnd()*PAYMENT_STAGES.length)];
  const paymentTerm=5+Math.floor(rnd()*25);
  const backingRequired=(small && hasAdvance) ? true : rnd()<0.55;
  const backingForm=backingRequired?(rnd()<0.5?'деньги':'БГ или деньги'):null;
  const applicationSecurityAmount=backingRequired?(1+Math.floor(rnd()*4)):null;
  const contractBackingForm=backingRequired?(rnd()<0.5?'деньги':'БГ или деньги'):null;
  const contractBackingSize=backingRequired?(5+Math.floor(rnd()*15)):null;
  const bankRestrictions=backingRequired?(rnd()<0.6?'да':'нет'):null;
  const bgValidityTerm=(backingRequired && contractBackingForm!=='деньги')?(30+Math.floor(rnd()*150)):null;
  const equivalentVal=orderType==='товары'?EQUIVALENT_VALS[Math.floor(rnd()*3)]:null;
  const experienceRequired=rnd()<0.25;
  const experienceFrom=experienceRequired?(rnd()<0.6?EXPERIENCE_SRC_VALS[0]:EXPERIENCE_SRC_VALS[1]):null;
  const nationalRegime=orderType==='товары'?(rnd()<0.35?'да':'нет'):(rnd()<0.1?'да':'нет');
  const assessmentMethod=ASSESSMENT_VALS[rnd()<0.7?0:1];
  const isExperience=assessmentMethod==='не только цена' && rnd()<0.5;
  const howExperience=isExperience?(rnd()<0.6?EXPERIENCE_SRC_VALS[0]:EXPERIENCE_SRC_VALS[1]):null;
  const deliveryMode=DELIVERY_MODES[Math.floor(rnd()*DELIVERY_MODES.length)];
  const docsList=rnd()<0.3?'да':'нет';
  const priceOfferTerm=10+Math.floor(rnd()*20);
  const status=rnd()<0.85?STATUS_VALS[0]:STATUS_VALS[1];
  const method=METHOD_VALS[Math.floor(rnd()*METHOD_VALS.length)];
  const msp=rnd()<0.4;
  /* КСР — классификатор именно строительных ресурсов, поэтому у работ
     используется значительно чаще, чем у товаров/услуг. */
  const usesKSR=orderType==='работы'?rnd()<0.6:rnd()<0.1;
  /* Срок поставки — критерий «Критерии из документации» (строка 16),
     которого раньше не было вообще: карточка не показывала, к какому сроку
     нужно исполнить контракт, только срок ПОДАЧИ заявки (p.days). Считаем
     от даты окончания приёма заявок — исполнение не может начаться раньше. */
  const deliveryTerm=days+5+Math.floor(rnd()*55);
  /* Объём закупки — тоже отсутствовал (строка 32 того же листа). Источник
     сам помечает единицы измерения как открытый вопрос («unit?») — здесь
     только правдоподобное значение для демо, не нормализованная система. */
  const qty=1+Math.floor(rnd()*500);
  const unitList=UNIT_VALS[orderType]||UNIT_VALS['товары'];
  const unit=unitList[Math.floor(rnd()*unitList.length)];
  const evTxt={'подписание актов':'после подписания актов','приемка':'после приёмки','поставка':'после поставки','счет':'по счёту'}[paymentEvent]||'';
  const pay = paymentType==='аванс' ? `аванс ${prepaidExpense}% предоплатой`
    : paymentType==='комбо' ? `аванс ${prepaidExpense}%, остальное постоплатой ${evTxt}`
    : paymentType==='отсрочка' ? `отсрочка платежа, ${paymentTerm} дн. ${evTxt}`
    : `постоплата, ${paymentTerm} дн. ${evTxt}`;
  const proc={
    id:genId(), st:'Прием заявок', lot:'Лот 1 из '+(1+Math.floor(rnd()*2)),
    n:o.title, cust, tt, place:g.addr, nmck, pay,
    end:fakeDate(days), days, urgent, tags:o.tags, pubDays, appStartDays, deliveryTerm, qty, unit,
    inn:'76'+String(1000000+Math.floor(rnd()*8999999)),
    orderType, paymentType, prepaidExpense, paymentEvent, paymentStages, paymentTerm,
    backingRequired, backingForm, applicationSecurityAmount,
    contractBackingForm, contractBackingSize, bankRestrictions, bgValidityTerm,
    equivalentVal, experienceRequired, experienceFrom,
    nationalRegime, assessmentMethod, isExperience, howExperience,
    deliveryMode, docsList, priceOfferTerm, status, method, msp, usesKSR, okpd2:o.okpd2,
  };
  PROCS.push(proc); PROCS_BY_ID.set(proc.id, proc);
  return proc;
}
CATS.forEach(cat=>{

    /* Код ОКПД2 — один на базовое название (не на каждый вариант отдельно):
       все варианты одного и того же товара/работы/услуги — один и тот же

/* ---------- движок релевантности: запрос → ранжированный список процедур ----------
   Без обращения к внешним ИИ-сервисам (см. обсуждение) — детерминированные
   правила на JS: совпадение ключевых слов запроса с названием лота и тегами
   категории, плюс реальная фильтрация по месту/цене/типу торгов/ИНН при
   ответах на вопросы диалога (см. REAL_FILTER_PRED и addFilter). */
const STOPWORDS=new Set(['для','или','под','что','как','это','также','либо','нужно','надо','хочу','нам','вам',
 'поставка','поставки','поставку','услуга','услуги','услугу','оказание','выполнение','работы','работ','нужны','нужен']);
/* «ё» в свободном тексте пишут не всегда (а часто и не пишут вовсе — обычная
   практика для русского языка), а в захардкоженных названиях/значениях
   полей она то есть, то нет («Приемка» без ё в значении, «приёмки» с ё —
   как типично печатает человек). Без нормализации это два РАЗНЫХ слова для
   stemMatch (сравнение по первым символам, ё≠е как разные символы) — реальный
   баг, 18.08.2026: «оплата после приёмки товара» не находило поле «Событие
   для оплаты» (значение «Приемка») именно из-за этого. Нормализуем ё→е
   везде, где текст готовится к сравнению (tokenize/rawWords/labelWordsRaw). */
function normRu(s){ return String(s||'').toLowerCase().replace(/ё/g,'е'); }
function tokenize(s){
  /* от 4 символов и длиннее: короткие обрубки (3 буквы и меньше) слишком легко
     случайно совпадают внутри произвольного длинного слова (например «бла»
     внутри «областная») — это была реальная причина мусорных совпадений. */
  return normRu(s).replace(/[^a-zа-я0-9\s]/gi,' ').split(/\s+/)
    .filter(w=>w.length>3 && !STOPWORDS.has(w));
}
function stemMatch(a,b){
  const n=Math.min(5,a.length,b.length);
  return n>=4 && a.slice(0,n)===b.slice(0,n);
}
function matchScore(p, toks){
  /* заказчик специально не участвует в сопоставлении — имена заказчиков
     в демо-наборе случайны и только вносили шум, не сигнал релевантности.
     Сравнение — по «стеблю» слова (первые буквы), чтобы «компьютеры»
     находило тег «компьютер», «ноутбуки» — тег «ноутбук» и т.п. */
  const hayToks = tokenize(p.n+' '+(p.tags||[]).join(' '));
  let s=0;
  toks.forEach(t=>{ if(hayToks.some(h=>stemMatch(h,t))) s++; });
  return s;
}
/* ---------- генерация процедур под ЛЮБОЙ запрос пользователя ----------
   Раньше подбор опирался только на ~13 захардкоженных категорий (CATS):
   если запрос не совпадал ни с одним тегом, rankMatches() откатывался к
   показу всей базы целиком, без всякой связи с текстом запроса (это и была
   «асфальтобетонное покрытие» на запрос «воздушные шарики» из звонка с
   заказчиком). По прямой просьбе (10.08.2026, «пользователь должен мочь
   ввести любой товар, который он поставляет») теперь под КАЖДЫЙ запрос
   генерируется собственный набор процедур, названия которых реально
   содержат текст запроса в нескольких формулировках — не только у старых
   13 тем. Остальные поля генерируются той же логикой, что и у CATS
   (тот же диапазон значений, те же справочники) — поэтому REAL_FILTER_PRED
   одинаково честно фильтрует что старые, что новые процедуры: иллюзия
   касается только текста названия под конкретный запрос, а не логики
   фильтрации. Сид — хэш текста запроса, поэтому один и тот же запрос
   в рамках сессии всегда даёт один и тот же набор (см. QUERY_PROC_CACHE),
   а не результат каждый раз пересобирается заново. */
function hashStr(s){
  let h=0;
  for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))|0; }
  return h>>>0;
}
function capFirst(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function guessKindForQuery(q){
  const s=q.toLowerCase();
  if(/услуг|обслуживани|сопровожд|консалт|аренд/.test(s)) return 'услуги';
  if(/работ[аы]?\b|монтаж|ремонт|строительств|реконструкц|демонтаж|укладк/.test(s)) return 'работы';
  return 'товары';
}
function queryTitles(rawQuery){
  const q=rawQuery.trim().replace(/\s+/g,' ');
  const low=q.charAt(0).toLowerCase()+q.slice(1);
  /* Раньше — 7 шаблонов, при батче в 10 480 процедур каждый текст названия
     повторялся ~60 раз (7 × 25 суффиксов = 175 комбинаций). Расширено до 20 —
     20 × 25 = 500 комбинаций, ~21 повтор на комбинацию (13.08.2026, по
     просьбе «разнообразим формулировки»). Шаблоны намеренно не содержат слов
     «товары/работы/услуги» — реальный тип предмета (orderType) определяется
     отдельно, через guessKindForQuery(), и вставка своего слова сюда могла бы
     разойтись с ним и противоречить настоящему значению поля «Тип предмета». */
  return [
    `Поставка: ${low}`,
    `Закупка партии «${q}»`,
    `Поставка ${low} для нужд организации`,
    `${capFirst(q)} — приобретение по контракту`,
    `Поставка ${low} для филиала`,
    `Приобретение: ${q}`,
    `${capFirst(q)} — поставка по заявкам`,
    `Закупка: ${low}`,
    `Поставка ${low} по договору поставки`,
    `Организация поставки: ${low}`,
    `${capFirst(q)} — открытая процедура закупки`,
    `Проведение закупки: ${low}`,
    `Поставка ${low} для собственных нужд заказчика`,
    `Закупка по потребности: ${low}`,
    `${capFirst(q)} — запрос предложений`,
    `Поставка ${low} в рамках исполнения контракта`,
    `Приобретение ${low} для нужд предприятия`,
    `${capFirst(q)} — конкурентная закупка`,
    `Закупка на конкурсной основе: ${low}`,
    `Поставка ${low} согласно спецификации`,
  ];
}
/* Сколько закупок по теме реально найдётся «на всю Россию». Раньше на
   ЛЮБОЙ запрос генерировалось ровно 10 480 процедур — при здоровом
   диапазоне выдачи 15–150 (SEARCH_CFG) это делало любую тему заведомо
   «слишком широкой» при любых условиях, и решение «открыть сразу / задать
   вопрос» не зависело бы от запроса вообще. Теперь объём зависит от
   широты темы: одно общее слово («стройматериалы») — сотни и тысячи
   закупок, конкретная формулировка из нескольких слов — меньше. Внутри
   диапазона — детерминированно по хэшу темы (один и тот же запрос всегда
   даёт одно и то же число). Все числа по-прежнему настоящие: показанное
   N — это ровно столько процедур, сколько реально лежит в выборке. */
function subjectVolume(query){
  const n = tokenize(query).length || 1;
  const [lo, hi] = n<=1 ? [700,1400] : n===2 ? [450,1000] : [160,450];
  return lo + (hashStr(normRu(query)) % (hi-lo+1));
}
/* Сид пакета для поиска без названной темы — см. genQueryProcs(''). */
const NEUTRAL_QUERY='поставка оборудования и материалов';
const QUERY_PROC_CACHE=new Map();
function genQueryProcs(rawQuery){
  const query=String(rawQuery||'').trim();
  /* Пустой запрос = «предмет закупки не назван» (реальный сценарий
     опытного пользователя: «44-ФЗ, Москва, НМЦК от 20 млн» — сплошные
     параметры, без темы). Раньше это возвращало статическую демо-базу
     (пара сотен позиций про плитку и стройматериалы), и поиск без темы
     упирался в неё: четырёх параметров хватало, чтобы честно получить
     ноль — не потому, что таких закупок не бывает, а потому что база под
     ними была на два порядка меньше, чем под любым НАЗВАННЫМ запросом
     (см. subjectVolume). Пользователь этой разницы не видит и
     объяснить её себе не может. Поэтому поиск без темы работает на
     пакете того же размера, что и любой другой, — просто собранном по
     нейтральному сиду. */
  if(!query) return genQueryProcs(NEUTRAL_QUERY);
  const key=query.toLowerCase();
  if(QUERY_PROC_CACHE.has(key)) return QUERY_PROC_CACHE.get(key).slice();
  const rnd=mulberry32(hashStr(key) || 1);
  const kind=guessKindForQuery(query);
  const tags=tokenize(query);
  const ids=[];
  /* Один код ОКПД2 на весь запрос (не на каждую процедуру отдельно) — см.
     комментарий у первой генерации (CATS). */
  const okpd2 = `${10+Math.floor(rnd()*89)}.${10+Math.floor(rnd()*89)}.${10+Math.floor(rnd()*89)}.${100+Math.floor(rnd()*899)}`;
  const titles = queryTitles(query);
  const volume = subjectVolume(query);
  for(let idx=0; idx<volume; idx++){
    const baseTitle = titles[idx % titles.length];
    const suffixIdx = Math.floor(idx / titles.length);
    /* «обычный» диапазон цены — под произвольный запрос конкретная
       категория цен заранее не известна; крупный сегмент (до 45 млн)
       добавляет genPrice(). */
    const proc = makeProc(rnd, {title: baseTitle + TITLE_SUFFIXES[suffixIdx % TITLE_SUFFIXES.length],
      orderType:kind, tags, okpd2, pMin:50000, pMax:1400000});
    ids.push(proc.id);
  }
  QUERY_PROC_CACHE.set(key, ids);
  return ids.slice();
}
/* Раньше здесь была фильтрация по совпадению тегов из фиксированных 13
   категорий (CATS) с откатом на «показать всё» при нуле совпадений (см.
   комментарий выше). Теперь под любой непустой запрос честно генерируется
   собственный набор процедур (genQueryProcs) — откат к «показать всё»
   остаётся только для пустого запроса (пустая строка). */
function rankMatches(query){
  return genQueryProcs(query);
}
/* Строковое представление диапазона, которое мы сами кладём в фильтр как
   value: "min-max" (см. parseNumberRange/applyFreeAnswer/freeCriterionFromChat) —
   разбираем обратно, чтобы numMatches мог честно проверить ОБЕ границы, а не
   одну «примерно» (см. комментарий у parseNumberRange — реальный баг
   13.08.2026: «от 3 до 15 млн» распознавалось как «≈примерно 3 000 000»). */
function parseRangeStr(v){
  const m = String(v).trim().match(/^(-?\d+)\s*-\s*(-?\d+)$/);
  if(!m) return null;
  return {min:parseInt(m[1],10), max:parseInt(m[2],10)};
}
/* Достаём из текста ОДНО целое число, честно отбрасывая копейки/дробную
   часть в конце (", 99" или ".99") ПЕРЕД тем, как убирать остальные
   нецифровые символы. Раньше запятая просто выбрасывалась вместе с пробелами
   и валютой одним regex — «80 900,99 ₽» превращалось в «8090099», то есть
   значение раздувалось в ~100 раз и предикат «Равен»/±40% никогда не
   срабатывал даже на том самом числе, что показано на карточке (реальный
   баг 13.08.2026: self-consistency-тест — предикат «НМЦ лота» проваливался
   на 100% настоящих карточек). */
function parseAmount(val){
  let s = String(val).trim();
  s = s.replace(/[.,]\d{1,2}(?=\D*$)/, '');
  const digits = s.replace(/\D/g,'');
  return digits ? parseInt(digits,10) : NaN;
}
/* Общий предикат для ЛЮБОГО числового поля (цена, %, дни): текст значения +
   явно выбранный оператор («Меньше»/«Больше» в модалке критериев). \b (граница
   слова) в JS-регулярках не годится для кириллицы — \w по умолчанию не
   включает кириллические буквы, поэтому границу слова считаем обычным
   поиском подстроки. Раньше оператор вообще не доходил до предиката, и,
   например, «меньше 700000», набранное свободным текстом, не опознавалось
   никак (ни «до», ни «от», ни «бол» не встречались в слове «меньше») и
   попадало в дефолтную ветку «около ±40%» — то есть реально не фильтровало. */
function numMatches(actual, val, op){
  if(actual==null) return false;
  const range = parseRangeStr(val);
  if(range) return actual>=range.min && actual<=range.max;
  const num=parseAmount(val);
  if(!num) return true;
  const v = String(val).toLowerCase();
  const lessHint = op==='Меньше' || v.includes('до') || v.includes('мень') || v.includes('не более');
  const moreHint = op==='Больше' || v.includes('от ') || v.includes('бол') || v.includes('не менее');
  if(lessHint) return actual<=num;
  if(moreHint) return actual>=num;
  /* «Равен» (и «Диапазон» без второй границы, т.е. по факту одно число) —
     раньше здесь было ±40% «около», хотя пользователь просил ТОЧНОЕ
     значение и видел в чате подтверждение «равен» — то есть сам текст
     обещал точность, а предикат её не соблюдал (просьба заказчика,
     18.08.2026: «должно быть чётко всё, как пользователь просит»).
     Math.floor(actual) — деньги (p.nmck) всегда хранятся с копейками
     (…,99), parseAmount() их отбрасывает; сравниваем в тех же целых
     рублях, что и введённое число, а не приблизительно. */
  return Math.floor(actual)===num;
}
function priceMatches(nmck, val, op){ return numMatches(nmck, val, op); }
/* Общий предикат для полей да/нет: actual может быть boolean (true/false),
   уже строкой 'да'/'нет' или null/undefined (поле не заполнено — считаем
   это «нет», ровно как в PROC_FIELD_DISPLAY: `p.поле ? 'Да' : 'Нет'`
   показывает «Нет» и для null тоже). Раньше null обрывал сравнение через
   отдельный ранний `return false` ДО учёта wantYes/wantNo — то есть ответ
   «Нет» никогда не совпадал с процедурой, где поле было not-applicable/null,
   хотя на карточке эта же процедура честно показывала «Нет» (реальный баг
   13.08.2026, см. self-consistency-тест — «Ограничения по банку»). */
function boolMatch(actual, val){
  const wantYes = /^да$/i.test(String(val).trim());
  const wantNo = /^нет$/i.test(String(val).trim());
  const bool = typeof actual==='boolean' ? actual : /^да$/i.test(String(actual==null?'':actual).trim());
  if(wantYes) return bool;
  if(wantNo) return !bool;
  return true;
}
/* Равенство строкового enum-поля без учёта регистра (payment_type, delivery_mode и т.п.) */
function eqMatch(actual, val){
  return actual!=null && String(actual).toLowerCase()===String(val).toLowerCase();
}
/* Название организации без кавычек любого вида (типографские «…», обычные
   "…"/'…') и с одним пробелом — см. REAL_FILTER_PRED['Заказчик']. */
function normOrgName(s){
  return String(s||'').toLowerCase().replace(/[«»"'']/g,'').replace(/\s+/g,' ').trim();
}
/* ОКПД2 — реальный код классификатора на процедуре (p.okpd2), а не
   tokenize()-сравнение по тегам названия. Раньше «Категория ОКПД 2»
   фильтровалась через matchScore(p, tokenize(val)) — то есть сравнивала
   слова из введённого текста со словами в названии/тегах лота. Код вида
   «70.33.93.273» через tokenize() (только буквенно-цифровые токены длиной
   >3) превращается в отдельные обрубки «70», «33», «93», «273» — каждый
   короче 4 символов и отбрасывается фильтром длины, то есть toks всегда
   пуст и совпадений не бывает НИКОГДА, даже если введённый код в точности
   совпадает с тем, что показано на карточке (реальный баг 13.08.2026).
   Сравниваем сам код: точное совпадение или совпадение по началу (ввод
   более короткого/более общего кода вида «70.33» тоже должен находить
   полный «70.33.93.273»). */
function okpd2Norm(s){ return String(s||'').replace(/[^\d.]/g,''); }
function okpd2Match(actual, val){
  const a = okpd2Norm(actual), v = okpd2Norm(val);
  if(!a || !v) return false;
  return a===v || a.startsWith(v) || v.startsWith(a);
}
/* «Дата публикации торгов» / «Дата начала приёма заявок» — оба поля хранят
   «сколько дней назад» (p.pubDays/p.appStartDays), чипы и типичный свободный
   текст формулируются как «за последние N дней» → берём N из текста и
   сравниваем с реальным давностью. 'До' читается как «опубликовано не
   позже, чем N дней назад» (то есть СТАРШЕ точки отсчёта — daysAgo>=d),
   'После'/по умолчанию — «не раньше N дней назад» (СВЕЖЕЕ — daysAgo<=d),
   что соответствует формулировке чипов «За последние N дней». */
function agoMatch(daysAgo, val, op){
  const d = parseInt(String(val).match(/\d+/)?.[0]||'0', 10);
  if(!d) return true;
  if(op==='До') return daysAgo>=d;
  return daysAgo<=d;
}
/* ---------- мультизначные критерии ----------
   Один критерий может нести НЕСКОЛЬКО значений одновременно («Москва и
   Санкт-Петербург», «44-ФЗ и 223-ФЗ»). Раньше значение критерия было
   всегда скаляром, и на фразу «добавь ещё Санкт-Петербург» оставалось
   только либо затереть Москву, либо завести ВТОРУЮ строку по тому же
   полю — а две строки одного поля пересекаются по И, то есть регион
   обязан быть одновременно и Москвой, и Петербургом: гарантированный
   ноль. Теперь значение критерия — это либо скаляр (как раньше), либо
   массив, и массив трактуется как ИЛИ внутри одного критерия. Все
   предикаты в REAL_FILTER_PRED остались скалярными и ничего про массивы
   не знают — разворачивание берёт на себя эта единственная функция,
   через которую теперь идут ВСЕ применения предикатов. */
function valList(v){ return Array.isArray(v) ? v : [v]; }
function matchFilter(pred, p, val, op){
  return valList(val).some(one=>pred(p, one, op));
}
/* Человекочитаемое значение критерия — массив показываем перечислением
   («Москва, Санкт-Петербург»), а не сырым [object Array]. */
function valText(v){ return valList(v).map(x=>String(x)).join(', '); }
const REAL_FILTER_PRED={
 /* --- заказчик / регион / место --- */

 'Место поставки': (p,val)=>{

   if(REGIONS.includes(v)) return regionOf(p.place)===v;
   return p.place.toLowerCase().includes(v.split(',')[0].toLowerCase());
 },

    с названием региона (см. комментарий у CITY_REGION — так было раньше и

 'Заказчик': (p,val)=>normOrgName(p.cust).includes(normOrgName(val)),

 /* --- сроки закупки --- */

   ===================================================================== */

   «стоит ли участвовать именно в этой закупке». Показываются в карточке
   процедуры и отдельной группой в палитре/«Настроить поиск». Вопросом

const CUT_BY_KEY = Object.fromEntries(CUT_FILTERS.map(c=>[c.key, c]));
const CUT_BY_FIELD = Object.fromEntries(CUT_FILTERS.map(c=>[c.field, c]));
/* Реестр моделей вопросов: ручной пресет (CUT_FILTERS) или модель из данных
   (genericModel) — у обеих один интерфейс {key, field, label, q, opts()}. */
const FIELD_KEYS = Object.keys(FIELD_DEFS);
const COVERED_FIELDS = new Set(CUT_FILTERS.flatMap(c=>c.covers||[]));
function qKeyOf(field){ return CUT_BY_FIELD[field] ? CUT_BY_FIELD[field].key : 'g'+FIELD_KEYS.indexOf(field); }
function qModel(key){
  if(CUT_BY_KEY[key]) return CUT_BY_KEY[key];
  const m = /^g(\d+)$/.exec(String(key||''));
  const field = m && FIELD_KEYS[+m[1]];

/* Детерминированный (без LLM) разбор ДВУХ чисел с общей единицей измерения
