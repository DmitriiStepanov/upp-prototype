/* Выбор значения в панели больше не применяется мгновенно — он копится в
   S.panelTray (curTray() отдаёт именно его, пока открыт S.fpField) тем же
   upsertTrayChip, которым уже пользуется «/»-палитра. Реальное изменение
   поиска — только по «Применить N» внизу панели (applyFilterPanel). */
window.panelApplyCut = (key,i)=>{
  const cut = CUT_BY_KEY[key]; const o = cut && trayOptsOf(cut)[i]; if(!o) return;
  upsertTrayChip({field:cut.field, label:`${cut.label}: ${o.l}`, valLabel:o.l, row:rowFromOpt(cut, o)});
  S.fpField = null; render();
};
window.panelApplyEnum = (name,value)=>{
  const def = FIELD_DEFS[name];
  upsertTrayChip({field:name, label:`${fieldLabel(name)}: ${valueLabel(name,value)}`, valLabel:valueLabel(name,value), row:{f:name, o:def.ops[0], v:value, delta:def.delta}});
  S.fpField = null; render();
};
window.panelApplyNumeric = (name)=>{
  const op = document.getElementById('palOp2').value;
  const raw = document.getElementById('palNum2').value;
  const num = parseAmount(raw);
  const errEl = document.getElementById('palErr2');
  if(isNaN(num)){ if(errEl){ errEl.textContent='Не похоже на число.'; errEl.hidden=false; } return; }
  const err = validateNumericOp(name, String(num));
  if(err){ if(errEl){ errEl.textContent=err; errEl.hidden=false; } return; }
  const def = FIELD_DEFS[name];
  upsertTrayChip({field:name, label:`${fieldLabel(name)}: ${numValLabel(op, String(num))}`, valLabel:numValLabel(op, String(num)), row:{f:name, o:op, v:String(num), delta:def.delta}});
  S.fpField = null; render();
};
window.panelApplyText = (name)=>{
  const raw = document.getElementById('palText2').value.trim();
  if(!raw) return;
  let value = raw;
  if(name==='ИНН заказчика') value = raw.replace(/\D/g,'');
  else if(name==='Категория ОКПД 2'){ const m = raw.match(/\d{2}(?:\.\d{1,3}){1,4}/); if(m) value = m[0]; }
  if(name==='ИНН заказчика' && value.length!==10 && value.length!==12){
    const errEl = document.getElementById('palErr2');
    if(errEl){ errEl.textContent = `ИНН — 10 или 12 цифр, получилось ${value.length}.`; errEl.hidden=false; }
    return;
  }
  const def = FIELD_DEFS[name];
  upsertTrayChip({field:name, label:`${fieldLabel(name)}: ${valueLabel(name,value)}`, valLabel:valueLabel(name,value), row:{f:name, o:def.ops[0], v:value, delta:def.delta}});
  S.fpField = null; render();
};
/* «Показать все N» — «хватит уточнений, покажи текущую выдачу»: открыть
   выдачу, закрыть висящий вопрос, фильтры не менять, поле НЕ считать
   отклонённым и будущий вопрос по нему не запрещать. Это не «Не важно». */
function showAllNow(typed){
  if(S.busy || !S.query) return;
  if(!typed) say('me', `Показать все ${fmt(S.total)}`);
  clearActionBlocks();
  S.pendingQ = null;
  render();
  botThink(()=>{
    if(!S.total) return showZeroRepair(`Нашёл ${countAccHtml(0)}.`);
    openGridByDecision(`Открываю все ${countHtml(S.total)}.`, tuneActs());
  }, 300);
}
/* Ноль — не «ничего не найдено», а разбор причины: минимальное сочетание
   условий-виновников по именам и 1–2 кнопки, каждая снимает ОДНО условие
   и сразу пересчитывает N и решение. */
function zeroReason(){
  if(!S.filters.length) return {html:'По этому запросу закупок не нашлось — попробуйте написать шире.', acts:[]};
  const core = zeroCore();
  const names = core.map(i=>`<b>${condPhrase(S.filters[i])}</b>`);
  let html = core.length===1
    ? `С фильтром ${names[0]} не находится ни одной закупки.`
    : `По отдельности фильтры ${names.join(', ')} находят закупки, но все вместе не совпадают ни в одной.`;
  const widen = getBestNextFilters({widen:true}).widen.slice(0, SEARCH_CFG.fixButtons);
  if(!widen.length){
    /* Одного снятия мало — всё равно по одному условию за клик, чтобы
       ничего не пропадало пачкой молча. */
    html += ' Одного убранного фильтра не хватит — придётся убрать ещё один.';
    return {html, acts:core.slice(0, SEARCH_CFG.fixButtons).map(i=>({l:esc(relaxLabel(S.filters[i])), c:`relaxCondition(${i})`, cls:'fix'}))};
  }
  return {html, acts:widenActs(widen)};
}
function showZeroRepair(lead){
  const z = zeroReason();
  sayActions(`${lead} ${z.html}`, z.acts);
  render();
}
/* Снять одно условие — из кнопки-починки (relax) или крестиком на чипе
   условия в рейле/над сеткой (remove). */
function relaxCondition(i){ dropCondition(i, r=>relaxLabel(r)); }
/* Крестик у фильтра в «Ходе подбора» или над списком — ручное действие. */
function removeCondition(i){ dropCondition(i, r=>`Убрать «${condPhrase(r)}»`, true); }
function dropCondition(i, bubble, manual){
  if(S.busy) return;
  const r = S.filters[i];
  if(!r) return;
  say('me', bubble(r));
  pushUndo();
  S.filters.splice(i,1);
  clearActionBlocks();
  render();
  botThink(()=>respondAfterChange({manual:!!manual}), 500);
}
/* Необязательные чипы сужения — в широкой выдаче над сеткой и в чате по
   просьбе «сузить». Не вопрос: ничего не блокируют, варианты открываются
   тем же инлайн-попапом, что и в лотке, с числом на каждом варианте. */
function narrowChip(cut, ctx){
  const id = `nr:${ctx}:${cut.key}`;
  const open = S.openDD===id;
  return `<span class="tfield ${open?'open':''}" data-dd="${id}">
    <button type="button" onclick="event.stopPropagation();toggleDD('${id}')">${esc(cut.label)} <span class="car">▾</span></button>
    ${open?narrowPopover(cut):''}</span>`;
}
function narrowPopover(cut){
  const opts = cut.opts().filter(o=>o.v!=null);
  const counts = optionCounts(cut, opts);
  return `<div class="tpop down" onclick="event.stopPropagation()">
    <div class="tph">${esc(cut.q)}</div>
    <div class="tpl">${opts.map((o,i)=>`<button type="button" class="topt" onclick="event.stopPropagation();applyNarrow('${cut.key}',${i})">${esc(o.l)}<span class="th">${fmt(counts[i])} ${buyWord(counts[i])}</span></button>`).join('')}</div>
  </div>`;
}
function applyNarrow(key, i){
  if(S.busy) return;
  const cut = qModel(key);
  const o = cut && cut.opts().filter(x=>x.v!=null)[i];
  if(!o) return;
  S.openDD = null;
  pushUndo();
  removeFilterValue(cut.field, null);
  const row = rowFromOpt(cut, o);
  S.filters.push(row);
  say('me', `${esc(cut.label)}: ${esc(o.l)}`);
  respondAfterChange({});
}
/* Строка «Сузить:» в шапке списка убрана (14.09.2026): сужение предлагается
   только в чате — чипами «Можно сузить» под ответом бота и через «Настроить поиск». */
function condChips(ctx){
  /* Строки без выбранного поля (см. condPhrase) — не показываем чипом
     вовсе: индекс i сохраняем ОРИГИНАЛЬНЫЙ (позицию в S.filters), а не
     позицию после фильтрации, иначе ✕ снимал бы не то условие. */
  return S.filters.map((r,i)=>({r,i})).filter(x=>x.r.f)
    .map(({r,i})=>`<span class="critchip">${condPhrase(r)}<button class="critx" onclick="event.stopPropagation();removeCondition(${i})" title="Убрать фильтр">✕</button></span>`).join('');
}

/* ---------- ТЕМА ПОИСКА ----------
   Предмет закупки — это то, что осталось от фразы после вычитания всего
   распознанного как параметр, служебных слов и вводных оборотов. Без
   этого «Ищу закупки на разработку ПО в Москве от 10 миллионов» ушло бы
   в поисковый запрос целиком, вместе с «в Москве от 10 миллионов», и
   движок релевантности искал бы процедуры со словом «миллионов» в
   названии. */
/* Служебные слова, которые не являются предметом закупки. Отдельными
   списками: короткие слова сверяем целиком (иначе предлог «на» съел бы
   начало слова «навигация»), длинные — по началу слова, чтобы покрыть
   все падежные формы сразу. Через регулярку с \b это в принципе не
   работает — см. комментарий про кириллицу у ruRe. */
const TOPIC_STOP_EXACT = new Set(['всё','все','заново','нуля','новый','сначала','ну','ладно','хм','ок','окей','ага','понятно','ясно','спасибо','хорошо','так','ну-ну','ого','класс','норм','мне','нам','для','по','на','в','во','с','со','от','до','из','за','и','а','но','это','мы','я','нужно','нужен','нужна','нужны','где','что','как','бы','же','ли','их','его','ещё','еще','также','тоже','вообще','теперь','сейчас','пожалуйста','давай','давайте','плюс','только','любые','какие','каких','без','через','при','об','о','у','к','не','ни','могу','можем','умеем','хотим','вы','вас','наш','наша','наши','свой','свои','своё','свое','своём','своем','город','рядом','вся','всей','россия','россии','везде'].map(normRu));
/* Жёсткий шум — не предмет закупки НИКОГДА: обращения к сервису, единицы
   измерения, названия самих критериев. */
const TOPIC_STOP_STEM = ['купи','покупк','приобре','ищ','иска','найд','найти','нужн','хочу','хоти','хотел','интересу','закупк','тендер','торг','процедур','покаж','показа','подбер','подобра','поиск','рублей','руб','миллион','миллиард','тысяч','млн','млрд','тыс','окпд','нмц','инн','кср','заказчик','поставщик','заявк','подач','дней','день','дня','суток','регион','област','город','цен','стоимост','бюджет','сумм','активн','архивн','участв','занимаемс','работаем','компан','фирм','организац','крупн','мелк','небольш','маленьк','недорог','серьёзн','солидн','скромн',
  /* обороты новичка: «хочу попробовать продавать…», «мы продаём…» */
  'сброс','очист','забуд','начн','попроб','продава','продаю','продаё','продае','продаж','предлага','привет','здравств'];
/* Мягкий шум — слова, которые обычно лишь обрамляют предмет («поставка
   медицинского оборудования»), но иногда сами и есть весь предмет
   («услуги охраны» без уточнения). Убираем их, только если после этого
   от темы что-то остаётся, — иначе тема схлопнулась бы в пустоту. */
const TOPIC_SOFT_STEM = ['поставк','товар','работ','услуг','обеспечен','мсп','соно','аукцион','конкурс','котировк','статус','срок','аванс','оплат','опыт','эквивалент','клиент','производ','поставля','предмет','контракт','договор'];
function isTopicNoise(w, soft){
  if(TOPIC_STOP_EXACT.has(w)) return true;
  if(TOPIC_STOP_STEM.some(st=>w.startsWith(st))) return true;
  return soft ? TOPIC_SOFT_STEM.some(st=>w.startsWith(st)) : false;
}
function topicFromText(text, ops){
  let t = ' '+String(text||'')+' ';
  /* Вырезаем куски, которые уже стали параметрами: сами значения и
     формулировки, по которым они опознаны. */
  (ops||[]).forEach(o=>{
    valList(o.v).forEach(v=>{
      const str = String(v);
      if(str.length<3) return;
      t = t.replace(new RegExp(str.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'), ' ');
    });
  });
  PLACE_ALIASES.concat(LAW_ALIASES).forEach(a=>{
    t = t.replace(new RegExp(a.re.source, 'gi'), ' ');
  });
  /* Числа с денежными единицами и коды — целиком, вместе с предлогом. */
  t = t.replace(new RegExp('(?:от|до|более|менее|свыше|больше|меньше|дороже|дешевле)?\\s*\\d[\\d\\s.,]*\\s*'+MONEY_UNIT+'?', 'gi'), ' ');
  t = t.replace(/\d[\d.]*\d/g, ' ');
  const words = t.split(new RegExp('[^'+RU_WORD+']+','i')).filter(Boolean);
  const strict = words.filter(w=>!isTopicNoise(normRu(w), true));
  if(strict.length) return strict.join(' ').trim();
  /* Всё сочли шумом — пробуем мягче. Если и так пусто, темы в реплике
     действительно нет: это нормальный сценарий опытного пользователя,
     который задал одни параметры («44-ФЗ, Москва, НМЦК от 20 млн»).
     Возвращаем пустую строку честно, а не подставляем исходный текст. */
  return words.filter(w=>!isTopicNoise(normRu(w), false)).join(' ').trim();
}

/* ---------- РАЗБОР РЕПЛИКИ И ОТВЕТ ----------
   Одно сообщение пользователя = текст и/или чипы лотка. Порядок:
   служебные намерения («сколько?», «что значит…», «верни как было») →
   разбор условий → предмет (обязателен) → число сразу → решение по
   числу (respondAfterChange/decide). Чипы лотка для движка — ровно то
   же, что условия, написанные текстом в той же фразе. */
async function handleUserMessage(text, chips){
  text = String(text||'').trim();
  chips = chips || [];
  say('me', userBubble(text, chips));
  clearActionBlocks(true);
  render();
  let isReset = false, didStartOver = false;
  if(text && !chips.length){
    const intent = detectIntent(text);
    if(intent==='confirm') return handleConfirm();
    if(intent==='decline') return handleDecline();
    /* «сколько закупок в Москве» — это условие, а не вопрос о состоянии. */
    /* Вопрос про варианты висящего вопроса («чем запрос котировок отличается
       от аукциона?», «какой выбрать?») — объясняем, вопрос ждёт ответа. */
    if(S.pendingQ && !['status','count','clear','undo','reset','search'].includes(intent)
       && (intent==='explain' || CHOOSE_RE.test(text) || looksLikeQuestion(text))
       && handleOptionQuestion(text, intent)) return;
    if(intent==='status' && !extractOps(numWordsToDigits(text)).length) return botThink(()=>showStatus(), 400);
    if(intent==='count' && !extractOps(numWordsToDigits(text)).length) return botThink(()=>showCount(), 400);
    if(intent==='clear'){
      /* «Сбрось всё и ищи мебель» — полный сброс и новая тема. Просто
         «сбрось всё» — снимаем фильтры, тема остаётся. */
      const newTopic = S.query && topicFromText(text.replace(RESET_WORDS,' '), extractOps(numWordsToDigits(text)));
      if(!newTopic) return botThink(()=>{ S.query ? clearAllFilters() : askSubject(); }, 400);
      startOver(); didStartOver = true;
    }
    if(intent==='undo')    return handleUndo();
    /* Поле угадано детерминированно (guessFieldForExplain) — отвечаем сразу,
       без LLM. Названо конкретное значение перечислимого поля («что такое
       портал поставщиков?», «что означает продажа посредством публичного
       предложения?») — тоже отвечаем детерминированно и НЕ идём в общий
       разбор: там LLM, вопреки прямому запрету в промпте, иногда всё равно
       применяет названное значение как фильтр (баг, найден тестами
       15.09.2026 — см. enumValuesMentioned). Ни то ни другое не угадано —
       не «не понял», а обычная реплика: единая LLM (llmAnalyzeMessage, см.
       parseText ниже) ответит в общем потоке вместе с разбором фильтров,
       вместо отдельного канцелярского отказа. */
    if(intent==='explain'){
      if(guessFieldForExplain(text, true).length) return handleExplain(text);
      const valHits = enumValuesMentioned(text);
      if(valHits.length) return handleExplainValues(text, valHits);
    }
    if(intent==='help')    return handleHelp();
    if(S.query && handleRelative(text)) return;
    if(intent==='search' && S.query && !extractOps(numWordsToDigits(text)).length) return showAllNow(true);
    /* «Начни заново / новый поиск / забудь» — тоже полный сброс. «Теперь ищу
       мебель / вместо этого» — смена темы с сохранением фильтров. */
    if(intent==='reset' && !didStartOver && FULL_RESET.test(text)){ startOver(); didStartOver = true; }
    isReset = intent==='reset' || didStartOver;
  }
  S.busy = true; render();
  const parsed = text ? await parseText(text) : {ops:[], dropOps:[], llmTopic:'', typos:[], llmAnswer:''};
  S.busy = false;

  /* Ответ словами на висящий вопрос: «город», «вся Россия», «по 44-му». */
  if(S.pendingQ && !chips.length && !parsed.ops.length && !parsed.dropOps.length){
    const hit = await matchPendingAnswer(text);
    if(hit!=null) return answerCut(S.pendingQ, hit, true);
  }

  pushUndo();
  const dropped = [];
  parsed.dropOps.forEach(o=>{
    valList(o.v).forEach(v=>{
      const res = removeFilterValue(o.f, v);
      if(res) dropped.push(esc(res.kind==='narrowed' ? `${fieldLabel(o.f)}: ${valText(res.removed)}` : fieldLabel(o.f)));
    });
  });

  /* Предмет закупки: из первого сообщения (или ответа на «Что вы
     продаёте?») — всё, что не стало условием; позже — только при явной
     смене направления («теперь ищу мебель»). */
  let subjectChanged = false, afterSubject = '';
  /* «Вместо компьютеров ищу мебель» — прежний предмет из текста темы убираем. */
  const topicText = isReset ? text.replace(/вместо\s+[а-яёa-z-]+/gi, ' ') : text;
  const topic = text ? (parsed.llmTopic || topicFromText(topicText, parsed.ops)) : '';
  if(topic && (!S.query || isReset)){
    /* Смена темы: фильтры сохраняются, кроме тех, что описывают прежний
       предмет (ОКПД2, тип продукции, КСР) — они новой теме противоречат. */
    const hadQuery = !!S.query, removedSubj = [];
    if(hadQuery) ['Категория ОКПД 2','Тип предмета','Классификатор строительных ресурсов (КСР)']
      .filter(n=>!parsed.ops.some(o=>o.f===n)).forEach(n=>{ if(removeFilterValue(n, null)) removedSubj.push(esc(fieldLabel(n))); });
    const kept = S.filters.filter(x=>x.f);
    setQuery(topic);
    subjectChanged = true;
    if(hadQuery && kept.length) afterSubject = `Остальные фильтры оставил: ${kept.map(x=>`<b>${condPhrase(x)}</b>`).join(', ')}.`;
    if(removedSubj.length) afterSubject += ` Убрал фильтры прежней темы: ${removedSubj.join(', ')}.`;
  }

  /* Условия. Чип лотка задаёт значение поля целиком (заменяет прежнее);
     текст — по правилам клауз («добавь Питер» дополняет, «только Питер»
     заменяет). */
  const changedBy = new Map();
  chips.forEach(c=>{
    /* Снятие из панели «Настроить поиск» (см. panelUnsetField). */
    if(c.remove){ if(removeFilterValue(c.field, null)) dropped.push(esc(c.label)); return; }
    removeFilterValue(c.row.f, null);
    const row = Object.assign({}, c.row);
    S.filters.push(row);
    changedBy.set(row.f, row);
  });
  const replaced = new Set();
  const conflicts = [];
  const beforeRows = new Map(S.filters.filter(x=>x.f).map(x=>[x.f, {f:x.f, o:x.o, v:x.v}]));
  /* Значение физически бессмысленно (аванс 500%, срок −10 дней) — условие
     НЕ применяется, но не молча: причина идёт в отдельный список и
     называется в ответе (respondAfterChange), а не теряется вместе с
     остальным разбором (просьба заказчика, 14.09.2026, п.3.3 — та же
     проверка, что и в палитре, см. NUMERIC_BOUNDS/validateNumericOp). */
  const invalid = [];
  parsed.ops.forEach(o=>{
    const err = validateNumericOp(o.f, o.v);
    if(err){ invalid.push(err); return; }
    if(!o.exclusive && !changedBy.has(o.f) && beforeRows.has(o.f)){
      const def = FIELD_DEFS[o.f];
      const row = {f:o.f, o:o.o||(def&&def.ops[0]), v:o.v, delta:def?def.delta:0};
      if(conditionsConflict(beforeRows.get(o.f), row)){
        if(!conflicts.some(k=>k.row.f===o.f)) conflicts.push({old:beforeRows.get(o.f), row});
        return;
      }
    }
    if(o.exclusive && !replaced.has(o.f)){ removeFilterValue(o.f, null); replaced.add(o.f); }
    const r = addOrMergeFilter(o.f, o.o, o.v);
    if(r && r.kind!=='same') changedBy.set(o.f, S.filters[findFilterIdx(o.f)]);
  });
  let note = '';
  /* «Добавь область» без названия — расширяем уже выбранный город до его области. */
  if(!parsed.ops.length && !chips.length && !subjectChanged && text){
    const widen = contextualRegionWiden(text);
    if(widen){
      const idx = findFilterIdx('Место поставки');
      S.filters[idx].v = widen.regions.length>1 ? widen.regions : widen.regions[0];
      changedBy.set('Место поставки', S.filters[idx]);
      note = `Расширил географию: ${esc(widen.cities.join(', '))} → ${esc(widen.regions.join(', '))}.`;
    }
  }
  const changed = [...changedBy.values()];

  /* Предмет не распознан — единственный обязательный вопрос. Ничего не
     считаем: без предмета число не имеет смысла. Условия не теряем. */
  if(!S.query){
    S.undo.pop();
    return botThink(()=>askSubject(changed), 500);
  }
  if(!changed.length && !dropped.length && !subjectChanged && !conflicts.length){
    S.undo.pop();
    /* Условие было — но не прошло проверку границ. Число (S.total) при
       этом не пересчитано (условие не применилось), но человек должен
       понять, ПОЧЕМУ реплика ничего не изменила — иначе выглядит так же,
       как «не понял», хотя на самом деле понял и отказался. */
    if(invalid.length){
      return botThink(()=>{ say('bot', `Не учёл: ${invalid.join(' ')} Сейчас ${countHtml(S.total)}.`); render(); }, 500);
    }
    /* Висит вопрос, а реплика не похожа на вопрос — это непонятый ответ, а не
       «не по теме». Короткая реплика без вопроса («ну ладно», «хм») — тоже
       просто «ничего нового»: отказ «не по теме» для неё звучит странно.
       Проверяем ДО того, как довериться ответу LLM ниже: модель не всегда
       слушается инструкции «для филлеров answer оставь пустым» (например,
       на «ну ладно» иногда всё равно пишет «Хорошо.») — код перестраховывает
       эти два консервативных случая сам, а не полагается на промпт. */
    const filler = text.split(/\s+/).filter(Boolean).length<=3;
    const pendingNonQuestion = !!S.pendingQ && !looksLikeQuestion(text);
    /* ЕДИНАЯ ТОЧКА ГИБКОГО ОТВЕТА (правка 15.09.2026, «чат должен работать
       максимально гибко»). Сообщение уже прошло через llmAnalyzeMessage
       внутри parseText — тот же вызов, что достаёт фильтры, теперь ещё и
       отвечает на вопрос/реплику, если она там была (см. llmAnalyzeMessage,
       поле answer). Если ответ есть — показываем его, а не канцелярский
       «не по теме»/«не понял фильтр». Старый детерминированный путь ниже
       (onTopic-регулярка, guessFieldForExplain, nothingNew) остаётся
       аварийным резервом на случай, когда LLM недоступна (нет ключа, сеть,
       таймаут — тогда parsed.llmAnswer пуст), а также страховкой для двух
       случаев выше (filler, pendingNonQuestion) — там ответ LLM игнорируем
       намеренно, даже если она его дала. */
    if(parsed.llmAnswer && !filler && !pendingNonQuestion){
      const tail = S.query ? `<div style="margin-top:8px;color:var(--ink3);font-size:12.5px">Сейчас ${countHtml(S.total)}.</div>` : '';
      return botThink(()=>{ say('bot', parsed.llmAnswer+tail); render(); }, 500);
    }
    if(!looksLikeQuestion(text) && (S.pendingQ || filler)) return botThink(()=>nothingNew(text), 500);
    /* Похоже на вопрос («?», «что», «как»…) ИЛИ вообще не содержит ни
       слова из словаря темы закупок — тогда это либо вопрос про закупки
       вообще (не привязан к конкретному полю), либо вовсе не по теме.
       «Не нашёл здесь условий»/«не понял ответ» тут не годится: они
       ответили бы на реплику тем же, чем и на нераспознанный ввод или
       botched-ответ на вопрос — пользователь не отличит одно от другого
       (просьба заказчика, 14.09.2026, п.4.3/4.5). Проверка на «вопрос»
       одна ловит не всё: «расскажи анекдот» — не вопрос по форме
       (нет вопросительного слова), но так же явно не по теме — вторая
       часть условия (!onTopic) ловит и такие реплики. Если поле
       всё-таки угадывается (даже без канонiчного «что такое») — это
       явно вопрос ПРО НЕГО, ведём через handleExplain, а не через
       общий путь; это приоритетнее «не по теме», раз поле нашлось. */
    const onTopic = PROCUREMENT_TOPIC_HINT.test(text);
    if(looksLikeQuestion(text) || !onTopic){
      if(guessFieldForExplain(text).length) return handleExplain(text);
      return botThink(()=>handleGeneralOrOffTopic(text), 500);
    }
    return botThink(()=>nothingNew(text), 500);
  }
  /* Предмет пришёл после вопроса «Что вы продаёте?» — напоминаем, что
     собранные раньше условия тоже учтены. */
  if(subjectChanged && S.subjectAsked && S.filters.length && !changed.length){
    note = `С учётом фильтров: ${S.filters.map(r=>`<b>${condPhrase(r)}</b>`).join(', ')}.`;
  }
  if(didStartOver) note = ['Начал поиск заново.', note].filter(Boolean).join(' ');
  /* Только выбранные параметры без текста («Настроить поиск», «/» в поле
     ввода) — ручное действие: пересчитываем, но не спрашиваем. */
  const manual = !text && chips.length>0;
  botThink(()=>respondAfterChange({changed, dropped, subjectChanged, afterSubject, typos:parsed.typos, note, invalid, conflicts, manual, llmAnswer:parsed.llmAnswer}), 600);
}
/* Полный сброс: тема, фильтры и состояние диалога (вопросы, отказы,
   открытость выдачи) — как новый поиск, но в том же чате и с «верни как было». */
const RESET_WORDS = ruRe('сброс[а-яё]*|очист[а-яё]*|убер[а-яё]*\\s+вс[её]|удали\\s+вс[её]|снять\\s+вс[её]|вс[её]\\s+заново|начн[а-яё]*\\s+заново|новый\\s+поиск|забудь(?:\\s+вс[её])?|с\\s+нуля');
const FULL_RESET = ruRe('начн[а-яё]*\\s+заново|новый\\s+поиск|забудь|с\\s+нуля|вс[её]\\s+заново');
function startOver(){
  pushUndo();
  S.filters = []; S.query = '';
  Object.assign(S, {askedCount:0, askedKeys:[], askedN:{}, notImportant:0, streakSig:null, declined:[], pendingQ:null, gridOpened:false, subjectAsked:false, conflicts:[]});
  S.gridOpen = false; S.gridPage = 0; S.cardOpen = false; S.curProc = null;
  clearActionBlocks();
}
function setQuery(topic){
  /* Новая тема — новый контекст: отказ от уточнения («Вся Россия») и уже
     звучавшие вопросы относились к прошлой теме, для новой их можно
     предложить снова. В рамках одной темы — не повторяем. Сам параметр
     пользователь может задать в любой момент. */
  if(normRu(topic)!==normRu(S.query||'')){ S.declined = []; S.askedKeys = []; S.askedN = {}; S.askedCount = 0; }
  S.query = topic;
  const entry = CHATS.find(c=>c.id===S.activeChat);
  if(entry) entry.n = topic.length>22 ? topic.slice(0,20)+'…' : topic;
}
function askSubject(rows){
  S.subjectAsked = true;
  const got = rows && rows.length
    ? `Учёл ${rows.length>1 ? rows.length+' ' : ''}${condWord(rows.length)}: ${rows.map(r=>`<b>${condPhrase(r)}</b>`).join(', ')}. ` : '';
  say('bot', `${got}<span class="qhead">${got ? 'Что именно хотите найти?' : 'Какие закупки хотите найти?'}</span> Например: поставка компьютеров, строительство школы или продукты питания.`);
  render();
}
/* Разбор текста реплики в операции над условиями — без побочных эффектов. */
async function parseText(text){
  /* Числительные словами — в цифры до всякого разбора («до трёх
     миллионов» → «до 3 миллионов»). */
  const norm = numWordsToDigits(text);
  /* По клаузам, а не целиком: «убери Москву и добавь Питер» — два
     действия в одной фразе, выполнить нужно оба. */
  let ops = [], dropOps = [];
  splitClauses(norm).forEach(c=>{
    const got = extractOps(c.text);
    if(!got.length) return;
    if(c.mode==='remove') dropOps.push(...got);
    else got.forEach(o=>ops.push(Object.assign({}, o, {exclusive:c.mode==='replace'})));
  });
  /* Клаузы ничего не дали — возможно, реплика разрезалась неудачно. */
  if(!ops.length && !dropOps.length){
    const whole = extractOps(norm);
    const mode = clauseMode(norm);
    if(mode==='remove') dropOps = whole;
    else ops = whole.map(o=>Object.assign({}, o, {exclusive:mode==='replace'}));
  }
  /* Последняя попытка — опечатки в географии. */
  let typos = [];
  if(!ops.length && !dropOps.length){
    typos = fuzzyGeo(norm);
    ops = typos.map(o=>Object.assign({}, o, {exclusive:false}));
  }
  /* LLM добирает то, что регулярки не увидели; недоступность сервиса
     разбор не ломает (см. llmAnalyzeMessage). Тот же вызов заодно отвечает
     на вопрос/реплику в сообщении, если она там была — контекст (тема,
     N, висящий вопрос) передаём, чтобы ответ был по делу, а не общими
     словами. */
  let llmTopic = '', llmAnswer = '';
  const pendingCut = S.pendingQ ? qModel(S.pendingQ) : null;
  const llm = await llmAnalyzeMessage(text, S.filters.map(r=>`${r.f}=${valText(r.v)}`), {query:S.query, n:S.total, pendingCut});
  if(llm){
    llm.add.forEach(o=>{ if(!ops.some(x=>x.f===o.f && normRu(valText(x.v))===normRu(valText(o.v)))) ops.push(o); });
    llm.remove.forEach(o=>dropOps.push({f:o.f, o:'Равен', v:o.v}));
    llmTopic = llm.topic;
    llmAnswer = llm.answer;
  }
  return {ops, dropOps, llmTopic, typos, llmAnswer};
}
/* Слова, которыми отвечают на вопрос о месте без названия места. */
const ANY_ANSWER = /не\s*важно|люб(ой|ая|ое|ые)|везде|вс[её]\s+равно|по\s+всей|вся\s+росси|всей\s+росси/;
async function matchPendingAnswer(text){
  const cut = qModel(S.pendingQ);
  if(!cut || !text) return null;
  const opts = cut.opts();
  const t = normRu(text);
  const anyIdx = opts.findIndex(o=>o.v==null);
  if(ANY_ANSWER.test(t)) return anyIdx>=0 ? anyIdx : -1;
  if(cut.key==='place'){
    if(/город/.test(t)) return 0;
    if(/област|регион|кра[йя]/.test(t)) return 1;
  }
  const toks = tokenize(text);
  for(let i=0;i<opts.length;i++){
    const ot = tokenize(opts[i].l);
    if(ot.length && ot.every(w=>toks.some(x=>stemMatch(w,x)))) return i;
  }
  /* Для полей с закрытым списком значений — уже проверенный однопольный
     LLM-разбор («по сорок четвёртому» → 44-ФЗ), только как запасной путь. */
  const def = FIELD_DEFS[cut.field];
  if(Array.isArray(def.values)){
    S.busy = true; render();
    const one = await llmExtract(text, cut.field, def);
    S.busy = false;
    if(one.ok && one.value!=null){
      const k = opts.findIndex(o=>o.v!=null && normRu(o.v)===normRu(one.value));
      if(k>=0) return k;
    }
  }
  return null;
}
/* Реплика ничего не поменяла. Число всё равно показываем. */
function nothingNew(text){
  if(REMOVE_MARK.test(text)){
    const byName = guessFieldForExplain(text).filter(n=>findFilterIdx(n)>=0);
    if(byName.length){
      pushUndo();
      removeFilterValue(byName[0], null);
      return respondAfterChange({dropped:[esc(fieldLabel(byName[0]))]});
    }
    if(S.filters.length){
      sayActions(`Не понял, какой фильтр убрать. Сейчас ${countHtml(S.total)}, учитываются:`,
        S.filters.slice(0,5).map((r,i)=>({l:`✕ ${condPhrase(r)}`, c:`removeCondition(${i})`})));
      return render();
    }
  }
  if(S.pendingQ){
    sayActions(`Не понял ответ. Выберите вариант или напишите его своими словами. Сейчас ${countHtml(S.total)}.`, []);
    return render();
  }
  const topic = topicFromText(text, []);
  const short = s => s.length>24 ? s.slice(0,22)+'…' : s;
  const acts = topic && normRu(topic)!==normRu(S.query)
    ? [{l:`Искать «${esc(short(topic))}» вместо «${esc(short(S.query))}»`, c:`setTopic('${jsq(topic)}')`}] : [];
  sayActions(`Не нашёл здесь новых условий для поиска. Сейчас ${countHtml(S.total)}.`, acts.concat(S.gridOpen ? [] : gridButton()));
  render();
}
function setTopic(topic){
  if(S.busy) return;
  say('me', `Искать «${esc(topic)}»`);
  pushUndo();
  ['Категория ОКПД 2','Тип предмета','Классификатор строительных ресурсов (КСР)'].forEach(n=>removeFilterValue(n, null));
  setQuery(topic);
  clearActionBlocks();
  render();
  botThink(()=>respondAfterChange({subjectChanged:true}), 500);
}

/* ВАРИАНТЫ ВИСЯЩЕГО ВОПРОСА. Пока бот ждёт ответа, человек может спросить про
   сами варианты: что это, чем отличаются, какой выбрать. Отвечаем с учётом
   вопроса и его вариантов (с числом закупок), вопрос остаётся ждать ответа.
   Описания — из «Критериев УПП» (LLM_FIELD_HINTS) и VALUE_EXPLAIN; «какой
   выбрать» — через LLM с контекстом вопроса, без LLM — по шаблону. Выбор
   за человека не делаем. */
const VALUE_EXPLAIN = {
 'Способ проведения': {
  'Аукцион на понижение':'участники снижают цену, побеждает самая низкая. Решает только цена.',
  'Аукцион на повышение':'цена растёт, побеждает самая высокая. Так обычно продают имущество или право заключить договор.',
  'Запрос котировок':'быстрая процедура для небольших закупок: каждый подаёт одну цену, торга нет, побеждает самая низкая. Сроки короткие.',
  'Запрос предложений':'заказчик сравнивает не только цену, но и условия — сроки, опыт, качество. Побеждает лучшее предложение в целом.',
  'Конкурс':'цену и неценовые критерии (опыт, квалификацию, предложение по исполнению) оценивают в баллах. Документов нужно больше.',
  'Продажа посредством публичного предложения':'продажа имущества: цена снижается по шагам, пока кто-то не согласится купить. Это про покупку, а не про поставку.'},
 'Тип торгов': {
  '44-ФЗ':'закупки государственных и муниципальных заказчиков. Строгие единые правила, всё публикуется в ЕИС, обычно нужно обеспечение.',
  '223-ФЗ':'закупки госкомпаний и компаний с госучастием. Правила задаёт положение о закупке заказчика — они гибче, чем по 44-ФЗ.',
  '615-ПП':'закупки работ по капремонту многоквартирных домов. Участвовать можно после предварительного отбора — включения в реестр подрядчиков.',
  'Коммерческие закупки':'закупки частных компаний вне 44-ФЗ и 223-ФЗ. Правила устанавливает сам заказчик.',
  'Портал Поставщиков':'небольшие закупки на портале поставщиков: быстрые котировочные сессии без сложной документации.'},
};
/* Значение, у которого есть описание, упомянутое в тексте, — из любого поля
   («что такое портал поставщиков?», пока висит вопрос про способ проведения). */
function describedValuesMentioned(text){
  const toks = optWords(text), out = [];
  Object.entries(VALUE_EXPLAIN).forEach(([field, vals])=>Object.keys(vals).forEach(v=>{
    const w = optWords(v);
    if(w.length && w.every(x=>wordHit(x, toks))) out.push({field, v});
  }));
  return out;
}
/* То же самое, но по ЛЮБОМУ перечислимому полю, не только по двум с
   готовыми описаниями (VALUE_EXPLAIN) — нужно ДО общего разбора чата, а не
   только внутри висящего вопроса (см. использование при intent==='explain'
   в handleUserMessage). Без этой проверки «что такое портал поставщиков?»
   без висящего вопроса шёл прямиком в LLM-разбор фильтров и та, вопреки
   прямому запрету в промпте, иногда всё равно применяла «Портал
   Поставщиков» как условие поиска (баг, найден тестами 15.09.2026) —
   здесь же гарантия кодовая, а не только на слово модели.
   Однословные значения («Товары», «Деньги», «Да») слишком общие и часто
   встречаются просто как обычная речь — пропускаем их, оставляя только
   различимые многословные названия или значения с цифрой (44-ФЗ, 615-ПП,
   «Продажа посредством публичного предложения»). */
function enumValuesMentioned(text){
  const toks = optWords(text), out = [];
  Object.keys(FIELD_DEFS).forEach(field=>{
    const def = FIELD_DEFS[field];
    if(!Array.isArray(def.values)) return;
    def.values.forEach(v=>{
      if(/^(?:Любые|Все|Указать|Ввести)\b/i.test(v)) return;
      const w = optWords(v);
      if(w.length<2 && !/\d/.test(v)) return;
      if(w.length && w.every(x=>wordHit(x, toks))) out.push({field, v});
    });
  });
  return out;
}
function handleExplainValues(text, hits){
  botThink(()=>{
    const tail = S.query ? `<div style="margin-top:8px;color:var(--ink3);font-size:12.5px">Сейчас ${countHtml(S.total)}.</div>` : '';
    const lines = hits.map(h=>{
      const e = valueExplain(h.field, h.v);
      return `<b>${esc(valueLabel(h.field, h.v))}</b> (${esc(paletteLabel(h.field))}) — ${e ? esc(e) : 'один из вариантов поля, отдельного описания пока нет.'}`;
    });
    say('bot', lines.join('<br>') + tail);
    render();
  }, 600);
}
function valueExplain(field, v){
  const own = VALUE_EXPLAIN[field] && VALUE_EXPLAIN[field][v];
  if(own) return own;
  const hint = LLM_FIELD_HINTS[field] && LLM_FIELD_HINTS[field].values && LLM_FIELD_HINTS[field].values[v];
  return hint ? hint.charAt(0).toLowerCase() + hint.slice(1) : null;
}
const CHOOSE_RE = ruRe('как[а-яё]*\\s+(?:вариант|выбрать|лучше|выгодн)[а-яё]*|что\\s+(?:лучше\\s+)?(?:выбрать|выгодн|посовету)[а-яё]*|выгодн[а-яё]*|посовету[а-яё]*|помоги[а-яё]*\\s+(?:выбрать|определиться)|(?:что|какой|какое|какую|какие)\\s+(?:мне\\s+|нам\\s+)?(?:лучше\\s+)?(?:выбрать|подойд[её]т)|лучше\\s+выбрать|не\\s+знаю,?\\s+что\\s+выбрать');
const OPTION_STOP = new Set(['на','по','для','от','до','без','только','не','и','в','с','закупки','закупок']);
function optWords(s){ return normRu(s).split(/[^а-яёa-z0-9]+/).filter(w=>w && !OPTION_STOP.has(w)); }
function wordHit(w, toks){ return toks.some(x=> w.length>=4 && x.length>=4 ? stemMatch(w, x) : w===x); }
/* Варианты, упомянутые в тексте: сначала полные совпадения («запрос
   котировок»), потом по первому слову («аукциона» → оба аукциона), если это
   слово не ушло в полное совпадение. */
function optionsMentioned(cut, text){
  const toks = optWords(text);
  const opts = cut.opts().map((o,i)=>({o, i, w:optWords(o.l)})).filter(x=>x.o.v!=null && x.w.length);
  const full = opts.filter(x=>x.w.every(w=>wordHit(w, toks)));
  const used = new Set(full.flatMap(x=>x.w));
  const part = opts.filter(x=>!full.includes(x) && !used.has(x.w[0]) && wordHit(x.w[0], toks) && x.w[0].length>=4);
  return full.concat(part);
}
function handleOptionQuestion(text, intent){
  const cut = qModel(S.pendingQ);
  if(!cut) return false;
  const t = normRu(text);
  if(/уточн/.test(t)) return false; /* «что лучше уточнить?» — обычная подсказка */
  const hits = optionsMentioned(cut, text);
  const choose = CHOOSE_RE.test(text);
  /* «Аукцион на понижение?» — это ответ, а не вопрос. */
  if(hits.length===1 && !choose && intent!=='explain' && !QUESTION_WORD.test(text)) return false;
  /* Реплика заодно ставит СВОЙ числовой/текстовый фильтр («до 1 млн, а
     вообще что выгоднее — 44-ФЗ или 223-ФЗ?») — это не только вопрос про
     текущий вопрос. Раньше это отсекалось лишь когда choose (CHOOSE_RE) не
     совпало — а «что выгоднее» как раз входит в CHOOSE_RE, так что фильтр
     «до 1 млн» тихо терялся, а ответ уходил про текущий вопрос (место), а
     не про закон (баг, найден тестами 15.09.2026). Отдаём такие реплики
     общему разбору — тот же вызов LLM (parseText/llmAnalyzeMessage)
     применит фильтр И ответит на вопрос с правильным контекстом за один
     проход. ТОЛЬКО для числовых/текстовых полей (kind!=='enum'): для
     перечислимых («портал поставщиков», «44-ФЗ» — см. other ниже) простое
     упоминание значения в вопросе слишком часто НЕ означает «примени этот
     фильтр» — модель (даже с прямым запретом в промпте) иногда всё равно
     его применяет, а локальная ветка «other» ниже безопаснее: объясняет
     значение и гарантированно не трогает S.filters (проверено тестами
     15.09.2026 — без этого сужения «что такое портал поставщиков?» само
     становилось фильтром). */
  const foreignOp = !hits.length && extractOps(numWordsToDigits(text))
    .some(o=>o.f!==cut.field && FIELD_DEFS[o.f] && llmFieldKind(FIELD_DEFS[o.f])!=='enum');
  if(foreignOp) return false;
  const other = hits.length ? [] : describedValuesMentioned(text).filter(x=>x.field!==cut.field);
  const fields = guessFieldForExplain(text);
  /* Не про варианты этого вопроса и не просьба помочь выбрать — обычный путь
     (объяснение другого фильтра, общий вопрос, разбор условий). */
  if(!hits.length && !choose && !other.length && !fields.includes(cut.field)) return false;
  const opts = cut.opts(), counts = optionCounts(cut, opts);
  const wait = `<div class="qwait">Вопрос выше ждёт ответа. Сейчас ${countHtml(S.total)}.</div>`;
  botThink(async ()=>{
    const described = hits.map(x=>({x, e:valueExplain(cut.field, x.o.v)}));
    if(described.some(d=>d.e) && !choose){
      const lines = described.map(({x,e})=>`<b>${esc(x.o.l)}</b> · ${countHtml(counts[x.i])} — ${e ? esc(e) : 'отдельного описания нет.'}`);
      say('bot', lines.join('<br>') + wait);
      return render();
    }
    if(other.length){
      const lines = other.map(x=>`<b>${esc(valueLabel(x.field, x.v))}</b> — ${esc(valueExplain(x.field, x.v))} Это вариант фильтра «${esc(paletteLabel(x.field))}», а не текущего вопроса.`);
      say('bot', lines.join('<br>') + wait);
      return render();
    }
    if(!hits.length && !choose){
      say('bot', explainField(cut.field) + wait);
      return render();
    }
    S.busy = true; render();
    const answer = await llmAnswerAboutOptions(text, cut, opts, counts);
    S.busy = false;
    if(answer){ say('bot', answer + wait); return render(); }
    const real = opts.filter(o=>o.v!=null);
    const withText = real.filter(o=>valueExplain(cut.field, o.v));
    say('bot', `Выбор за вами — он зависит от того, в каких закупках вы готовы участвовать. Сколько закупок останется: ${real.map(o=>`${esc(o.l)} — ${fmt(counts[opts.indexOf(o)])}`).join('; ')}.`
      + (withText.length ? ` Спросите про любой вариант — расскажу, что он значит.` : '')
      + ` Если не уверены, нажмите «Не важно»: сужать по этому признаку не буду.` + wait);
    render();
  }, 500);
  return true;
}
async function llmAnswerAboutOptions(text, cut, opts, counts){
  if(!LLM_CFG.apiKey) return null;
  const lines = opts.map((o,i)=>`${o.l} — ${counts[i]} закупок${o.v!=null && valueExplain(cut.field, o.v) ? ': '+valueExplain(cut.field, o.v) : ''}`);
  const sys = ['Ты помогаешь поставщику ответить на уточняющий вопрос в сервисе поиска закупок.',
    `Предмет поиска: ${S.query}. Сейчас задан вопрос: «${cut.q}».`,
    'Варианты ответа (сколько закупок останется, пояснение):', ...lines,
    'Объясни простым языком, чем отличаются варианты и в каких условиях подходит каждый. Если пользователь рассказал о себе, учти это.',
    'Не выбирай за пользователя и не говори, что какой-то вариант выгоднее или лучше вообще. Не придумывай других вариантов, не называй чисел, которых нет выше.',
    'Отвечай кратко: 2–4 предложения, простым текстом без markdown и списков.'].join('\n');
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), LLM_CFG.timeoutMs);
  try{
    const res = await fetch(LLM_CFG.baseUrl.replace(/\/+$/,'')+'/v1/chat/completions', {
      method:'POST', headers:{'Authorization':'Bearer '+LLM_CFG.apiKey, 'Content-Type':'application/json'}, signal:controller.signal,
      body: JSON.stringify({ model:LLM_CFG.model, temperature:0.2, max_tokens:260,
        chat_template_kwargs:{enable_thinking:false},
        messages:[{role:'system',content:sys},{role:'user',content:text}] })
    });
    clearTimeout(timer);
    if(!res.ok) return null;
    const data = await res.json();
    const msg = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    return msg ? esc(msg).trim().replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*/g,'').replace(/\n+/g,'<br>') : null;
  }catch(err){ clearTimeout(timer); return null; }
}
/* «Что значит этот фильтр?» / «Чем регион заказчика отличается от места
   поставки?» — объясняем простым языком. Поиск не трогаем, вопрос (если
   висит) остаётся живым; число — как после любого сообщения. */
function handleExplain(text){
  botThink(()=>{
    const names = guessFieldForExplain(text);
    const tail = S.query ? `<div style="margin-top:8px;color:var(--ink3);font-size:12.5px">Сейчас ${countHtml(S.total)}.</div>` : '';
    if(!names.length){
      say('bot', 'Не понял, про какой фильтр вопрос — назовите его, например «что такое обеспечение заявки?».'+tail);
      return render();
    }
    const pair = EXPLAIN_PAIRS.find(p=>names.includes(p.a) && names.includes(p.b))
      || (names.length===1 ? EXPLAIN_PAIRS.find(p=>(p.a===names[0]||p.b===names[0]) && /отлич|разниц/i.test(text)) : null);
    say('bot', (pair ? pair.text : explainField(names[0])) + tail);
    render();
  }, 600);
}

/* ---------- ОБЩИЕ ВОПРОСЫ О ЗАКУПКАХ И ОТКАЗ НЕ ПО ТЕМЕ ----------
   Реплика похожа на вопрос (вопросительный знак или вопросительное
   слово), а конкретное поле для неё не угадалось (guessFieldForExplain
   пуст в вызывающем коде) — это НЕ «не понял условие», а настоящий
   вопрос не про конкретный критерий. Дальше решает не совпадение с
   полем, а признак предметной области: похоже на закупки вообще —
   отвечаем через LLM в узких рамках темы; не похоже — вежливый отказ, а
   не молчаливое «не нашёл здесь условий», которое выглядело бы так же,
   как ответ на нераспознанный ввод (просьба заказчика, 14.09.2026,
   п.4.3/4.5 — до этого два разных случая было невозможно отличить по
   ответу бота). */
const QUESTION_WORD = ruRe('что|как|почему|зачем|когда|где|какой|какая|какие|можно\\s+ли|нужно\\s+ли|стоит\\s+ли|подскажите|расскажите|объясните');
function looksLikeQuestion(text){ return /\?/.test(text) || QUESTION_WORD.test(text); }
/* Не исчерпывающий словарь домена, а дешёвый детерминированный фильтр
   ПЕРЕД обращением к LLM — тот же принцип, что и везде в этом файле:
   то, что можно надёжно проверить в JS, не отдаём модели на угадывание.
   Ложноотрицательный результат (редкий термин закупок, которого здесь
   нет) — не катастрофа: это лишь означает вежливый отказ вместо ответа,
   не наоборот. */
/* Бывший баг (найден тестами, 14.09.2026): ruRe требует НЕ-букву сразу
   после совпавшего варианта («граница слова»), а у большинства стемов
   ниже не было продолжения [а-яё]* — «закупк» матчил только буквальное
   слово «закупк» (которого не существует), но не «закупки»/«закупок»/
   «закупках», ровно как LAW_ALIASES/BOOL_PHRASES выше по файлу уже верно
   делают. Без этого исправления regex не находил на практике почти ни
   одного реального словоупотребления. */
const PROCUREMENT_TOPIC_HINT = ruRe('закупк[а-яё]*|тендер[а-яё]*|торг[а-яё]*|контракт[а-яё]*|заказчик[а-яё]*|поставщик[а-яё]*|аукцион[а-яё]*|конкурс[а-яё]*|котировк[а-яё]*|гарант[а-яё]*|обеспечен[а-яё]*|нмцк?|смп|мсп|соно|электронн[а-яё]*\\s*подпис[а-яё]*|эцп|лицензи[а-яё]*|аккредитац[а-яё]*|площадк[а-яё]*|госзакупк[а-яё]*|коммерческ[а-яё]*\\s*закупк[а-яё]*|оферт[а-яё]*|задаток|аванс[а-яё]*|44[-\\s]?фз|223[-\\s]?фз|615[-\\s]?пп|фас\\b|жалоб[а-яё]*|реестр[а-яё]*|извещени[а-яё]*|документаци[а-яё]*|техническ[а-яё]*\\s+задани[а-яё]*|окпд|нацрежим[а-яё]*|тз\\b|нмцк?\\b|участник[а-яё]*|заявк[а-яё]*|нко\\b');
async function handleGeneralOrOffTopic(text){
  /* Тот же приём, что и в handleExplain: поиск не трогаем, но напоминаем
     текущее число — принцип «число после каждого сообщения» (раздел 1)
     не делает исключения для реплик не про условия. */
  const tail = S.query ? `<div style="margin-top:8px;color:var(--ink3);font-size:12.5px">Сейчас ${countHtml(S.total)}.</div>` : '';
  if(!PROCUREMENT_TOPIC_HINT.test(text)){
    /* Отказ короткий и без извинений — по требованиям к копирайтингу
       («no apologies, no vagueness»), но по-прежнему вежливый: не
       заявляет, что реплика бессмысленна, — просто называет границу
       того, чем сервис может помочь. */
    say('bot', 'Я помогаю подбирать закупки — вопросы не по этой теме, увы, не по адресу. Спросите что-нибудь про поиск, фильтры или сами закупки.'+tail);
    return render();
  }
  S.busy = true; render();
  const answer = await llmAnswerGeneral(text);
  S.busy = false;
  if(answer){ say('bot', answer+tail); return render(); }
  say('bot', 'Не смог сформулировать ответ (сервис недоступен сейчас) — а вот с фильтрами поиска помогу в любой момент.'+tail);
  render();
}
/* Открытый ответ на вопрос про закупки вообще, не привязанный к
   конкретному полю (в отличие от llmExtract/llmAnalyzeMessage — те
   классифицируют значение ИЗВЕСТНОГО поля, эта функция ничего не
   классифицирует и не трогает S.filters, только формулирует текст).
   Домен намеренно сужен системным промптом ДВАЖДЫ (детерминированным
   PROCUREMENT_TOPIC_HINT ДО вызова и инструкцией внутри промпта) — модель
   не единственная линия защиты от ответа не по теме. */
async function llmAnswerGeneral(text){
  if(!LLM_CFG.apiKey) return null;
  const sys = ['Ты — помощник по закупкам в сервисе «Умный поиск».',
    'Отвечай ТОЛЬКО на вопросы о закупках, тендерах, участии поставщиков, 44-ФЗ/223-ФЗ и смежных темах.',
    'Если вопрос не про закупки — не отвечай по существу, напиши одно предложение о том, что помогаешь только с закупками.',
    'Отвечай кратко (2–4 предложения), простым языком, без канцелярита.'].join('\n');
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), LLM_CFG.timeoutMs);
  try{
    const res = await fetch(LLM_CFG.baseUrl.replace(/\/+$/,'')+'/v1/chat/completions', {
      method:'POST', headers:{'Authorization':'Bearer '+LLM_CFG.apiKey, 'Content-Type':'application/json'}, signal:controller.signal,
      body: JSON.stringify({ model:LLM_CFG.model, temperature:0.3, max_tokens:220,
        chat_template_kwargs:{enable_thinking:false},
        messages:[{role:'system',content:sys},{role:'user',content:text}] })
    });
    clearTimeout(timer);
    if(!res.ok) return null;
    const data = await res.json();
    const msg = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    return msg ? esc(msg).trim().replace(/\n+/g,'<br>') : null;
  }catch(err){ clearTimeout(timer); return null; }
}

/* ---------- «ПОМОГИТЕ ВЫБРАТЬ» ----------
   Раньше intent==='help' распознавался, но никуда не вёл — реплика
   проваливалась в общий разбор и получала нейтральное «не нашёл здесь
   условий». Восстановлено с явным ограничением (просьба заказчика,
   14.09.2026): агент подсказывает, КАКИЕ поля сейчас сильнее всего
   сузили бы выдачу и сколько это даст, но не выбирает значение ЗА
   человека и не оформляет совет как рекомендацию — ответственность за
   решение остаётся на пользователе, агент только даёт входные данные.
   Технически — те же кликабельные поля с попапом значений и числом на
   варианте, что и «Сузить» в шапке сетки (narrowChip/applyNarrow): клик
   применяет условие, но выбор значения каждый раз делает сам человек. */
function handleHelp(){
  botThink(()=>{
    if(!S.query) return askSubject();
    const ranked = getBestNextFilters().narrow.slice(0,3);
    if(!ranked.length){
      sayActions(`Сейчас ${countHtml(S.total)}. Сильно сузить это уже нечем — можно открыть список или дописать фильтр своими словами.`, gridButton());
      return render();
    }
    const chips = ranked.map(cut=>narrowChip(cut,'help')).join('');
    say('bot', `Сейчас ${countHtml(S.total)}. Вот что сильнее всего делит выдачу — выбор за вами:<div class="chiprow">${chips}</div>`);
    render();
  }, 600);
}
/* «Да» / «ок». На вопрос «да/нет» — это ответ; иначе — «покажите». */
function handleConfirm(){
  botThink(()=>{
    const cut = S.pendingQ && qModel(S.pendingQ);
    if(cut && cut.yesNo) return answerCut(cut.key, cut.yesNo[0], true);
    if(cut){ sayActions(`Выберите вариант выше или откройте все ${countHtml(S.total)}.`, []); return render(); }
    if(!S.query) return askSubject();
    if(!S.gridOpen && S.total) return showAllNow(true);
    showStatus();
  }, 400);
}
function handleDecline(){
  botThink(()=>{
    const cut = S.pendingQ && qModel(S.pendingQ);
    if(cut && cut.yesNo) return answerCut(cut.key, cut.yesNo[1], true);
    if(!S.query) return askSubject();
    sayActions(`Хорошо. Сейчас ${countHtml(S.total)}.`, gridButton());
    render();
  }, 400);
}
/* «Верни как было» — снимок предмета и условий до последнего изменения. */
function handleUndo(){
  botThink(()=>{
    const prev = S.undo.pop();
    if(!prev){
      sayActions(`Отменять пока нечего.${S.query?` Сейчас ${countHtml(S.total)}.`:''}`, gridButton());
      return render();
    }
    restoreConditions(prev);
    if(!S.query) return askSubject(S.filters);
    respondAfterChange({note:'Вернул как было.'});
  }, 400);
}

/* ---------- RAIL: Ход подбора ----------
   Не список «какие блоки анкеты пройдены» (анкеты больше нет), а то, что
   действительно определяет следующий шаг: текущее N относительно
   здорового диапазона, предмет и учтённые условия (каждое снимается
   крестиком — это такое же изменение условий, как реплика). */
function statusInfo(){
  const n = S.total, c = SEARCH_CFG;
  if(!S.query) return {label:'Напишите, что ищете', color:'var(--ink3)'};
  if(n===0) return {label:'Ничего не найдено', color:'var(--red)'};
  if(n<c.healthyMin) return {label:'Мало', color:'var(--amber)'};
  if(n<=c.healthyMax) return {label:'В самый раз', color:'var(--green)'};
  return {label:'Много — стоит уточнить', color:'var(--rust)'};
}
/* Положение N на логарифмической шкале 1…(healthyMax×10) — зелёная зона
   и есть здоровый диапазон из конфига. */
function scalePos(n){
  const max = Math.log10(SEARCH_CFG.healthyMax*10);
  return Math.max(0, Math.min(100, Math.log10(Math.max(1,n))/max*100));
}
function viewRail(){
  const st = statusInfo();
  const c = SEARCH_CFG;
  const zl = scalePos(c.healthyMin), zr = scalePos(c.healthyMax);
  return `<div class="rp"><div class="pcard">
    <div class="t">Ход подбора</div>
    ${S.query?`<div class="rnum"><b>${fmt(S.total)}</b><span>${buyWord(S.total)}</span></div>`:''}
    <div class="prow2"><span class="l">Статус</span><span class="v" style="color:${st.color}">${st.label}</span></div>
    ${S.query?`<div class="rscale"><span class="zone" style="left:${zl}%;width:${zr-zl}%"></span><span class="mk" style="left:${scalePos(S.total)}%"></span></div>
    <div class="rscalel"><span>0</span><span>${c.healthyMin}–${c.healthyMax} закупок — в самый раз</span></div>`:''}
    <div class="rsub">Ищем: ${S.query?`<b>${esc(S.query)}</b>`:'<span style="color:var(--ink4)">пока не указано</span>'}</div>
    ${S.filters.length?`<div class="critchips" style="margin-top:0">${condChips('rail')}</div>`
      :`<div style="font-size:12px;color:var(--ink4)">Фильтров пока нет</div>`}
    <div class="pcrit" onclick="openCritModal()">Настроить поиск${S.filters.length?` · <b class="num">${S.filters.length}</b>`:''}</div>
    ${S.query && S.total?`<div class="pcta" onclick="showAllNow()">Показать ${fmt(S.total)} ${buyWord(S.total)}</div>`:''}
  </div></div>`;
}

/* ---------- отражение ответов диалога в выдаче ----------
   То, что человек указал в диалоге, влияет ТОЛЬКО на выбор процедур
   (S.workingSet), а не на содержимое самих карточек — см. displayProc()
   ниже. filterVal/filterOp здесь больше не нужны и намеренно убраны. */
/* База процедур (PROCS) неизменна и никогда не редактируется под запрос —
   что человек ввёл в диалоге, влияет ТОЛЬКО на то, какие процедуры попадают
   в S.workingSet (см. rankMatches/REAL_FILTER_PRED/addFilter), а не на то,
   что написано в самих карточках. Раньше здесь была «косметическая»
   подмена: если у конкретной позиции реального совпадения с ответом не
   было, в карточку вместо настоящих данных подставлялся сырой текст
   ответа (например, введённое наименование заказчика) — то есть база как
   будто редактировалась под пользователя. Это и создавало путаницу.
   displayProc() теперь ничего не подменяет — только готовит служебное
   nmckDisplay (текстовое представление цены) для рендера. */
function displayProc(p){
  return { ...p, nmckDisplay: p.nmck===null ? null : money(p.nmck) };
}

/* ---------- GRID ---------- */
/* Поля сортировки — по скриншоту макета. Двухуровневое меню: сначала поле,
   потом направление (по возрастанию / по убыванию) — оба списка видны
   одновременно, второй справа от первого, выбор направления применяет
   сортировку сразу. null-значения (например, нет обеспечения) всегда в
   конце списка независимо от направления. */
const SORT_FIELDS={
 nmck:{label:'НМЦК', get:p=>p.nmck},
 end:{label:'Дата приема предложений', get:p=>p.days},
 pub:{label:'Дата публикации', get:p=>p.pubDays},
 region:{label:'Регион', get:p=>p.place},
 cust:{label:'Заказчик', get:p=>p.cust},
 backing:{label:'Размер обеспечения', get:p=>p.contractBackingSize},
 advance:{label:'Размер аванса', get:p=>p.prepaidExpense},
};
/* Открытие сетки — и по решению, и вручную — снимает висящий вопрос, но не
   возможность спрашивать дальше: после открытия вопрос только предложение. */
function openGrid(){
  const onbDone = inOnboarding() && finishOnboarding();
  S.gridOpen=true; S.gridOpened=true; S.gridPage=0;
  if(S.pendingQ){ S.pendingQ=null; clearActionBlocks(); }
  if(onbDone) say('bot', onboardingNextHtml());
  render();
}
function sortArr(arr){
  const def = SORT_FIELDS[S.sortField] || SORT_FIELDS.pub;
  const dir = S.sortDir==='asc' ? 1 : -1;
  arr.sort((a,b)=>{
    const av=def.get(a), bv=def.get(b);
    const aNull = av===null || av===undefined;
    const bNull = bv===null || bv===undefined;
    if(aNull && bNull) return 0;
    if(aNull) return 1; /* без значения — всегда в конце */
    if(bNull) return -1;
    if(typeof av==='string') return dir*av.localeCompare(bv,'ru');
    return dir*(av-bv);
  });
  return arr;
}
/* Используется для папок/шаблонов — сортировка по ВСЕМ процедурам без привязки к запросу текущего чата. */
function sortedProcs(){ return sortArr(PROCS.slice()); }
/* Используется в живом гриде выдачи — только то, что реально относится к текущему запросу
   и прошедшим фильтрам (см. rankMatches/REAL_FILTER_PRED), а не весь каталог. */
function sortedResultProcs(){
  /* Раньше пустой S.workingSet тихо подменялся всем каталогом («чтобы не
     показывать пустоту») — это ровно то нечестное поведение, от которого
     теперь явно отказались (см. комментарий у computeStages()): честный
     ноль остаётся нулём и здесь, viewGrid() показывает пустое состояние
     явно, а не весь каталог вместо результата. */
  const ids = S.workingSet || [];
  const arr = ids.map(id=>PROCS_BY_ID.get(id)).filter(Boolean);
  return sortArr(arr);
}
function sortLabel(){
  const def = SORT_FIELDS[S.sortField] || SORT_FIELDS.pub;
  return `${def.label} (${S.sortDir==='asc'?'по возр.':'по убыв.'})`;
}
function toggleSortMenu(){
  if(S.openDD==='sort'){ S.openDD=null; S.sortPendingField=null; }
  else { S.openDD='sort'; S.sortPendingField=null; }
  render();
}
function pickSortField(key){ S.sortPendingField=key; render(); }
function pickSortDir(dir){
  S.sortField=S.sortPendingField; S.sortDir=dir;
  S.sortPendingField=null; S.openDD=null; render();
}
function sortBtn(){
  const open = S.openDD==='sort';
  return `<span class="gbtn ddwrap" data-dd="sort" style="padding:0;position:relative">
    <button type="button" style="padding:6px 11px;display:flex;align-items:center;gap:6px" onclick="event.stopPropagation();toggleSortMenu()">↕ ${sortLabel()}</button>
    ${open?`<div class="ddmenu">${Object.keys(SORT_FIELDS).map(k=>`<div class="ddopt ${(S.sortPendingField?S.sortPendingField===k:S.sortField===k)?'on':''}"
      onclick="event.stopPropagation();pickSortField('${k}')">${SORT_FIELDS[k].label}</div>`).join('')}</div>`:''}
    ${S.sortPendingField?`<div class="ddmenu" style="left:calc(100% + 8px);top:0;min-width:170px">
      <div class="ddopt" onclick="event.stopPropagation();pickSortDir('asc')">по возрастанию</div>
      <div class="ddopt" onclick="event.stopPropagation();pickSortDir('desc')">по убыванию</div>
    </div>`:''}
  </span>`;
}
function selectAllVisible(){ S.checked = sortedResultProcs().map(p=>p.id); render(); }
function gridKebab(){
  const open = S.openDD==='gridkebab';
  return `<span class="ddwrap" data-dd="gridkebab" style="position:relative">
    <button class="kb" onclick="event.stopPropagation();toggleDD('gridkebab')">⋮</button>
    ${open?`<div class="ddmenu" style="right:0;left:auto;min-width:210px">
      <div class="ddopt" onclick="event.stopPropagation();S.openDD=null;selectAllVisible()">✓ Выбрать все</div>
      <div class="ddopt" onclick="event.stopPropagation();S.openDD=null;openSaveTemplateModal()">📄 Сохранить фильтры как шаблон</div>
    </div>`:''}
  </span>`;
}
/* Грид открывает РЕАЛЬНЫЕ процедуры (S.workingSet) постранично, а не
   одним длинным списком. GRID_PAGE_SIZE — сколько карточек на странице. */
const GRID_PAGE_SIZE = 20;
/* Перелистывание вперёд за пределы того, что реально сгенерировано под
   запрос (см. genQueryProcs) — не рисуем пустую страницу и не выдумываем
   дополнительные строки, а показываем то же информационное сообщение
   (toast), что и в остальных местах приложения, и остаёмся на последней
   странице с настоящими карточками. Кнопка «Далее» намеренно не блокируется
   заранее (в отличие от «Назад») — по просьбе заказчика (10.08.2026):
   «если пользователь захочет открыть выборку до существенного сужения —
   просто показываем грид с тем, что есть, а на next-е — информационное
   сообщение», а не подряд задизейбленную кнопку. */
function gridPage(delta){
  const totalPagesReal = Math.max(1, Math.ceil(sortedResultProcs().length/GRID_PAGE_SIZE));
  const next = (S.gridPage||0) + delta;
  if(delta>0 && next>=totalPagesReal){
    toast('Показаны все процедуры, доступные по вашим фильтрам сейчас — новые обновляются в реальном времени.');
    return;
  }
  S.gridPage = Math.max(0, Math.min(totalPagesReal-1, next));
  render();
}
function viewGrid(){
  const list = sortedResultProcs();
  const totalPagesReal = Math.max(1, Math.ceil(list.length/GRID_PAGE_SIZE));
  const page = Math.min(S.gridPage||0, totalPagesReal-1);
  const pageList = list.slice(page*GRID_PAGE_SIZE, page*GRID_PAGE_SIZE+GRID_PAGE_SIZE);
  return `<div class="gcol">
    <div class="gh">
      <div class="gh1">
        <button class="x" onclick="S.gridOpen=false;S.cardOpen=false;S.cardAnimId=null;render()">×</button>
        <span class="t">${esc((S.query||'Подборка').trim())}</span><span class="c num">${fmt(list.length)} ${buyWord(list.length)}</span>
        ${gridKebab()}
      </div>
      <div class="gh2">
        ${sortBtn()}
        <button class="gbtn" onclick="openCritModal()">☰ Настроить поиск<span class="bdg num">${S.filters.length}</span></button>
      </div>
      ${S.filters.length?`<div class="gh3">
        <span class="gl">Фильтры:</span>${condChips('grid')}
      </div>`:''}
    </div>
    <div class="gsc">
      ${list.length ? pageList.map(p=>prow(p)).join('') : gridZero()}
    </div>
    ${list.length?`<div class="gpager">
      <button class="gpbtn" onclick="gridPage(-1)" ${page<=0?'disabled':''}>‹ Назад</button>
      <span class="gpinfo">Стр. ${page+1} из ${totalPagesReal}</span>
      <button class="gpbtn" onclick="gridPage(1)" ${page>=totalPagesReal-1?'disabled':''}>Далее ›</button>
    </div>`:''}
    ${S.checked.length?bulkLive():''}
  </div>`;
}
/* Пустая сетка (ноль после открытия) — та же починка, что и в чате:
   виновники по именам и кнопки, снимающие по одному условию. */
function gridZero(){
  const z = zeroReason();
  return `<div class="gzero">${z.html}${z.acts.length?`<div class="chiprow">${z.acts.map(a=>
    `<button class="chip ${a.cls||''}" onclick="${a.c}">${a.l}${a.cnt!=null?`<span class="cnt">${fmt(a.cnt)} ${buyWord(a.cnt)}</span>`:''}</button>`).join('')}</div>`:''}</div>`;
}
function prow(p0, ctx){
  const p = displayProc(p0);
  const on=S.curProc&&S.curProc.id===p.id;
  const ck=S.checked.includes(p.id);
  const long=p.n.length>58;
  const nm=long?esc(p.n.slice(0,56))+'…':esc(p.n);
  const kebab = ctx ? `<span class="ddwrap" data-dd="fk-${p.id}" style="position:relative;margin-left:auto" onclick="event.stopPropagation()">
      <button class="fkb" onclick="event.stopPropagation();toggleDD('fk-${p.id}')">⋮</button>
      ${S.openDD==='fk-'+p.id?`<div class="ddmenu" style="right:0;left:auto;min-width:200px">
        ${ctx.archived
          ?`<div class="ddopt" onclick="event.stopPropagation();restoreFromArchive('${esc(ctx.folder)}','${p.id}')">↩ Вернуть из архива</div>`
          :`<div class="ddopt" onclick="event.stopPropagation();archiveItem('${esc(ctx.folder)}','${p.id}')">📦 В архив</div>`}
        <div class="ddopt" style="color:var(--red)" onclick="event.stopPropagation();removeFromFolder('${esc(ctx.folder)}','${p.id}')">🗑 Удалить из подборки</div>
      </div>`:''}
    </span>` : '';
  return `<div class="prow ${on?'on':''}" onclick="openCard('${p.id}')">
    <span class="cb ${ck?'on':''}" onclick="event.stopPropagation();chk('${p.id}')">${ck?'✓':''}</span>
    <div class="pin">
      <div class="pr1"><div class="nm">${nm}</div>
        <div class="pz ${p.nmckDisplay===null?'no':''}">${p.nmckDisplay===null?'НМЦ не указано':esc(p.nmckDisplay)}</div>${kebab}</div>
      <div class="pr2"><span>${esc(p.cust)}</span><span>·</span><span>${esc(p.tt)}</span><span>·</span><span>${esc(p.place)}</span></div>
      <div class="pr3">
        ${p.urgent?'<span class="urg">Успейте подать предложение</span>':`<span class="days">Приём заявок: ещё ${p.days<1?Math.round(p.days*24)+' ч.':p.days+' дн.'}</span>`}
      </div>
    </div>
  </div>`;
}
function chk(id){ const i=S.checked.indexOf(id); i>=0?S.checked.splice(i,1):S.checked.push(id); render(); }

/* ---------- сохранение процедур в подборку (папку) ----------
   Всплывающее окно вместо выпадающего меню: заголовок с числом выбранных
   процедур, поле «Новая подборка» с предзаполненным именем вида
   «Запрос_ДД_ММ_ГГГГ» и список уже существующих подборок как альтернативных
   получателей — клик по подборке выбирает её (переключатель: повторный клик
   снимает выбор и возвращает к созданию новой). */
function defaultFolderName(){
  const q = (S.query||'Подборка').trim().replace(/\s+/g,' ');
  const short = q.length>40 ? q.slice(0,40) : q;
  const d = new Date();
  const pad = n=>String(n).padStart(2,'0');
  return `${short}_${pad(d.getDate())}_${pad(d.getMonth()+1)}_${d.getFullYear()}`;
}
function openSaveModal(ids){
  if(!ids || !ids.length) return;
  S.saveIds = ids.slice();
  S.saveSelectedFolder = null;
  S.saveNewName = defaultFolderName();
  S.saveModalOpen = true;
  S.openDD = null;
  render();
}
function closeSaveModal(){ S.saveModalOpen=false; render(); }
function selectSaveFolder(name){ S.saveSelectedFolder = (S.saveSelectedFolder===name?null:name); render(); }
function doSave(navigate){
  let target = S.saveSelectedFolder;
  if(!target){
    const name = (S.saveNewName||'').trim();
    if(!name){ toast('Введите название подборки'); return; }
    if(!findFolder(name)) FOLDERS_ACTIVE.unshift({n:name, d:'Сегодня', items:[]});
    target = name;
  }
  saveToFolder(target, S.saveIds, /*silent*/true);
  S.saveModalOpen = false;
  if(navigate){ S.navScreen='folders'; openFolder(target); }
  else { toast(`Сохранено в «${target}»`); render(); }
}
function renderSaveModal(){
  const usingExisting = !!S.saveSelectedFolder;
  return `<div class="modalbg" onclick="if(event.target===this)closeSaveModal()">
    <div class="modalcard" style="max-width:560px">
      <div class="mhead"><span class="mtitle">Сохранить процедуры <span class="num" style="color:var(--ink3)">${S.saveIds.length}</span></span>
        <button class="mx" onclick="closeSaveModal()">×</button></div>
      <div class="sffield ${usingExisting?'':'on'}">
        <div class="sflabel">Новая подборка <span style="color:var(--red)">*</span></div>
        <div class="sfrow">
          <input id="saveNameInput" value="${esc(S.saveNewName)}" oninput="S.saveNewName=this.value" ${usingExisting?'disabled':''}>
          <button class="sfclear" onclick="S.saveNewName='';render();document.getElementById('saveNameInput').focus()">×</button>
        </div>
      </div>
      ${FOLDERS_ACTIVE.length?`<div class="sflist">
        ${FOLDERS_ACTIVE.map(f=>`<div class="sfitem ${S.saveSelectedFolder===f.n?'on':''}" onclick="selectSaveFolder('${esc(f.n)}')">
          <div class="sfi">📁</div>
          <div class="sftx">${esc(f.n)}</div>
          <div class="sfcnt num">🔖 ${folderCount(f)}</div>
          <div class="sfdate">${f.d}</div>
        </div>`).join('')}
      </div>`:''}
      <div class="sffoot">
        <button class="sfbtn" onclick="doSave(false)">Сохранить</button>
        <button class="sfbtn pri" onclick="doSave(true)">Сохранить и перейти</button>
      </div>
    </div>
  </div>`;
}
function saveToFolder(folderName, ids, silent){
  const f = findFolder(folderName);
  let added=0;
  ids.forEach(id=>{ if(!f.items.some(i=>i.id===id)){ f.items.push({id, archived:false}); added++; } });
  S.openDD=null; S.checked=[];
  if(!silent) toast(added ? `Сохранено в «${folderName}» (${added})` : `Уже есть в «${folderName}»`);
  render();
}
function archiveItem(folderName,id){ const f=findFolder(folderName); const it=f.items.find(i=>i.id===id); if(it) it.archived=true; S.openDD=null; render(); }
function restoreFromArchive(folderName,id){ const f=findFolder(folderName); const it=f.items.find(i=>i.id===id); if(it) it.archived=false; S.openDD=null; render(); }
function removeFromFolder(folderName,id){ const f=findFolder(folderName); f.items=f.items.filter(i=>i.id!==id); S.checked=S.checked.filter(x=>x!==id); S.openDD=null; render(); }

function bulkLive(){
  return `<div class="bulkbar">
    <span class="bicon pri" onclick="openSaveModal(S.checked)">🔖 Сохранить</span>
    <span class="bicon" onclick="toast('Отправка коллеге')">↗</span>
    <span class="bicon" onclick="toast('Выгрузка файла')">⬇</span>
    <span class="sp"></span><span class="bcount num">Выбрано ${S.checked.length}</span>
    <span class="bx" onclick="S.checked=[];render()">×</span>
  </div>`;
}
function bulkFolder(){
  return `<div class="bulkbar">
    <span class="bicon" onclick="S.checked.slice().forEach(id=>archiveItem(S.curFolder,id));S.checked=[];render()">📦 В архив</span>
    <span class="bicon" onclick="toast('Выгрузка')">⬇ Выгрузить</span>
    <span class="bicon" onclick="toast('Отправка')">↗ Отправить</span>
    <span class="bicon" onclick="S.checked.slice().forEach(id=>removeFromFolder(S.curFolder,id));S.checked=[];render()">🗑 Удалить</span>
    <span class="sp"></span><span class="bcount num">Выбрано ${S.checked.length}</span>
    <span class="bx" onclick="S.checked=[];render()">×</span>
  </div>`;
}

/* ---------- CARD ----------
   Вся страница перерисовывается на любой чих (render() перестраивает
   весь innerHTML), поэтому если карточка уже открыта, а пользователь
   кликнул на что-то совсем другое (галочку в другой строке, сортировку
   и т.п.), .ccol создаётся заново — и раньше это КАЖДЫЙ РАЗ заново
   проигрывало анимацию появления (opacity 0→1, сдвиг), из-за чего
   уже открытая панель визуально «мигала», будто закрылась и открылась
   снова, хотя по смыслу ничего не менялось. Проигрываем анимацию
   только при первом открытии карточки или при переключении на другую
   процедуру — не при каждой перерисовке. */
function openCard(id){ S.curProc=PROCS_BY_ID.get(id); S.cardOpen=true; render(); }
function closeCard(){ S.cardOpen=false; S.cardAnimId=null; render(); }
/* Раньше карточка всегда показывала один и тот же фиксированный набор
   полей (НМЦ/Оплата/Место поставки/Окончание приёма), независимо от того,
   какие критерии реально выбрал пользователь в подборе. Заказчик прямо
   попросил обратное: показывать РЕАЛЬНЫЕ значения именно тех критериев,
   что были заданы (S.filters), — не typed-текст ответа пользователя
   (это запрещено ещё с прошлой правки displayProc), а настоящее значение
   поля у ЭТОЙ процедуры, то же самое, что использует REAL_FILTER_PRED. */
const PROC_FIELD_DISPLAY = {
 'Тип торгов': p=>p.tt,
 'Способ проведения': p=>p.method,
 'Статус торгов': p=>p.status,
 'Тип предмета': p=>p.orderType,

 'Категория ОКПД 2': p=>p.okpd2||null,
 'Классификатор строительных ресурсов (КСР)': p=>p.usesKSR?'Да':'Нет',
 'Способ оплаты': p=>p.paymentType,
 'Наличие аванса': p=>p.prepaidExpense>0?'Да':'Нет',
 'Аванс: процент': p=>p.prepaidExpense!=null?p.prepaidExpense+'%':null,
 'Событие для оплаты': p=>p.paymentEvent,
 'Этапность платежей': p=>p.paymentStages,
 'Срок оплаты': p=>p.paymentTerm!=null?p.paymentTerm+' дн.':null,
 'Наличие обеспечения заявки': p=>p.backingForm!==null?'Да':'Нет',
 'Форма обеспечения заявки': p=>p.backingForm,
 'Размер обеспечения заявки': p=>p.applicationSecurityAmount!=null?p.applicationSecurityAmount+'%':null,
 'Требуется обеспечение исполнения': p=>p.backingRequired?'Да':'Нет',
 'Форма обеспечения исполнения': p=>p.contractBackingForm,
 'Размер обеспечения исполнения': p=>p.contractBackingSize!=null?p.contractBackingSize+'%':null,
 /* Раньше — `p.bankRestrictions?'Да':'Нет'`: значение поля хранится как

    настоящим 'нет' и не совпадал). Та же ошибка была у «Национальный
    режим» и «Есть перечень обязательных документов» ниже. */
 'Ограничения по банку': p=>p.bankRestrictions==='да'?'Да':'Нет',

 'Национальный режим': p=>p.nationalRegime==='да'?'Да':'Нет',

 'Метод оценки': p=>p.assessmentMethod,

 'Есть перечень обязательных документов': p=>p.docsList==='да'?'Да':'Нет',

 'Объемы / ед. изм.': p=>p.qty!=null?`${p.qty}${p.unit?' '+p.unit:''}`:null,
};
function critValueOnProc(name, p){
  const fn = PROC_FIELD_DISPLAY[name];
  if(!fn) return null;
  const v = fn(p);
  return (v===null || v===undefined || v==='') ? null : v;
}
function viewCard(){
  const p=displayProc(S.curProc);
  const fresh = S.cardAnimId !== p.id;
  S.cardAnimId = p.id;
  /* Раньше здесь показывались ВСЕ формализованные критерии (CARD_BASE_FIELDS)
     безусловно, вне зависимости от того, выбрал ли их пользователь в
     подборе, — по прямой просьбе заказчика (18.08.2026) сузили: в основной
     таблице карточки теперь только формализованные критерии, которые
     ДЕЙСТВИТЕЛЬНО применены (S.filters). Остальные формализованные поля
     (не выбранные в подборе) — по-прежнему доступны через «Все критерии»
     (openM_allcrit), просто больше не дублируются здесь по умолчанию.
     Значения — настоящие, с ЭТОЙ процедуры (critValueOnProc), не то, что
     человек напечатал — ввод пользователя только выбирает ИЗ неизменной
     базы, а не подставляется в карточку как есть. */
  /* Два РАЗНЫХ типа критериев (п.5 ТЗ):
     • таблица — фильтры поиска: значения у ЭТОЙ закупки тех условий,
       по которым она попала в выдачу (они же участвуют в подсчёте N);
       если условий нет — ключевые параметры закупки;
     • «Критерии из документации» — требования к участнику, нацрежим,
       эквивалент, банковская гарантия и т.п. из ТЗ/извещения: помогают
       решить, стоит ли участвовать именно в этой закупке. Показываются
       всегда, от фильтров не зависят и в вопросы агента не попадают. */
  const KEY_FIELDS = ['Тип торгов','НМЦ лота','Место поставки','Окончание приема заявок'];
  const searchFields = S.filters.map(r=>r.f).filter(f=>!DOC_CRITERIA_FIELDS.includes(f));
  const baseRows = (searchFields.length ? searchFields : KEY_FIELDS)
    .filter((f,i,a)=>a.indexOf(f)===i)
    .map(f=>({name:f, val:critValueOnProc(f, p)}))
    .filter(r=>r.val!==null);
  const rows = baseRows
    .map(r=>`<tr><td>${esc(fieldLabel(r.name))}</td><td>${esc(String(r.val))}</td></tr>`).join('');
  const filterRows = DOC_CRITERIA_FIELDS
    .map(f=>({name:f, val:critValueOnProc(f, p)}))
    .filter(r=>r.val!==null)
    .slice(0, 6);
  return `<div class="ccol" style="${fresh?'':'animation:none'}">
    <div class="ch1">
      <span class="regn">✅ ${p.id}</span><span class="tagok">${p.st}</span><span class="lot">${p.lot}</span>
      <span class="sp"></span><button class="dh x" onclick="closeCard()">×</button>
    </div>
    <div class="csc">
      <div class="ctit">${esc(p.n)}</div>

      <div style="font-size:11px;color:var(--ink4);margin-bottom:4px">${searchFields.length?'Совпадает с вашими фильтрами':'Основные данные'}</div>
      ${baseRows.length?`<table class="ktab">${rows}</table>`:''}
      <a class="morea" onclick="toast('Открывается новой вкладкой в торговой секции')">Подробнее ↗</a>
      <div class="docbox">
        <div class="dt">Требования из документации <span class="spark">✦</span></div>
        <div style="font-size:11.5px;color:var(--ink3);margin-bottom:6px">Что нужно для участия именно в этой закупке</div>
        ${filterRows.length?`<ul>${filterRows.map(r=>`<li>${esc(fieldLabel(r.name))}: ${esc(String(r.val))}. Источник: ${docSourceCell(r.name)}</li>`).join('')}</ul>`
          :`<div style="font-size:12px;color:var(--ink4);margin-bottom:2px">В документации особых требований не найдено</div>`}
        <span class="allcrit" onclick="openM_allcrit()">Все данные закупки →</span>
      </div>
    </div>
    <div class="cfoot">
      <button class="bigb" style="flex:1" onclick="openSaveModal(['${p.id}'])">🔖 Сохранить</button>
      <button class="sqb" onclick="toast('Отправка коллеге')">↗</button>
    </div>
  </div>`;
}
/* Раньше это была фиксированная выдуманная таблица (ALLCRIT) — одни и те
   же 10 строк с одними и теми же значениями независимо от того, какую
   процедуру открыли. Теперь строим её из настоящих данных ЭТОЙ процедуры
   (PROC_FIELD_DISPLAY/critValueOnProc — то же, что использует viewCard()
   и REAL_FILTER_PRED), «Источник» — честная классификация из CSV
   (FIELD_SOURCE_TYPE), «В подборе» — реально ли поле есть среди
   применённых пользователем фильтров (S.filters), а не произвольные
   true/false как раньше. */
/* ~30 критериев с реальным значением у типичной процедуры — одной колонкой
   на обычной высоте экрана это не помещается. Делим на две колонки
   (компактные строки), модалка шире и выше — так на обычном экране почти
   всегда видно всё сразу; прокрутка внутри содержимого оставлена как
   защита на случай маленького окна/особо длинного списка (по просьбе
   заказчика, 12.08.2026) — не обрезаем критерии, а даём докрутить. */
function openM_allcrit(){
  const p = displayProc(S.curProc);
  const usedNames = new Set(S.filters.map(r=>r.f));
  const rowData = Object.keys(PROC_FIELD_DISPLAY)
    .map(name=>({name, val:critValueOnProc(name, p), used:usedNames.has(name)}))
    .filter(r=>r.val!==null);
  const mid = Math.ceil(rowData.length/2);
  const rowsHtml = arr=>arr.map(c=>`<tr style="${c.used?'background:var(--green-bg)':''}">
    <td style="padding:5px 8px;border-bottom:1px solid var(--line2)">${esc(c.name)}</td>

    <td style="padding:5px 8px;border-bottom:1px solid var(--line2);font-size:11px">${docSourceCell(c.name)}</td>
    <td style="padding:5px 8px;border-bottom:1px solid var(--line2)">${c.used?'<span style="color:var(--green);font-weight:600;font-size:11px">✓</span>':'<span style="color:var(--ink4);font-size:11px">—</span>'}</td></tr>`).join('');
  const tableHtml = arr=>`<table style="width:100%;border-collapse:collapse;font-size:12px">
    <thead><tr style="font-size:10px;text-transform:uppercase;color:var(--ink4);text-align:left">
      <th style="padding:0 8px 6px">Параметр</th><th style="padding:0 8px 6px">Значение</th><th style="padding:0 8px 6px">Источник</th><th style="padding:0 8px 6px">В подборе</th></tr></thead>
    <tbody>${rowsHtml(arr)}</tbody>
  </table>`;
  const html = `<div style="position:fixed;inset:0;background:rgba(27,30,43,.42);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px" onclick="if(event.target===this)this.remove()">
    <div style="background:#fff;border-radius:16px;width:100%;max-width:1040px;max-height:94vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(27,30,43,.3)">
      <div style="padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;flex:none">
        <span style="font-size:15px;font-weight:700;flex:1">Все данные закупки</span>
        <button onclick="this.closest('div[style*=fixed]').remove()" style="font-size:18px;color:var(--ink3)">×</button></div>
      <div style="padding:14px 20px;display:flex;gap:20px;overflow-y:auto">
        <div style="flex:1;min-width:0">${tableHtml(rowData.slice(0,mid))}</div>
        <div style="flex:1;min-width:0;border-left:1px solid var(--line);padding-left:20px">${tableHtml(rowData.slice(mid))}</div>
      </div>
    </div></div>`;
  const d=document.createElement('div'); d.innerHTML=html; document.body.appendChild(d.firstElementChild);
}

/* ---------- фильтрация и критерии ВНУТРИ подборки ----------
   Те же дропдауны поля/оператора/значения (ddField/valueField/selectDD,
   scope='folder' → S.folderFilters), тот же движок реальных предикатов
   (REAL_FILTER_PRED), что и в живом гриде выдачи — только применяются не
   ко всей базе, а к процедурам, которые УЖЕ сохранены в этой подборке. */
function folderBaseProcs(){
  const f = findFolder(S.curFolder);
  if(!f) return [];
  const shown = f.items.filter(i=>S.folderItemsTab==='active' ? !i.archived : i.archived);
  return shown.map(i=>PROCS_BY_ID.get(i.id)).filter(Boolean);
}
function applyFolderFilters(arr){
  /* Тот же «предохранитель», что был везде в основном поиске (тихо
     оставлял предыдущий непустой шаг при настоящем нуле) — убран по тому
     же принципу: честный ноль внутри подборки тоже должен остаться нулём,
     а не молча откатываться на шаг назад (найдено сквозным аудитом,
     13.08.2026). */
  S.folderFilters.forEach(r=>{
    const pred = REAL_FILTER_PRED[r.f];
    if(pred){ arr = arr.filter(p=>matchFilter(pred, p, r.v, r.o)); }
  });
  return arr;
}
function openFolderCritModal(){ S.folderCritModalOpen=true; S.openDD=null; render(); }
function closeFolderCritModal(){ S.folderCritModalOpen=false; render(); }
function addFolderFilterRow(){
  S.folderFilters.push({f:null, o:null, v:'', delta:0}); /* см. addFilterRow() — строка стартует пустой */
  render();
}
function removeFolderFilterRow(i){ S.folderFilters.splice(i,1); render(); }
function folderCritRunning(){
  let arr = folderBaseProcs();
  let prev = arr.length;
  return S.folderFilters.map(r=>{
    const pred = REAL_FILTER_PRED[r.f];
    if(pred){ arr = arr.filter(p=>matchFilter(pred, p, r.v, r.o)); }
    const total = arr.length;
    const delta = Math.max(0, prev-total);
    prev = total;
    return {...r, total, delta};
  });
}
function folderCritRow(r,i){
  if(!r.f){
    return `<div class="crow">
