/* Единицы измерения денег — «20 млн», «500 тыс», «1.5 миллиарда». */
const MONEY_UNIT = '(млрд|миллиард[а-яё]*|млн|миллион[а-яё]*|тыс\\.?|тысяч[а-яё]*)';
function moneyMult(unit){
  const u=(unit||'').toLowerCase();
  if(u.startsWith('млрд')||u.startsWith('миллиард')) return 1e9;
  if(u.startsWith('млн')||u.startsWith('миллион')) return 1e6;
  if(u.startsWith('тыс')) return 1e3;
  return 1;
}
/* Цена закупки из фразы: «от 20 млн», «до 500 тысяч», «от 3 до 15 млн»,
   «5-10 млн», «НМЦК 20 000 000». Возвращает готовую пару op/value для
   критерия «НМЦ лота» либо null. Диапазон детектируется первым — иначе
   «от 3 до 15 млн» превратилось бы просто в «от 3 000 000». */
const MONEY_HINT = ruRe('нмцк?|цен[а-яё]*|стоимост[а-яё]*|бюджет[а-яё]*|сумм[а-яё]*|руб[а-яё.]*|₽|'+MONEY_UNIT.slice(1,-1));
function parsePriceCondition(text){
  const t = normRu(text).replace(/ /g,' ');
  if(!MONEY_HINT.test(t)) return null;
  const num = '(\\d[\\d\\s]*(?:[.,]\\d+)?)\\s*'+MONEY_UNIT+'?';
  const toNum = (d,u,fallbackUnit)=>{
    const val = parseFloat(String(d).replace(/\s+/g,'').replace(',','.'));
    if(isNaN(val)) return null;
    return Math.round(val*moneyMult(u||fallbackUnit));
  };
  let m;
  /* «от 3 до 15 млн», «с 3 по 15 млн», «3-15 млн» — единица обычно
     называется один раз, в конце, и относится к обоим числам. */
  m = t.match(new RegExp('(?:от|с)\\s*'+num+'\\s*(?:до|по|-|–|—)\\s*'+num));
  if(!m) m = t.match(new RegExp(num+'\\s*(?:-|–|—)\\s*'+num));
  if(m){
    const tail = m[4] || m[2];
    const a = toNum(m[1], m[2], tail), b = toNum(m[3], m[4], tail);
    if(a!=null && b!=null && a!==b) return {op:'Диапазон', value:`${Math.min(a,b)}-${Math.max(a,b)}`};
  }
  /* «от 20 млн», «больше 20 млн», «дороже», «не менее» */
  m = t.match(new RegExp('(?:от|больше|более|свыше|дороже|не\\s+ме?нее|начиная\\s+с)\\s*'+num));
  if(m){ const a=toNum(m[1],m[2]); if(a!=null) return {op:'Больше', value:String(a)}; }
  /* «до 500 тыс», «меньше», «дешевле», «не более» */
  m = t.match(new RegExp('(?:до|меньше|менее|дешевле|не\\s+более|не\\s+дороже|максимум)\\s*'+num));
  if(m){ const a=toNum(m[1],m[2]); if(a!=null) return {op:'Меньше', value:String(a)}; }
  /* Голое число рядом со словом про деньги — «НМЦК 20 млн», «бюджет 500000». */
  m = t.match(new RegExp('(?:нмцк?|цена|стоимость|бюджет|сумма)\\D{0,12}'+num));
  if(m){ const a=toNum(m[1],m[2]); if(a!=null && a>=1000) return {op:'Равен', value:String(a)}; }
  return null;
}

/* «Где-нибудь рядом», «в своём городе» — география без названия места:
   берём место поставщика из профиля (USER_GEO), а не переспрашиваем —
   лишний вопрос сверх одного запрещён. «Рядом/в регионе» — область,
   «в своём городе» — город. */
const NEAR_CITY = ruRe('в\\s+сво[её]м\\s+город[а-яё]*|в\\s+моём\\s+город[а-яё]*|в\\s+моем\\s+город[а-яё]*|у\\s+нас\\s+в\\s+город[а-яё]*');
const NEAR_REGION = ruRe('рядом|поблизост[а-яё]*|недалеко|в\\s+сво[её]й\\s+област[а-яё]*|в\\s+мо[её]й\\s+област[а-яё]*|в\\s+сво[её]м\\s+регион[а-яё]*|в\\s+мо[её]м\\s+регион[а-яё]*|у\\s+нас\\s+в\\s+(?:регион|област)[а-яё]*');

/* Даты: «за последние 7 дней», «свежие», «заявки до 14 дней». */
const PUB_HINT = ruRe('опубликован[а-яё]*|публикац[а-яё]*|размещен[а-яё]*|свеж[а-яё]*|нов[а-яё]*');
const END_HINT = ruRe('заявк[а-яё]*|подач[а-яё]*|окончан[а-яё]*|дедлайн[а-яё]*|успе[а-яё]*');
const FRESH_HINT = ruRe('свеж[а-яё]*|тольк[оa-яё]*\\s+что\\s+опубликован[а-яё]*');
function parseDateConditions(text){
  const t = normRu(text);
  const out = [];
  const m = t.match(/(\d+)\s*(?:дн[а-яё]*|день|суток)/);
  /* «от 10 дней», «не менее 10 дней», «минимум 10 дней» на подачу — нужно
     НЕ МЕНЬШЕ стольких дней на подготовку (итоговая логика, п.18: «срок
     подачи от 10 дней»). Без такого слова — как раньше: «заявки до 14 дней». */
  const atLeast = m && new RegExp('(?:от|не\\s+менее|не\\s+меньше|минимум|хотя\\s+бы|больше|более)\\s*'+m[1]+'\\s*(?:дн|день|суток)').test(t);
  if(m && END_HINT.test(t)) out.push({f:'Окончание приема заявок', o:atLeast?'После':'До', v:m[1]});
  else if(m && PUB_HINT.test(t)) out.push({f:'Дата публикации торгов', o:'После', v:m[1]});
  else if(FRESH_HINT.test(t)) out.push({f:'Дата публикации торгов', o:'После', v:'7'});
  return out;
}

/* Общий проход по ЛЮБЫМ enum-полям: ищем в тексте точное вхождение
   одного из допустимых значений критерия. Намеренно исключаем короткие и
   служебные значения — «Да»/«Нет»/«Все»/«Любые торги» встречаются в
   обычной речи постоянно («да, покажите») и давали бы ложные критерии.
   Это и есть покрытие остальных трёх десятков фильтров без единой
   строчки кода на каждый: их значения уже описаны в FIELD_DEFS. */
/* «аванс» — не «Способ оплаты: Аванс» (это 100% предоплата), а просто
   наличие аванса; его разбирает BOOL_PHRASES ниже. */
const ENUM_SCAN_STOP = new Set(['да','нет','все','любые торги','условно','счет','приемка','поставка','деньги','аванс']);
function scanEnumValues(text){
  const t = normRu(text);
  const out = [];
  Object.keys(FIELD_DEFS).forEach(name=>{
    const f = FIELD_DEFS[name];
    if(!Array.isArray(f.values)) return;
    f.values.forEach(v=>{
      const nv = normRu(v);
      if(nv.length < 5 || ENUM_SCAN_STOP.has(nv)) return;
      /* Границы слова — чтобы «Конкурс» не срабатывал внутри «конкурсной
         документации», а «Работы» — внутри «работаем с 2010 года». */
      const re = new RegExp('(^|[^'+RU_LET+'])'+nv.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^'+RU_LET+']|$)', 'i');
      if(re.test(t)) out.push({f:name, o:f.ops[0], v});
    });
  });
  return out;
}

/* Да/нет-критерии, которые в речи выражаются не словом «да», а самой
   формулировкой: «без обеспечения», «только для МСП», «с авансом». */
const BOOL_PHRASES = [
  {re:ruRe('мсп|смп|соно'),                                        f:'МСП / СОНО', v:'Да'},
  {re:ruRe('без\\s+аванс[а-яё]*|без\\s+предоплат[а-яё]*'),          f:'Наличие аванса', v:'Нет'},
  {re:ruRe('(?:с|нужен|нужна|требуетс[а-яё]*|хочу|только\\s+с)\\s+(?:аванс[а-яё]*|предоплат[а-яё]*)|аванс[а-яё]*\\s+(?:нужен|обязател[а-яё]*)'), f:'Наличие аванса', v:'Да'},
  {re:ruRe('без\\s+обеспечен[а-яё]*'),                             f:'Наличие обеспечения заявки', v:'Нет'},
  {re:ruRe('(?:нужн[а-яё]*|требуетс[а-яё]*|с)\\s+обеспечен[а-яё]*\\s+заявк[а-яё]*'), f:'Наличие обеспечения заявки', v:'Да'},
  {re:ruRe('национальн[а-яё]*\\s+режим[а-яё]*'),                    f:'Национальный режим', v:'Да'},
  {re:ruRe('без\\s+опыт[а-яё]*|опыт\\s+не\\s+(?:нужен|требуетс[а-яё]*)'), f:'Опыт: требуется для допуска', v:'Нет'},
  {re:ruRe('(?:нужен|требуетс[а-яё]*)\\s+опыт[а-яё]*'),             f:'Опыт: требуется для допуска', v:'Да'},
  {re:ruRe('эквивалент[а-яё]*\\s+(?:допускаетс[а-яё]*|можно)|можно\\s+аналог[а-яё]*'), f:'Эквивалент', v:'Допускается'},
];

/* Процент аванса из текста — «аванс 30%», «аванс не менее 50%», «с
   авансом от 30%». Раньше это поле было достижимо только через палитру:
   в чате распознавалось лишь само наличие аванса (BOOL_PHRASES), число
   при этом терялось молча. Оператор — по тем же словам-подсказкам, что и
   у цены (parsePriceCondition): «не менее»/«от» → «Больше», голое число
   → «Равен». Значение проходит ту же проверку границ (NUMERIC_BOUNDS),
   что и палитра, — поэтому «аванс 500%» не тише пройдёт через чат, чем
   через форму (просьба заказчика, 14.09.2026, п.3.3). */
function parseAdvancePercent(text){
  const t = normRu(text);
  if(!ruRe('аванс[а-яё]*|предоплат[а-яё]*').test(t)) return null;
  const m = t.match(/(?:не\s+ме?нее|от|минимум)\s*(\d{1,3})\s*(?:%|процент[а-яё]*)|(\d{1,3})\s*(?:%|процент[а-яё]*)/);
  if(!m) return null;
  const num = m[1]||m[2];
  const isMin = /не\s+ме?нее|от|минимум/.test(m[0]);
  return {op:isMin?'Больше':'Равен', value:num};
}

/* «Добавь ещё область» / «а по региону?» — география названа без имени:
   конкретного города или региона в тексте нет, есть только слово
   «область»/«регион»/«край». Из контекста это почти всегда значит
   «расширить географию вокруг того, что уже выбрано» (требование: не
   переспрашивать, какую именно область, если из диалога это очевидно).
   Расширяем честно: заменяем город его областью целиком в том же
   критерии — «Место поставки: Ярославль» становится «Место поставки:
   Ярославская обл.». Добавить регион ВТОРЫМ критерием было бы ошибкой:
   критерии пересекаются по И, то есть «город И регион» не расширяет
   выборку, а сужает её — ровно наоборот тому, что просили. */
const REGION_WORD = ruRe('област[а-яё]*|обл\\.?|регион[а-яё]*|кра[йея][а-яё]*|округ[а-яё]*');
function contextualRegionWiden(text){
  if(!REGION_WORD.test(text)) return null;
  /* Если в тексте есть конкретное место — это обычный разбор, не наш случай. */
  if(PLACE_ALIASES.some(a=>a.re.test(text))) return null;
  const idx = findFilterIdx('Место поставки');
  if(idx<0) return null;
  const cities = valList(S.filters[idx].v).filter(c=>CITY_REGION[c]);
  const regions = [...new Set(cities.map(c=>CITY_REGION[c]))];
  if(!regions.length) return null;
  return {cities, regions};
}

/* ---------- главный детерминированный разбор сообщения ---------- */
/* Возвращает список операций над SEARCH_STATE. Каждая операция — уже
   готовая строка критерия (f/o/v), пригодная для addOrMergeFilter(). */
function extractOps(text){
  const ops = [];
  const push = (f,o,v)=>{ if(FIELD_DEFS[f]) ops.push({f,o:o||FIELD_DEFS[f].ops[0],v}); };

  /* ИНН — 10 или 12 цифр подряд. Проверяем ДО цены: иначе длинное число
     могло бы уехать в «НМЦ лота» как сумма. */
  const inn = String(text).match(/\b(\d{10}|\d{12})\b/);
  if(inn) push('ИНН заказчика','Равен',inn[1]);

  /* ОКПД2 — код вида 26.20.11 / 70.33.93.273 (минимум две группы цифр
     через точку, иначе «44.2» из обычного текста ложно сработает). */
  /* ОКПД2 — код вида 26.60.13. Двух групп («15.5») мало: столько же
     выглядит обычное дробное число рядом с ценой, и «от 15.5 млн»
     молча становилось бы кодом классификатора. Поэтому две группы
     принимаем ТОЛЬКО когда классификатор назван явно, иначе требуем
     минимум три. */
  const okpdNamed = ruRe('окпд\\s*2?').test(text);
  const okpd = String(text).match(okpdNamed ? /(\d{2}(?:\.\d{1,3}){1,4})/ : /(\d{2}(?:\.\d{1,3}){2,4})/);
  if(okpd && !inn) push('Категория ОКПД 2','Равен',okpd[1]);

  LAW_ALIASES.forEach(a=>{ if(a.re.test(text)) push('Тип торгов','Равен',a.v); });

  const places = [];
  PLACE_ALIASES.forEach(a=>{
    if(!a.re.test(text)) return;
    if(places.includes(a.v)) return;
    places.push(a.v);
  });
  /* «Костромская область» совпадает и с регион-формой, и с основой
     «костром…» — город внутри уже названной области лишний. */
  places.filter(v=>!(CITY_REGION[v] && places.includes(CITY_REGION[v])))
    .forEach(v=>push('Место поставки', 'Равен', v));
  if(!places.length){
    if(NEAR_CITY.test(text)) push('Место поставки','Равен',USER_GEO.city);
    else if(NEAR_REGION.test(text)) push('Место поставки','Равен',USER_GEO.region);
  }

  const price = parsePriceCondition(text);
  if(price) push('НМЦ лота', price.op, price.value);

  parseDateConditions(text).forEach(d=>push(d.f,d.o,d.v));
  BOOL_PHRASES.forEach(b=>{ if(b.re.test(text)) push(b.f,'Равен',b.v); });
  const advPct = parseAdvancePercent(text);
  if(advPct) push('Аванс: процент', advPct.op, advPct.value);

  /* Статус — отдельными словами, а не через общий enum-скан: «активные»
     и «действующие» пишут гораздо чаще, чем ровно «Активные». */
  if(ruRe('активн[а-яё]*|действующ[а-яё]*|текущ[а-яё]*|открыт[а-яё]*').test(text)) push('Статус торгов','Равен','Активные');
  else if(ruRe('архивн[а-яё]*|завершённ[а-яё]*|завершенн[а-яё]*|прошедш[а-яё]*|закрыт[а-яё]*').test(text)) push('Статус торгов','Равен','Архивные');

  /* Тип предмета — по естественным формулировкам («поставка» = товары,
     «выполнение работ», «оказание услуг»). */
  if(ruRe('поставк[а-яё]*\\s+товар[а-яё]*|закупк[а-яё]*\\s+товар[а-яё]*|только\\s+товар[а-яё]*').test(text)) push('Тип предмета','Равен','Товары');
  else if(ruRe('выполнени[а-яё]*\\s+работ[а-яё]*|строительн[а-яё]*\\s+работ[а-яё]*|подрядн[а-яё]*\\s+работ[а-яё]*|только\\s+работ[а-яё]*').test(text)) push('Тип предмета','Равен','Работы');
  else if(ruRe('оказани[а-яё]*\\s+услуг[а-яё]*|только\\s+услуг[а-яё]*').test(text)) push('Тип предмета','Равен','Услуги');

  scanEnumValues(text).forEach(e=>{
    /* Не перетираем то, что уже определено более специфичным правилом
       выше (например, «Статус торгов» словом «действующие»). */
    if(ops.some(o=>o.f===e.f)) return;
    push(e.f, e.o, e.v);
  });
  return ops;
}

/* ---------- НАМЕРЕНИЕ ---------- */
/* Порядок проверок = приоритет. Сначала самые однозначные («покажи
   результаты», «что значит …»), в конце — общий случай «уточняет поиск».
   Всё детерминированно: намерение слишком дёшево определить по речевым
   маркерам, чтобы платить за него сетевым вызовом и рисковать таймаутом. */
const INTENT_RE = [
  ['status',  ruRe('что\\s+(?:у\\s+меня\\s+)?(?:сейчас\\s+)?в\\s+фильтр[а-яё]*|каки[а-яё]*\\s+фильтр[а-яё]*|текущи[а-яё]*\\s+(?:фильтр|критери)[а-яё]*|что\\s+(?:уже\\s+)?выбран[а-яё]*|мои\\s+критери[а-яё]*|каки[а-яё]*\\s+услови[а-яё]*|что\\s+(?:у\\s+меня\\s+)?(?:сейчас\\s+)?(?:по\\s+)?услови[а-яё]*')],
  ['count',   ruRe('сколько\\s+(?:нашл|найден|получил|остал|подход)[а-яё]*|сколько\\s+(?:сейчас\\s+)?(?:всего\\s+)?закуп[а-яё]*')],
  ['clear',   ruRe('убер[а-яё]*\\s+вс[её]|удали\\s+вс[её]|сброс[а-яё]*|очист[а-яё]*|снять\\s+вс[её]|вс[её]\\s+заново')],
  ['undo',    ruRe('верни\\s+как\\s+было|отмени\\s+последн[а-яё]*|верни\\s+назад|шаг\\s+назад|откати[а-яё]*')],
  ['explain', ruRe('что\\s+(?:значит|такое|означает)|отлича[а-яё]*|в\\s+ч[ёе]м\\s+разниц[а-яё]*|разниц[а-яё]*\\s+между|зачем\\s+(?:нужен|нужна|нужно)|как\\s+понять|поясни[а-яё]*|объясни[а-яё]*|расскажи\\s+про')],
  ['reset',   ruRe('теперь\\s+(?:вообще\\s+)?(?:ищ[а-яё]*|искать|нужн[а-яё]*)|давай\\s+(?:теперь\\s+)?ищ[а-яё]*|вместо\\s+этого|вместо\\s+[а-яё-]+\\s+(?:ищ[а-яё]*|нужн[а-яё]*|хочу|давай)|начн[а-яё]*\\s+заново|новый\\s+поиск|забудь')],
  ['remove',  ruRe('убер[а-яё]*|убрать|удали[а-яё]*|исключ[а-яё]*|сними|снять|отмени[а-яё]*|не\\s+нужн[а-яё]*|больше\\s+не\\s+надо')],
  ['search',  ruRe('покаж[а-яё]*|показать|найд[а-яё]*|искать|выполн[а-яё]*\\s+поиск|поехали|результат[а-яё]*|что\\s+есть')],
  ['help',    ruRe('помог[а-яё]*|не\\s+знаю|подскаж[а-яё]*|как\\s+лучше|посоветуй[а-яё]*|с\\s+чего\\s+начать|что\\s+мне\\s+(?:выбрать|указать)|что\\s+(?:ещ[её]\\s+)?(?:лучше\\s+)?(?:можно\\s+)?(?:ещ[её]\\s+)?уточн[а-яё]*')],
];
/* Короткое согласие («да», «ок», «давай») — ответ на то, что бот только
   что предложил, а не новый запрос. Проверяется ОТДЕЛЬНО от остальных
   намерений и по строгому правилу: вся реплика целиком состоит из слов
   согласия. Через общий список это делать нельзя — «давай найдём закупки
   в Москве» тоже содержит «давай», и такая реплика молча превратилась бы
   в подтверждение вместо поиска. */
const CONFIRM_WORDS = new Set(['да','ага','угу','ок','окей','ok','хорошо','конечно','давай','давайте','поехали','подходит','верно','именно','согласен','согласна','ясно','понятно','отлично','супер','ага-ага','плюс','го']);
function isPureConfirm(text){
  const words = normRu(text).split(/[^а-яёa-z]+/).filter(Boolean);
  return words.length>0 && words.length<=3 && words.every(w=>CONFIRM_WORDS.has(w));
}
const DECLINE_WORDS = new Set(['нет','не','неа','нету','неверно','отмена','стоп','не-а']);
function isPureDecline(text){
  const words = normRu(text).split(/[^а-яёa-z]+/).filter(Boolean);
  return words.length>0 && words.length<=3 && words.every(w=>DECLINE_WORDS.has(w));
}
function detectIntent(text){
  if(isPureConfirm(text)) return 'confirm';
  if(isPureDecline(text)) return 'decline';
  for(const [name, re] of INTENT_RE){ if(re.test(text)) return name; }
  return 'refine';
}

/* ---------- SEARCH_STATE: добавить / изменить / убрать ---------- */
/* Ключевое отличие от прежнего addFilter(): критерий по полю не
   дублируется. Если поле уже есть — значение либо ДОБАВЛЯЕТСЯ к нему
   (перечислимые поля: регионы, типы торгов — «добавь ещё Петербург»),
   либо ЗАМЕНЯЕТ прежнее (числовые и одиночные: вторая цена вместо первой
   — «нет, от 20 млн»). Раньше и то и другое давало вторую строку по
   тому же полю, а строки пересекаются по И — то есть «Москва и
   Петербург» означало «одновременно Москва и Петербург»: ноль. */
const MULTI_VALUE_FIELDS = new Set(['Место поставки','Регион заказчика','Тип торгов','Способ проведения','Тип предмета','Категория ОКПД 2','Заказчик','Способ оплаты','Событие для оплаты','Режим поставки']);
function findFilterIdx(name){ return S.filters.findIndex(r=>r.f===name); }
/* ПРОТИВОРЕЧИЯ. Новое условие по тому же полю, которое не может выполняться
   одновременно со старым («до 1 млн» и «от 5 млн», «с авансом» и «без
   аванса»), молча не применяем — спрашиваем, какое оставить. Не противоречие:
   поля-списки (регион, закон — там «ИЛИ»), совместимые числа («до 2 млн»
   после «до 1 млн» — просто уточнение), явная замена словами «только»,
   «вместо», «не А, а Б». */
function isRangeField(def){ return def && def.values==null && def.ops.some(o=>['Больше','Меньше','До','После','Диапазон'].includes(o)); }
function numInterval(r){
  const range = parseRangeStr(r.v); if(range) return [range.min, range.max];
  const x = parseAmount(valList(r.v)[0]); if(x==null || isNaN(x)) return null;
  if(r.o==='Больше' || r.o==='После') return [x, Infinity];
  if(r.o==='Меньше' || r.o==='До') return [-Infinity, x];
  return [x, x];
}
function conditionsConflict(old, row){
  const def = FIELD_DEFS[row.f];
  if(!def || MULTI_VALUE_FIELDS.has(row.f)) return false;
  if(isRangeField(def)){
    const a = numInterval(old), b = numInterval(row);
    return !!(a && b) && Math.max(a[0],b[0]) > Math.min(a[1],b[1]);
  }
  return normRu(valText(old.v)) !== normRu(valText(row.v));
}
function addOrMergeFilter(name, op, value){
  const def = FIELD_DEFS[name];
  if(!def) return null;
  const idx = findFilterIdx(name);
  if(idx<0){
    S.filters.push({f:name, o:op||def.ops[0], v:value, delta:def.delta});
    return {kind:'added', f:name, v:value};
  }
  const row = S.filters[idx];
  if(MULTI_VALUE_FIELDS.has(name) && (op||def.ops[0])===row.o){
    const cur = valList(row.v).filter(x=>x!=='' && x!=null);
    const add = valList(value).filter(v=>!cur.some(c=>normRu(c)===normRu(v)));
    if(!add.length) return {kind:'same', f:name, v:row.v};
    const merged = cur.concat(add);
    row.v = merged.length>1 ? merged : merged[0];
    return {kind:'extended', f:name, v:row.v, added:add};
  }
  const before = row.v;
  row.o = op||def.ops[0];
  row.v = value;
  return {kind:'replaced', f:name, v:value, before};
}
/* Убрать критерий целиком либо только ОДНО значение из перечисления
   («убери Москву» при регионах Москва+Петербург не должно сносить
   критерий целиком вместе с Петербургом). */
function removeFilterValue(name, value){
  const idx = findFilterIdx(name);
  if(idx<0) return null;
  const row = S.filters[idx];
  if(value!=null && Array.isArray(row.v)){
    const left = row.v.filter(x=>normRu(x)!==normRu(value));
    if(left.length && left.length<row.v.length){
      const removed = row.v.filter(x=>normRu(x)===normRu(value));
      row.v = left.length>1 ? left : left[0];
      return {kind:'narrowed', f:name, removed, v:row.v};
    }
  }
  S.filters.splice(idx,1);
  return {kind:'removed', f:name};
}

/* ---------- LLM: разбор ВСЕГО сообщения целиком ----------
   Прежний llmExtract() умел ровно одно: сопоставить текст с вариантами
   ОДНОГО заранее известного поля. Для «44-ФЗ, Москва, НМЦК от 20 млн,
   только активные» этого мало — здесь модель должна сама решить, к каким
   полям относятся куски фразы, и вернуть их все сразу. Отдельный
   инструмент update_search с массивом операций.

   Детерминированный разбор (extractOps) уже отработал ДО этого вызова, и
   его результат приоритетнее: модель добирает только то, что регулярки
   не увидели. Если сервис недоступен — молча остаёмся на
   детерминированном разборе (не сыплем ошибками в чат: пользователь не
   спрашивал про LLM, а разбор в большинстве случаев уже состоялся). */
function llmFieldCatalogue(){
  return Object.keys(FIELD_DEFS).map(name=>{
    const f = FIELD_DEFS[name];
    const vals = Array.isArray(f.values) ? ' = ' + f.values.join(' | ') : (llmFieldKind(f)==='numeric' ? ' = число' : ' = произвольный текст');
    return `- ${name}${fieldLabel(name)!==name?` (${fieldLabel(name)})`:''}${vals}`;
  }).join('\n');
}
/* ЕДИНЫЙ РАЗБОР СООБЩЕНИЯ (правка 15.09.2026, «чат должен работать
   максимально гибко даже в прототипе», вариант C из трёх обсуждённых —
   LLM разбирает каждое сообщение первым, а не только когда правила
   ничего не нашли). Раньше эта функция только извлекала фильтры; правила
   (extractOps и т.п.) всё равно проверяются первыми и остаются главными
   для дешёвых однозначных случаев (числа, даты, «да/нет» на висящий
   вопрос) — LLM их только ДОБИРАЕТ, а не переопределяет. Но теперь тот же
   единственный вызов на каждое сообщение ещё и отвечает на вопрос или
   реплику в этом же сообщении (поле answer), если она там была — вместо
   того, чтобы код молчал и падал в канцелярский «не по теме»/«не понял
   фильтр» (см. использование parsed.llmAnswer в handleUserMessage/
   respondAfterChange). Контракт с моделью не меняется: она может выбирать
   ТОЛЬКО из реальных полей/значений (валидация ниже та же) и не должна
   ничего решать за код — просто отвечать словами там, где раньше отвечать
   было некому. */
async function llmAnalyzeMessage(text, known, ctx){
  if(!LLM_CFG.apiKey) return null;
  ctx = ctx || {};
  const pendingLines = [];
  if(ctx.pendingCut){
    const cut = ctx.pendingCut, opts = cut.opts(), counts = optionCounts(cut, opts);
    pendingLines.push(`В чате уже задан и ждёт ответа вопрос «${cut.q}». Варианты и сколько закупок останется у каждого: ${opts.map((o,i)=>`${o.l} — ${counts[i]}`).join('; ')}.`);
  }
  const sys = [
    'Ты — единственный модуль разбора сообщений в чате поиска закупок для поставщиков. У тебя ДВЕ задачи на каждое сообщение:',
    '1) Извлечь параметры поиска, если они явно заданы, — вызовом функции update_search (как раньше).',
    '2) Если в сообщении, помимо условий или вместо них, есть вопрос, просьба объяснить/посоветовать, реплика не по теме, или сообщение вообще ни то ни другое — коротко ответить в поле answer той же функции.',
    'Контекст сейчас:',
    `Предмет поиска: ${ctx.query || 'ещё не задан'}.`,
    `Сейчас подходит закупок: ${ctx.n!=null ? ctx.n : 'неизвестно'}.`,

    '3. topic — только сам предмет закупки своими словами («разработка ПО», «медицинское оборудование»), без региона, цены и прочих параметров. Если предмет не изменился — не заполняй.',

    '7. Никогда не заполняй add для полей без закрытого списка значений (Заказчик, ИНН заказчика, Категория ОКПД 2) — их пользователь задаёт только вручную, через отдельную настройку. Не пытайся «закрепить» предмет поиска как категорию ОКПД2.',
    '8. «Что выгоднее — А или Б?», «какой вариант лучше — Х или Y?» — это ВОПРОС для сравнения, а не выбор обоих значений сразу. В add такие названные-для-сравнения значения НЕ попадают, если пользователь явно не попросил искать именно по ним.',
    'Правила для answer:',
    '- Заполняй, только если в сообщении реально есть вопрос, просьба, реплика или что-то ещё, кроме перечисления условий поиска.',
    '- Сообщение — просто короткое подтверждение или ничего не значащая реплика без вопроса («ладно», «хорошо», «спасибо», «хм») — answer оставь пустым, это обработает код.',
    '- Отвечай только на темы поиска закупок и участия поставщиков. Если сообщение вообще не по этой теме — в одном-двух предложениях, своими словами (не шаблонной фразой), скажи, что помогаешь только с подбором закупок; не извиняйся.',
    '- Если висит вопрос (см. контекст выше) и пользователь спрашивает про его варианты («чем отличаются?», «что выбрать?») — сравни варианты по факту из контекста; никогда не выбирай ЗА пользователя и не называй один вариант однозначно лучшим.',
    '- Никогда не придумывай числа, названия критериев или значения, которых нет в контексте выше.',
    '- Пиши коротко: 1–4 предложения, простым текстом без markdown и списков.',
  ].join('\n');
  const tool = {type:'function', function:{
    name:'update_search',
    description:'Обновляет состояние поиска закупок по сообщению пользователя и, если нужно, отвечает на вопрос в нём же.',
    parameters:{type:'object', properties:{
      topic:{type:'string', description:'Новый предмет поиска, если он задан или изменён. Иначе пустая строка.'},
      add:{type:'array', description:'Критерии, которые нужно установить.', items:{type:'object', properties:{
        field:{type:'string', enum:Object.keys(FIELD_DEFS)},
        value:{type:'string'},
        op:{type:'string', enum:['Равен','Содержит','Больше','Меньше','Диапазон','До','После']}
      }, required:['field','value']}},
      remove:{type:'array', description:'Критерии, которые нужно убрать.', items:{type:'object', properties:{
        field:{type:'string', enum:Object.keys(FIELD_DEFS)},
        value:{type:'string', description:'Конкретное значение, если убрать нужно только его. Иначе пустая строка.'}
      }, required:['field']}},
      answer:{type:'string', description:'Ответ на вопрос/реплику вне выбора условий. Пустая строка, если такого вопроса нет.'}
    }, required:['add']}
  }};
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), LLM_CFG.timeoutMs);
  try{
    const res = await fetch(LLM_CFG.baseUrl.replace(/\/+$/,'')+'/v1/chat/completions', {
      method:'POST',
      headers:{'Authorization':'Bearer '+LLM_CFG.apiKey, 'Content-Type':'application/json'},
      signal: controller.signal,
      body: JSON.stringify({
        model: LLM_CFG.model, temperature:0, max_tokens:700, /* фильтры + связный ответ теперь в одном вызове — 500 иногда обрезало answer */
        chat_template_kwargs:{enable_thinking:false},
        tools:[tool], tool_choice:'auto',
        messages:[{role:'system',content:sys},{role:'user',content:text}]
      })
    });
    clearTimeout(timer);
    if(!res.ok) return null;
    const data = await res.json();
    const call = data && data.choices && data.choices[0] && data.choices[0].message
      && data.choices[0].message.tool_calls && data.choices[0].message.tool_calls[0];
    if(!call) return null;
    let parsed; try{ parsed = JSON.parse(call.function.arguments); }catch(e){ return null; }
    /* Валидация — та же дисциплина, что и в validateLlmResult(): в
       состояние поиска попадает только то, что реально существует в
       FIELD_DEFS и (для перечислимых полей) входит в список допустимых
       значений. Придуманное моделью значение отбрасываем молча. */
    const add = (parsed.add||[]).map(o=>{
      const def = FIELD_DEFS[o.field]; if(!def) return null;
      /* Поля без закрытого списка значений (Заказчик, ИНН, ОКПД2) — только
         через ручной ввод/палитру (см. §16 спецификации), не через общий
         разбор чата: проверено тестами 15.09.2026 — модель, увидев в
         контексте текущий предмет («компьютеры»), иногда сама проставляет
         его же как «Категория ОКПД 2: компьютеры» (не код, а слово), что
         обнуляет выдачу. Промпт это тоже просит не делать, но здесь —
         гарантия кодом, а не только инструкцией модели. */
      if(llmFieldKind(def)==='text') return null;
      let v = String(o.value==null?'':o.value).trim(); if(!v) return null;
      if(Array.isArray(def.values)){
        const hit = def.values.find(x=>normRu(x)===normRu(v));
        if(!hit) return null;
        v = hit;
      }
      const op = def.ops.includes(o.op) ? o.op : def.ops[0];
      return {f:o.field, o:op, v};
    }).filter(Boolean);
    const remove = (parsed.remove||[]).map(o=>FIELD_DEFS[o.field] ? {f:o.field, v:(o.value||'').trim()||null} : null).filter(Boolean);
    /* answer — свободный текст модели, а не служебные данные: экранируем и
       нормализуем markdown, которым модель иногда всё равно балуется
       (см. тот же приём в llmAnswerAboutOptions). */
    const answerRaw = typeof parsed.answer==='string' ? parsed.answer.trim() : '';
    const answer = answerRaw ? esc(answerRaw).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*/g,'').replace(/\n+/g,'<br>') : '';
    return {topic:(parsed.topic||'').trim(), add, remove, answer};
  }catch(err){ clearTimeout(timer); return null; }
}

/* =====================================================================
   ЯДРО: ЧИСЛО, СИЛА ФИЛЬТРА, ПРИЧИНА НУЛЯ
   ===================================================================== */
/* Сколько закупок подходит под предмет + набор условий. Чистая функция:
   не трогает S — поэтому ей же считаются «что будет, если снять это
   условие» и «сколько даст каждый вариант ответа». */
function applyRows(ids, rows){
  rows.forEach(r=>{
    const pred = r && r.f ? REAL_FILTER_PRED[r.f] : null;
    if(pred) ids = ids.filter(id=>{ const p=PROCS_BY_ID.get(id); return p && matchFilter(pred, p, r.v, r.o); });
  });
  return ids;
}
function computeN(rows, query){
  const q = query===undefined ? S.query : query;
  return applyRows(rankMatches(q), rows||[]);
}
/* Режущий фильтр уже задан — самим полем или полем, которое его
   покрывает («Регион заказчика» закрывает вопрос о месте поставки). */
function cutIsSet(cut){
  return [cut.field].concat(cut.covers||[]).some(f=>findFilterIdx(f)>=0);
}
/* ПОЛЕЗНОСТЬ ВОПРОСА. Продуктовое правило — AI выбирает самый полезный
   следующий фильтр. В прототипе полезность оценивается приближённо, через
   способность фильтра разделить текущую выдачу, — это ТЕХНИЧЕСКАЯ ЭВРИСТИКА,
   а не окончательная модель: позже в оценку могут войти важность параметра,
   типичность для сценария и поведение пользователей. Сама эвристика: берём
   распределение значений поля ВНУТРИ текущей выдачи и считаем
   1 − Σ pᵢ² (индекс Джини–Симпсона): это ожидаемая доля выдачи, которая
   отсечётся, если человек ответит на вопрос. Поле, где у всех закупок
   одно и то же значение, даёт 0 — спрашивать про него бессмысленно;
   поле, по которому выдача разбросана на много сопоставимых частей, —
   ближе к 1. Считается заново на каждый ход — от текущей выдачи, а не
   от базы в целом, поэтому один и тот же фильтр бывает сильным для одной
   темы и бесполезным для другой. */
function filterStrength(cut, ids){
  if(!ids.length) return 0;
  const counts = new Map();
  ids.forEach(id=>{
    const p = PROCS_BY_ID.get(id); if(!p) return;
    const b = String(cut.bucket(p));
    counts.set(b, (counts.get(b)||0)+1);
  });
  let sumSq = 0;
  counts.forEach(c=>{ const x=c/ids.length; sumSq += x*x; });
  return 1 - sumSq;
}
/* КАНДИДАТЫ НА ВОПРОС — любой доступный фильтр, а не фиксированный набор.
   Фильтр НЕ рекомендуется, если:
   • уже задан (или задан покрывающий его фильтр: «Регион заказчика» —
     место поставки);
   • явно отклонён в текущей теме («Не важно», «Вся Россия»);
   • неприменим к текущему поиску: нельзя фильтровать; нет закрытого
     набора ответов (свободный текст — заказчик, ИНН, ОКПД2); или ни один
     вариант ответа реально не меняет выдачу (у всех закупок одно значение
     либо значение не заполнено);
   • полезность ниже minStrength.
   Количество кандидатов ничем не ограничено. Полезность — текущая
   техническая эвристика (Джини–Симпсон), см. filterStrength/genericQuestion. */
let _qMemo = {sig:null, map:new Map()};
/* Кэш на одно состояние поиска: кандидаты и варианты ответов пересчитываются,
   только когда меняются тема, фильтры, выдача или отказы. */
function memoQ(k, fn){
  const ws = S.workingSet || [];
  const sig = [S.query, JSON.stringify((S.filters||[]).map(r=>[r.f,r.o,r.v])), ws.length, ws[0], ws[ws.length-1], (S.declined||[]).join(',')].join('|');
  if(_qMemo.sig!==sig) _qMemo = {sig, map:new Map()};
  if(!_qMemo.map.has(k)) _qMemo.map.set(k, fn());
  return _qMemo.map.get(k);
}
function rankQuestionModels(){
  return memoQ('rank', ()=>{
    const ids = S.workingSet, N = ids.length;
    if(!N) return [];
    const declined = S.declined || [];
    const out = [];
    CUT_FILTERS.forEach(c=>{
      if(cutIsSet(c) || declined.includes(c.key)) return;
      const counts = optionCounts(c, c.opts().filter(o=>o.v!=null));
      if(!counts.some(n=>n>0 && n<N)) return; /* ни один вариант не меняет выдачу */
      out.push({m:c, strength:filterStrength(c, ids)});
    });
    FIELD_KEYS.forEach(field=>{
      if(CUT_BY_FIELD[field] || COVERED_FIELDS.has(field) || findFilterIdx(field)>=0 || !REAL_FILTER_PRED[field]) return;
      if(declined.includes(qKeyOf(field))) return;
      const g = genericQuestion(field);
      if(!g.opts.length) return;
      out.push({m:genericModel(field), strength:g.strength});
    });
    return out.filter(x=>x.strength>=SEARCH_CFG.minStrength).sort((a,b)=>b.strength-a.strength);
  });
}
/* Модель вопроса по полю без ручного пресета: текст вопроса — из справочника
   полей (FIELD_DEFS.q), варианты — из данных текущей выдачи, плюс «Не важно»
   (явный отказ от уточнения). */
function genericModel(field){
  const def = FIELD_DEFS[field];
  const m = {key:qKeyOf(field), field, label:fieldLabel(field), q:def.q || `${fieldLabel(field)}?`, generic:true};
  m.opts = ()=>genericQuestion(field).opts.map(o=>({l:o.l, o:o.o, v:o.v})).concat([{l:'Не важно', v:null}]);
  Object.defineProperty(m, 'yesNo', {get(){
    const o = m.opts(), y = o.findIndex(x=>x.v==='Да'), n = o.findIndex(x=>x.v==='Нет');
    return y>=0 && n>=0 ? [y, n] : undefined;
  }});
  return m;
}
/* Варианты ответа и полезность вопроса по полю на текущей выдаче.
   • список значений / да-нет — значения из справочника, которые реально
     встречаются в выдаче и сужают её;
   • число — пороги по терцилям текущих значений («не больше X» / «не меньше Y»;
     для дат — «за последние N дн.»);
   • свободный текст — вопрос неприменим (закрытого набора ответов нет).
   Полезность — индекс Джини–Симпсона по разбиению выдачи на ответы
   (+ группа «остальное / не заполнено»). */
function genericQuestion(field){
  return memoQ('g:'+field, ()=>{
    const def = FIELD_DEFS[field], ids = S.workingSet, N = ids.length;
    const kind = llmFieldKind(def);
    let cand = [], bins = null;
    if(kind==='enum'){
      cand = def.values.filter(v=>!/^(Указать|Ввести)\s/i.test(v) && !['любые торги','все'].includes(normRu(v)))
        .map(v=>({l:String(valueLabel(field, v)), v}));
    } else if(kind==='numeric'){
      const q = numericQuestionOptions(field, def, ids);
      cand = q.opts; bins = q.bins;
    }
    const opts = cand.map(o=>Object.assign(o, {n:applyRows(ids, [{f:field, o:o.o||def.ops[0], v:o.v}]).length}))
      .filter(o=>o.n>0 && o.n<N);
    if(!opts.length) return {opts:[], strength:0};
    if(kind==='enum') opts.sort((a,b)=>b.n-a.n);
    const parts = bins || opts.map(o=>o.n);
    const rest = Math.max(0, N - parts.reduce((a,b)=>a+b, 0));
    let sumSq = 0;
    parts.concat(rest).forEach(c=>{ const x = c/N; sumSq += x*x; });
    return {opts, strength:1-sumSq};
  });
}
function numericValueOf(field, p){
  const d = critValueOnProc(field, p);
  if(d==null) return null;
  const m = String(d).replace(/\s/g,'').match(/-?\d+(?:[.,]\d+)?/);
  return m ? parseFloat(m[0].replace(',','.')) : null;
}
function niceNum(x){
  if(x>=1000){ const k = Math.pow(10, Math.floor(Math.log10(x))-1); return Math.round(x/k)*k; }
  if(x>=20) return Math.round(x/5)*5;
  return Math.max(1, Math.round(x));
}
function numericQuestionOptions(field, def, ids){
  const vals = [];
  ids.forEach(id=>{ const p = PROCS_BY_ID.get(id); const v = p ? numericValueOf(field, p) : null; if(v!=null && !isNaN(v)) vals.push(v); });
  vals.sort((a,b)=>a-b);
  if(vals.length<2 || vals[0]===vals[vals.length-1]) return {opts:[], bins:null};
  const at = f=>vals[Math.floor(f*(vals.length-1))];
  const t1 = niceNum(at(1/3));
  let t2 = Math.max(t1, niceNum(at(2/3)));
  /* Много одинаковых значений (например, нулевой аванс у большинства) —
     оба порога совпали бы. Второй порог берём по значениям выше первого. */
  if(t2===t1){
    const above = vals.filter(v=>v>t1);
    if(above.length) t2 = Math.max(t1+1, niceNum(above[Math.floor((above.length-1)/2)]));
  }
  const ago = def.ops.includes('После') && !def.ops.includes('Больше');
  const unit = (NUMERIC_BOUNDS[field]||{}).unit || '';
  const suf = unit==='%' ? '%' : unit ? ' '+unit : '';
  const opts = ago
    ? [{l:`За последние ${t1} дн.`, o:'После', v:String(t1)}, {l:`Раньше, чем ${t2} дн. назад`, o:'До', v:String(t2)}]
    : [{l:`Не больше ${fmt(t1)}${suf}`, o:'Меньше', v:String(t1)}, {l:`Не меньше ${fmt(t2)}${suf}`, o:'Больше', v:String(t2)}];
  const lo = vals.filter(v=>v<=t1).length;
  const hi = t2>t1 ? vals.filter(v=>v>=t2).length : vals.filter(v=>v>t1).length;
  return {opts, bins:[lo, Math.max(0, vals.length-lo-hi), hi]};
}
/* ЕДИНАЯ ТОЧКА РЕКОМЕНДАЦИЙ (итоговая логика, п.14). Одна функция отвечает
   на вопрос «что сейчас полезнее всего сделать с фильтрами», и её
   используют: вопрос бота, чипы «Можно сузить» в чате,
   «помогите выбрать», популярные параметры в «Настроить поиск», починка
   нуля и «шире» — чтобы чат и интерфейс не советовали разное в одной и
   той же ситуации.
   narrow — любые применимые фильтры (rankQuestionModels): ещё не заданы,
     не отклонены в текущей теме, полезность не ниже minStrength; по
     убыванию полезности. Числа кандидатов не ограничено.
   widen — что убрать или ослабить, чтобы закупок стало больше; по
     убыванию того, сколько вернётся. При нуле — только из ядра конфликта.
     Считается только по запросу (opts.widen): это пересчёт на каждый фильтр. */
function getBestNextFilters(opts){
  const narrow = rankQuestionModels().map(x=>x.m);
  if(!opts || !opts.widen) return {narrow, widen:[]};
  let cand = S.filters.map((_,i)=>i).filter(i=>S.filters[i].f);
  if(S.total===0 && cand.length) cand = zeroCore();
  return {narrow, widen:widenOptions(cand)};
}
/* Варианты расширения: убрать фильтр целиком или — для места поставки —
   мягче: город заменить его областью («Расширить до: Ярославская обл.»). */
function widenOptions(cand){
  const cur = S.workingSet.length;
  const out = [];
  cand.forEach(i=>{
    const r = S.filters[i];
    if(r.f==='Место поставки'){
      const vals = valList(r.v);
      const regions = [...new Set(vals.filter(v=>CITY_REGION[v]).map(v=>CITY_REGION[v]))];
      if(regions.length){
        const nv = [...new Set(vals.filter(v=>!CITY_REGION[v]).concat(regions))];
        const rows = S.filters.map((x,j)=>j===i ? Object.assign({}, x, {v:nv.length>1?nv:nv[0]}) : x);
        const n = computeN(rows).length;
        if(n>cur) out.push({i, n, l:`Расширить до: ${regions.join(', ')}`, c:`widenRegion(${i})`});
      }
    }
    const n = nWithout(i);
    if(n>cur) out.push({i, n, l:relaxLabel(r), c:`relaxCondition(${i})`});
  });
  return out.sort((a,b)=>b.n-a.n);
}
function widenActs(list){ return list.map(x=>({l:esc(x.l), c:x.c, cnt:x.n, cls:'fix'})); }
function widenRegion(i){
  if(S.busy) return;
  const r = S.filters[i]; if(!r) return;
  const vals = valList(r.v);
  const regions = [...new Set(vals.filter(v=>CITY_REGION[v]).map(v=>CITY_REGION[v]))];
  if(!regions.length) return;
  const nv = [...new Set(vals.filter(v=>!CITY_REGION[v]).concat(regions))];
  say('me', `Расширить до: ${esc(regions.join(', '))}`);
  pushUndo();
  r.v = nv.length>1 ? nv : nv[0];
  clearActionBlocks();
  render();
  botThink(()=>respondAfterChange({changed:[r]}), 500);
}
/* Следующий вопрос — самый полезный фильтр. Если вопрос по нему уже звучал,
   предлагаем снова, только когда выдача с тех пор изменилась хотя бы в
   reaskChange раз и фильтр по-прежнему в числе полезных; иначе — следующий. */
function questionCandidates(){
  const askedN = S.askedN || {}, k = SEARCH_CFG.reaskChange, n = S.total;
  return getBestNextFilters().narrow.filter(m=>{
    const n0 = askedN[m.key];
    return n0==null || n >= n0*k || n*k <= n0;
  });
}
function pickQuestion(){ return questionCandidates()[0] || null; }
/* ВЫБОР ВОПРОСА: АЛГОРИТМ + LLM (спецификация, §14–15).
   Код решает, ЧТО вообще можно спросить: questionCandidates() — все допустимые
   кандидаты по Джини–Симпсону, без ограничения по количеству. LLM выбирает
   из них самый уместный сейчас и может переформулировать вопрос. Варианты
   ответа, числа и фильтры LLM не трогает: они берутся из модели вопроса.
   Защита: ключ принимается, только если он есть в списке кандидатов;
   формулировка — только короткий вопрос без разметки. Нет ключа API, ошибка,
   ответ дольше llmPickTimeoutMs или неверный ключ — берём первого по Джини.
   Чипы «Можно сузить», «что лучше уточнить?» и «Часто уточняют сейчас»
   остаются в порядке Джини: LLM выбирает только активный вопрос. */
function plainText(html){ return String(html||'').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim(); }
function questionPickContext(cands){
  const strength = new Map(rankQuestionModels().map(x=>[x.m.key, x.strength]));
  const lastMe = [...S.chat].reverse().find(m=>m.who==='me');
  const label = k=>{ const m = qModel(k); return m ? m.label : k; };
  return [
    `Предмет поиска: ${S.query}`,
    `Фильтры: ${S.filters.filter(r=>r.f).map(r=>plainText(condPhrase(r))).join('; ') || 'нет'}`,
    `Сейчас закупок: ${S.total}`,
    `Список закупок уже открывался: ${S.gridOpened ? 'да' : 'нет'}`,
    `Уточняющих вопросов уже задано: ${S.askedCount||0}${(S.askedKeys||[]).length ? ' ('+[...new Set(S.askedKeys)].map(label).join(', ')+')' : ''}`,
    `Отказался уточнять («Не важно»): ${(S.declined||[]).map(label).join(', ') || 'нет'}`,
    `Последнее сообщение пользователя: ${lastMe ? plainText(lastMe.h) : '—'}`,
    '',
    'Кандидаты (ключ | фильтр | вопрос | полезность 0–1 | варианты · сколько закупок останется):',
    ...cands.map(m=>{
      const opts = m.opts(), cnt = optionCounts(m, opts);
      return `${m.key} | ${m.label} | ${m.q} | ${(strength.get(m.key)||0).toFixed(2)} | ${opts.map((o,i)=>`${o.l} · ${cnt[i]}`).join('; ')}`;
    }),
  ].join('\n');
}
async function chooseQuestion(cands){
  const fallback = {m:cands[0], q:null, by:'gini'};
  if(!LLM_CFG.apiKey) return fallback;
  const keys = cands.map(m=>m.key);
  const sys = ['Ты выбираешь следующий уточняющий вопрос в сервисе поиска закупок.',
    'Выбирай ТОЛЬКО одного кандидата из списка — по его ключу. Других фильтров и значений не придумывай.',
    'Выбирай вопрос, который сейчас уместнее всего: понятен новичку, заметно делит выдачу (полезность и числа в вариантах), естественно продолжает диалог, учитывает последнее сообщение и не возвращается к уже обсуждённому.',
    'Можешь переформулировать вопрос короче и проще, по-русски, в одно предложение со знаком вопроса. Не перечисляй в нём варианты и не пиши числа закупок.',
    'Ответь только вызовом функции choose_question.'].join('\n');
  const tool = {type:'function', function:{name:'choose_question',
    description:'Выбрать один вопрос из кандидатов.',
    parameters:{type:'object', properties:{
      key:{type:'string', enum:keys, description:'Ключ выбранного кандидата, дословно из списка.'},
      question:{type:'string', description:'Формулировка вопроса для пользователя (необязательно).'}
    }, required:['key']}}};
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), SEARCH_CFG.llmPickTimeoutMs);
  try{
    const res = await fetch(LLM_CFG.baseUrl.replace(/\/+$/,'')+'/v1/chat/completions', {
      method:'POST', headers:{'Authorization':'Bearer '+LLM_CFG.apiKey, 'Content-Type':'application/json'}, signal:controller.signal,
      body: JSON.stringify({ model:LLM_CFG.model, temperature:0, max_tokens:120,
        chat_template_kwargs:{enable_thinking:false}, tools:[tool], tool_choice:'auto',
        messages:[{role:'system',content:sys},{role:'user',content:questionPickContext(cands)}] })
    });
    clearTimeout(timer);
    if(!res.ok) return fallback;
    const data = await res.json();
    const msg = data && data.choices && data.choices[0] && data.choices[0].message;
    const call = msg && msg.tool_calls && msg.tool_calls[0];
    if(!call) return fallback;
    const args = JSON.parse(call.function.arguments);
    const m = cands.find(x=>x.key===args.key);
    if(!m) return fallback;
    const q = typeof args.question==='string' ? args.question.trim() : '';
    const okQ = q.length>=5 && q.length<=140 && /\?$/.test(q) && !/[<>]/.test(q);
    return {m, q: okQ ? q : null, by:'llm'};
  }catch(err){ clearTimeout(timer); return fallback; }
}
/* Сколько останется при каждом варианте ответа — показываем прямо на
   кнопке, чтобы выбор был осознанным. Вариант без значения («Вся Россия»,
   «Могу внести») — без сужения, то есть текущее N. */
function optionCounts(cut, opts){
  return opts.map(o=>o.v==null ? S.workingSet.length : applyRows(S.workingSet, [rowFromOpt(cut, o)]).length);
}
/* ---------- причина нуля ----------
   Минимальное сочетание условий, которое само по себе даёт ноль. Жадное
   вычёркивание: идём по условиям и выбрасываем из «виновников» каждое,
   без которого ноль всё равно сохраняется. В конце остаются только те,
   снятие ЛЮБОГО из которых уже возвращает результаты, — их и называем по
   именам. Не «последний добавленный» и не «первый обнуливший по
   порядку», а настоящее ядро конфликта: для «до 300 тыс. + аванс + без
   обеспечения» это все три, для несуществующего ИНН — один ИНН. */
function zeroCore(){
  const base = rankMatches(S.query);
  /* Строки без выбранного поля (модалка «Критерии подбора», ещё не
     довыбранная строка) не могут быть частью причины нуля — исключаем их
     сразу, а не только полагаемся на то, что снятие такой строки ничего
     не меняет (условие ниже это бы и так отсеяло, но обращение к
     condPhrase() дальше по коду упало бы на такой строке, см. condPhrase). */
  let core = S.filters.map((_,i)=>i).filter(i=>S.filters[i].f);
  S.filters.forEach((_,i)=>{
    const trial = core.filter(j=>j!==i);
    if(applyRows(base, trial.map(j=>S.filters[j])).length===0) core = trial;
  });
  return core;
}
/* Что вернёт снятие ОДНОГО условия при сохранении всех остальных. */
function nWithout(idx){
  return computeN(S.filters.filter((_,j)=>j!==idx)).length;
}
/* Кнопки-починки: по одной на условие, лучшие по числу возвращённых
   закупок. Для нуля — только из ядра конфликта; для «мало» — из всех. */
function fixOptions(candidates){
  return candidates.map(i=>({i, n:nWithout(i)}))
    .filter(x=>x.n>S.workingSet.length)
    .sort((a,b)=>b.n-a.n)
    .slice(0, SEARCH_CFG.fixButtons);
}
/* Условие короткой фразой, как его сказал бы человек: «сумма до 300 тыс.
   ₽», «с авансом», «без обеспечения заявки». Возвращает безопасный HTML. */
function condPhrase(r){
  /* Строка модалки «Критерии подбора», пока критерий ещё не выбран
     (addFilterRow кладёт {f:null,...} — просьба заказчика: не подставлять
     дефолтное поле молча), — не настоящее условие. Раньше это падало
     здесь с TypeError (fieldLabel(null) → null.charAt) и обрывало render()
     ПОСРЕДИ работы — так выглядела как «висит всё приложение»: не только
     новая строка не появлялась в модалке, но и следующий клик (хоть
     «Применить», хоть «Сохранить критерии») застревал на том же месте,
     пока поле для новой строки не выбрано. Реальный баг, найден по
     репорту пользователя (14.09.2026). */
  if(!r || !r.f) return '';
  const v = r.v, yes = /^да$/i.test(String(valList(v)[0]));
  switch(r.f){
    case 'НМЦ лота': {
      const rg = parseRangeStr(v);
      if(rg) return `сумма ${esc(moneyShort(rg.min))} – ${esc(moneyShort(rg.max))}`;
      const n = parseAmount(valList(v)[0]);
      return (r.o==='Больше'?'сумма от ':r.o==='Меньше'?'сумма до ':'сумма ')+esc(moneyShort(n));
    }
    case 'Наличие аванса': return yes ? 'с авансом' : 'без аванса';
    case 'Наличие обеспечения заявки': return yes ? 'с обеспечением заявки' : 'без обеспечения заявки';
    case 'МСП / СОНО': return yes ? 'только для МСП' : 'без закупок для МСП';
    case 'Окончание приема заявок': return r.o==='После' ? `на подачу не меньше ${esc(v)} дн.` : `подача в ближайшие ${esc(v)} дн.`;
    case 'Место поставки': return esc(valText(v));
    case 'Тип торгов': return esc(valText(v));
  }
  /* Первую букву — строчной, но аббревиатуры («ИНН», «КСР») не трогаем. */
  const lab = fieldLabel(r.f);
  const low = /^[А-ЯЁA-Z]{2}/.test(lab) ? lab : lab.charAt(0).toLowerCase()+lab.slice(1);
  return `${esc(low)}: ${critValDisplay(r.f, r.o, v)}`;
}
/* Надпись на кнопке, снимающей условие, — действием, а не «удалить
   фильтр»: «Разрешить обеспечение», «Убрать требование аванса». */
function relaxLabel(r){
  if(!r || !r.f) return '';
  const yes = /^да$/i.test(String(valList(r.v)[0]));
  switch(r.f){
    case 'Наличие обеспечения заявки': return yes ? 'Не требовать обеспечение' : 'Разрешить обеспечение';
    case 'Наличие аванса': return yes ? 'Убрать требование аванса' : 'Разрешить аванс';
    case 'НМЦ лота': return 'Снять ограничение по сумме';
    case 'Место поставки': return 'Искать по всей России';
    case 'Регион заказчика': return 'Любой регион заказчика';
    case 'Тип торгов': return 'Любой закон';
    case 'МСП / СОНО': return 'Без ограничения по МСП';
    case 'Окончание приема заявок': return 'Любой срок подачи';
  }
  return `Убрать «${condPhrase(r)}»`;
}

/* ---------- ОБЪЯСНЕНИЕ КРИТЕРИЕВ ----------
   Пары критериев, которые люди путают чаще всего. Для них — не просто
   два тултипа подряд, а именно объяснение РАЗНИЦЫ с бытовым примером и
   рекомендацией, что выбрать под задачу (как в требовании). Для всех
   остальных полей объяснение собирается из уже имеющихся tip/values. */
const EXPLAIN_PAIRS = [
  {a:'Регион заказчика', b:'Место поставки',
   text:'<b>Регион заказчика</b> — где зарегистрирована организация, которая проводит закупку.<br><b>Место поставки</b> — где фактически нужно поставить товар или выполнить работы.<br><br>Например, заказчик может находиться в Москве, но закупать оборудование для объекта в Казани.<br><br>Если вам важно, где будет реальный проект или клиент, ориентируйтесь на место поставки. Если важно, с кем вы заключаете договор, — на регион заказчика.'},
  {a:'Наличие обеспечения заявки', b:'Требуется обеспечение исполнения',
   text:'<b>Обеспечение заявки</b> вносится до подведения итогов — это залог того, что вы не откажетесь от подписания контракта. Его возвращают всем проигравшим.<br><b>Обеспечение исполнения</b> вносит уже победитель, перед подписанием контракта, и оно держится до конца исполнения.<br><br>Первое влияет на то, сколько денег нужно заморозить, чтобы просто поучаствовать. Второе — на то, сколько понадобится, если вы выиграете.'},
  {a:'Опыт: требуется для допуска', b:'Опыт: критерий оценки',
   text:'<b>Опыт для допуска</b> — обязательное требование: без подтверждённого опыта заявку просто отклонят.<br><b>Опыт как критерий оценки</b> — не обязателен, но добавляет баллов при сравнении заявок.<br><br>Если опыта пока мало, вам интереснее закупки, где он влияет только на оценку, а не на допуск.'},
  {a:'Дата публикации торгов', b:'Окончание приема заявок',
   text:'<b>Дата публикации</b> — когда закупка появилась на площадке. Помогает смотреть только свежее и не разбирать одно и то же дважды.<br><b>Окончание приёма заявок</b> — до какого момента вы физически успеваете подать документы.<br><br>Если нужно «что нового», это дата публикации. Если «что я ещё успею», — окончание приёма заявок.'},
];
function explainField(name){
  const f = FIELD_DEFS[name];
  if(!f) return null;
  const pair = EXPLAIN_PAIRS.find(p=>p.a===name || p.b===name);
  let h = '';
  if(pair){
    h = pair.text;
  } else {
    h = `<b>${esc(fieldLabel(name))}</b> — ${esc(f.tip || f.q || 'фильтр поиска закупок.')}`;
    if(Array.isArray(f.values) && f.values.length){
      h += `<br><br>Возможные значения: ${f.values.map(v=>esc(v)).join(', ')}.`;
    } else if(llmFieldKind(f)==='numeric'){
      h += '<br><br>Указывается числом — можно задать «от», «до» или диапазон.';
    }
  }
  return h;
}
/* Какой критерий человек просит объяснить. Ищем среди ВСЕХ полей, а не
   только неотвеченных (в отличие от guessFieldFromText) — спрашивают
   обычно как раз про то, что уже применилось и дало неожиданный
   результат. */
/* Как поля называют вслух — «СМП», «аванс», «44-ФЗ», — а не по их
   техническому имени. */
const EXPLAIN_ALIASES = [
  [ruRe('смп|мсп|соно|мал[а-яё]*\\s+бизнес[а-яё]*'), 'МСП / СОНО'],
  [ruRe('обеспечени[а-яё]*\\s+заявк[а-яё]*'), 'Наличие обеспечения заявки'],
  [ruRe('обеспечени[а-яё]*\\s+исполнени[а-яё]*'), 'Требуется обеспечение исполнения'],
  [ruRe('аванс[а-яё]*|предоплат[а-яё]*'), 'Наличие аванса'],
  [ruRe('нмцк?|начальн[а-яё]*\\s+цен[а-яё]*'), 'НМЦ лота'],
  [ruRe('44[-\\s]?фз|223[-\\s]?фз|615[-\\s]?пп|закон[а-яё]*'), 'Тип торгов'],
  [ruRe('нацрежим[а-яё]*'), 'Национальный режим'],
];
/* strict=true — только уверенные совпадения (алиас или точное имя поля),
   без нечёткой оценки по словам ниже. Нужен там, где угаданное поле сразу
   решает, что показать пользователю, БЕЗ подстраховки живым разбором
   (см. вызов при intent==='explain' в handleUserMessage): нечёткая оценка
   там путала общие фразы вроде «объясни, как вообще устроена эта система
   закупок» с конкретным полем «Объём закупки» — просто по совпадению слова
   «закупки» (баг, найден тестами 15.09.2026). Второй вызов той же функции
   (в разборе «ничего не изменилось») страховки не требует: если LLM уже
   ответила (parsed.llmAnswer), до него дело не доходит вовсе. */
function guessFieldForExplain(text, strict){
  const byAlias = EXPLAIN_ALIASES.filter(([re])=>re.test(text)).map(([,n])=>n);
  if(byAlias.length) return byAlias;
  const toks = tokenize(text);
  const norm = normRu(text);
  const names = Object.keys(FIELD_DEFS);
  const exact = names.filter(n=>norm.includes(normRu(fieldLabel(n))) || norm.includes(normRu(n)));
  if(exact.length){ exact.sort((a,b)=>fieldLabel(b).length-fieldLabel(a).length); return exact; }
  if(strict) return [];
  const scored = names.map(n=>({n, cov:fieldNameCoverage(n, toks), s:fieldMatchScore(n, toks)}))
    .filter(x=>x.s>0 && x.cov>0);
  scored.sort((a,b)=>b.cov-a.cov || b.s-a.s);
  return scored.slice(0,2).map(x=>x.n);
}

/* ---------- ИНТЕРАКТИВНЫЕ ДЕЙСТВИЯ ----------
   Сообщение с готовыми кнопками. Кнопки не обрезаются: у вопроса по полю
   со списком может быть до 6 значений + «Не важно» + «Показать все» +
   «Настроить поиск», и ни одну из них терять нельзя.
   cnt — число закупок, которое даст кнопка; cls — вид кнопки.
   Свободный ввод при этом всегда остаётся доступен. */
function actionsBlock(m){
  const acts = m.acts||[];
  if(!acts.length) return '';
  return `<div class="chiprow">${acts.map(a=>
    `<button class="chip ${a.muted?'muted':''} ${a.cls||''}" onclick="${a.c}">${a.l}${a.cnt!=null?`<span class="cnt">${fmt(a.cnt)} ${buyWord(a.cnt)}</span>`:''}</button>`).join('')}</div>`;
}
function sayActions(html, acts, extra){ S.chat.push(Object.assign({who:'bot', h:html, x:'actions', acts}, extra||{})); }


/* =====================================================================
   ГИБКОСТЬ РАЗБОРА: КЛАУЗЫ, ЗАМЕНА, ЧИСЛИТЕЛЬНЫЕ, ОПЕЧАТКИ
   =====================================================================
   Первая версия разбирала реплику как единое целое: одно намерение на всё
   сообщение и одно действие — «добавить». На живой речи это разваливалось
   сразу в нескольких местах:

   • «не Москва, а Казань» и «давай только Питер» ДОБАВЛЯЛИ город к уже
     выбранному вместо замены — то есть реплика, которой человек сужает
     поиск, на деле его расширяла, прямо против сказанного;
   • «убери Москву и добавь Питер» выполняло только первую половину, вторая
     терялась молча;
   • «до трёх миллионов» не понималось вообще — числительные словами не
     разбирались;
   • «да», «ок», «сколько нашлось?», «убери всё», «верни как было» —
     ничего из этого не работало.

   Разбор идёт по клаузам: реплика режется на смысловые куски, у каждого
   своё действие (добавить / заменить / убрать), и все они применяются.
   ===================================================================== */

/* Числительные словами — «до трёх миллионов», «от пяти млн», «полмиллиона».
   Переводим в цифры ДО ценового разбора, чтобы parsePriceCondition() не
   пришлось учить второй синтаксис. */
const NUM_WORDS = {
  'полтора':1.5,'полутора':1.5,'один':1,'одного':1,'одну':1,'одна':1,'два':2,'двух':2,'две':2,
  'три':3,'трёх':3,'трех':3,'четыре':4,'четырёх':4,'четырех':4,'пять':5,'пяти':5,
  'шесть':6,'шести':6,'семь':7,'семи':7,'восемь':8,'восьми':8,'девять':9,'девяти':9,
  'десять':10,'десяти':10,'пятнадцать':15,'пятнадцати':15,'двадцать':20,'двадцати':20,
  'тридцать':30,'тридцати':30,'сорок':40,'сорока':40,'пятьдесят':50,'пятидесяти':50,'сто':100,'ста':100,
};
function numWordsToDigits(text){
  let t = String(text||'');
  /* «полмиллиона», «полмиллиарда», «полтыщи» — слитная форма. */
  t = t.replace(/пол\s*миллиона/gi,'0.5 млн').replace(/пол\s*миллиарда/gi,'0.5 млрд');
  /* «до миллиона», «от тысячи» — единица без числа значит «один». */
  t = t.replace(new RegExp('((?:^|[^'+RU_LET+'])(?:до|от|свыше|больше|меньше|около|не\\s+более|не\\s+менее)\\s+)(миллион[а-яё]*|миллиард[а-яё]*|тысяч[а-яё]*)','gi'), (m, pre, unit)=>pre+'1 '+unit);
  Object.keys(NUM_WORDS).forEach(w=>{
    t = t.replace(new RegExp('(^|[^'+RU_LET+'])'+w+'(?![' + RU_LET + '])','gi'), '$1'+NUM_WORDS[w]);
  });
  return t;
}

/* ---------- КЛАУЗЫ ----------
   Режем реплику по запятым и сочинительным союзам: «убери Москву и добавь
   Питер» — это два разных действия в одном предложении, и выполнить нужно
   оба. Союз «а» здесь особенно важен: «не Москва, а Казань» — это в чистом
   виде «убрать одно, поставить другое». */
const CLAUSE_SPLIT = new RegExp('[,;]|(?:^|[^'+RU_LET+'])(?:и|а|но|также|плюс|затем|потом)(?![' + RU_LET + '])','gi');
/* Слова, после которых «не» означает не отрицание критерия, а часть самого
   условия: «не менее 60 дней», «не дороже 3 млн». Без этой оговорки такие
   фразы читались бы как просьба убрать критерий. */
const NOT_AS_COMPARISON = new RegExp('не\\s+(?:менее|более|позже|раньше|дороже|дешевле|меньше|больше|ниже|выше)','i');
const REMOVE_MARK = ruRe('убер[а-яё]*|убрать|удали[а-яё]*|исключ[а-яё]*|сним[а-яё]*|снять|отмен[а-яё]*|без|не\\s+нужн[а-яё]*|не\\s+надо|не\\s+хочу');
const REPLACE_MARK = ruRe('только|лишь|исключительно|вместо|замен[а-яё]*|помен[а-яё]*|лучше|переключ[а-яё]*');
/* «без обеспечения», «без аванса» — это само условие («Нет»), а не
   просьба убрать критерий: слово «без» здесь часть значения. */
const EXPLICIT_REMOVE = ruRe('убер[а-яё]*|убрать|удали[а-яё]*|сним[а-яё]*|снять|отмен[а-яё]*');
function clauseMode(clause){
  if(!EXPLICIT_REMOVE.test(clause) && BOOL_PHRASES.some(b=>b.re.source.includes('без') && b.re.test(clause))) return 'add';
  const hasNot = !NOT_AS_COMPARISON.test(clause) && ruRe('не|нет').test(clause);
  if(REMOVE_MARK.test(clause)) return 'remove';
  /* Голое «не Москва» — тоже снятие, но только если в клаузе есть что
     снимать (какое-то значение критерия), иначе это просто частица. */
  if(hasNot && extractOps(clause).length) return 'remove';
  if(REPLACE_MARK.test(clause)) return 'replace';
  return 'add';
}
function splitClauses(text){
  const parts = String(text||'').split(CLAUSE_SPLIT).map(x=>(x||'').trim()).filter(Boolean);
  const list = parts.length ? parts : [String(text||'')];
  return list.map(t=>({text:t, mode:clauseMode(t)}));
}

/* ---------- ОПЕЧАТКИ ----------
   «маасква», «екатеринбрг» — без внешнего сервиса такие вещи ловятся
   расстоянием Левенштейна. Применяем ТОЛЬКО как последнюю попытку, когда
   точный разбор не дал ничего, и только к достаточно длинным словам —
   иначе короткие слова начнут «исправляться» друг в друга. */
function levenshtein(a,b){
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  let prev=new Array(n+1), cur=new Array(n+1);
  for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    const t=prev; prev=cur; cur=t;
  }
  return prev[n];
}
/* Словарь, по которому исправляем: города и регионы — самые частые цели
   опечаток в этом сценарии. */
function geoVocabulary(){
  const out = [];
  Object.keys(CITY_REGION).forEach(c=>out.push({word:normRu(c), f:'Место поставки', v:c}));
  Object.values(CITY_REGION).forEach(r=>out.push({word:normRu(r).replace(/^(г\.|республика)\s*/,''), f:'Регион заказчика', v:r}));
  return out;
}
function fuzzyGeo(text){
  const words = normRu(text).split(new RegExp('[^'+RU_WORD+']+','i')).filter(w=>w.length>=5);
  if(!words.length) return [];
  const vocab = geoVocabulary();
  const found = [];
  words.forEach(w=>{
    let best=null, bestD=99;
    vocab.forEach(v=>{
      /* Допуск — одна ошибка на каждые пять букв, но не больше двух:
         «маасква»→«москва» это 2 правки при длине 6. */
      const limit = Math.min(2, Math.floor(v.word.length/5)+1);
      const d = levenshtein(w, v.word);
      if(d<=limit && d<bestD){ bestD=d; best=v; }
    });
    if(best && !found.some(x=>x.f===best.f && x.v===best.v)) found.push({f:best.f, o:'Равен', v:best.v, typo:w});
  });
  return found;
}

/* ---------- ОТНОСИТЕЛЬНЫЕ КОРРЕКТИРОВКИ ----------
   «а подешевле?», «побольше вариантов» — человек говорит не абсолютное
   значение, а направление относительно того, что уже есть. */
const CHEAPER = ruRe('подешевл[а-яё]*|дешевл[а-яё]*|поменьше\\s+(?:цен|стоимост|бюджет)[а-яё]*|снизить\\s+(?:цен|бюджет)[а-яё]*');
const PRICIER = ruRe('подорож[а-яё]*|дорож[а-яё]*|побольше\\s+(?:цен|стоимост|бюджет)[а-яё]*|поднять\\s+(?:цен|бюджет)[а-яё]*');
const WIDER   = ruRe('побольше\\s+вариант[а-яё]*|больше\\s+вариант[а-яё]*|шире|расшир[а-яё]*|мало\\s+результат[а-яё]*|слишком\\s+мало|покаж[а-яё]*\\s+больше|давай\\s+больше|больше\\s+закуп[а-яё]*|больше\\s+результат[а-яё]*');
const NARROWER= ruRe('поменьше\\s+вариант[а-яё]*|уж[её]|сузить|слишком\\s+много|много\\s+результат[а-яё]*|точнее|сузь|сузи[а-яё]*|давай\\s+меньше|меньше\\s+результат[а-яё]*|меньше\\s+закуп[а-яё]*');
function handleRelative(text){
  const idx = findFilterIdx('НМЦ лота');
  const cheaper = CHEAPER.test(text), pricier = PRICIER.test(text);
  /* Без заданной суммы направление не к чему приложить — такая реплика
     уходит в обычный разбор (число покажем, лишнего вопроса не будет). */
  if((cheaper || pricier) && idx>=0){
    const row = S.filters[idx];
    const rg = parseRangeStr(row.v);
    const cur = rg ? (cheaper ? rg.min : rg.max) : parseAmount(valList(row.v)[0]);
    if(!cur) return false;
    pushUndo();
    row.o = cheaper ? 'Меньше' : 'Больше';
    row.v = String(Math.max(10000, Math.round((cheaper ? cur/2 : cur*2)/1000)*1000));
    botThink(()=>respondAfterChange({changed:[row], note:`${cheaper?'Снизил':'Поднял'} планку по сумме.`}), 500);
    return true;
  }
  if(WIDER.test(text)){ botThink(()=>suggestWidening(), 500); return true; }
  if(NARROWER.test(text)){ botThink(()=>suggestNarrowing(), 500); return true; }
  return false;
}
/* «Дайте побольше вариантов» — что убрать или ослабить, чтобы вернулось
   больше всего (getBestNextFilters). Предлагаем кнопками, сами ничего не снимаем. */
function suggestWidening(){
  const widen = getBestNextFilters({widen:true}).widen.slice(0, SEARCH_CFG.widenButtons);
  if(!widen.length){
    sayActions(`Сейчас ${countHtml(S.total)}. ${S.filters.length?'Если убрать один фильтр, почти ничего не добавится':'Фильтров нет — шире некуда'} — можно написать сам запрос шире.`, gridButton());
    return render();
  }
  sayActions(`Сейчас ${countHtml(S.total)}. Больше всего закупок вернётся, если:`, widenActs(widen));
  render();
}
/* «Слишком много / сузь» — не блокирующий вопрос, а те же самые полезные
   сейчас параметры (getBestNextFilters) чипами со значениями и числами. */
function suggestNarrowing(){
  const keys = getBestNextFilters().narrow.slice(0, SEARCH_CFG.narrowChipsWide).map(c=>c.key);
  sayActions(`Сейчас ${countHtml(S.total)}. ${keys.length?'Можно сузить поиск:':'Основные фильтры уже заданы — напишите своими словами, что ещё важно.'}`,
    tuneActs(), keys.length ? {narrow:keys} : null);
  render();
}

/* ---------- СОСТОЯНИЕ ПОИСКА ПО ЗАПРОСУ ----------
   «что у меня сейчас в фильтрах?», «сколько нашлось?» */
function showStatus(){
  const lines = S.filters.map(r=>filterLine(r));
  const head = S.query ? `Ищем: <b>${esc(S.query)}</b>.` : 'Пока не указано, что ищем.';
  sayActions(`${head} ${S.query?`Сейчас ${countHtml(S.total)}.`:''}`
    + (lines.length ? stateBullets(lines) : '<br><span style="color:var(--ink3);font-size:12.5px">Фильтров нет — ищу только по запросу.</span>'),
    S.query ? gridButton() : []);
  render();
}
/* «Сколько закупок?» / «сколько нашлось?» — только число. */
function showCount(){
  if(!S.query) return askSubject();
  sayActions(`Сейчас ${countHtml(S.total)}.`, S.gridOpen ? [] : gridButton());
  render();
}
/* «Убери всё» / «сбрось фильтры» — снимаем условия, но НЕ предмет. */
function clearAllFilters(){
  if(!S.filters.length){
    sayActions(`Фильтров и так нет — сбрасывать нечего. Сейчас ${countHtml(S.total)}.`, gridButton());
    return render();
  }
  const n = S.filters.length;
  pushUndo();
  S.filters = [];
  respondAfterChange({note:`Убрал все фильтры (${n}), запрос «${esc(S.query)}» оставил.`});
}

/* ---------- ПОКАЗ СОСТОЯНИЯ ПОИСКА ЧЕЛОВЕКУ ---------- */
function critValDisplay(name, op, v){
  const def = FIELD_DEFS[name];
  if(name==='НМЦ лота'){
    const range = parseRangeStr(v);
    if(range) return `от ${fmt(range.min)} до ${fmt(range.max)} ₽`;
    const num = parseAmount(v);
    const pref = op==='Больше' ? 'от ' : (op==='Меньше' ? 'до ' : '');
    return num!=null ? `${pref}${fmt(num)} ₽` : esc(valText(v));
  }
  if(def && llmFieldKind(def)==='numeric') return numValLabel(op, v);
  return esc(valueLabel(name, valText(v)));
}
function filterLine(row){ return `${esc(fieldLabel(row.f))}: <b>${critValDisplay(row.f, row.o, row.v)}</b>`; }
function stateBullets(lines){
  return `<ul class="blist">${lines.map(l=>`<li>${l}</li>`).join('')}</ul>`;
}

/* =====================================================================
   РЕШЕНИЕ ПО ЧИСЛУ
   =====================================================================
   N определяет не действие пользователя, а состояние поиска. Чем больше N,
   тем вероятнее AI предложит уточнение, но само N не достаточное условие
   для вопроса: вопрос задаётся только при наличии полезного следующего
   параметра. Одна развилка после ЛЮБОГО изменения условий:
     N = 0            → восстановить поиск (что обнулило + варианты с числами);
     N ≤ 150          → показать / обновить выдачу + расширить или сузить;
     N > 150:
       нет полезного вопроса        → показать / оставить выдачу + сузить;
       есть, выдача не открывалась  → задать вопрос + «Показать все N»;
       есть, выдача уже открыта     → предложить уточнить (не блокирует,
                                      выдача остаётся доступной).
   Ограничения на число вопросов нет: AI спрашивает, пока вопросы полезны.
   Открытие выдачи не отнимает возможность спрашивать — меняет только роль
   вопроса: до открытия он основное действие, после — предложение.
   Режимов «новичок / опытный» нет: решает только понятое и получившееся N.
   ===================================================================== */
function countHtml(n){ return `<span class="ncount ${n===0?'zero':''}">${fmt(n)}</span> ${buyWord(n)}`; }
/* После «Нашёл» — винительный падеж: «нашёл 121 закупку», не «121 закупка». */
function countAccHtml(n){ return `<span class="ncount ${n===0?'zero':''}">${fmt(n)}</span> ${plural(n,'закупку','закупки','закупок')}`; }
function jsq(s){ return esc(String(s)).replace(/'/g,"\\'"); }
function gridButton(){
  if(S.gridOpen || !S.query || !S.total) return [];
  return [{l:'Показать список', c:'showAllNow()', cnt:S.total}];
}
function snapshotConditions(){
  return {query:S.query, filters:S.filters.map(r=>Object.assign({}, r, {v:Array.isArray(r.v)?r.v.slice():r.v}))};
}
function restoreConditions(snap){
  S.query = snap.query; S.filters = snap.filters;
  recomputeWorkingSet();
}
function pushUndo(){ S.undo.push(snapshotConditions()); if(S.undo.length>30) S.undo.shift(); }
/* Кнопки прошлого хода перестают быть активными, как только человек
   сделал следующий шаг. keepQuestion — висящий вопрос остаётся живым,
   пока на него не ответили (реплика «а что такое СМП?» — не ответ). */
function clearActionBlocks(keepQuestion){
  S.chat.forEach(m=>{ if(m.x==='actions' && !(keepQuestion && m.q)) m.x=null; });
}
function respondAfterChange(ctx){
  ctx = ctx || {};
  clearActionBlocks();
  S.pendingQ = null;
  recomputeWorkingSet();
  const parts = [];
  if(ctx.note) parts.push(ctx.note);
  if(ctx.subjectChanged && S.query) parts.push(`Ищу «<b>${esc(S.query)}</b>».`);
  if(ctx.afterSubject) parts.push(ctx.afterSubject);
  if(ctx.dropped && ctx.dropped.length) parts.push(`Убрал: ${ctx.dropped.map(d=>`<b>${d}</b>`).join(', ')}.`);
  const ch = ctx.changed || [];
  if(ch.length) parts.push(`Учёл ${ch.length>1 ? ch.length+' ' : ''}${condWord(ch.length)}: ${ch.map(r=>`<b>${condPhrase(r)}</b>`).join(', ')}.`);
  if(ctx.typos && ctx.typos.length) parts.push(`<span style="color:var(--ink4)">(«${esc(ctx.typos.map(t=>t.typo).join('», «'))}» прочитал как ${esc(ctx.typos.map(t=>t.v).join(', '))})</span>`);
  if(ctx.invalid && ctx.invalid.length) parts.push(`<span style="color:var(--ink4)">Не учёл: ${ctx.invalid.join(' ')}</span>`);
  /* Реплика заодно содержала вопрос/просьбу («до 1 млн, а вообще что
     выгоднее — аукцион или конкурс?») — ответ на него не теряется. */
  if(ctx.llmAnswer) parts.push(ctx.llmAnswer);
  if(ctx.conflicts && ctx.conflicts.length) return showConflicts(parts.join(' '), ctx.conflicts);
  decide(parts.join(' '), ctx.manual);
}
/* Противоречие — одно сообщение: что сейчас стоит, что добавили, и по две
   кнопки на каждое (оставить / заменить) с числом закупок. */
function showConflicts(head, conflicts){
  S.conflicts = conflicts;
  const lines = conflicts.map(k=>`«<b>${condPhrase(k.old)}</b>» (вы написали «<b>${condPhrase(k.row)}</b>»)`);
  const acts = [];
  conflicts.forEach((k,i)=>{
    const rows = S.filters.map(x=>x.f===k.row.f ? k.row : x);
    acts.push({l:`Оставить «${condPhrase(k.old)}»`, c:`resolveConflict(${i},'keep')`, cnt:S.total, cls:'ghost'});
    acts.push({l:`Заменить на «${condPhrase(k.row)}»`, c:`resolveConflict(${i},'new')`, cnt:computeN(rows).length});
  });
  sayActions(`${head?head+' ':''}Сейчас ${countHtml(S.total)}. Уже стоит ${conflicts.length>1?'фильтры':'фильтр'} ${lines.join('; ')}. Что сделать?`, acts);
  render();
}
function resolveConflict(i, choice){
  if(S.busy) return;
  const list = S.conflicts || [];
  const k = list[i]; if(!k) return;
  say('me', choice==='new' ? `Заменить на «${condPhrase(k.row)}»` : `Оставить «${condPhrase(k.old)}»`);
  pushUndo();
  if(choice==='new'){ removeFilterValue(k.row.f, null); S.filters.push(Object.assign({}, k.row)); }
  const rest = list.filter((_,j)=>j!==i);
  S.conflicts = rest;
  clearActionBlocks();
  render();
  botThink(()=>respondAfterChange({
    changed: choice==='new' ? [S.filters[findFilterIdx(k.row.f)]] : [],
    note: choice==='new' ? '' : `Оставил «${condPhrase(k.old)}».`,
    conflicts: rest,
  }), 500);
}
/* ГЛАВНАЯ РАЗВИЛКА (итоговая логика, пп.3–5, 10–13). N — сигнал, а не цель:
   вопрос задаётся не ради уменьшения числа, а только если есть фильтр, ответ
   на который реально разделит выдачу (getBestNextFilters), он ещё не задан,
   человек от него не отказывался и такой вопрос ещё не звучал. Лимита на
   число вопросов нет. Результаты доступны всегда: «Показать все» есть в
   каждом вопросе, в рейле и в широкой выдаче. */
/* Подпись поиска — предмет и фильтры. Нужна, чтобы понять, было ли
   содержательное изменение с момента последнего «Не важно». */
function searchSig(){ return (S.query||'')+'|'+JSON.stringify((S.filters||[]).filter(r=>r.f).map(r=>[r.f,r.o,r.v])); }
/* manual — изменение пришло из ручного действия (крестик, «Настроить поиск»,
   окно фильтров, параметры через «/» без текста): пересчитываем и обновляем
   выдачу, но ни вопрос, ни чипы-подсказки не показываем — ждём следующего
   сообщения пользователя. Ремонт нуля остаётся: без него человек в тупике. */
function decide(head, manual){
  const n = S.total, c = SEARCH_CFG;
  const lead = (head ? head+'<br>' : '') + `Нашёл ${countAccHtml(n)}.`;
  /* 0 — разбираем, что обнулило, и предлагаем, что убрать или ослабить. */
  if(n===0) return showZeroRepair(lead);
  /* 1–14 — показываем сразу и предлагаем расширить. */
  if(n < c.healthyMin){
    const widen = manual ? [] : getBestNextFilters({widen:true}).widen.slice(0, c.widenButtons);
    return showResults(lead, widen.length ? 'Можно расширить поиск:' : '', widenActs(widen), null, manual);
  }
  const narrow = getBestNextFilters().narrow;
  /* 15–150 — комфортная выдача: показываем, сузить можно по желанию. */
  if(n <= c.healthyMax){
    const keys = manual ? [] : narrow.slice(0, c.narrowChips).map(x=>x.key);
    return showResults(lead, keys.length ? 'Можно сузить поиск:' : '', [], keys, manual);
  }
  /* >150 после ручного действия — только пересчёт, без вопроса. */
  if(manual) return showResults(lead, '', [], [], true);
  /* Несколько «Не важно» подряд без изменений поиска — уточнения сейчас не
     нужны: вопросы прекращаем, даём открыть текущую выдачу. Счётчик
     обнуляется при любом изменении предмета или фильтров. */
  if(S.streakSig!==searchSig()) S.notImportant = 0;
  if((S.notImportant||0) >= c.notImportantLimit){
    S.pendingQ = null;
    const acts = S.gridOpen ? [] : [{l:`Показать ${fmt(n)} ${buyWord(n)}`, c:'showAllNow()'}];
    sayActions(`${head ? head+'<br>' : ''}Похоже, дополнительные уточнения сейчас не нужны. Нашёл ${countAccHtml(n)}.${S.gridOpen?' Список обновлён.':''}`, acts.concat(tuneActs()));
    return render();
  }
  /* >150 — есть ли полезный следующий вопрос? Кандидатов даёт код, лучшего
     из них выбирает LLM (chooseQuestion). Если за время выбора поиск
     изменился, выбранный вопрос устарел — не показываем его. */
  const cands = questionCandidates();
  if(cands.length){
    const sig = searchSig();
    S.busy = true; render();
    return chooseQuestion(cands).then(pick=>{
      S.busy = false;
      S.lastQuestionPick = {key:pick.m.key, by:pick.by, q:pick.q};
      if(searchSig()!==sig) return render();
      /* Выдача ещё не открывалась — вопрос основное действие. */
      if(!S.gridOpened){ say('bot', lead); return askCut(pick.m, null, pick.q); }
      /* Уже открыта — только предложение: выдача остаётся на месте. */
      return askCut(pick.m, {lead}, pick.q);
    });
  }
  /* Полезного вопроса нет — показать / оставить выдачу и предложить сузить. */
  const keys = narrow.slice(0, c.narrowChipsWide).map(x=>x.key);
  showResults(lead, keys.length ? 'Можно сузить поиск:' : '', [], keys);
}
/* Показать выдачу (или обновить уже открытую) и под ответом — предложения
   сузить/расширить. Выдачу, закрытую крестиком, насильно не открываем —
   даём кнопку «Показать список». manual — ручное действие: список обновляем,
   только если он открыт, закрытый сами не открываем. */
function showResults(lead, hint, acts, narrowKeys, manual){
  const onbDone = inOnboarding() && finishOnboarding();
  let status = '', pre = [];
  if(!S.gridOpened && manual){ pre = gridButton(); }
  else if(!S.gridOpened){ status = ' Открываю список.'; S.gridOpened = true; S.gridOpen = true; S.gridPage = 0; }
  else if(S.gridOpen){ status = ' Список обновлён.'; }
  else { pre = gridButton(); }
  S.pendingQ = null;
  sayActions(lead + status + (hint ? ' '+hint : ''), pre.concat(acts||[], tuneActs()),
    narrowKeys && narrowKeys.length ? {narrow:narrowKeys} : null);
  if(onbDone) say('bot', onboardingNextHtml());
  render();
}
function openGridByDecision(html, acts){
  const onbDone = inOnboarding() && finishOnboarding();
  S.gridOpened = true; S.gridOpen = true; S.gridPage = 0; S.pendingQ = null;
  sayActions(html, onbDone ? tuneActs() : (acts||[]));
  if(onbDone) say('bot', onboardingNextHtml());
  render();
}
/* Уточняющий вопрос — готовые варианты с числом на каждом и «Показать все»
   рядом: отвечать не обязательно (итоговая логика, п.9). Можно ответить и
   словами — см. matchPendingAnswer. Тот же вопрос повторно — только если
   выдача с тех пор заметно изменилась (SEARCH_CFG.reaskChange). */
/* soft — выдача уже открыта: тот же вопрос, но как предложение в одном
   сообщении с числом («Список обновлён. Можно уточнить: …»), без «Показать
   все» (выдача и так на экране; если её закрыли — «Показать список»). */
function askCut(cut, soft, qText){
  const again = S.askedCount>0;
  S.askedCount++;
  S.askedKeys = (S.askedKeys||[]).concat(cut.key);
  S.askedN = Object.assign({}, S.askedN, {[cut.key]: S.total});
  S.pendingQ = cut.key;
  const opts = cut.opts();
  const counts = optionCounts(cut, opts);
  const acts = opts.map((o,i)=>({l:esc(o.l), c:`answerCut('${cut.key}',${i})`, cnt:counts[i]}));
  const tip = FIELD_DEFS[cut.field] && FIELD_DEFS[cut.field].tip;
  const qh = `<span class="qhead">${esc(qText || cut.q)}</span>${tip?` <span class="tipi" title="${esc(tip)}">ⓘ</span>`:''}`;
  if(soft){
    acts.push(...gridButton(), ...tuneActs());
    sayActions(`${soft.lead}${S.gridOpen?' Список обновлён.':''} Можно уточнить: ${qh}`, acts, {q:true});
    return render();
  }
  acts.push({l:`Показать все ${fmt(S.total)}`, c:'showAllNow()', cls:'ghost'});
  acts.push(...tuneActs());
  /* Подсказка новичку — не запрет: все кнопки и «Показать все» доступны
     сразу, ответ на вопрос никогда не обязателен. */
  const hint = (inOnboarding() && !again) ? `<div class="onbhint">Выберите вариант или ответьте своими словами — или сразу откройте список.</div>` : '';
  sayActions(`${again?'Можно ещё уточнить. ':''}${qh}${hint}`, acts, {q:true});
  render();
}
/* i = -1 — ответ без сужения («нет» на «только для СМП?»). typed — ответ
   уже пришёл текстом, второй пузырь пользователя не нужен. */
function answerCut(key, i, typed){
  if(S.busy) return;
  const cut = qModel(key);
  if(!cut) return;
  const o = i>=0 ? cut.opts()[i] : {l:'Нет', v:null};
  if(!o) return;
  if(!typed) say('me', esc(o.l));
  clearActionBlocks();
  S.pendingQ = null;
  pushUndo();
  if(o.v!=null){
    removeFilterValue(cut.field, null);
    S.filters.push(rowFromOpt(cut, o));
  } else {
    /* «Не важно» (и «Вся Россия», «Могу внести», «Можно без аванса») — явный
       отказ от этого уточнения. Считаем подряд идущие отказы; счётчик сам
       обнуляется при любом изменении предмета или фильтров (см. decide). */
    if(!S.declined.includes(key)) S.declined.push(key);
    if(S.streakSig!==searchSig()) S.notImportant = 0;
    S.notImportant = (S.notImportant||0) + 1;
    S.streakSig = searchSig();
  }
  render();
  botThink(()=>respondAfterChange({}), 500);
}
/* «Все фильтры» — постоянно доступная кнопка (в вопросе, при пересчёте,
   при открытии списка — везде, где decide() вообще отвечает) на панель со
   ВСЕМИ полями сразу — и режущими фильтрами поиска, и критериями из
   документации (то же деление на группы, что и в палитре «/», см.
   PALETTE_GROUPS), а не только с двумя-семью самыми сильными для сужения.
   Точка входа прямо из сообщения бота, без необходимости открывать
   список, печатать «/» или «сузить» словами. */
function tuneActs(){

}
/* Эскейп из ЕДИНСТВЕННОГО вопроса (или из любого другого ответа бота) —
   сразу к полному списку полей вместо ответа по одному. askedCount не
   откатывается: сам факт вопроса уже состоялся, просто ответили на него
   иначе, чем ожидалось. Сама панель рисуется в mRender() по флагу

function showAllFiltersPanel(typed){

    render();
    /* Прокручиваем к началу панели, а не к низу чата, как у обычного нового
       сообщения: панель рассчитана на высоту окна чата (fgLayout, FG.chrome),
       и так ей достаётся вся высота — без пустой полосы под ней. Если панель
