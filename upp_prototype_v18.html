   13.08.2026: ввод «нмц от 3 до 15 млн» уходил в LLM, схема classify_answer
   умеет вернуть только ОДНО число, модель вернула 3 000 000 с оператором
   «Диапазон», а «Диапазон» без второй границы отображается как «≈примерно» —
   то есть вторая граница диапазона(«до 15 млн») терялась полностью и молча.
   Детерминированный путь пробуем ДО обращения к LLM для полей, где ops
   вообще допускает 'Диапазон' — то же архитектурное решение, что и у

   полагаемся на дисциплину модели.

   есть суффикс, а у первого нет, применяем тот же множитель к обоим. */
function extractNumsWithUnit(text){
  const re=/(\d[\d\s]*(?:[.,]\d+)?)\s*(миллион\w*|млн\.?|тысяч\w*|тыс\.?)?/gi;
  const out=[]; let m;
  while((m=re.exec(text))){
    const digits=m[1].replace(/\s+/g,'');
    const val=parseFloat(digits.replace(',', '.'));
    if(isNaN(val)) continue;
    out.push({val, unit:(m[2]||'').toLowerCase(), index:m.index, len:m[0].length});
  }

  if(unit.startsWith('млн')||unit.startsWith('миллион')) return 1e6;
  if(unit.startsWith('тыс')) return 1e3;
  return 1;
}

  const t=String(text||'').toLowerCase();
  const nums=extractNumsWithUnit(t);
  if(nums.length<2) return null;
  const [a,b]=nums;
  const between=t.slice(a.index+a.len, b.index);
  if(!/до|по|-|–|—/.test(between)) return null;
  const unit=a.unit||b.unit;
  const mult=unitMult(unit);
  const min=Math.round(Math.min(a.val,b.val)*mult);
  const max=Math.round(Math.max(a.val,b.val)*mult);

  if(min===max) return null;
  return {min, max};
}

        recognized:{type:'boolean', description:'true — в тексте есть распознаваемое число; false — числа нет.'},
        value:{type:'number', description:'Извлечённое число (учитывается только при recognized=true).'},
        op:{type:'string', enum:f.ops, description:'Оператор сравнения.'},
        confidence:{type:'number', description:'Уверенность от 0 до 1.'}
      },
      required:['recognized','value','op','confidence']
    }
  }};
}
async function llmExtract(text, name, f){
  if(!LLM_CFG.apiKey) return {ok:false, reason:'API-ключ не настроен'};
  const sys = buildLlmSystemPrompt(name, f) + '\nОбязательно используй функцию classify_answer для ответа — не отвечай обычным текстом.';
  const tool = buildLlmTool(name, f);
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), LLM_CFG.timeoutMs);
  try{
    const res = await fetch(LLM_CFG.baseUrl.replace(/\/+$/,'')+'/v1/chat/completions', {
      method:'POST',
      headers:{'Authorization':'Bearer '+LLM_CFG.apiKey, 'Content-Type':'application/json'},
      signal: controller.signal,
      body: JSON.stringify({
        model: LLM_CFG.model, temperature:0, max_tokens:250,
        chat_template_kwargs:{enable_thinking:false},
        tools:[tool], tool_choice:'auto',
        messages:[{role:'system',content:sys},{role:'user',content:text}]
      })
    });
    clearTimeout(timer);
    if(!res.ok){
      let detail='';
      try{ const j=await res.json(); detail = j.error && j.error.message ? j.error.message : ''; }catch(e){}
      return {ok:false, reason:`HTTP ${res.status}${detail?': '+detail:''}`};
    }
    const data = await res.json();
    const msg = data && data.choices && data.choices[0] && data.choices[0].message;
    const call = msg && msg.tool_calls && msg.tool_calls[0];
    if(!call) return {ok:false, reason:'модель не вызвала функцию классификации'};
    let parsed;
    try{ parsed = JSON.parse(call.function.arguments); }catch(e){ return {ok:false, reason:'не удалось разобрать аргументы функции'}; }
    return validateLlmResult(parsed, f);
  }catch(err){
    clearTimeout(timer);
    return {ok:false, reason: err && err.name==='AbortError' ? 'превышено время ожидания' : ((err && err.message) || 'сетевая ошибка')};
  }
}

/* «21 процедур» / «264 процедур» — сообщения бота теперь показывают
   счётчик в куда большем числе мест, чем раньше, и несогласованное
   числительное бросается в глаза. Обычное русское правило: 1 — процедура,
   2-4 — процедуры, 0 и 5+ — процедур (с оговоркой на 11-14). */
function plural(n, one, few, many){
  const a = Math.abs(n) % 100, b = a % 10;
  if(a>10 && a<20) return many;
  if(b>1 && b<5) return few;
  if(b===1) return one;
  return many;
}

/* «300 тыс. ₽», «1,5 млн ₽» — коротко, как говорят вслух. */
function moneyShort(n){
  if(n==null || isNaN(n)) return '—';
  const f = x => x.toLocaleString('ru-RU',{maximumFractionDigits:1});
  if(n>=1e6) return f(n/1e6)+' млн ₽';
  if(n>=1e3) return f(n/1e3)+' тыс. ₽';
  return fmt(n)+' ₽';
}

/* ---------- shared stable dropdown component ----------
   Единственный источник состояния открытого меню — S.openDD.
   Закрытие по клику вне обрабатывается ОДНИМ обработчиком на document
   (см. конец файла), навешанным один раз, а не при каждом рендере —
   именно повторное навешивание на каждый рендер и повторные закрытия
   «в тот же клик» были причиной мерцания меню. */
function toggleDD(id){ S.openDD = (S.openDD===id) ? null : id; render(); }
function ddField(id, kind, scope, idx, value, options, labelFn){

     (OP_LABEL), а не служебное название («Больше» → «больше или равно») —
     внутреннее значение (что реально сохраняется и участвует в
     REAL_FILTER_PRED) не меняется, меняется только то, что видит человек. */
  const disp = labelFn || (v => kind==='o' ? (OP_LABEL[v]||v) : v);

  </span>`;
}
/* scope различает, какой массив редактируется одним и тем же переиспользуемым
   набором дропдаунов: 'chat' — S.filters (живой подбор), 'tpl' — черновик
   редактирования шаблона, 'folder' — критерии внутри конкретной подборки. */
function scopeArr(scope){
  if(scope==='tpl') return S.curTplRules;
  if(scope==='folder') return S.folderFilters;
  return S.filters;
}
/* Выбор ПОЛЯ критерия — раньше был обычным ddField() со сплошным списком
   из ~35 названий без группировки, которые невозможно было быстро найти
   (просьба заказчика, 18.08.2026). Отдельный дропдаун: те же группы, что
   и в «Ход подбора» (BLOCKS), плюс поиск по вводу текста (фильтрует список
   на лету, без render() — чтобы не сбрасывать фокус ввода при печати, тот
   же приём, что и у setFilterVal). Поля, уже занятые ДРУГИМИ строками того
   же набора критериев, скрыты — незачем предлагать выбрать критерий
   дважды. */
function fieldGroupsFor(scope, currentValue){
  const used = new Set(scopeArr(scope).map(r=>r.f).filter(f=>f && f!==currentValue));
  return BLOCKS.map(b=>({n:b.n, items:b.items.filter(it=>FIELD_DEFS[it] && !used.has(it))}))
    .filter(g=>g.items.length);
}
function fieldOptRow(scope, idx, it, value){
  return `<div class="ddopt fddopt ${it===value?'on':''}" data-s="${esc(normRu(fieldLabel(it)))}"
    onclick="selectDD('${scope}','f',${idx},'${esc(it).replace(/'/g,"\\'")}')">${esc(fieldLabel(it))}</div>`;
}
function fieldGroupRow(scope, idx, g, value){
  return `<div class="fddgrp">${esc(g.n)}</div>${g.items.map(it=>fieldOptRow(scope,idx,it,value)).join('')}`;
}
function fieldDD(id, scope, idx, value){
  const open = S.openDD===id;
  const groups = fieldGroupsFor(scope, value);
  const optsHtml = groups.map(g=>fieldGroupRow(scope,idx,g,value)).join('');
  return `<span class="esel fsel" data-dd="${id}">
    <button type="button" class="ddtrig" onclick="event.stopPropagation();toggleDD('${id}')">
      <span>${value?esc(fieldLabel(value)):'<span style="color:var(--ink4)">Выберите фильтр</span>'}</span><span style="color:var(--ink4)">▾</span></button>
    ${open?`<div class="ddmenu fddmenu" onclick="event.stopPropagation()">

    </div>`:''}

/* Прямая правка DOM без render() — печать в поле поиска не должна сбрасывать
   фокус (тот же приём, что и у setFilterVal ниже). Два прохода по списку:
   сначала скрываем/показываем сами пункты по совпадению подстроки, затем
   скрываем заголовок группы целиком, если в ней не осталось видимых пунктов. */
function filterFieldOpts(input){
  const q = normRu(input.value).trim();
  const list = input.nextElementSibling;
  if(!list) return;
  let curGroup=null, curGroupVisible=false;
  Array.from(list.children).forEach(el=>{
    if(el.classList.contains('fddgrp')){
      if(curGroup) curGroup.style.display = curGroupVisible ? '' : 'none';
      curGroup=el; curGroupVisible=false;
    } else {
      const match = !q || el.getAttribute('data-s').includes(q);
      el.style.display = match ? '' : 'none';
      if(match) curGroupVisible=true;
    }
  });
  if(curGroup) curGroup.style.display = curGroupVisible ? '' : 'none';
}
/* Ручной ввод значения критерия в модалке: перечисление через запятую —
   это НЕСКОЛЬКО значений одного критерия (ИЛИ), а не одно значение со
   знаком препинания внутри. Одиночное значение остаётся скаляром — чтобы
   не менять форму данных там, где множественность не нужна. */
function parseValInput(str){
  const parts = String(str||'').split(',').map(x=>x.trim()).filter(Boolean);
  return parts.length>1 ? parts : String(str||'');
}
function valueField(id, scope, idx, r){
  const def = FIELD_DEFS[r.f];
  if(def && Array.isArray(def.values)) return ddField(id,'v',scope,idx,r.v,def.values,v=>valueLabel(r.f,v));
  const setter = `scopeArr('${scope}')[${idx}].v=parseValInput(this.value)`;
  return `<input class="esel eval" value="${esc(valText(r.v))}" oninput="${setter}">`;
}
function selectDD(scope, kind, idx, value){
  const arr = scopeArr(scope);
  if(kind==='f'){ const def=FIELD_DEFS[value]; arr[idx] = {f:value, o:def.ops[0], v:def.values?def.values[0]:'', delta:def.delta}; }
  else if(kind==='o'){ arr[idx].o = value; }
  else if(kind==='v'){ arr[idx].v = value; }
  S.openDD=null; render();
}

/* ---------- criteria (filters) list ---------- */
/* Единая точка правды для «сколько процедур сейчас подходит» — прогоняем
   реальную базу через движок relevantности (rankMatches) и затем через
   настоящие предикаты (REAL_FILTER_PRED) для каждого применённого критерия
   по порядку. Раньше счётчик двигался по вручную заданным «весам» (delta),
   вообще не привязанным к реальной базе, — отсюда и ощущение бутафории.
   Раньше также был «предохранитель»: если конкретный шаг сужал список до
   0, мы тихо оставляли прошлый (непустой) шаг, чтобы грид не показывал
   пусто. По прямой просьбе заказчика (12.08.2026) это убрано — «если
   результат равен нулю, сервис должен прямо писать, что торгов нет», а
   не маскировать ноль под «почти ничего». Настоящий ноль на каком-то шаге
   теперь так и остаётся нулём — по нему (первому пустому этапу) честно
   определяется, какой именно критерий обнулил выборку, см.
   zeroCore(). */
function computeStages(){
  let ws = rankMatches(S.query);
  const stages = [];
  S.filters.forEach(r=>{
    const pred = REAL_FILTER_PRED[r.f];
    if(pred){
      ws = ws.filter(id=>{ const p=PROCS_BY_ID.get(id); return p && matchFilter(pred, p, r.v, r.o); });
    }
    stages.push({filter:r, ws});
  });
  return stages;
}
/* Строки running-счётчика в модалке «Критерии подбора» — настоящие числа
   на каждом шаге (computeStages), без какой-либо развилки по фазе — фазы
   больше нет. */
function critRunning(){
  let prevReal = rankMatches(S.query).length;
  return computeStages().map(s=>{
    const realTotal = s.ws.length;
    const delta = Math.max(0, prevReal-realTotal);
    prevReal = realTotal;
    return {...s.filter, total:realTotal, realTotal, delta};
  });
}
/* Раньше новая строка сразу получала первое неиспользуемое поле и его
   дефолтное значение — пользователь должен был заметить и поменять то, что
   подставилось само, вместо того чтобы осознанно выбрать критерий (просьба
   заказчика, 18.08.2026). Теперь строка стартует пустой (f:null) — critRow()
   в этом случае показывает только выбор поля, без оператора/значения/итога,
   пока критерий не выбран. */
function addFilterRow(){
  S.filters.push({f:null, o:null, v:'', delta:0});
  render();
}
function removeFilterRow(i){ S.filters.splice(i,1); render(); }
function setFilterVal(i,v){ S.filters[i].v=v; } /* без render() — чтобы не сбрасывать фокус при вводе текста */
function openCritModal(){ S.undoCandidate=snapshotConditions(); S.critModalOpen=true; S.openDD=null; render(); }
/* Закрытие без «Применить» — отмена правок: возвращаем условия как были. */
function closeCritModal(){ S.critModalOpen=false; S.openDD=null; render(); }
function cancelCritModal(){
  if(S.undoCandidate){ restoreConditions(S.undoCandidate); S.undoCandidate=null; }
  closeCritModal();
}
/* Модалка допускает произвольные правки (добавить/удалить/поменять любую
   строку, не только последнюю), поэтому по «Применить» пересчитываем
   список кандидатов с нуля от исходного запроса — прогоняя через реальные
   предикаты ВСЕ текущие критерии по порядку, а не пытаясь инкрементально
   поправить прежний S.workingSet. */
function recomputeWorkingSet(){
  S.workingSet = computeN(S.filters);
  S.total = currentTotal();
}
/* Правка в модалке — такое же изменение условий, как реплика в чате:
   число показывается сразу, решение (сетка/вопрос/починка нуля) — то же. */
function applyCrit(){
  const before = S.undoCandidate;
  S.filters = S.filters.filter(r=>r.f);
  closeCritModal();
  if(!S.query) return;
  if(before) S.undo.push(before);
  S.undoCandidate = null;
  say('me', 'Изменил фильтры');
  render();
  botThink(()=>respondAfterChange({changed:[], note:'Применил фильтры.', manual:true}), 500);
}
/* Строка фильтра — словами, а не языком базы данных (аудит «понятно даже
   лохам», 14.09.2026): было «Место поставки | равен | Ярославль | −835 | 68 | 🗑».
   Оператор показываем, только когда у поля их несколько («не меньше» /
   «не больше»), для списков «равен» не пишем вовсе; числа подписаны. */
function critRow(r,i){
  const del = `<button class="ctrash" title="Убрать фильтр" onclick="removeFilterRow(${i})">✕</button>`;
  if(!r.f){
    return `<div class="crow">
      <span class="cidx">${i+1}.</span>
      ${fieldDD('cf'+i,'chat',i,null)}
      <span style="flex:1;color:var(--ink4);font-size:12px">Сначала выберите фильтр</span>
      ${del}
    </div>`;
  }
  const warn = r.realTotal!=null && r.realTotal<=5;
  const ops = opsFor(r.f);
  return `<div class="crow ${warn?'warn':''}">
    <span class="cidx">${i+1}.</span>
    ${fieldDD('cf'+i,'chat',i,r.f)}
    ${ops.length>1 ? ddField('co'+i,'o','chat',i,r.o,ops,o=>opLabelFor(r.f,o)) : ''}

/* ---------- ОБЯЗАТЕЛЬНЫЙ ИНТЕРАКТИВНЫЙ ОНБОРДИНГ (15.09.2026) ----------
   Разворот предыдущей версии (та делала вид, что помогает, подсказками, но
   ничего не блокировала). Теперь — ровно то, что просили изначально:
   интерфейс затемняется, подсвечивается ОДИН реальный элемент, объяснение
   рядом, а перейти к следующему шагу можно только настоящим действием —
   не кликом «Далее». Технически это тот же спотлайт-слой, что раньше был
   пассивным туром (.tourdim/.tourring/.tourbub), но с двумя ключевыми
   отличиями:
   • дырки над целью (.tourhole) больше нет — сам подсвеченный элемент
     ничем не перекрыт и работает как обычно (можно печатать, кликать);
     все ОСТАЛЬНОЕ (включая сайдбar) закрыто четырьмя .tourdim-прямоугольниками
     без onclick — клик по ним ничего не делает, просто не проходит дальше;
   • шаг не хранится числом и не листается «Далее» — он каждый раз считается
     заново из состояния поиска (tutorialStep()): пока нет темы — шаг
     «опишите», как только появилась — «уточните», как только список
     открылся хоть раз — обучение завершено САМО (см. finishOnboarding(),
     который уже вызывается из decide()/showResults/openGrid). Это и даёт
     адаптивность бесплатно: кто сразу написал развёрнутый запрос со всеми
     условиями, проходит оба шага одним сообщением, не отвечая на вопросы,
     которые бы дублировали то, что он уже сказал. */
let TOUR_EVER_STARTED = false; /* больше ничего не запускает — оставлено, чтобы не трогать focusComposer() */
let ONBOARDED = (()=>{ try{ return localStorage.getItem('upp_onboarded')==='1'; }catch(e){ return false; } })();
function inOnboarding(){ return !!(S && S.onb) && !S.gridOpened; }
function finishOnboarding(){
  if(!S.onb) return false;
  S.onb = false; ONBOARDED = true; S.tutorialSkipConfirm = false;
  try{ localStorage.setItem('upp_onboarded','1'); }catch(e){}
  return true;
}
function restartOnboarding(){ ONBOARDED = false; try{ localStorage.removeItem('upp_onboarded'); }catch(e){} }
function onboardingNextHtml(){

      <li>«Настроить поиск» — все фильтры сразу;</li>

/* На стартовом экране «S.onb» ещё не взведён — он проставляется только
   внутри beginChat(), при отправке первого сообщения. Без этой оговорки
   самый первый, ещё пустой экран для нового пользователя оставался бы без
   подсказки: подсветка появлялась бы только ПОСЛЕ того, как он уже сам
   догадался, что писать. Поэтому здесь — глобальный ONBOARDED (то же самое
   «проходил ли когда-нибудь онбординг», что и сохраняется в localStorage). */
function tutorialActive(){
  if(S.screen==='start') return !ONBOARDED;
  return !!(S.onb && S.screen==='chat');
}
/* Шаг — проекция текущего состояния поиска, а не отдельный счётчик:
   пересчитывается заново на каждый render(), поэтому не может «отстать»
   от того, что человек уже сделал (см. комментарий выше). */
function tutorialStep(){ return S.query ? 'refine' : 'describe'; }
const TUTORIAL_STEPS = {
  describe: {
    sels: ['#qIn', '#freeIn'],
    title: 'Опишите, что ищете',
    text: 'Напишите обычными словами, что ищете, — как рассказали бы заказчику. Категорию заранее выбирать не нужно.',
  },
  refine: {
    /* Сначала — кнопки последнего сообщения бота (вариант вопроса, кнопки
       починки нуля и т.п.); если их сейчас нет (например, идёт выбор
       вопроса LLM или пауза между сообщениями) — просто поле ввода чата. */
    sels: ['.chatsc .m.bot:last-child .chiprow', '.chatin'],
    title: 'Уточните — или сразу откройте список',
    text: 'Можно нажать вариант, можно написать условие своими словами, как в обычном разговоре, а можно сразу попросить показать всё, что нашлось.',
  },
};
function renderTutorialLayer(){
  if(!tutorialActive()) return '';
  const def = TUTORIAL_STEPS[tutorialStep()];
  const el = def.sels.map(s=>document.querySelector(s)).find(Boolean);
  if(!el) return '';
  const r = el.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  const pad = 6;
  const top = Math.max(0, r.top-pad), left = Math.max(0, r.left-pad);
  const right = Math.min(vw, r.right+pad), bottom = Math.min(vh, r.bottom+pad);
  /* Клика на .tourdim нет намеренно — снаружи подсвеченного элемента
     ничего не происходит, ни продвижения, ни закрытия. */
  const rects = `<div class="tourdim" style="left:0;top:0;width:100%;height:${top}px"></div>
    <div class="tourdim" style="left:0;top:${bottom}px;width:100%;height:${Math.max(0,vh-bottom)}px"></div>
    <div class="tourdim" style="left:0;top:${top}px;width:${left}px;height:${Math.max(0,bottom-top)}px"></div>
    <div class="tourdim" style="left:${right}px;top:${top}px;width:${Math.max(0,vw-right)}px;height:${Math.max(0,bottom-top)}px"></div>
    <div class="tourring" style="left:${left}px;top:${top}px;width:${right-left}px;height:${bottom-top}px"></div>`;
  const bubbleW = 300;
  const belowFits = bottom+170<vh;
  const bubTop = belowFits ? bottom+12 : Math.max(12, top-172);
  const bubLeft = Math.min(Math.max(left,12), Math.max(12,vw-bubbleW-12));
  const skip = S.tutorialSkipConfirm
    ? `<div class="tourtext">Пропустить обучение? Дальше — самостоятельно, без подсказок.</div>
       <div class="tourfoot"><button class="chip muted" onclick="tutorialSkip()">Пропустить</button><button class="chip" onclick="tutorialCancelSkip()">Продолжить обучение</button></div>`
    : `<div class="tourfoot"><button class="tourskip" onclick="tutorialAskSkip()">Пропустить обучение</button></div>`;
  return `<div class="tourlay">${rects}
    <div class="tourbub" style="top:${bubTop}px;left:${bubLeft}px;width:${bubbleW}px">
      <div class="tourhead">${esc(def.title)}</div>
      ${S.tutorialSkipConfirm ? '' : `<div class="tourtext">${esc(def.text)}</div>`}
      ${skip}
    </div>
  </div>`;
}
window.tutorialAskSkip = ()=>{ S.tutorialSkipConfirm = true; render(); };
window.tutorialCancelSkip = ()=>{ S.tutorialSkipConfirm = false; render(); };
window.tutorialSkip = ()=>{
  /* Не просто finishOnboarding(): на стартовом экране S.onb ещё не взведён
     (см. tutorialActive()), и её ранний выход «if(!S.onb) return false»
     ничего бы не сохранил — пропуск с самого первого экрана не запомнился
     бы, и подсказка тут же появилась бы снова. */
  S.onb = false; ONBOARDED = true; S.tutorialSkipConfirm = false;
  try{ localStorage.setItem('upp_onboarded','1'); }catch(e){}
  render();
};

/* Чаты не предзаполнены — каждый чат в списке слева появляется только когда
   пользователь реально отправил запрос. При переключении между чатами
   сохраняем и восстанавливаем их состояние (вопросы, критерии, счётчик),
   а не запускаем один и тот же сценарий заново поверх чужой истории. */
function snapshotChat(){
  if(!S.activeChat) return;
  const entry = CHATS.find(c=>c.id===S.activeChat);
  if(!entry) return;
  entry.state = {
    query:S.query, chat:S.chat, total:S.total, filters:S.filters,
    animatedCount:S.animatedCount, workingSet:S.workingSet, gridPage:S.gridPage,
    gridOpen:S.gridOpen, askedCount:S.askedCount, gridOpened:S.gridOpened, pendingQ:S.pendingQ,
    subjectAsked:S.subjectAsked, undo:S.undo, declined:S.declined, askedKeys:S.askedKeys, askedN:S.askedN, notImportant:S.notImportant, streakSig:S.streakSig, onb:S.onb,
  };
  entry.c = S.total;
}
/* Новый чат с чистым состоянием решения. Первое сообщение проходит
   ровно тот же путь, что и любое следующее (handleUserMessage): разбор →
   число сразу → решение по числу. Никакой отдельной «анкеты для
   первого хода» больше нет. */
function beginChat(title){
  snapshotChat();
  const chatId='c'+Date.now()+Math.floor(Math.random()*1000);
  Object.assign(S, freshDialog());
  S.onb = !ONBOARDED; /* первый поиск пользователя — с онбордингом */
  S.activeChat=chatId; S.navScreen=null; S.screen='chat';
  S.query=''; S.chat=[]; S.animatedCount=0; S.filters=[];
  S.workingSet=[]; S.total=0;

}

/* Запуск нового подбора по сохранённому шаблону — те же условия сразу,
   дальше то же решение по числу, что и после любого сообщения. */
function startFromTemplate(name){
  const t = TEMPLATES.find(x=>x.n===name);
  if(!t) return;
  const queryRule = t.rules.find(r=>r.f==='Запрос');
  const query = queryRule ? queryRule.v : '';
  beginChat(query||name);
  S.query = query;
  t.rules.filter(r=>r.f!=='Запрос' && FIELD_DEFS[r.f]).forEach(r=>{
    S.filters.push({f:r.f, o:r.o, v:r.v, delta:FIELD_DEFS[r.f].delta});
  });
  say('me', `Начать подбор по шаблону «${esc(name)}»`);

function viewWork(){
  /* render() перестраивает innerHTML целиком при ЛЮБОМ клике (даже в гриде/карточке,
     никак не связанном с чатом) — а значит и весь список сообщений S.chat собирался
     заново каждый раз. У сообщений в CSS стоит анимация появления (.m{animation:fade}),
     и она проигрывалась заново для ВСЕХ прошлых сообщений на каждый чих — это и было
     похоже на то, что что-то само открывается/закрывается. Проигрываем анимацию только
     для сообщений, которых ещё не было на экране (индекс >= S.animatedCount). */
  const already = S.animatedCount||0;
  const chatHtml = S.chat.map((m,i)=>mRender(m, i>=already)).join('');
  S.animatedCount = S.chat.length;
  let h = `<div class="chatcol ${S.gridOpen?'narrow':''}">
    <div class="chatsc" id="chatSc">${chatHtml}${S.busy?typing():''}</div>
    <div class="chatin">${composer('chat')}</div>
  </div>`;
  if(!S.gridOpen) h += viewRail();
  if(S.gridOpen) h += viewGrid();
  if(S.cardOpen) h += viewCard();

}
function mRender(m, fresh){
  const st = fresh ? '' : ' style="animation:none"';
  if(m.who==='me') return `<div class="m me"${st}><div class="b">${m.h}</div></div>`;
  /* «Настроить поиск»: текст сообщения — в верхней строке самой панели,
     рядом с поиском (см. allFiltersPanelHtml). Когда панель закрыта
     (clearActionBlocks: m.x=null), остаётся обычный текст. */
  if(m.x==='actions' && m.allFields) return `<div class="m bot"${st}><div class="b">${allFiltersPanelHtml(m.h)}</div></div>`;
  /* Единственный интерактивный тип сообщения бота — 'actions': готовые
     варианты под текстом (вопрос с вариантами, кнопки-починки нуля,
     «показать список»). Кнопки живы, пока человек не сделал следующий
     шаг, — см. clearActionBlocks(). */
  /* Сначала чипы «Можно сузить» (они продолжают фразу бота), потом кнопки. */
  let extra = '';
  if(m.x==='actions' && m.narrow && m.narrow.length){
    const chips = m.narrow.map(k=>qModel(k)).filter(c=>c && !cutIsSet(c)).map(c=>narrowChip(c,'chat')).join('');
    if(chips) extra += `<div class="chiprow">${chips}</div>`;
  }
  if(m.x==='actions') extra += actionsBlock(m);
  return `<div class="m bot"${st}><div class="b">${m.h}${extra}</div></div>`;
}
function typing(){ return `<div class="typing"><span class="tdots"><i></i><i></i><i></i></span>Анализирую запрос…</div>`; }
function say(who,h,x){ S.chat.push({who,h,x:x||null}); }

/* label/tip — на нескольких полях (см. таблицу «Критерии УПП») пробуем
   более понятные названия и тултипы вместо сырого технического имени
   поля. Внутренний ключ (S.filters/BLOCKS/REAL_FILTER_PRED) не трогаем —
   меняется только то, что видит пользователь. */
function fieldLabel(name){ const f=FIELD_DEFS[name]; return (f&&f.label)||name; }
/* «Не менее 60 дней» и «60 дней» — разные условия, но подтверждение боту
   раньше показывало для обоих просто «60» (оператор терялся, если он
   совпадал с ops[0] у поля). Теперь для числовых полей оператор всегда
   виден рядом со значением — символом, а не служебным названием. */
/* «Больше»/«Меньше» — служебные названия операторов (REAL_FILTER_PRED/
   numMatches трактуют их включительно: «Больше» = ≥, «Меньше» = ≤ — см.
   numMatches). Раньше это никак не отражалось в тексте: «Не менее 60
   дней» подтверждалось как «Больше» (или вообще без оператора — если он
   совпадал с ops[0] у поля), а «больше» по-русски читается как строгое
   «>», не «не менее» (≥) — путало пользователя. Теперь везде, где
   оператор показывается человеку (подтверждение в чате, дропдаун в
   «Критериях подбора»), — однозначная словесная формулировка, а не голое
   служебное название. */
/* «Диапазон» без второй границы (одно число, не настоящий "от–до") раньше
   подписывался «≈ примерно» — но numMatches теперь сравнивает точно (см.
   комментарий там), а подпись обещала неточность, которой на самом деле
   нет (просьба заказчика, 18.08.2026: «должно быть чётко всё, как
   пользователь просит»). Настоящий диапазон "min-max" вообще не заходит в
   OP_LABEL — он форматируется отдельно в numValLabel() как «от X до Y». */
/* «не меньше / не больше» вместо «больше или равно / меньше или равно» —
   так говорят люди, а не формулы (аудит «понятно даже лохам», 14.09.2026). */
const OP_LABEL = {'Больше':'не меньше','Меньше':'не больше','Равен':'ровно','Диапазон':'ровно','До':'до','После':'после'};
/* Для полей-списков «ровно» звучит странно («Место поставки ровно Ярославль»). */
function opLabelFor(field, op){
  const def = FIELD_DEFS[field];
  if(def && llmFieldKind(def)==='numeric') return OP_LABEL[op]||op;
  return ({'Равен':'точно','Содержит':'содержит'})[op] || OP_LABEL[op] || op;
}
/* Значения, которые понятны юристу, но не новичку, — показываем словами.
   Внутреннее значение (фильтрация, данные) не меняется. */
const VALUE_LABEL = {'Эквивалент':{'условно':'Если подходит по характеристикам'}};
function valueLabel(field, v){ const m = VALUE_LABEL[field]; return (m && m[String(v).toLowerCase()]) || v; }
/* Значение может быть настоящим диапазоном "min-max" (см. parseNumberRange) —
   для него «≈ примерно» (OP_LABEL['Диапазон']) вводит в заблуждение: обе
   границы известны точно, показываем «от X до Y», а не приближение. */
function numValLabel(op, value){
  const range = parseRangeStr(value);
  if(range) return `от ${fmt(range.min)} до ${fmt(range.max)}`;
  return `${OP_LABEL[op]||op} ${esc(String(value))}`;
}
/* Отправка из поля ввода в чате — текст плюс заполненные чипы лотка
   одним сообщением (см. composerSend). */
function freeT(){ composerSend('chat'); }

/* =====================================================================
   КОМАНДНАЯ ПАЛИТРА УСЛОВИЙ («+» / «/» в поле ввода)
   =====================================================================
   Тот же паттерн, что «/» в Slack и Notion, «@» в Linear — по названию
   команды, а не по функции: способ найти нужное из ~40 полей, не делая
   интерфейс постоянной панелью фильтров. Никаких чипов-фильтров на
   экране по умолчанию (просьба заказчика, 14.09.2026, «уберём чипы
   отовсюду, визуальный шум») — единственный постоянный элемент это сама
   кнопка «+». Настоящий инлайн-слэш: «/запрос» печатается прямо в поле
   сообщения тем же шрифтом, что и остальной текст, — не отдельная строка
   поиска, а живой фильтр по тому, что уже набрано (см. slashToken/
   composerType). Список — маленький плавающий попап у поля ввода, а не
   блок, раздвигающий композер.
   • «+» (или «/» где угодно в тексте) открывает попап: полный список
     условий по группам. Клик по полю НЕ закрывает попап — в том же
     месте показывается выбор значения (или форма для числа/текста),
     после выбора попап возвращается к списку, можно сразу выбирать
     следующее поле;
   • «Требования из документации» — отдельная последняя группа с иконкой:
     их можно найти тем же поиском, но они не смешиваются с фильтрами
     поиска (см. DOC_CRITERIA_FIELDS/п.5).
   Выбранные значения — чипы над полем ввода, как вложения к письму.
   Можно набрать сколько угодно подряд — бот молчит, пока не нажали
   «Отправить»: тогда текст + все чипы уходят одним сообщением, дальше —
   обычная логика handleUserMessage: «Понял N условий. Нашёл M закупок». */
/* Активный «/»-токен в поле ввода — не часть S: не нужен для истории и
   снимков чата, только для текущего кадра набора текста (тот же принцип,
   что у модульной _navSig ниже по файлу). Клик по строке меню уводит
   фокус с textarea раньше, чем можно было бы прочитать живой
   el.selectionStart, — поэтому запоминаем токен на КАЖДОЕ нажатие
   клавиши (composerType), а читаем уже сохранённое значение при клике. */
let SLASH = null; // {start, query} | null
/* Раньше пробел «закрывал» слэш-токен — правило было рассчитано на то,
   что случайный забытый «/» посреди обычной фразы не должен держать
   меню открытым вечно. Реальный побочный эффект (найден тестами,
   14.09.2026): половина названий полей в палитре — из двух и более слов
   («Размер аванса», «Регион заказчика», «Срок действия БГ») — и пробел
   между первым и вторым словом СРАЗУ закрывал меню, то есть многословный
   поиск был не рабочим в принципе, только однословный. Теперь токен
   держится, пока сам «/» не удалён, не выбран пункт или не нажат Esc /
   клик мимо (composerKey/click-away ниже) — так же ведут себя Notion и
   Slack, у которых названия команд тоже бывают из нескольких слов. */
function slashToken(el){
  const pos = el.selectionStart;
  if(pos==null) return null;
  const before = el.value.slice(0, pos);
  const i = before.lastIndexOf('/');
  if(i<0) return null;
  return {start:i, query:before.slice(i+1)};
}
function composer(mode){
  const start = mode==='start';
  const att = S.tray.map(c=>`<span class="achip"><span class="an" onclick="event.stopPropagation();openInPalette('${jsq(c.field)}')">${esc(c.label)}</span><button class="ax" title="Убрать фильтр" onclick="event.stopPropagation();removeTrayField('${jsq(c.field)}')">✕</button></span>`).join('');
  const palette = S.trayOpen ? `<div class="pal ${start?'down':'up'}" onclick="event.stopPropagation()">${paletteBody()}</div>` : '';
  const plus = `<button type="button" class="cmpplus ${S.trayOpen?'on':''}" title="Найти фильтр (или наберите «/»)" onclick="insertSlash('${mode}')"><span class="pl">+</span></button>`;
  const send = `<button class="sendb" onclick="composerSend('${mode}')">↑</button>`;
  const ph = S.tray.length ? 'Можно дописать текстом или сразу отправить'
    : (start ? 'Опишите закупки, которые ищете' : 'Напишите, что уточнить, или наберите «/»');
  if(start){
    return `<div class="cmpbox cmp">
      <div class="cmpatt">${att}</div>
      <div class="cmprow">${plus}<input id="qIn" placeholder="${ph}" value="${esc(S.draft)}"
        oninput="composerType(this)" onkeydown="composerKey(event,this,'start')">${send}</div>
      ${palette}
    </div>`;
  }
  return `<div class="tabox cmp">
    ${palette}
    <div class="cmpatt">${att}</div>
    <textarea id="freeIn" placeholder="${ph}" oninput="composerType(this)"
      onkeydown="composerKey(event,this,'chat')">${esc(S.draft)}</textarea>
    <div class="tarow">${plus}<span style="font-size:11.5px;color:var(--ink4)">${S.tray.length?`${S.tray.length} ${condWord(S.tray.length)} к отправке`:''}</span><span class="sp"></span>${send}</div>
  </div>`;
}
/* Каждое нажатие клавиши в поле сообщения: обычный ввод текста плюс живое
   слежение за «/»-токеном у курсора. Первое открытие попапа — обычный
   render() (см. комментарий у filterFieldOpts выше о цене render() на
   каждую букву); все следующие нажатия, пока попап уже открыт, —
   ПРЯМАЯ правка innerHTML только самого попапа, без render() и без
   пересборки textarea, поэтому курсор и фокус не сбрасываются. */
function composerType(el){
  S.draft = el.value;
  if(S.paletteField) return; /* печатаем не в это поле — открыт редактор значения со своими полями */
  const tok = slashToken(el);
  if(!tok){
    /* render() здесь пересобирает textarea/input заново — без явного
       focusComposer() фокус ушёл бы в никуда прямо посреди набора текста
       (например, «закрыл» слэш пробелом и следующая буква уже никуда не
       попадает) — реальный баг, найденный тестами при первой обкатке. */
    if(S.trayOpen){ S.trayOpen=false; SLASH=null; render(); focusComposer(); }
    return;
  }
  const fresh = !S.trayOpen;
  SLASH = tok;
  if(fresh){ S.trayOpen=true; render(); focusComposer(); return; }
  const pop = document.querySelector('.cmp .pal');
  if(pop) pop.innerHTML = paletteBody(); else render();
}
function composerKey(e, el, mode){
  if(e.key==='Escape' && S.trayOpen){
    e.preventDefault();
    S.trayOpen=false; S.paletteField=null; S.fpField=null; SLASH=null;
    render(); focusComposer();
    return;
  }
  if(e.key==='Enter' && S.trayOpen && !S.paletteField){
    e.preventDefault();
    const first = document.querySelector('.cmp .pal .palopt');
    if(first) first.click(); else composerSend(mode);
    return;
  }
  if(e.key==='Enter' && (mode==='start' || !e.shiftKey)){
    e.preventDefault();
    composerSend(mode);
  }
}
/* Кнопка «+» — то же самое, что напечатать «/»: дописывает слэш в конец
   сообщения и открывает попап с пустым запросом (полный список). Повторный
   клик, пока попап уже открыт, — закрывает его целиком. */
function insertSlash(mode){
  if(S.trayOpen){ S.trayOpen=false; S.paletteField=null; S.fpField=null; SLASH=null; render(); focusComposer(); return; }
  S.draft = (S.draft||'') + '/';
  SLASH = {start:S.draft.length-1, query:''};
  S.trayOpen = true; S.paletteField = null;
  render();
  focusComposer();
}
/* Список вариантов режущего фильтра с числом на каждом — переиспользуется
   вложением в лотке и полем внутри палитры. title:false
   убирает заголовок поля (он уже есть в обёртке .paledn палитры). */
function cutOptionsHtml(cut, opt){
  const title = !opt || opt.title!==false;
  const list = trayOptsOf(cut);
  const counts = optionCounts(cut, list);
  const search = cut.search ? `<input placeholder="Город или область…" oninput="filterTrayOpts(this)"
    onkeydown="if(event.key==='Enter'){event.preventDefault();pickFirstTrayOpt(this)}">` : '';
  const body = list.map((o,i)=>{
    const h = trayOptHint(cut, o);
    return `<button type="button" class="topt" data-s="${esc(normRu(o.l))}" onclick="event.stopPropagation();applyCutChip('${jsq(cut.key)}',${i})">${esc(o.l)}<span class="th">${h?h+' · ':''}${fmt(counts[i])} ${buyWord(counts[i])}</span></button>`;
  }).join('');
  return `${title?`<div class="tph">${esc(cut.label)}</div>`:''}${search}<div class="tpl">${body}</div>`;
}
function trayOptHint(c, o){
  if(c.key!=='place') return '';
  if(o.v===USER_GEO.city) return 'ваш город';
  if(o.v===USER_GEO.region) return 'ваша область';
  return REGIONS.includes(o.v) ? 'область' : '';
}
/* Поиск по списку без render() — чтобы не сбрасывать фокус при печати. */
function filterTrayOpts(input){
  const q = normRu(input.value).trim();
  input.parentElement.querySelectorAll('.topt').forEach(el=>{
    el.style.display = !q || el.getAttribute('data-s').includes(q) ? '' : 'none';
  });
}
function pickFirstTrayOpt(input){
  const el = Array.from(input.parentElement.querySelectorAll('.topt')).find(x=>x.style.display!=='none');
  if(el) el.click();
}
/* Общая точка записи чипа лотка — от быстрого чипа, палитры или ✕ на
   вложении: один тап/выбор = одно заполненное значение, без хода
   переписки. Значение по тому же полю заменяет прежнее. */
/* У панели «Настроить поиск» в чате свой список выбранного (S.panelTray), у
   поля ввода — свой (S.tray, «/» и «+»). Раньше список был общий: выбор в
   панели появлялся ещё и чипами над полем ввода, поле росло на каждый клик,
   и сообщения чата дёргались. Редакторы значений общие; куда писать, решает
   S.fpField — он задан, пока открыт выпадающий список панели. */
function curTray(){ return S.fpField ? S.panelTray : S.tray; }
function upsertTrayChip(chip){
  const tray = curTray();
  const i = tray.findIndex(t=>t.field===chip.field);
  if(i>=0) tray[i]=chip; else tray.push(chip);
}
function removeChipByField(field, tray){ tray = tray || S.tray; const i=tray.findIndex(t=>t.field===field); if(i>=0) tray.splice(i,1); }
function removeTrayField(field){ removeChipByField(field); S.openDD=null; render(); focusComposer(); }
function applyCutChip(key, i){
  const cut = CUT_BY_KEY[key];
  const o = cut && trayOptsOf(cut)[i];
  if(!o) return;
  upsertTrayChip({field:cut.field, label:`${cut.label}: ${o.l}`, valLabel:o.l, row:rowFromOpt(cut, o)});
  closePaletteField();
}

/* ---------- палитра: список всех ~40 полей и выбор значения на месте ----------
   Открытие БЕЗ активного «/»-токена (клик по уже заполненному вложению-
   чипу) — сразу редактор значения этого поля, список не показываем. */
function openInPalette(field){ S.trayOpen=true; S.paletteField=field; SLASH=null; render(); focusComposer(); }
/* Клик по строке списка, найденной живым «/»-поиском: вырезаем из текста
   сообщения сам «/запрос» (он сделал своё дело — нашёл поле) и переходим
   к выбору значения в том же попапе. */
function pickSlashField(name){
  if(SLASH){
    S.draft = S.draft.slice(0, SLASH.start) + S.draft.slice(SLASH.start + 1 + SLASH.query.length);
  }
  SLASH = null;
  S.paletteField = name;
  render();
  focusComposer();
}
/* «← Назад» из редактора значения — к полному списку (без фильтра: сам
   текст «/запроса» уже вырезан из сообщения на предыдущем шаге). */
function closePaletteField(){
  /* Значение выбрано в выпадающем списке панели «Все фильтры» в чате — фокус
     в поле ввода внизу не переносим: человек, скорее всего, выбирает
     следующий фильтр в той же панели. */
  const inPanel = !!S.fpField;
  S.paletteField=null; S.fpField=null; SLASH=null; render();
  if(!inPanel) focusComposer();
}
/* Список полей — фильтруется живым «/»-запросом (SLASH.query), а не
   отдельной строкой поиска: строки поиска в попапе больше нет вовсе,
   печатать нужно прямо в сообщение (см. composerType). */
/* Дружелюбное имя поля для палитры — то же самое, что уже показано на
   чипах (вложение над полем ввода, рейл, шапка сетки): для семи режущих
   фильтров это CUT_FILTERS.label («Закон», «Сумма закупки»), а не
   технический fieldLabel() («Тип торгов», «Стоимость закупки»). Без
   этого поиск «/закон» или «/сумма» не находил бы ровно те поля, чьё
   короткое имя пользователь только что видел на своём же чипе —
   реальный баг, найденный тестами при первой обкатке нового поиска. */
function paletteLabel(name){ const c=CUT_BY_FIELD[name]; return c ? c.label : fieldLabel(name); }
function paletteBody(){
  if(S.paletteField) return paletteFieldEditor(S.paletteField);
  const q = normRu((SLASH && SLASH.query) || '').trim();
  const groups = PALETTE_GROUPS.map(g=>({n:g.n, doc:g.doc,
    items:g.items.filter(it=>FIELD_DEFS[it] && (!q || normRu(paletteLabel(it)).includes(q)))
  })).filter(g=>g.items.length);
  if(!groups.length) return `<div class="palempty">Ничего не нашлось</div>`;
  return `<div class="pallist">${groups.map(g=>`<div class="palgrp">${g.doc?'📄 ':''}${esc(g.n)}</div>${g.items.map(it=>{
    const chip = S.tray.find(t=>t.field===it);
    return `<button type="button" class="palopt ${chip?'filled':''}"
      onclick="pickSlashField('${jsq(it)}')">${esc(paletteLabel(it))}${chip?`<span class="palval">${esc(chip.valLabel)}</span>`:''}</button>`;
  }).join('')}`).join('')}</div>`;
}
function paletteEditorWrap(name, inner){
  return `<button type="button" class="palback" onclick="closePaletteField()">← Назад</button>
    <div class="paledn">${esc(paletteLabel(name))}</div>${inner}`;
}
/* Выбор значения конкретного поля — три вида, по типу поля:
   • режущий фильтр (place/price/law/…) — тот же список с числом на
     варианте, что и у быстрого чипа;
   • enum (закрытый список значений) — список кнопок;
   • число (аванс %, сроки в днях, обеспечение %) — оператор + число;
   • свободный текст (заказчик, ИНН, ОКПД2) — поле ввода.
   Критерии из документации сюда попадают наравне с остальными (их можно
   найти и заполнить), но НЕ являются кандидатами на вопрос агента — это
   разделение задаёт CUT_FILTERS/DOC_CRITERIA_FIELDS, не эта функция. */
function paletteFieldEditor(name){
  if(!FIELD_DEFS[name]) return '';
  return paletteEditorWrap(name, fieldEditorInner(name));
}
/* Сам редактор значения без обёртки «← Назад» — переиспользуется и
   палитрой композера, и выпадающим списком в панели «Все фильтры». */
function fieldEditorInner(name){
  const f = FIELD_DEFS[name]; if(!f) return '';
  const cut = CUT_BY_FIELD[name];
  return cut ? cutOptionsHtml(cut, {title:false})
    : llmFieldKind(f)==='enum' ? enumOptionsHtml(name, f)
    : llmFieldKind(f)==='numeric' ? numericEditorHtml(name, f)
    : textEditorHtml(name, f);
}
function enumOptionsHtml(name, f){
  const chip = curTray().find(t=>t.field===name);
  const values = f.values.filter(v=>!/^(Указать|Ввести)\s/i.test(v));
  const body = values.map(v=>`<button type="button" class="topt ${chip&&normRu(valText(chip.row.v))===normRu(v)?'on':''}"
    onclick="event.stopPropagation();applyEnumChip('${jsq(name)}','${jsq(v)}')">${esc(valueLabel(name,v))}</button>`).join('');
  return `<div class="tpl">${body}</div>`;
}
function applyEnumChip(name, value){
  const def = FIELD_DEFS[name];
  upsertTrayChip({field:name, label:`${fieldLabel(name)}: ${valueLabel(name,value)}`, valLabel:valueLabel(name,value), row:{f:name, o:def.ops[0], v:value, delta:def.delta}});
  closePaletteField();
}
/* ---------- ВАЛИДАЦИЯ ЧИСЛОВЫХ ЗНАЧЕНИЙ ----------
   Раньше физически бессмысленное число («аванс 500%», «обеспечение −10%»)
   принималось молча — ни отказа, ни объяснения, значение просто иногда
   тихо не сохранялось (ИНН неверной длины), иногда тихо сохранялось как
   есть. Одна таблица границ — общая и для палитры (submitPaletteNumeric),
   и для разбора свободного текста в чате (см. validateOps в
   handleUserMessage), чтобы «что считается невалидным» не разъезжалось
   между двумя входами одного и того же поля (просьба заказчика,
   14.09.2026, п.3.3: «что через слэш, что через чат»). */
const NUMERIC_BOUNDS = {
 'Аванс: процент':{min:0,max:100,unit:'%'},
 'Размер обеспечения заявки':{min:0,max:100,unit:'%'},
 'Размер обеспечения исполнения':{min:0,max:100,unit:'%'},
 'Срок оплаты':{min:0,max:3650,unit:'дн.'},
 'Срок КП':{min:0,max:3650,unit:'дн.'},
 'Срок действия БГ':{min:0,max:3650,unit:'дн.'},
 'Окончание приема заявок':{min:0,max:3650,unit:'дн.'},
 'Дата публикации торгов':{min:0,max:3650,unit:'дн.'},
 'Дата начала приёма заявок':{min:0,max:3650,unit:'дн.'},
 'НМЦ лота':{min:0,max:1e10,unit:'₽'},
 'Срок поставки':{min:0,max:3650,unit:'дн.'},
 'Объемы / ед. изм.':{min:0,max:1e7,unit:''},
};
/* value — то же, что летит в S.filters[].v: голое число либо диапазон
   "min-max" (см. parseRangeStr). Возвращает null (всё в порядке) либо
   готовую фразу для чата/попапа — с названием поля, чтобы было понятно,
   какое именно условие не применилось, если их несколько в одном сообщении. */
function validateNumericOp(name, value){
  const b = NUMERIC_BOUNDS[name];
  if(!b) return null;
  const range = parseRangeStr(value);
  const nums = range ? [range.min, range.max] : [parseAmount(valList(value)[0])];
  for(const n of nums){
    if(n==null || isNaN(n)) continue;
    if(n<b.min || n>b.max){
      const unit = b.unit==='%' ? '%' : ' '+b.unit;
      return `${fieldLabel(name)}: ${fmt(n)}${unit} — это вне разумных границ (${b.min}–${fmt(b.max)}${unit}), не применил.`;
    }
  }
  return null;
}
function numericPlaceholder(name){
  if(name==='Аванс: процент' || /размер обеспечения/i.test(name)) return '% от НМЦК';
  if(/срок|дата/i.test(name)) return 'дней';
  return 'число';
}
function numericEditorHtml(name, f){
  const chip = curTray().find(t=>t.field===name);
  const ops = f.ops.filter(o=>o!=='Диапазон'); /* один число без второй границы — см. численное поле ниже */
  const curOp = chip ? chip.row.o : ops[0];
  const curVal = chip ? valList(chip.row.v)[0] : '';
  return `<div class="palnumrow">
    <select id="palOp">${ops.map(o=>`<option value="${esc(o)}" ${o===curOp?'selected':''}>${esc(OP_LABEL[o]||o)}</option>`).join('')}</select>
    <input id="palNum" placeholder="${esc(numericPlaceholder(name))}" value="${esc(String(curVal))}"
      oninput="document.getElementById('palErr').hidden=true"
      onkeydown="if(event.key==='Enter'){event.preventDefault();submitPaletteNumeric('${jsq(name)}')}">
    <button type="button" class="palgo" onclick="submitPaletteNumeric('${jsq(name)}')">Добавить</button>
  </div>
  <div id="palErr" class="palerr" hidden></div>`;
}
/* Ошибка показывается ПРЯМОЙ правкой DOM, без render() — иначе попап
   перерисовался бы целиком и то, что человек уже напечатал, стёрлось бы
   вместе с ним же (тот же приём отказа от render() на живом вводе, что
   и у filterFieldOpts выше). render() происходит только при УСПЕШНОМ
   сохранении — тогда стирать уже нечего. */
function submitPaletteNumeric(name){
  const op = document.getElementById('palOp').value;
  const raw = document.getElementById('palNum').value;
  const num = parseAmount(raw);
  const errEl = document.getElementById('palErr');
  if(isNaN(num)){
    if(errEl){ errEl.textContent='Не похоже на число.'; errEl.hidden=false; }
    return;
  }
  const err = validateNumericOp(name, String(num));
  if(err){
    if(errEl){ errEl.textContent=err; errEl.hidden=false; }
    return;
  }
  const def = FIELD_DEFS[name];
  upsertTrayChip({field:name, label:`${fieldLabel(name)}: ${numValLabel(op, String(num))}`, valLabel:numValLabel(op, String(num)),
    row:{f:name, o:op, v:String(num), delta:def.delta}});
  closePaletteField();
}
function textEditorHtml(name, f){
  const chip = curTray().find(t=>t.field===name);
  const ph = name==='ИНН заказчика' ? 'ИНН, 10 или 12 цифр' : name==='Категория ОКПД 2' ? 'например 41.20.40' : 'название организации';
  return `<div class="palnumrow">
    <input id="palText" style="flex:1" placeholder="${ph}" value="${chip?esc(valText(chip.row.v)):''}"
      oninput="document.getElementById('palErr').hidden=true"
      onkeydown="if(event.key==='Enter'){event.preventDefault();submitPaletteText('${jsq(name)}')}">
    <button type="button" class="palgo" onclick="submitPaletteText('${jsq(name)}')">Добавить</button>
  </div>
  <div id="palErr" class="palerr" hidden></div>`;
}
function submitPaletteText(name){
  const raw = document.getElementById('palText').value.trim();
  if(!raw) return;
  const def = FIELD_DEFS[name];
  /* Пользователь печатает прямо в подписанное поле («ИНН заказчика», не
     «ответ на вопрос анкеты») — очищать текст от названия поля незачем,
     в отличие от свободного ответа в чате. Исключение — ОКПД2: если
     всё-таки набрать «ОКПД2 41.20.40» (название поля уже перед глазами,
     но повторить его в поле — обычное дело), после okpd2Norm() цифра «2»
     из самого слова «ОКПД2» приклеится к началу кода («241.20.40» вместо
     «41.20.40») — реальный баг, тот же, что уже чинили для чата (см.
     stripLabelWords выше). Вместо очистки текста от слова — вынимаем
     сам код по образцу (как это делает extractOps() для свободного
     текста), независимо от того, что напечатано вокруг него. */
  let value = raw;
  if(name==='ИНН заказчика') value = raw.replace(/\D/g,'');
  else if(name==='Категория ОКПД 2'){ const m = raw.match(/\d{2}(?:\.\d{1,3}){1,4}/); if(m) value = m[0]; }
  if(name==='ИНН заказчика' && value.length!==10 && value.length!==12){
    /* Раньше здесь молча ничего не сохранялось — ни чипа, ни объяснения,
       почему. Пользователь не мог понять, ввёл ли он что-то не то или
       просто не туда попал (реальный пробел, п.3.3, 14.09.2026). */
    const errEl = document.getElementById('palErr');
    if(errEl){ errEl.textContent = `ИНН — 10 или 12 цифр, получилось ${value.length}.`; errEl.hidden=false; }
    return;
  }
  upsertTrayChip({field:name, label:`${fieldLabel(name)}: ${valueLabel(name,value)}`, valLabel:valueLabel(name,value), row:{f:name, o:def.ops[0], v:value, delta:def.delta}});
  closePaletteField();
}
function focusComposer(){
  setTimeout(()=>{
    const el = document.querySelector('.tpop input') || document.getElementById('palNum') || document.getElementById('palText')
      || document.getElementById('freeIn') || document.getElementById('qIn');
    if(el && document.activeElement!==el && S.tourStep==null){
      el.focus();
      if(el.value!=null){ const n=el.value.length; try{ el.setSelectionRange(n,n); }catch(e){} }
    }
  }, 40);
}
function composerSend(mode){
  if(mode==='start') return startS();
  if(S.busy) return;
  const text = (S.draft||'').trim();
  const chips = S.tray.slice();
  if(!text && !chips.length) return;
  S.draft=''; S.tray=[]; S.trayOpen=false; S.paletteField=null; S.fpField=null; S.openDD=null;
  handleUserMessage(text, chips);
}
/* Пузырь пользователя: текст и чипы лотка — одно сообщение. */
function userBubble(text, chips){
  const t = text ? esc(text) : '';
  const c = (chips||[]).length ? `<div class="mchips">${chips.map(x=>`<span${x.remove?' class="mdel"':''}>${esc(x.label)}</span>`).join('')}</div>` : '';
  return t + c;
}
/* ---------- свободный критерий из чата (не ответ на активный вопрос) ----------
   Простая, не ИИ-эвристика для угадывания ПОЛЯ (по совпадению слов с
   названием/вопросом поля — та же tokenize()/stemMatch(), что уже
   используется для сопоставления запроса с процедурами), плюс уже готовый
   и проверенный пайплайн LLM-распознавания ЗНАЧЕНИЯ (llmExtract) — для поля
   он и так умеет честно отвечать «не понял» вместо угадывания. Намеренно
   один критерий за сообщение — не пытаемся разобрать несколько критериев
   в одной фразе, это usability-сложность, которую пока не просили решать. */
function fieldSearchText(name){
  const f = FIELD_DEFS[name];
  /* fieldLabel(name) — то, что пользователь реально ВИДИТ и печатает
     («Способ выбора победителя»), а не внутренний технический ключ поля
     («Метод оценки») — раньше здесь стоял голый name, и переименованные
     по CSV поля (12.08.2026) с этого момента вообще перестали угадываться
     (или угадывались как другое поле, у которого случайно совпало слово
     в СТАРОМ ключе — «Способ выбора победителя» находило «Способ оплаты»,
     потому что оба ключа начинаются на «Способ», хотя показываемое
     название «Метод оценки» с этим текстом вообще не пересекалось). */
  const parts = [fieldLabel(name), name, f.q||''];
  if(Array.isArray(f.values)) parts.push(...f.values);
  return parts.join(' ');
}
/* Сырой счёт совпавших токенов (сколько слов из текста нашлось в имени/
   вопросе/значениях поля) был обманчив на составных названиях: «Тип
   торгов» и «Статус торгов» оба содержат слово «торгов» — при вводе «Тип
   торгов» токенизируется только «торгов» (само «тип» короче 4 букв и
   отсекается), и оба поля получали одинаковый счёт 1 — честная ничья, но
   неправильная, ведь пользователь буквально написал название критерия.
   Считаем ДОЛЮ покрытия — сколько токенов САМОГО ИМЕНИ поля нашлось в
   тексте (matched / общее число токенов имени), а не сколько токенов
   текста нашлось хоть где-то. Для «Тип торгов» (имя целиком — один
   значимый токен «торгов») это будет 1/1=100%, для «Статус торгов»
   (два токена «статус»+«торгов») — 1/2=50%: явный перевес у точного поля. */
function fieldNameCoverage(name, toks){
  const nameToks = tokenize(fieldLabel(name)); /* по видимому названию, не по техническому ключу — см. комментарий в fieldSearchText() */
  if(!nameToks.length) return 0;
  const matched = nameToks.filter(h=>toks.some(t=>stemMatch(h,t))).length;
  return matched/nameToks.length;
}
function fieldMatchScore(name, toks){
  const hay = tokenize(fieldSearchText(name));
  let s = 0;
  toks.forEach(t=>{ if(hay.some(h=>stemMatch(h,t))) s++; });
  return s;
}
/* Совпадение конкретно с одним из ДОПУСТИМЫХ ЗНАЧЕНИЙ поля (а не просто с
   его названием/вопросом) — гораздо более сильный сигнал: значение вроде
   «отсрочка» буквально называет конкретный ответ, а не просто упоминает
   тему. Реальный случай (18.08.2026): «нужна отсрочка платежа на 30 дней» —
   слово «отсрочка» точно совпадает со значением поля «Способ оплаты», а
   слово «платежа» лишь стеммится с частью НАЗВАНИЯ другого поля («Этапность
   платежей»/«Этапы оплаты») — без разделения по силе сигнала оба поля
   получали одинаковый fieldMatchScore, попадали в ничью и guessFieldFromText
   честно, но неудачно, отказывался угадывать вовсе (см. ниже). */
function fieldValueScore(name, toks){
  const f = FIELD_DEFS[name];
  const vals = Array.isArray(f.values) ? f.values : [];
  if(!vals.length) return 0;
  /* Не «сколько слов из текста нашлось хоть где-то среди значений» (тогда
     частичное совпадение с ОДНИМ словом многословного значения — «платежей»
     из «График платежей» — весило бы наравне с полным совпадением
     однословного значения «Отсрочка», что и создавало ложную ничью выше).
     А максимальная ДОЛЯ покрытия по каждому отдельному значению — полное
     совпадение с целым значением весит больше, чем совпадение с частью
     составного. */
  let best = 0;
  vals.forEach(v=>{
    const vToks = tokenize(v);
    if(!vToks.length) return;
    const matched = vToks.filter(vt=>toks.some(t=>stemMatch(vt,t))).length;
    best = Math.max(best, matched/vToks.length);
  });
  return best;
}
/* Угадываем только среди ещё НЕ отвеченных полей (S.usedItems) — если
   критерий уже проставлен, менять его через свободный текст не пытаемся:
   для этого уже есть модалка «Критерии подбора» и ✕ на чипе критерия.
   Возвращаем null, если ничего не совпало или совпадение неоднозначно —
   лучше честно не угадать, чем выбрать не то поле. Два прохода:
   1) точное/подстрочное совпадение с названием поля — сильный сигнал,
      пользователь буквально написал имя критерия («Тип торгов»);
   2) иначе — по доле покрытия имени поля (см. fieldNameCoverage), а при
      равенстве долей — по количеству реально совпавших слов (fieldMatchScore). */
/* Реальный кейс (13.08.2026): «хочу уточнить график поставки» → поле
   угадалось верно («Режим поставки»), но САМОГО значения в тексте физически
   нет — только намерение обсудить критерий. LLM тем не менее вернула
   «Партиями» — вопреки инструкции признаться, что не распознала (см.
   validateLlmResult/recognized). Это ровно тот случай, который принцип
   проекта запрещает: подставлять правдоподобное значение вместо честного
   «не знаю». Отсекаем такие фразы ДЕТЕРМИНИРОВАННО, ДО обращения к LLM —
   не полагаемся на дисциплину модели там, где можно проверить в JS.
   Логика: убираем из токенов текста токены названия поля (label считается,
   не техническое имя — то, что пользователь реально печатает) и известные
   «намеренческие» глаголы/слова («хочу», «уточнить», «указать», «задать»,
   «узнать», «важно» и т.п. по стеблю) — если после этого не осталось ни
   одного токена, значит содержательной информации о ЗНАЧЕНИИ в тексте нет. */
/* Здесь раньше жил freeCriterionFromChat() — прежний разбор свободного
   текста: одно поле за сообщение, угаданное по совпадению слов
   (guessFieldFromText), плюс отсев «намерения без значения»
   (isMetaIntentOnly). Всё это заменено разбором целой реплики — см.
   handleUserMessage()/extractOps() ниже. Вспомогательные функции подсчёта
   совпадений с полем (fieldSearchText/fieldNameCoverage/fieldMatchScore/
   fieldValueScore) остались: на них теперь опирается guessFieldForExplain()
   — «про какой критерий вопрос?». */

/* =====================================================================
   ДИАЛОГОВЫЙ ДВИЖОК: SEARCH_STATE, НАМЕРЕНИЯ, МНОГОКРИТЕРИАЛЬНЫЙ РАЗБОР
   =====================================================================
   Раньше чат работал как анкета: на любой запрос бот сразу показывал
   карусель из восьми блоков («выберите критерии»), из выбранного собирал
   очередь S.queue и задавал вопросы подряд, по одному, независимо от
   того, что человек уже написал. Свободный текст разбирался строго как
   ОДИН критерий за сообщение (см. старый freeCriterionFromChat) — фраза
   «44-ФЗ, Москва, НМЦК от 20 млн, только активные» давала один фильтр из
   четырёх, а остальное молча терялось.

   Теперь порядок обратный: сначала мы пытаемся понять всё, что человек
   сказал (намерение + СКОЛЬКО УГОДНО критериев за сообщение), обновляем
   единое состояние поиска, показываем, как поняли, и только потом — если
   выборка всё ещё слишком широкая — задаём ОДИН, самый полезный
   уточняющий вопрос. Анкета никуда не делась, но стала тем, чем должна
   быть: явно вызываемым инструментом («Показать все критерии»), а не
   обязательным первым шагом.

   SEARCH_STATE — это по-прежнему S.query (тематика) + S.filters
   (критерии). Отдельной структуры намеренно не заводим: на S.filters уже
   завязаны грид, карточка, модалка «Критерии подбора», шаблоны и рейл —
   вторая копия состояния означала бы рассинхронизацию чата с ручными
   фильтрами, а это ровно то, что требование «чат + фильтры» запрещает.
   ===================================================================== */

/* ---------- разбор ЗНАЧЕНИЙ из свободного текста (детерминированно) ----------
   Всё, что можно надёжно вытащить регулярками, вытаскиваем в JS и НЕ
   отдаём модели — тот же принцип, что уже действовал для диапазонов
   (parseNumberRange) и «намерения без значения» (isMetaIntentOnly).
   LLM подключается после этого, чтобы добрать то, что регулярками не берётся
   (см. llmAnalyzeMessage) — а не чтобы дублировать надёжный разбор. */

/* Города и регионы во всех формах, которыми их реально пишут в чате.
   Город → «Место поставки» (где физически нужен товар/работа), регион в
   региональной форме → «Регион заказчика» (где зарегистрирован
   заказчик). Разницу между этими двумя критериями бот умеет объяснить
   отдельно (см. EXPLAIN_PAIRS) — это один из самых частых вопросов.
   Отдельная оговорка про Подмосковье: в демо-базе городов Московской
   области нет вообще (см. CITY_REGION), поэтому «Москва и МО» честно
   сводится к одному значению «Москва», а не к выдуманному региону,
   которого в данных не существует. */
/* ВАЖНО про регулярки и кириллицу. В JavaScript \w — это ровно
   [A-Za-z0-9_], а \b — граница между \w и не-\w. Русские буквы в \w не
   входят, поэтому «\bмосква\b» НЕ находит «в Москве» (слева и справа от
   слова — тоже не-\w, границы нет), а «миллион\w*» захватывает только
   «миллион», оставляя хвост «ов». Обе ошибки — молчаливые: регулярка
   просто никогда не срабатывает или срабатывает наполовину. Поэтому
   всюду ниже — явные классы [а-яё] вместо \w и явные границы вместо \b
   (ruRe). Тот же подход уже применён в scanEnumValues и в существующем
   stripLabelWords выше по файлу. */
const RU_LET = 'а-яёa-z';
const RU_WORD = 'а-яёa-z0-9';
function ruRe(body, flags){
  return new RegExp('(?:^|[^'+RU_WORD+'])(?:'+body+')(?![' + RU_LET + '])', flags||'i');
}
/* Область целиком («в Ярославской области») — тоже «Место поставки», со
   значением-регионом: для поставщика это почти всегда «куда везти», и
   именно так её предлагает вопрос «Где готовы поставлять?». Если бы
   фраза ставила «Регион заказчика», агент тут же переспросил бы про
   место поставки, хотя человек его только что назвал. Регион-формы
   стоят ПЕРЕД городами: «Ярославская область» не должна дать ещё и
   город «Ярославль». */
const PLACE_ALIASES = [
  {re:ruRe('московск[а-яё]*\\s+обл[а-яё.]*|подмосковь[а-яё]*'),  f:'Место поставки', v:'Московская обл.'},
  {re:ruRe('москв[а-яё]*|мск'),                                  f:'Место поставки', v:'Москва'},
  {re:ruRe('санкт-?петербург[а-яё]*|спб|питер[а-яё]*|петербург[а-яё]*'), f:'Место поставки', v:'Санкт-Петербург'},
  {re:ruRe('ярославск[а-яё]*\\s+обл[а-яё.]*'),                    f:'Место поставки', v:'Ярославская обл.'},
  {re:ruRe('ярославл[а-яё]*|ярославе?ц'),                         f:'Место поставки', v:'Ярославль'},
  {re:ruRe('рыбинск[а-яё]*'),                                     f:'Место поставки', v:'Рыбинск'},
  {re:ruRe('переславл[а-яё]*'),                                   f:'Место поставки', v:'Переславль-Залесский'},
  {re:ruRe('костромск[а-яё]*\\s+обл[а-яё.]*'),                    f:'Место поставки', v:'Костромская обл.'},
  {re:ruRe('костром[а-яё]*'),                                     f:'Место поставки', v:'Кострома'},
  {re:ruRe('подольск[а-яё]*'),                                    f:'Место поставки', v:'Подольск'},
  {re:ruRe('химк[а-яё]*'),                                        f:'Место поставки', v:'Химки'},
  {re:ruRe('татарстан[а-яё]*'),                                   f:'Место поставки', v:'Республика Татарстан'},
  {re:ruRe('казан[ьи][а-яё]*|казань'),                            f:'Место поставки', v:'Казань'},
  {re:ruRe('свердловск[а-яё]*\\s+обл[а-яё.]*'),                   f:'Место поставки', v:'Свердловская обл.'},
  {re:ruRe('екатеринбург[а-яё]*'),                                f:'Место поставки', v:'Екатеринбург'},
  {re:ruRe('новосибирск[а-яё]*\\s+обл[а-яё.]*'),                  f:'Место поставки', v:'Новосибирская обл.'},
  {re:ruRe('новосибирск[а-яё]*'),                                 f:'Место поставки', v:'Новосибирск'},
  {re:ruRe('краснодарск[а-яё]*\\s+кра[а-яё]*|кубан[а-яё]*'),      f:'Место поставки', v:'Краснодарский край'},
  {re:ruRe('краснодар[а-яё]*'),                                   f:'Место поставки', v:'Краснодар'},
  {re:ruRe('нижн[а-яё]*\\s+новгород[а-яё]*|нижегородск[а-яё]*'),  f:'Место поставки', v:'Нижний Новгород'},
  {re:ruRe('тюмен[а-яё]*'),                                       f:'Место поставки', v:'Тюмень'},

/* Тип торгов — по номеру закона/площадке, как их называют вслух. */
const LAW_ALIASES = [

  {re:ruRe('223[-\\s]?фз|фз[-\\s]?223'),        v:'223-ФЗ'},
  {re:ruRe('615[-\\s]?пп|пп[-\\s]?615'),        v:'615-ПП'},
