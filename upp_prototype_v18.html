  const warn = r.total<=2;
  return `<div class="crow ${warn?'warn':''}">
    <span class="cidx">${i+1}.</span>

    ${ddField('fo'+i,'o','folder',i,r.o,opsFor(r.f))}

    <span class="ctotal num">${fmt(r.total)}</span>

    <button class="ctrash" onclick="removeFolderFilterRow(${i})">🗑</button>
  </div>`;
}

function dcolFresh(key){ const fresh = S.dcolAnimKey!==key; S.dcolAnimKey=key; return fresh; }
function viewTemplateDetail(){
  const t = TEMPLATES.find(x=>x.n===S.curTemplate);
  if(S.templateEdit) return viewTemplateEdit(t);
  const fresh = dcolFresh('view:'+S.curTemplate);
  return `<div class="dcol" style="width:auto;flex:1;${fresh?'':'animation:none'}">
    <div class="dh"><span class="t">${esc(t.n)}</span><button class="x" onclick="S.curTemplate=null;render()">×</button></div>
    <div class="dsc">
      ${t.rules.map(r=>`<div class="frule"><div class="fl">${r.f}</div><div class="fo">${r.o}</div><div class="fv">${esc(valText(r.v))}</div></div>`).join('')}
      <div class="dactions">
        <div class="dact pri" onclick="startFromTemplate('${esc(t.n)}')">💬 Начать новый подбор</div>
        <div class="dact" onclick="toast('Шаблон продублирован')">⧉ Дублировать</div>
        <div class="dact" onclick="startTplEdit(t)">Редактировать</div>
        <div class="dact" onclick="toast('Переименование')">Переименовать</div>
        <div class="dact danger" onclick="toast('Шаблон удалён')">🗑 Удалить</div>
      </div>
    </div>
  </div>`;
}
function startTplEdit(t){ S.templateEdit=true; S.openDD=null; S.curTplRules=t.rules.slice(1).map(r=>({...r})); render(); }
function addTplRule(){
  S.curTplRules.push({f:null, o:null, v:''}); /* см. addFilterRow() — строка стартует пустой */
  render();
}
function saveTplEdit(n){
  const t = TEMPLATES.find(x=>x.n===n);
  t.rules = [t.rules[0], ...S.curTplRules];
  S.templateEdit=false; S.curTplRules=null;
  toast('Шаблон сохранён'); render();
}
function viewTemplateEdit(t){
  const fresh = dcolFresh('edit:'+S.curTemplate);
  return `<div class="dcol" style="width:auto;flex:1;${fresh?'':'animation:none'}">
    <div class="dh"><span class="t">${esc(t.n)}</span><button class="x" onclick="S.templateEdit=false;S.curTplRules=null;render()">×</button></div>
    <div class="dsc">
      <div class="esearch">🔍 Запрос: ${esc(t.rules[0].v)}</div>
      ${S.curTplRules.map((r,i)=>r.f?`<div class="econd">
        <span class="en">${i+1}.</span>
        ${fieldDD('tf'+i,'tpl',i,r.f)}
        ${ddField('to'+i,'o','tpl',i,r.o,opsFor(r.f))}
        ${valueField('tv'+i,'tpl',i,r)}
        <button class="ctrash" onclick="S.curTplRules.splice(${i},1);render()">🗑</button>
      </div>`:`<div class="econd">
        <span class="en">${i+1}.</span>
        ${fieldDD('tf'+i,'tpl',i,null)}
        <span style="flex:1;color:var(--ink4);font-size:12px">Сначала выберите фильтр</span>
        <button class="ctrash" onclick="S.curTplRules.splice(${i},1);render()">🗑</button>
      </div>`).join('')}
      <div class="eadd" onclick="addTplRule()">⊕ Добавить</div>
      <div><button class="esave" onclick="saveTplEdit('${esc(t.n)}')">Сохранить</button>
      <button class="ecancel" onclick="S.templateEdit=false;S.curTplRules=null;render()">Отмена</button></div>
    </div>
  </div>`;
}

/* ---------- misc ---------- */
function toast(t){
  const d=document.createElement('div');
  d.textContent=t;
  d.style.cssText='position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#1B1E2B;'+
    'color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;z-index:300;box-shadow:0 8px 26px rgba(0,0,0,.25)';
  document.body.appendChild(d); setTimeout(()=>d.remove(),2000);
}
document.getElementById('burger').onclick=()=>{ S.navCol=!S.navCol; render(); };

/* Единственный на весь документ обработчик "клик вне — закрыть меню".
   Важно: он навешан ОДИН раз при загрузке, а не заново на каждый render() —
   если бы он пересоздавался при каждом рендере, клики множились бы и
   меню открывалось/закрывалось само по себе. Срабатывает на mousedown
   (до перерисовки DOM по клику), поэтому не путается в новых/старых узлах. */
document.addEventListener('mousedown', (e)=>{
  if(S.openDD!==null && !e.target.closest('[data-dd]')){ S.openDD=null; S.sortPendingField=null; render(); }
  /* Палитра условий не закрывалась сама по себе ничем, кроме повторного
     клика по «+» — открытая один раз, она оставалась бы на экране сколь
     угодно долго. Клик куда угодно вне композера её закрывает, как и
     любое обычное всплывающее меню. */
  if(S.trayOpen && !e.target.closest('.cmp')){ S.trayOpen=false; S.paletteField=null; S.fpField=null; SLASH=null; render(); }
  /* Выпадающий список поля в панели «Все фильтры» — закрывается кликом вне панели. */
  if(S.fpField && !e.target.closest('[data-fp]')){ S.fpField=null; render(); }
});

render();
</script>
<script>
/* =====================================================================

   ===================================================================== */

/* ---------- состав панели: 34 фильтра и блоки — как в таблице ----------
   Поля, которых в таблице нет («ИНН заказчика» — теперь часть «Заказчика»,
   «Наличие аванса», «Срок поставки», «Объём закупки») и справочные

   справочно в карточке»), в панель не попадают. Порядок блоков — ради
   раскладки: в первой строке пять больших блоков, во второй три малых,
   так самая высокая строка не выше, чем в v12. */
const FX_BLOCKS = [
  {n:'Параметры закупки', row:1, items:['Тип торгов','Способ проведения','Статус торгов','Дата публикации торгов','Дата начала приёма заявок','Окончание приема заявок']},
  {n:'Предмет закупки', row:1, items:['Категория ОКПД 2','Классификатор строительных ресурсов (КСР)','Тип предмета','Эквивалент','Национальный режим']},
  {n:'Оплата', row:1, items:['НМЦ лота','Аванс: процент','Способ оплаты','Этапность платежей','Событие для оплаты']},
  {n:'Обеспечение', row:1, items:['Наличие обеспечения заявки','Размер обеспечения заявки','Форма обеспечения заявки','Требуется обеспечение исполнения','Размер обеспечения исполнения','Форма обеспечения исполнения','Ограничения по банку']},
  {n:'Требования', row:1, items:['Есть перечень обязательных документов','Опыт: требуется для допуска','Опыт: чем подтверждать (допуск)','МСП / СОНО']},
  {n:'Заказчик', row:2, items:['Заказчик','Регион заказчика']},
  {n:'Сроки и графики', row:2, items:['Режим поставки','Место поставки']},
  {n:'Оценка заявок', row:2, items:['Опыт: критерий оценки','Метод оценки','Опыт: чем подтверждать (оценка)']},
];
/* Способ ввода по каждому полю (ключ — имя поля в FIELD_DEFS).
   ctl: seg — переключатель (один вариант, первый — «Не важно»); chips —
   чипы, несколько; toggle — флажок; tree — дерево с поиском; suggest —
   поиск заказчика; date — календарь с пресетами; money — диапазон суммы;
   percent — диапазон процентов; limit — порог «не больше» в % или ₽.
   llm — поле из документации: в окошке флажок «показывать и те, где это не
   указано». dep — поле неактивно, пока в другом поле выбрано значение. */
const FX_YN = (yes, no)=>[{v:'Да', l:yes},{v:'Нет', l:no}];
const FX_MONEYFORM = [{v:'БГ или деньги', l:'Можно банковской гарантией'},{v:'Деньги', l:'Только деньги'}];
const FX_PROOF = [{v:'Любые договоры', l:'Любые договоры'},{v:'Договоры из ЕИС', l:'Только договоры из ЕИС'}];
const FX_NAT = ['Запрет','Ограничение','Преимущество','Не установлен'];
const FGX = {
  'Тип торгов': {ctl:'chips', label:'Тип торгов'},
  'Способ проведения': {ctl:'chips', label:'Способ проведения',
    order:['Аукцион на понижение','Аукцион на повышение','Конкурс','Запрос предложений','Запрос котировок','Продажа посредством публичного предложения']},
  'Статус торгов': {ctl:'seg', label:'Статус торгов', any:'Все', opts:[{v:'Активные', l:'Активные'},{v:'Архивные', l:'В архиве'}]},
  'Дата публикации торгов': {ctl:'date', label:'Дата публикации', mode:'past',
    presets:[{l:'Сегодня', lo:0, hi:0},{l:'За 3 дня', lo:0, hi:3},{l:'За неделю', lo:0, hi:7},{l:'За месяц', lo:0, hi:30}]},
  'Дата начала приёма заявок': {ctl:'date', label:'Начало приёма заявок', mode:'any',
    presets:[{l:'Уже идёт', lo:0, hi:3650},{l:'Начнётся в ближайшие 7 дней', lo:-7, hi:-1}]},
  'Окончание приема заявок': {ctl:'date', label:'Окончание приёма заявок', mode:'future',
    hint:'Сколько дней остаётся на подготовку заявки.',
    presets:[{l:'Не раньше чем через 3 дня', min:3},{l:'Через 7 дней и позже', min:7},{l:'Через 14 дней и позже', min:14}]},
  'Заказчик': {ctl:'suggest', label:'Заказчик'},
  'Регион заказчика': {ctl:'tree', tree:'geo', label:'Регион заказчика',
    hint:'Где зарегистрирован заказчик. Куда везти — фильтр «Место поставки».'},
  'Категория ОКПД 2': {ctl:'tree', tree:'okpd', label:'Категория продукции (ОКПД2)'},
  'Классификатор строительных ресурсов (КСР)': {ctl:'toggle', label:'КСР', text:'Только закупки с позициями КСР', lbl:'есть позиции КСР'},
  'Тип предмета': {ctl:'chips', llm:true, label:'Тип продукции'},
  'Эквивалент': {ctl:'chips', llm:true, label:'Допускается аналог', labels:{'Условно':'Условно'}, hint:'«Условно» — аналог можно, если совпадают характеристики.'},
  'Национальный режим': {ctl:'chips', llm:true, label:'Национальный режим', opts:FX_NAT.map(v=>({v, l:v})),
    hint:'Российскому производителю полезны «Запрет», «Ограничение», «Преимущество»; поставщику импорта — «Не установлен».'},
  'Режим поставки': {ctl:'chips', llm:true, label:'График поставки', labels:{'Разово':'Единоразово','Партиями':'По графику'}},
  'Место поставки': {ctl:'tree', tree:'geo', myCity:true, label:'Место поставки'},
  'НМЦ лота': {ctl:'money', label:'Стоимость закупки'},
  'Аванс: процент': {ctl:'percent', llm:true, label:'Размер аванса'},
  'Способ оплаты': {ctl:'chips', llm:true, label:'Способ оплаты', hint:'«Комбо» — часть заранее, часть после приёмки.'},
  'Этапность платежей': {ctl:'chips', llm:true, label:'Этапы оплаты'},
  'Событие для оплаты': {ctl:'chips', llm:true, label:'Условие оплаты', labels:{'Приемка':'Приёмка','Счет':'Счёт'}},
  'Наличие обеспечения заявки': {ctl:'seg', label:'Обеспечение заявки', opts:[{v:'Нет', l:'Без обеспечения'},{v:'Да', l:'С обеспечением'}]},
  'Размер обеспечения заявки': {ctl:'limit', llm:true, label:'Размер обеспечения заявки', pres:{pct:[1,2,3], rub:[10000,50000,100000]},
    dep:['Наличие обеспечения заявки','Нет','Выбрано «Без обеспечения»']},
  'Форма обеспечения заявки': {ctl:'seg', llm:true, label:'Вид обеспечения', opts:FX_MONEYFORM},
  'Требуется обеспечение исполнения': {ctl:'seg', llm:true, label:'Обеспечение исполнения', opts:FX_YN('Требуется','Не требуется')},
  'Размер обеспечения исполнения': {ctl:'limit', llm:true, label:'Размер обеспечения исполнения', pres:{pct:[5,10,15], rub:[100000,500000,1000000]},
    dep:['Требуется обеспечение исполнения','Нет','Выбрано «Не требуется»']},
  'Форма обеспечения исполнения': {ctl:'seg', llm:true, label:'Форма обеспечения исполнения', opts:FX_MONEYFORM},
  'Ограничения по банку': {ctl:'seg', llm:true, label:'Требования к банку', opts:FX_YN('Есть требования','Нет требований')},
  'Есть перечень обязательных документов': {ctl:'seg', llm:true, label:'Обязательные документы', opts:FX_YN('Есть перечень','Нет перечня')},
  'Опыт: требуется для допуска': {ctl:'seg', llm:true, label:'Требуется опыт', opts:FX_YN('Опыт нужен','Опыт не нужен')},
  'Опыт: чем подтверждать (допуск)': {ctl:'seg', llm:true, label:'Подтверждение опыта', opts:FX_PROOF,
    dep:['Опыт: требуется для допуска','Нет','В «Требуется опыт» выбрано «Опыт не нужен»']},
  'МСП / СОНО': {ctl:'seg', label:'Только для МСП / СОНО', opts:FX_YN('Только для МСП','Для всех')},
  'Опыт: критерий оценки': {ctl:'seg', llm:true, label:'Опыт влияет на оценку', opts:FX_YN('Влияет','Не влияет')},
  'Метод оценки': {ctl:'seg', llm:true, label:'Способ выбора победителя', opts:[{v:'Только цена', l:'Только цена'},{v:'Не только цена', l:'Не только цена'}]},
  'Опыт: чем подтверждать (оценка)': {ctl:'seg', llm:true, label:'Подтверждение опыта для оценки', opts:FX_PROOF,
    dep:['Опыт: критерий оценки','Нет','В «Опыт влияет на оценку» выбрано «Не влияет»']},
};
function fgLabel(name){ return (FGX[name] && FGX[name].label) || paletteLabel(name); }
const FX_UNK = 'Показывать и те, где в документации это не указано';

/* ---------- новые форматы значений в поиске ----------
   Панель кладёт в условие значения новых видов; старые форматы (из чата,
   из «/»-палитры) работают как раньше — новые предикаты сначала узнают
   свой формат, иначе отдают решение прежнему.
   • даты: «lo..hi» — сколько дней назад (публикация, начало приёма) или
     сколько дней осталось (окончание приёма), диапазон включительно;
   • стоимость: «nm:от..до», пустая граница — без неё, «|np» — включая
     закупки без указанной цены;
   • аванс: «pc:от..до» в процентах;
   • обеспечение: «pct:N» — не больше N% цены, «rub:N» — не больше N ₽
     (проценты из данных пересчитываем через НМЦК); без обеспечения — тоже
     подходит, ведь это 0;
   • заказчик: название или «ИНН …»; исключение — оператор «Кроме» и
     значения через «||»;
   • регион заказчика: регион или город;
   • национальный режим: в демо-данных он да/нет — вид (запрет /
     ограничение / преимущество) выводим из «да» детерминированно по id
     закупки, «нет» — «Не установлен». В реальных данных вид придёт из LLM. */
const FX_P = REAL_FILTER_PRED;
const FX_OLD = Object.assign({}, FX_P);
const fxRange = s=>{ const m = String(s).match(/^(-?\d+)\.\.(-?\d+)$/); return m ? [+m[1], +m[2]] : null; };
FX_P['Дата публикации торгов'] = (p,v,op)=>{ const r = fxRange(v); return r ? p.pubDays>=r[0] && p.pubDays<=r[1] : FX_OLD['Дата публикации торгов'](p,v,op); };
FX_P['Дата начала приёма заявок'] = (p,v,op)=>{ const r = fxRange(v); return r ? p.appStartDays>=r[0] && p.appStartDays<=r[1] : FX_OLD['Дата начала приёма заявок'](p,v,op); };
FX_P['Окончание приема заявок'] = (p,v,op)=>{ const r = fxRange(v); return r ? p.days>=r[0] && p.days<=r[1]+0.99 : FX_OLD['Окончание приема заявок'](p,v,op); };
FX_P['НМЦ лота'] = (p,v,op)=>{
  const m = String(v).match(/^nm:(\d*)\.\.(\d*)(\|np)?$/);
  if(!m) return FX_OLD['НМЦ лота'](p,v,op);
  if(p.nmck==null) return !!m[3];
  return (m[1]==='' || p.nmck>=+m[1]) && (m[2]==='' || p.nmck<=+m[2]);
};
FX_P['Аванс: процент'] = (p,v,op)=>{
  const m = String(v).match(/^pc:(\d+)\.\.(\d+)$/);
  return m ? p.prepaidExpense>=+m[1] && p.prepaidExpense<=+m[2] : FX_OLD['Аванс: процент'](p,v,op);
};
function fxSecLimit(pct, p, v){
  const m = String(v).match(/^(pct|rub):([\d.]+)$/);
  if(!m) return null;
  if(pct==null) return true;
  if(m[1]==='pct') return pct <= +m[2];
  return p.nmck!=null && pct*p.nmck/100 <= +m[2];
}
FX_P['Размер обеспечения заявки'] = (p,v,op)=>{ const r = fxSecLimit(p.applicationSecurityAmount, p, v); return r==null ? FX_OLD['Размер обеспечения заявки'](p,v,op) : r; };
FX_P['Размер обеспечения исполнения'] = (p,v,op)=>{ const r = fxSecLimit(p.contractBackingSize, p, v); return r==null ? FX_OLD['Размер обеспечения исполнения'](p,v,op) : r; };
FX_P['Заказчик'] = (p,v,op)=>{
  const hit = String(v).split('||').some(x=>/^ИНН /.test(x) ? p.inn===x.slice(4).replace(/\D/g,'') : FX_OLD['Заказчик'](p, x, 'Содержит'));
  return op==='Кроме' ? !hit : hit;
};
FX_P['Регион заказчика'] = (p,v,op)=>REGIONS.includes(String(v)) ? FX_OLD['Регион заказчика'](p,v,op) : cityOf(p.place)===String(v);
function fxNatKind(p){
  if(p.nationalRegime!=='да') return 'Не установлен';
  let h = 0; String(p.id).split('').forEach(c=>{ h = (h*31 + c.charCodeAt(0)) % 9973; });
  return FX_NAT[h % 3];
}
FX_P['Национальный режим'] = (p,v,op)=>FX_NAT.some(k=>normRu(k)===normRu(String(v))) ? normRu(fxNatKind(p))===normRu(String(v)) : FX_OLD['Национальный режим'](p,v,op);

/* Фраза условия в чате и в «Ходе подбора»: у значений из новой панели
   есть готовая подпись (lbl) — «за неделю», «от 1 до 5 млн ₽». */
const fxCondPhraseOld = window.condPhrase;
window.condPhrase = function(r){
  if(r && r.f && r.lbl) return `${esc(fgLabel(r.f).toLowerCase())}: ${esc(r.lbl)}`;
  if(r && r.f && FGX[r.f] && (FGX[r.f].ctl==='seg' || FGX[r.f].ctl==='chips' || FGX[r.f].ctl==='suggest')){
    const L = fgValueLabels(r.f, r);
    if(L.length) return `${esc(fgLabel(r.f).toLowerCase())}: ${esc(L.join(', '))}`;
  }
  return fxCondPhraseOld(r);
};

/* ---------- текущее значение поля в панели ---------- */
/* Черновик (если поле снимают — null), иначе применённое условие. */
function fxCurRow(name){
  const t = S.panelTray.find(x=>x.field===name);
  if(t) return t.remove ? null : t.row;
  const i = findFilterIdx(name); return i>=0 ? S.filters[i] : null;
}
/* Записать значение поля в черновик панели: null — «не важно» (снять
   применённое, если было); совпало с применённым — черновик не нужен. */
function fgSetRow(name, row){
  const idx = findFilterIdx(name);
  const key = r=>JSON.stringify([r.o, valList(r.v).map(x=>normRu(String(x))).sort(), !!r.unk]);
  if(!row){
    if(idx>=0) fgPutDraft({field:name, remove:true, label:`${fgLabel(name)}: ${fgValueLabels(name, S.filters[idx]).join(', ')}`, valLabel:null});
    else removeChipByField(name, S.panelTray);
    return;
  }
  const def = FIELD_DEFS[name] || {};
  row = Object.assign({f:name, delta:def.delta||0}, row);
  if(!row.unk) delete row.unk;
  if(idx>=0 && key(S.filters[idx])===key(row)){ removeChipByField(name, S.panelTray); return; }
  const labels = fgValueLabels(name, row);
  fgPutDraft({field:name, label:`${fgLabel(name)}: ${labels.join(', ')}`, valLabel:labels.join(', '), row});
}
/* Подписи значения для пилюли, тултипа и сообщения в чат. */
const fxValueLabelsOld = window.fgValueLabels;
window.fgValueLabels = function(name, row){
  if(!row || row.v==null) return [];
  const x = FGX[name];
  let L;
  if(row.lbl) L = [row.lbl];
  else if(x && x.ctl==='seg'){ const v = String(valList(row.v)[0]); const o = x.opts.find(o=>normRu(o.v)===normRu(v)); L = [o ? o.l : v]; }
  else if(x && x.ctl==='chips'){ const opts = fxChipOpts(name); L = valList(row.v).map(v=>{ const o = opts.find(o=>normRu(String(o.v))===normRu(String(v))); return o ? o.l : String(v); }); }
  else if(x && x.ctl==='suggest'){ L = fxOrgList(row).map((v,i)=>i===0 && row.o==='Кроме' ? 'кроме: '+v : v); }
  else if(x && x.ctl==='tree'){ L = valList(row.v).map(String); }
  else L = fxValueLabelsOld(name, row);
  if(row.unk && L.length) L[L.length-1] += ' + не указано';
  return L;
};
const fxOrgList = row=>row ? (row.o==='Кроме' ? String(row.v).split('||') : valList(row.v).map(String)) : [];

/* ---------- блоки и раскладка ---------- */
window.fgGroups = function(){
  return FX_BLOCKS.map(b=>({n:b.n, row:b.row, doc:b.row===2, items:b.items.filter(it=>FIELD_DEFS[it])})).filter(g=>g.items.length);
};
window.fgGridH = function(groups, n, ph){
  let h = 0, rows = 0;
  [...new Set(groups.map(g=>g.row))].forEach(row=>{
    const gs = groups.filter(g=>g.row===row);
    for(let i=0; i<gs.length; i+=n){ h += fgBlockH(Math.max(...gs.slice(i, i+n).map(g=>g.items.length)), ph); rows++; }
  });
  return h + (rows-1)*FG.rowGap;
};
window.allFiltersPanelHtml = function(lead){
  const groups = fgGroups();
  const L = fgLayout(groups);
  const q = S.fpQuery || '';
  const found = groups.reduce((s,g)=>s + g.items.filter(it=>fgMatch(it, q)).length, 0);
  const rowStart = groups.map((g,i)=>i>0 && g.row!==groups[i-1].row);
  const blocks = groups.map((g,i)=>`<div class="fgblk"${rowStart[i]?' style="grid-column-start:1"':''}>
      <div class="fghead" title="${esc(g.n)}">${esc(g.n)}</div>
      <div class="fgplist">${g.items.map(it=>fgCarouselPill(it, q, L.colW)).join('')}</div></div>`).join('');
  const search = `<div class="fgsearch" onclick="event.stopPropagation()"><span class="ic">🔍</span><input type="search" value="${esc(q)}"
      placeholder="Найти параметр или значение…" autocomplete="off"
      oninput="panelSearch(this.value)" onkeydown="panelSearchKey(event)" onfocus="panelSearchFocus()">${fgFoundHtml(q, found)}</div>`;
  return `<div class="fgpanel" data-fp data-w="${Math.round(L.W)}" data-h="${Math.round(L.H)}" onclick="panelBgClick()">
    <div class="fgtop"><div class="fglead">${lead||''}</div>${search}</div>
    <div class="fgcols" style="grid-template-columns:repeat(${L.n},minmax(0,1fr));--fgph:${L.ph}px">${blocks}</div>${panelFootHtml()}</div>`;
};

/* ---------- пилюля, тултип, поиск — те же, что в v12, с подписями из таблицы ---------- */
window.fgCarouselPill = function(it, q, colW){
  const {idx, queued, unset, labels} = fgPillState(it);
  const open = S.fpField===it;
  const f = FIELD_DEFS[it], x = FGX[it] || {};
  const label = esc(fgLabel(it));
  const fit = labels.length ? fgFitValues(labels, colW) : null;
  const state = unset ? 'unset' : queued ? 'queued' : idx>=0 ? 'filled' : '';
  const body = `<span class="fgl">${label}</span>` + (fit
    ? `<span class="fgv"><span class="fgv1">${esc(fit.text)}</span>${fit.more ? `<span class="fgmore">+${fit.more}</span>` : ''}</span>` : '');
  const tail = unset
    ? `<span class="fgx" title="Не снимать — оставить как было" onclick="event.stopPropagation();removePanelField('${jsq(it)}')">↺</span>`
    : queued
      ? `<span class="fgx" title="Убрать из выбранного" onclick="event.stopPropagation();removePanelField('${jsq(it)}')">✕</span>`
      : idx>=0
        ? `<span class="fgx" title="Снять фильтр" onclick="event.stopPropagation();panelUnsetField('${jsq(it)}')">✕</span>`
        : '';
  const title = !fit ? esc(x.hint || (f&&f.tip) || '') : fit.cut ? '' : `${label}: ${esc(labels.join(', '))}`;
  return `<span class="tfield crslpill ${state} ${open?'open':''} ${fit&&fit.cut?'fgmany':''} ${fgMatch(it, q)?'':'fgdim'}" data-f="${esc(it)}">
    <button type="button" ${title?`title="${title}"`:''} onclick="event.stopPropagation();openFieldInPanel('${jsq(it)}')"><span class="fgt">${body}</span>${tail}</button>
    ${open?fieldPopoverHtml(it):''}</span>`;
};
window.fgTipShow = function(el){
  const name = el.dataset.f;
  if(!FG_TT){ FG_TT = document.createElement('div'); FG_TT.className = 'fgtt'; document.body.appendChild(FG_TT); }
  if(FG_TT.style.display==='block' && FG_TT.dataset.f===name) return;
  const {queued, unset, labels} = fgPillState(name);
  const note = unset ? 'Будет снято после «Применить»' : queued ? 'Выбрано, применится по кнопке «Применить»' : '';
  FG_TT.innerHTML = `<div class="h">${esc(fgLabel(name))}${labels.length>1 ? ` · ${labels.length} ${plural(labels.length,'значение','значения','значений')}` : ''}</div>`
    + (labels.length>1 ? `<ul>${labels.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>` : `<div>${esc(labels[0]||'')}</div>`)
    + (note ? `<div class="s">${note}</div>` : '');
  FG_TT.dataset.f = name;
  FG_TT.style.display = 'block';
  const r = el.getBoundingClientRect(), t = FG_TT.getBoundingClientRect();
  const top = window.innerHeight - r.bottom > t.height + 14 ? r.bottom + 6 : r.top - t.height - 6;
  FG_TT.style.top = Math.max(8, top)+'px';
  FG_TT.style.left = Math.max(8, Math.min(r.left, window.innerWidth - t.width - 8))+'px';
};
const FX_SEARCH = new Map();
window.fgSearchText = function(it){
  if(!FX_SEARCH.has(it)){
    const x = FGX[it] || {};
    let vals = [];
    if(x.ctl==='seg') vals = x.opts.map(o=>o.l);
    else if(x.ctl==='chips') vals = fxChipOpts(it).map(o=>o.l);
    else if(x.tree==='geo') vals = REGIONS.concat(GEO.map(g=>g.city));
    else if(x.ctl==='suggest') vals = CUSTOMERS;
    FX_SEARCH.set(it, normRu([fgLabel(it), paletteLabel(it), it].concat(vals).join(' ')));
  }
  return FX_SEARCH.get(it);
};
window.panelSearchKey = function(e){
  if(e.key==='Escape'){ e.preventDefault(); e.target.value = ''; panelSearch(''); return; }
  if(e.key!=='Enter') return;
  e.preventDefault();
  const vis = [...document.querySelectorAll('[data-fp] .crslpill:not(.fgdim)')];
  const words = normRu(e.target.value).trim().split(/\s+/).filter(Boolean);
  if(!words.length) return;
  const byName = vis.find(el=>{ const t = normRu(fgLabel(el.dataset.f)); return words.every(w=>t.includes(w)); });
  const first = byName || vis[0];
  if(first) openFieldInPanel(first.dataset.f);
};
window.panelUnsetField = function(name){
  const i = findFilterIdx(name); if(i<0) return;
  fgPutDraft({field:name, remove:true, label:`${fgLabel(name)}: ${fgValueLabels(name, S.filters[i]).join(', ')}`, valLabel:null});
  if(S.fpField===name) S.fpField = null;
  render();
};

/* ---------- окошко выбора ---------- */
/* Временное состояние открытого окошка: строка поиска, раскрытые ветки
   дерева, выбранные дни календаря, единицы порога. Сбрасывается при
   открытии другого поля. */
const fxOpenOld = window.openFieldInPanel;
window.openFieldInPanel = function(name){
  if(S.fpField!==name){
    const cur = fxCurRow(name);
    const cal = cur && cur.cal;
    const base = cal ? new Date(cal.a) : fxToday();
    S.fgx = {name, q:'', open:{}, own:!!cal, a:cal?new Date(cal.a):null, b:cal?new Date(cal.b):null,
      y:base.getFullYear(), m:base.getMonth(), unk:!!(cur && cur.unk),
      unit:cur && /^rub:/.test(String(cur.v)) ? 'rub' : 'pct', excl:!!(cur && cur.o==='Кроме')};
  }
  fxOpenOld(name);
};
function fxDepOff(name){
  const d = FGX[name] && FGX[name].dep; if(!d) return null;
  const c = fxCurRow(d[0]);
  return c && normRu(String(valList(c.v)[0]))===normRu(d[1]) ? d[2] : null;
}
const fxPopoverOld = window.fieldPopoverHtml;
window.fieldPopoverHtml = function(name){
  const x = FGX[name]; if(!x) return fxPopoverOld(name);
  const f = FIELD_DEFS[name] || {};
  const cur = fxCurRow(name);
  const dep = fxDepOff(name);
  const body = fxEditor(name, x);
  const unk = x.llm ? `<label class="fxunk"><input type="checkbox" ${(S.fgx && S.fgx.unk) ? 'checked' : ''} onchange="fxUnk('${jsq(name)}',this.checked)">${FX_UNK}</label>` : '';
  const foot = x.ctl==='seg' ? '' : `<div class="fgpopfoot"><span>${cur ? 'Выбрано: '+esc(fgValueLabels(name, cur).join(', ')) : 'Ничего не выбрано — «не важно»'}</span><span class="sp"></span>
      <button type="button" class="palgo" onclick="event.stopPropagation();closePanelField()">Готово</button></div>`;
  return `<div class="tpop ${S.fpUp?'up':'down'} fgpop fxpop ${S.fpRight?'fgright':''}" ${S.fpMaxH?`style="max-height:${S.fpMaxH}px"`:''} onclick="event.stopPropagation()">
    <div class="fxhead"><span class="fgh">${esc(fgLabel(name))}</span>${cur ? `<button type="button" class="fxreset" onclick="fxReset('${jsq(name)}')">Сбросить</button>` : ''}</div>
    ${x.hint || f.tip ? `<div class="fgtip">${esc(x.hint || f.tip)}</div>` : ''}
    ${dep ? `<div class="fxdep">${esc(dep)} — фильтр неактивен</div><div class="fxoff">${body}</div>` : body}
    ${unk}${foot}</div>`;

function fxEditor(name, x){
  switch(x.ctl){
    case 'seg': return fxSegHtml(name, x);
    case 'chips': return fxChipsHtml(name, x);
    case 'toggle': return fxToggleHtml(name, x);
    case 'tree': return fxTreeHtml(name, x);
    case 'suggest': return fxSugHtml(name, x);
    case 'date': return fxDateHtml(name, x);
    case 'money': return fxMoneyHtml(name, x);
    case 'percent': return fxPctHtml(name, x);
    case 'limit': return fxLimitHtml(name, x);
  }
  return '';
}
/* Перерисовать, оставив окошко открытым; если в нём было поле ввода —
   вернуть в него фокус с курсором в конце. */
function fxRerender(focusSel){
  render();
  fxFit();
  if(!focusSel) return;
  const el = document.querySelector('.fxpop '+focusSel);
  if(el){ el.focus({preventScroll:true}); const n = el.value.length; try{ el.setSelectionRange(n, n); }catch(e){} }
}
/* Окошко выросло после открытия (появился календарь, список, плашки) —
   ограничиваем высоту местом до края чата, чтобы «Готово» не уезжало за
   край; дальше — своя прокрутка окошка, как и при открытии. */
function fxFit(){
  const pop = document.querySelector('.fxpop'), sc = document.getElementById('chatSc');
  if(!pop || !sc) return;
  const box = sc.getBoundingClientRect(), r = pop.getBoundingClientRect(), gap = 12;
  const room = S.fpUp ? r.bottom - box.top - gap : box.bottom - r.top - gap;
  if(pop.scrollHeight > room){ S.fpMaxH = Math.max(160, Math.floor(room)); pop.style.maxHeight = S.fpMaxH+'px'; }
}
const fxCount = (name, row)=>applyRows(panelPreviewSet(name), [Object.assign({f:name}, row)]).length;
const fxCnt = n=>`<span class="fxn">${fmt(n)}</span>`;
window.fxUnk = (name, on)=>{
  S.fgx.unk = on;
  const cur = fxCurRow(name);
  if(cur) fgSetRow(name, Object.assign({}, cur, {unk:on}));
  fxRerender();
};
window.fxReset = name=>{ fgSetRow(name, null); S.fgx.unk = false; S.fgx.a = S.fgx.b = null; S.fgx.own = false; fxRerender(); };

function fxSegHtml(name, x){
  const cur = fxCurRow(name), cv = cur ? normRu(String(valList(cur.v)[0])) : null;

  return `<div class="fxseg">${opts.map((o,i)=>{

  }).join('')}</div>`;
}
window.fxSeg = (name, i)=>{
  const x = FGX[name], o = [{v:null}].concat(x.opts)[i];

/* -- чипы: несколько вариантов, окошко остаётся открытым -- */
function fxChipOpts(name){
  const x = FGX[name] || {};
  let opts = x.opts || fgOpts(name).map(o=>({v:o.v, l:o.l}));
  opts = opts.filter(o=>o.v!=null && !/^(любые|все|не важно)/i.test(String(o.v)));
  if(x.labels) opts = opts.map(o=>({v:o.v, l:x.labels[o.v] || o.l}));
  if(x.order) opts = opts.slice().sort((a,b)=>x.order.indexOf(a.v) - x.order.indexOf(b.v));
  return opts;
}
function fxChipsHtml(name, x){
  const cur = fxCurRow(name);
  const on = new Set((cur ? valList(cur.v) : []).map(v=>normRu(String(v))));
  return `<div class="fxchips">${fxChipOpts(name).map((o,i)=>{
    const n = fxCount(name, {o:'Равен', v:o.v});
    return `<button type="button" class="fxchip ${on.has(normRu(String(o.v)))?'on':''} ${n===0?'zero':''}" onclick="fxChip('${jsq(name)}',${i})">${esc(o.l)}${fxCnt(n)}</button>`;
  }).join('')}</div>`;
}
window.fxChip = (name, i)=>{
  const o = fxChipOpts(name)[i], cur = fxCurRow(name);
  let list = cur ? valList(cur.v).slice() : [];
  const k = list.findIndex(v=>normRu(String(v))===normRu(String(o.v)));
  if(k>=0) list.splice(k, 1); else list.push(o.v);
  fgSetRow(name, list.length ? {o:'Равен', v:list.length>1 ? list : list[0], unk:S.fgx.unk} : null);
  fxRerender();
};

/* -- дерево: регион → город, раздел → код ОКПД2 -- */
let FX_OKPD = null;
function fxTreeData(x){
  if(x.tree==='geo') return REGIONS.map(r=>({id:r, n:r,
    kids:r.startsWith('г. ') ? [] : GEO.filter(g=>g.region===r).map(g=>({id:g.city, n:g.city}))}));
  /* ОКПД2 — весь каталог кодов, которые есть в базе, по разделам (первые
     две цифры); число у кода — сколько закупок с ним по текущему запросу.
     Название кода — название закупки с этим кодом (в демо-данных
     классификатор не настоящий, а у закупок одного запроса часто один код —
     поэтому не только коды текущей выдачи). */
  if(!FX_OKPD || FX_OKPD.n!==PROCS.length){ /* новый запрос добавляет в базу закупки — пересобираем */
    FX_OKPD = new Map(); FX_OKPD.n = PROCS.length;
    PROCS.forEach(p=>{ if(p.okpd2 && !FX_OKPD.has(p.okpd2)) FX_OKPD.set(p.okpd2, p.n.split(' — ')[0]); });
  }
  const byCode = FX_OKPD;
  const secs = new Map();
  [...byCode.keys()].sort().forEach(c=>{ const s = c.slice(0,2); if(!secs.has(s)) secs.set(s, []); secs.get(s).push({id:c, n:byCode.get(c)}); });
  return [...secs.keys()].sort().map(s=>({id:s, n:'Раздел '+s, kids:secs.get(s)}));
}
function fxTreeHtml(name, x){
  const cur = fxCurRow(name), sel = cur ? valList(cur.v).map(String) : [];
  const quick = x.tree==='geo' ? `<div class="fxchips">${x.myCity ? `<button type="button" class="fxchip ${sel.includes(USER_GEO.city)?'on':''}" onclick="fxTree('${jsq(name)}','${jsq(USER_GEO.city)}')">Ваш город: ${esc(USER_GEO.city)}</button>` : ''}<button type="button" class="fxchip ${sel.includes(USER_GEO.region)?'on':''}" onclick="fxTree('${jsq(name)}','${jsq(USER_GEO.region)}')">Ваш регион: ${esc(USER_GEO.region)}</button></div>` : '';
  const toks = sel.length ? `<div class="fxtoks">${sel.map(id=>`<span class="fxtok">${esc(id)}<button type="button" onclick="fxTree('${jsq(name)}','${jsq(id)}')" title="Убрать">✕</button></span>`).join('')}</div>` : '';
  return `${quick}${toks}<input class="fxinp fxq" placeholder="${x.tree==='geo' ? 'Регион или город…' : 'Код или название…'}" value="${esc(S.fgx.q)}" oninput="fxTreeQ('${jsq(name)}',this.value)">
    <div class="fxlst" id="fxlst">${fxTreeList(name, x)}</div>`;
}
function fxTreeList(name, x){
  const cur = fxCurRow(name), sel = cur ? valList(cur.v).map(String) : [];
  const q = normRu(S.fgx.q).trim(), code = x.tree==='okpd';
  const hit = t=>!q || normRu(t.n).includes(q) || normRu(t.id).startsWith(q);
  let out = '';
  fxTreeData(x).forEach(p=>{
    const kidsHit = p.kids.filter(hit);
    if(!hit(p) && !kidsHit.length) return;
    const open = S.fgx.open[p.id] || (q && kidsHit.length);
    const pOn = sel.includes(p.id);
    out += `<div class="fxit" onclick="fxTree('${jsq(name)}','${jsq(p.id)}')">${p.kids.length ? `<span class="fxex" onclick="event.stopPropagation();fxTreeOpen('${jsq(name)}','${jsq(p.id)}')">${open?'▾':'▸'}</span>` : '<span class="fxex"></span>'}<input type="checkbox" tabindex="-1" ${pOn?'checked':''}><span class="fxtx">${code ? '' : esc(p.n)}${code ? `<span class="fxcode">${esc(p.id)}</span> ${esc(p.n)}` : ''}</span>${fxCnt(fxCount(name, {o:'Равен', v:p.id}))}</div>`;
    if(open) (q ? kidsHit : p.kids).forEach(c=>{
      const on = pOn || sel.includes(c.id);
      out += `<div class="fxit fxkid" ${pOn ? 'title="Входит в выбранный раздел"' : `onclick="fxTree('${jsq(name)}','${jsq(c.id)}')"`}><input type="checkbox" tabindex="-1" ${on?'checked':''} ${pOn?'disabled':''}><span class="fxtx">${code ? `<span class="fxcode">${esc(c.id)}</span> ` : ''}${esc(c.n)}</span>${fxCnt(fxCount(name, {o:'Равен', v:c.id}))}</div>`;
    });
  });
  return out || '<div class="fxempty">Ничего не нашлось</div>';
}
window.fxTreeQ = (name, v)=>{ S.fgx.q = v; const el = document.getElementById('fxlst'); if(el) el.innerHTML = fxTreeList(name, FGX[name]); };
window.fxTreeOpen = (name, id)=>{ S.fgx.open[id] = !S.fgx.open[id]; fxRerender(); };
window.fxTree = (name, id)=>{
  const x = FGX[name], data = fxTreeData(x), cur = fxCurRow(name);
  let sel = cur ? valList(cur.v).map(String) : [];
  if(sel.includes(id)) sel = sel.filter(v=>v!==id);
  else {
    const par = data.find(p=>p.kids.some(c=>c.id===id));
    if(par && sel.includes(par.id)) return;
    sel.push(id);
    const node = data.find(p=>p.id===id);
    if(node) sel = sel.filter(v=>!node.kids.some(c=>c.id===v)); /* раздел поглощает свои коды */
  }
  fgSetRow(name, sel.length ? {o:'Равен', v:sel.length>1 ? sel : sel[0]} : null);
  fxRerender(S.fgx.q ? '.fxq' : '');
};

/* -- заказчик: поиск по названию или ИНН, несколько, можно исключить -- */
function fxSugHtml(name, x){
  const cur = fxCurRow(name), list = fxOrgList(cur);
  const toks = list.length ? `<div class="fxtoks">${list.map((v,i)=>`<span class="fxtok">${esc(v)}<button type="button" onclick="fxOrgDrop('${jsq(name)}',${i})" title="Убрать">✕</button></span>`).join('')}</div>` : '';
  return `${toks}<input class="fxinp fxq" placeholder="Название или ИНН — можно вставить список ИНН" value="${esc(S.fgx.q)}"
      oninput="fxSugQ('${jsq(name)}',this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();fxOrgEnter('${jsq(name)}')}">
    <div id="fxsug">${fxSugList(name)}</div>
    <div class="fxsw ${S.fgx.excl?'on':''}" onclick="fxExcl('${jsq(name)}')"><i></i>Кроме этих заказчиков</div>`;
}
const fxInns = q=>String(q).split(/[\s,;]+/).filter(s=>/^\d{9,12}$/.test(s));
function fxSugList(name){
  const q = S.fgx.q.trim(), cur = fxCurRow(name), list = fxOrgList(cur);
  if(q.length<2) return '<div class="fxnote">Начните вводить — от 2 символов: название или первые цифры ИНН.</div>';
  const inns = fxInns(q);
  if(inns.length>1) return `<div class="fxsug"><div class="fxit" onclick="fxOrgEnter('${jsq(name)}')">Добавить ${inns.length} ИНН из списка</div></div>`;
  let hits = [];
  if(/^\d+$/.test(q)){
    const seen = new Set();
    PROCS.forEach(p=>{ if(p.inn && p.inn.startsWith(q) && !seen.has(p.inn) && seen.size<5){ seen.add(p.inn); hits.push({v:'ИНН '+p.inn, s:p.cust}); } });
  } else {
    hits = CUSTOMERS.filter(c=>normOrgName(c).includes(normOrgName(q))).slice(0,6).map(c=>({v:c, s:''}));
  }
  hits = hits.filter(h=>!list.includes(h.v));
  if(!hits.length) return '<div class="fxempty">Не нашли такого заказчика.</div>';
  S.fgx.hits = hits;
  return `<div class="fxsug">${hits.map((h,i)=>`<div class="fxit" onclick="fxOrgAdd('${jsq(name)}',${i})"><span class="fxtx">${esc(h.v)}${h.s ? `<small>${esc(h.s)}</small>` : ''}</span>${fxCnt(fxCount(name, {o:'Равен', v:h.v}))}</div>`).join('')}</div>`;
}
function fxOrgSave(name, list){
  fgSetRow(name, list.length ? (S.fgx.excl ? {o:'Кроме', v:list.join('||')} : {o:'Равен', v:list.length>1 ? list : list[0]}) : null);
}
window.fxSugQ = (name, v)=>{ S.fgx.q = v; const el = document.getElementById('fxsug'); if(el) el.innerHTML = fxSugList(name); };
window.fxOrgAdd = (name, i)=>{ const h = S.fgx.hits && S.fgx.hits[i]; if(!h) return; fxOrgSave(name, fxOrgList(fxCurRow(name)).concat([h.v])); S.fgx.q = ''; fxRerender('.fxq'); };
window.fxOrgDrop = (name, i)=>{ const l = fxOrgList(fxCurRow(name)); l.splice(i, 1); fxOrgSave(name, l); fxRerender(); };
window.fxOrgEnter = name=>{
  const add = fxInns(S.fgx.q).filter(inn=>PROCS.some(p=>p.inn===inn)).map(inn=>'ИНН '+inn);
  if(!add.length) return;
  const l = fxOrgList(fxCurRow(name)); add.forEach(v=>{ if(!l.includes(v)) l.push(v); });
  fxOrgSave(name, l); S.fgx.q = ''; fxRerender('.fxq');
};
window.fxExcl = name=>{ S.fgx.excl = !S.fgx.excl; const l = fxOrgList(fxCurRow(name)); if(l.length) fxOrgSave(name, l); fxRerender(); };

/* -- даты: пресеты чипами и календарь «с — по» -- */
function fxToday(){ const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
const fxDays = (a, b)=>Math.round((b - a)/864e5);
const fxPad = n=>String(n).padStart(2,'0');
const fxD = d=>`${fxPad(d.getDate())}.${fxPad(d.getMonth()+1)}.${d.getFullYear()}`;
const fxDs = d=>`${fxPad(d.getDate())}.${fxPad(d.getMonth()+1)}`;
const FX_MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function fxPresetRow(x, p){
  if(x.mode==='future') return {o:'После', v:String(p.min), lbl:`≥ ${p.min} дн. на подачу`};
  return {o:'Диапазон', v:`${p.lo}..${p.hi}`, lbl:p.l.toLowerCase()};
}
function fxDateHtml(name, x){
  const cur = fxCurRow(name);
  const pres = x.presets.map((p,i)=>{
    const row = fxPresetRow(x, p);
    const on = cur && !cur.cal && cur.o===row.o && String(cur.v)===row.v;
    const n = fxCount(name, row);
    return `<button type="button" class="fxchip ${on?'on':''} ${n===0?'zero':''}" onclick="fxDatePre('${jsq(name)}',${i})">${esc(p.l)}${fxCnt(n)}</button>`;
  }).join('');
  const own = S.fgx.own || (cur && cur.cal);
  return `<div class="fxchips">${pres}<button type="button" class="fxchip ${own?'on':''}" onclick="fxOwn('${jsq(name)}')">Свой период</button></div>${own ? fxCalHtml(name, x) : ''}`;
}
function fxCalHtml(name, x){
  const t = fxToday(), y = S.fgx.y, m = S.fgx.m, a = S.fgx.a, b = S.fgx.b;
  const first = new Date(y, m, 1), start = (first.getDay()+6)%7, n = new Date(y, m+1, 0).getDate();
  const same = (p, q)=>p && q && p.getTime()===q.getTime();
  let g = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<span>${d}</span>`).join('');
  for(let i=0; i<start; i++) g += '<span></span>';
  for(let d=1; d<=n; d++){
    const dt = new Date(y, m, d);
    const dis = (x.mode==='past' && dt>t) || (x.mode==='future' && dt<t);
    const edge = same(dt, a) || same(dt, b), inr = a && b && dt>a && dt<b;
    g += `<button type="button" ${dis?'disabled':''} class="${edge?'edge':inr?'in':''} ${same(dt,t)?'today':''}" onclick="fxDay('${jsq(name)}',${y},${m},${d})">${d}</button>`;
  }
  const hint = !a ? 'Выберите первый день' : !b ? 'Теперь последний день' : `${fxD(a)} — ${fxD(b)}`;
  return `<div class="fxcal"><div class="fxmh"><button type="button" onclick="fxCalNav(-1)">‹</button>${FX_MONTHS[m]} ${y}<button type="button" onclick="fxCalNav(1)">›</button></div><div class="fxg">${g}</div></div><div class="fxnote">${hint}</div>`;
}
window.fxDatePre = (name, i)=>{
  const x = FGX[name], row = fxPresetRow(x, x.presets[i]), cur = fxCurRow(name);
  const on = cur && !cur.cal && cur.o===row.o && String(cur.v)===row.v;
  fgSetRow(name, on ? null : row);
  S.fgx.own = false; S.fgx.a = S.fgx.b = null;
  fxRerender();
};
window.fxOwn = name=>{ S.fgx.own = true; fxRerender(); };
window.fxCalNav = d=>{ S.fgx.m += d; if(S.fgx.m<0){ S.fgx.m = 11; S.fgx.y--; } if(S.fgx.m>11){ S.fgx.m = 0; S.fgx.y++; } fxRerender(); };
window.fxDay = (name, y, m, d)=>{
  const x = FGX[name], dt = new Date(y, m, d), s = S.fgx;
  if(!s.a || s.b){ s.a = dt; s.b = null; }
  else if(dt<s.a){ s.b = s.a; s.a = dt; } else s.b = dt;
  if(s.a && s.b){
    const t = fxToday();
    /* Прошлое: сколько дней назад (позже — меньше); будущее: сколько осталось. */
    const lo = x.mode==='future' ? fxDays(t, s.a) : fxDays(s.b, t);
    const hi = x.mode==='future' ? fxDays(t, s.b) : fxDays(s.a, t);
    const lbl = s.a.getFullYear()===s.b.getFullYear() ? `${fxDs(s.a)} — ${fxD(s.b)}` : `${fxD(s.a)} — ${fxD(s.b)}`;
    fgSetRow(name, {o:'Диапазон', v:`${lo}..${hi}`, lbl, cal:{a:s.a.getTime(), b:s.b.getTime()}});
  }
  fxRerender();
};

/* -- стоимость: «от — до», пресеты, без указанной цены -- */
const FX_PRICE = [{l:'до 300 тыс', a:'', b:300000},{l:'300 тыс – 1 млн', a:300000, b:1000000},{l:'1–5 млн', a:1000000, b:5000000},{l:'от 5 млн', a:5000000, b:''}];
function fxMoneyParse(s){
  s = String(s||'').toLowerCase().replace(/\s/g,'').replace(',','.');
  const m = s.match(/^([\d.]+)(млн|м|тыс|т|к)?/); if(!m) return '';
  let n = parseFloat(m[1]); if(isNaN(n)) return '';
  if(m[2]==='млн' || m[2]==='м') n *= 1e6; else if(m[2]) n *= 1e3;
  return Math.round(n);
}
function fxMoneyCur(name){
  const cur = fxCurRow(name), m = cur && String(cur.v).match(/^nm:(\d*)\.\.(\d*)(\|np)?$/);
  return m ? {a:m[1]==='' ? '' : +m[1], b:m[2]==='' ? '' : +m[2], np:!!m[3]} : {a:'', b:'', np:false};
}
function fxMoneyRow(a, b, np){
  if(a==='' && b==='') return null;
  const lbl = a!=='' && b!=='' ? `от ${moneyShort(a)} до ${moneyShort(b)}` : a!=='' ? `от ${moneyShort(a)}` : `до ${moneyShort(b)}`;
  return {o:'Диапазон', v:`nm:${a}..${b}${np?'|np':''}`, lbl:lbl + (np ? ' + без цены' : '')};
}
function fxMoneyHtml(name, x){
  const c = fxMoneyCur(name);
  return `<div class="fxchips">${FX_PRICE.map((p,i)=>{
      const row = fxMoneyRow(p.a, p.b, c.np), on = c.a===p.a && c.b===p.b;
      return `<button type="button" class="fxchip ${on?'on':''}" onclick="fxMoneyPre('${jsq(name)}',${i})">${esc(p.l)}${fxCnt(fxCount(name, row))}</button>`;
    }).join('')}</div>
    <div class="fxrow"><input class="fxinp" id="fxA" placeholder="от" value="${c.a===''?'':fmt(c.a)}" onchange="fxMoney('${jsq(name)}')"><span>—</span><input class="fxinp" id="fxB" placeholder="до" value="${c.b===''?'':fmt(c.b)}" onchange="fxMoney('${jsq(name)}')"><span>₽</span></div>
    <div class="fxnote">Можно писать «1,5 млн» или «300 тыс».</div>
    <label class="fxunk"><input type="checkbox" ${c.np?'checked':''} onchange="fxMoneyNp('${jsq(name)}',this.checked)">Включать закупки без указанной цены</label>`;
}
window.fxMoney = name=>{ const c = fxMoneyCur(name); fgSetRow(name, fxMoneyRow(fxMoneyParse(document.getElementById('fxA').value), fxMoneyParse(document.getElementById('fxB').value), c.np)); fxRerender(); };
window.fxMoneyPre = (name, i)=>{ const c = fxMoneyCur(name), p = FX_PRICE[i]; fgSetRow(name, c.a===p.a && c.b===p.b ? null : fxMoneyRow(p.a, p.b, c.np)); fxRerender(); };
window.fxMoneyNp = (name, on)=>{ const c = fxMoneyCur(name); if(c.a!=='' || c.b!=='') fgSetRow(name, fxMoneyRow(c.a, c.b, on)); fxRerender(); };

/* -- размер аванса: ползунок 0–100% с двумя ручками -- */
const FX_PCT = [{l:'Без аванса (0%)', lo:0, hi:0},{l:'от 10%', lo:10, hi:100},{l:'от 30%', lo:30, hi:100},{l:'от 50%', lo:50, hi:100}];
function fxPctCur(name){ const cur = fxCurRow(name), m = cur && String(cur.v).match(/^pc:(\d+)\.\.(\d+)$/); return m ? {lo:+m[1], hi:+m[2]} : {lo:0, hi:100}; }
function fxPctRow(lo, hi){
  if(lo===0 && hi===100) return null;
  return {o:'Диапазон', v:`pc:${lo}..${hi}`, lbl:hi===0 ? 'без аванса' : hi===100 ? `от ${lo}%` : lo===0 ? `до ${hi}%` : `${lo}–${hi}%`};
}
function fxPctHtml(name, x){
  const c = fxPctCur(name);
  return `<div class="fxchips">${FX_PCT.map((p,i)=>`<button type="button" class="fxchip ${c.lo===p.lo&&c.hi===p.hi?'on':''}" onclick="fxPctPre('${jsq(name)}',${i})">${esc(p.l)}${fxCnt(fxCount(name, fxPctRow(p.lo, p.hi)))}</button>`).join('')}</div>
    <div class="fxdual"><div class="tr"></div><div class="fill" id="fxFill" style="left:${c.lo}%;width:${c.hi-c.lo}%"></div>
      <input type="range" id="fxLo" min="0" max="100" step="5" value="${c.lo}" oninput="fxPctDrag()" onchange="fxPct('${jsq(name)}')">
      <input type="range" id="fxHi" min="0" max="100" step="5" value="${c.hi}" oninput="fxPctDrag()" onchange="fxPct('${jsq(name)}')"></div>
    <div class="fxrow"><span>от</span><input class="fxinp" id="fxLoN" type="number" min="0" max="100" value="${c.lo}" onchange="fxPctNum('${jsq(name)}')"><span>% до</span><input class="fxinp" id="fxHiN" type="number" min="0" max="100" value="${c.hi}" onchange="fxPctNum('${jsq(name)}')"><span>%</span></div>`;
}
window.fxPctDrag = ()=>{
  const lo = document.getElementById('fxLo'), hi = document.getElementById('fxHi');
  if(+lo.value > +hi.value){ if(document.activeElement===lo) hi.value = lo.value; else lo.value = hi.value; }
  const f = document.getElementById('fxFill'); f.style.left = lo.value+'%'; f.style.width = (hi.value - lo.value)+'%';
  document.getElementById('fxLoN').value = lo.value; document.getElementById('fxHiN').value = hi.value;
};
window.fxPct = name=>{ fgSetRow(name, fxPctRow(+document.getElementById('fxLo').value, +document.getElementById('fxHi').value)); fxRerender(); };
window.fxPctNum = name=>{
  let lo = Math.max(0, Math.min(100, +document.getElementById('fxLoN').value||0)), hi = Math.max(0, Math.min(100, +document.getElementById('fxHiN').value||0));
  if(lo>hi) [lo, hi] = [hi, lo];
  fgSetRow(name, fxPctRow(lo, hi)); fxRerender();
};
window.fxPctPre = (name, i)=>{ const c = fxPctCur(name), p = FX_PCT[i]; fgSetRow(name, c.lo===p.lo && c.hi===p.hi ? null : fxPctRow(p.lo, p.hi)); fxRerender(); };

/* -- обеспечение: порог «не больше» в % от цены или в ₽ -- */
function fxLimCur(name){ const cur = fxCurRow(name), m = cur && String(cur.v).match(/^(pct|rub):([\d.]+)$/); return m ? {unit:m[1], n:+m[2]} : null; }
function fxLimRow(unit, n){
  if(!(n>0)) return null;
  return {o:'Меньше', v:`${unit}:${n}`, lbl:unit==='pct' ? `не больше ${String(n).replace('.',',')}% цены` : `не больше ${moneyShort(n)}`};
}
function fxLimitHtml(name, x){
  const c = fxLimCur(name), unit = S.fgx.unit;
  const pres = (unit==='pct' ? x.pres.pct : x.pres.rub).map(v=>({v, l:unit==='pct' ? `до ${v}%` : `до ${moneyShort(v)}`}));
  return `<div class="fxseg">${[['pct','% от цены'],['rub','₽']].map(([k,l])=>`<button type="button" class="${unit===k?'on':''}" onclick="fxLimUnit('${jsq(name)}','${k}')"><span>${l}</span></button>`).join('')}</div>
    <div class="fxchips">${pres.map(p=>`<button type="button" class="fxchip ${c && c.unit===unit && c.n===p.v?'on':''}" onclick="fxLimPre('${jsq(name)}',${p.v})">${esc(p.l)}${fxCnt(fxCount(name, fxLimRow(unit, p.v)))}</button>`).join('')}</div>
    <div class="fxrow"><span>не больше</span><input class="fxinp" id="fxLim" inputmode="decimal" value="${c && c.unit===unit ? String(c.n).replace('.',',') : ''}" onchange="fxLim('${jsq(name)}')"><span>${unit==='pct' ? '% от НМЦК' : '₽'}</span></div>
    <div class="fxnote">Закупки без обеспечения тоже подходят. ${unit==='pct' ? '' : 'Рубли считаем от НМЦК закупки.'}</div>`;
}
window.fxLimUnit = (name, u)=>{ S.fgx.unit = u; fxRerender(); };
window.fxLimPre = (name, v)=>{ const c = fxLimCur(name); fgSetRow(name, c && c.unit===S.fgx.unit && c.n===v ? null : fxLimRow(S.fgx.unit, v)); fxRerender(); };
window.fxLim = name=>{
  const raw = document.getElementById('fxLim').value;
  const n = S.fgx.unit==='rub' ? fxMoneyParse(raw) : parseFloat(String(raw).replace(',','.'));
  fgSetRow(name, fxLimRow(S.fgx.unit, n)); fxRerender();
};
</script>

<script>
/* =====================================================================
   v14 (06.10.2026): «Настроить поиск» в «Ходе подбора» и в шапке выдачи
   открывает не модальное окно, а ту же панель в чате, что и чип в
   сообщении бота. В чате всегда не больше одной живой панели:
   • живая панель есть (она всегда последнее сообщение — любой следующий
     шаг в чате её закрывает, см. clearActionBlocks) — новое сообщение не
     шлём, прокручиваем к ней и подсвечиваем; выбранное, но не применённое
     сохраняется;
   • живой панели нет — обычный путь showAllFiltersPanel(): сообщение
     «Настроить поиск» от пользователя и свежая панель с текущим числом.
   Старые панели из истории не удаляем: закрытая панель уже свёрнута в
   строку текста, за ней — сообщение с применёнными фильтрами; это
   полезный след, и удаление дёргало бы прокрутку чата.
   ===================================================================== */
function fxLivePanel(){ return S.chat.some(m=>m.x==='actions' && m.allFields); }
function fxFlashPanel(){
  const sc = document.getElementById('chatSc'), m = sc && [...sc.querySelectorAll('.m.bot')].pop();
  const p = m && m.querySelector('.fgpanel'); if(!p) return;
  sc.scrollTo({top:sc.scrollTop + m.getBoundingClientRect().top - sc.getBoundingClientRect().top - 8, behavior:'smooth'});
  p.classList.remove('fgflash'); void p.offsetWidth; p.classList.add('fgflash');
  setTimeout(()=>p.classList.remove('fgflash'), 1200);
}
const fxShowPanelOld = window.showAllFiltersPanel;
window.showAllFiltersPanel = function(typed){
  if(S.busy) return;
  if(fxLivePanel()){ if(S.fpField){ S.fpField = null; render(); } fxFlashPanel(); return; }
  fxShowPanelOld(typed);
};
/* Модальное окно больше не открываем. Из шапки выдачи колонка чата узкая
   (340px) — панель на неё не рассчитана, поэтому выдачу на время
   настройки закрываем, а после «Применить» открываем снова. */
window.openCritModal = function(){
  if(S.busy) return;
  if(S.gridOpen && !fxLivePanel()){ S.gridOpen = false; S.cardOpen = false; S.fxReopenGrid = true; }
  else if(S.gridOpen){ S.gridOpen = false; S.cardOpen = false; S.fxReopenGrid = true; render(); }
  showAllFiltersPanel();
};
const fxApplyOld = window.applyFilterPanel;
window.applyFilterPanel = function(){
  const reopen = S.fxReopenGrid && S.panelTray.length;
  fxApplyOld();
  if(reopen){ S.fxReopenGrid = false; S.gridOpen = true; S.gridPage = 0; render(); }
};
</script>

<script>
/* =====================================================================
   v18 (09.10.2026): сбор обратной связи — четыре точки из минимума.
   Ключевая ценность для поставщика — быстро найти закупки, в которых он
   может и хочет участвовать, ничего не пропустив. Поэтому узнаём три вещи:
   релевантность выдачи, понял ли бот запрос, точны ли данные из
   документации. Принципы: сначала поведение, потом вопросы; обратная связь,
   которая сразу помогает самому человеку («скрыть», «исправить»), не
   раздражает; ничего модального; один клик на ответ, текст — по желанию;
   прямой вопрос — не чаще раза за сессию и раза в неделю.
   1. Метрики поведения — молча (меню профиля → «Метрики сессии» — для
      команды, в продукте пользователь этого не видит).
   2. «Не подходит» на закупке в выдаче и в карточке: закупка сворачивается
      на месте, причины — чипами по желанию; «Этот заказчик» скрывает все
      его закупки.
   3. «Неверно?» у данных из документации в карточке.
   4. «Нашли, что искали?» — сообщением бота после сохранения в подборку.
   Подключается после основного скрипта v14 и подменяет только несколько
   функций отображения (prow, viewCard, mRender, avatarMenu) и обёртывает
   действия, по которым считаются метрики.
   ===================================================================== */
S.fb = {t0:Date.now(), events:[], firstSave:null, hidden:{}, hiddenCust:{}, flags:{}, wrongOpen:null, askedSession:false, answers:[]};
function fbLog(type, data){
  S.fb.events.push(Object.assign({type, t:Date.now()}, data||{}));
}
const FB_WEEK = 7*864e5;
function fbCooldownOk(){ try{ return Date.now() - (+localStorage.getItem('upp_fb_found')||0) > FB_WEEK; }catch(e){ return true; } }
function fbSetCooldown(){ try{ localStorage.setItem('upp_fb_found', String(Date.now())); }catch(e){} }

/* ---------- 1. метрики поведения ---------- */
const fbOpenCardOld = window.openCard;
window.openCard = function(id){ fbLog('card', {id}); fbOpenCardOld(id); };
const fbHandleOld = window.handleUserMessage;
window.handleUserMessage = function(text, chips){
  if(String(text||'').trim()) fbLog('message', {text:String(text).trim().slice(0,60)});
  return fbHandleOld(text, chips);
};
const fbRespondOld = window.respondAfterChange;
window.respondAfterChange = function(ctx){
  fbRespondOld(ctx);
  if(S.query && S.total===0) fbLog('zero');
};
const fbApplyOld = window.applyFilterPanel;
window.applyFilterPanel = function(){ if(S.panelTray.length) fbLog('manual', {n:S.panelTray.length}); fbApplyOld(); };
const fbSaveOld = window.saveToFolder;
window.saveToFolder = function(folderName, ids, silent){
  fbLog('save', {n:ids.length});
  if(!S.fb.firstSave) S.fb.firstSave = {ms:Date.now()-S.fb.t0, steps:S.fb.events.length-1};
  fbSaveOld(folderName, ids, silent);
  /* Окно «Сохранить в подборку» (doSave) сохраняет «тихо» — со своим
     тостом, поэтому вопрос задаём при любом сохранении, не только при
     обычном. */
  setTimeout(fbAskFound, 1200);
};
function fbFmtMs(ms){ const s = Math.round(ms/1000); return s<60 ? `${s} с` : `${Math.floor(s/60)} мин ${s%60} с`; }
function fbMetricsHtml(){
  const ev = S.fb.events, cnt = t=>ev.filter(e=>e.type===t).length;
  const reasons = {};
  Object.values(S.fb.hidden).forEach(h=>{ if(h.reason) reasons[h.reason] = (reasons[h.reason]||0)+1; });
  const fs = S.fb.firstSave;
  const rows = [
    ['До первого сохранения', fs ? `${fbFmtMs(fs.ms)} · ${fs.steps} ${plural(fs.steps,'шаг','шага','шагов')}` : 'ещё не сохраняли'],
    ['Открыто карточек', cnt('card')],
    ['Сообщений в чат (переформулировок)', cnt('message')],
    ['Ручных настроек фильтров', cnt('manual')],
    ['Нулевых выдач', cnt('zero')],
    ['Сохранений в подборку', cnt('save')],
    ['«Не подходит»', Object.keys(S.fb.hidden).length + (Object.keys(reasons).length ? ' · ' + Object.entries(reasons).map(([k,v])=>`${k}: ${v}`).join(', ') : '')],
    ['Скрытых заказчиков', Object.keys(S.fb.hiddenCust).length],
    ['«Неверно» в данных', Object.keys(S.fb.flags).length],
    ['«Нашли, что искали?»', S.fb.answers.length ? S.fb.answers.map(a=>a.v + (a.reasons.length?` (${a.reasons.join(', ')})`:'')).join('; ') : '—'],
  ];
  return `<div class="fbm"><div class="fbmh"><b>Метрики сессии</b><span>для команды, пользователь не видит</span><button onclick="fbMetrics(false)">✕</button></div>
    <table>${rows.map(r=>`<tr><td>${r[0]}</td><td>${esc(String(r[1]))}</td></tr>`).join('')}</table>
    <div class="fbml">${ev.slice(-8).reverse().map(e=>`<div>${new Date(e.t).toLocaleTimeString('ru-RU')} · ${esc(e.type)}${e.text?` «${esc(e.text)}»`:''}${e.reason?` · ${esc(e.reason)}`:''}</div>`).join('') || '<div>событий пока нет</div>'}</div></div>`;
}
window.fbMetrics = on=>{
  let el = document.getElementById('fbMetrics');
  if(!on){ if(el) el.remove(); S.fb.metricsOn = false; return; }
  S.fb.metricsOn = true;
  if(!el){ el = document.createElement('div'); el.id = 'fbMetrics'; document.body.appendChild(el); }
  el.innerHTML = fbMetricsHtml();
};
const fbRenderOld = window.render;
window.render = function(){
  fbRenderOld();
  if(S.fb && S.fb.metricsOn) fbMetrics(true);
  if(S.fb && S.fb.pendingAsk && !S.navScreen && S.screen==='chat'){ S.fb.pendingAsk = false; setTimeout(fbAskFound, 700); }
};
window.avatarMenu = function(){
  return `<div class="ddmenu" style="right:0;left:auto;top:calc(100% + 8px);min-width:220px">
    <div class="ddopt" onclick="event.stopPropagation();S.openDD=null;goOnboard()">📘 Онбординг</div>
    <div class="ddopt" onclick="event.stopPropagation();S.openDD=null;toast('Профиль');render()">👤 Профиль</div>
    <div class="ddopt" onclick="event.stopPropagation();S.openDD=null;toast('Обратная связь: форма в отдельном окне');render()">💬 Обратная связь</div>
    <div class="ddopt" onclick="event.stopPropagation();S.openDD=null;render();fbMetrics(true)">📊 Метрики сессии (для команды)</div>
    <div class="ddopt" onclick="event.stopPropagation();S.openDD=null;toast('Выход из аккаунта');render()">↪ Выйти</div>
  </div>`;
};

/* ---------- 2. «Не подходит» ---------- */
const FB_REASONS = ['Не тот предмет','Не мой регион','Не та сумма','Не устраивают условия','Этот заказчик'];
const fbProwOld = window.prow;
window.prow = function(p0, ctx){
  if(ctx) return fbProwOld(p0, ctx);
  const h = S.fb.hidden[p0.id], hc = S.fb.hiddenCust[p0.cust];
  if(h || hc){
    /* Закупка не исчезает, а сворачивается на месте — список не прыгает. */
    let body;
    if(hc && !(h && h.reason==='Этот заказчик')) body = `<span class="fbhn">Скрыто: закупки этого заказчика</span>`;
    else if(h.reason==='Этот заказчик') body = `<span class="fbhn">Закупки «${esc(p0.cust)}» больше не показываем.</span>`;
    else if(h.reason) body = `<span class="fbhn">Скрыто · ${esc(h.reason.toLowerCase())}. Спасибо, учтём в подборе.</span>`;
    else body = `<span class="fbhn">Закупка скрыта. Почему?</span>${FB_REASONS.map(r=>`<button class="fbchip" onclick="event.stopPropagation();fbReason('${p0.id}','${r}')">${r}</button>`).join('')}`;
    const undo = hc && !(h && h.reason==='Этот заказчик') ? '' : `<button class="fblink" onclick="event.stopPropagation();fbUnhide('${p0.id}')">Вернуть</button>`;
    return `<div class="prow fbhid" onclick="event.stopPropagation()"><div class="fbhw">${body}${undo}</div></div>`;
  }
  const html = fbProwOld(p0, ctx);
  return html.replace(/<\/div>\s*$/, `<button class="fbno" title="Не подходит — скрыть" onclick="event.stopPropagation();fbHide('${p0.id}')">Не подходит</button></div>`);
};
window.fbHide = id=>{
  S.fb.hidden[id] = {reason:null, at:Date.now()};
  fbLog('not_fit', {id});
  if(S.curProc && S.curProc.id===id){ S.cardOpen = false; S.curProc = null; }
  S.checked = S.checked.filter(x=>x!==id);
  render();
};
window.fbReason = (id, r)=>{
  const p = PROCS_BY_ID.get(id);
  S.fb.hidden[id].reason = r;
  if(r==='Этот заказчик' && p) S.fb.hiddenCust[p.cust] = id;
  fbLog('not_fit_reason', {id, reason:r});
  render();
};
window.fbUnhide = id=>{
  const p = PROCS_BY_ID.get(id), h = S.fb.hidden[id];
  if(h && h.reason==='Этот заказчик' && p) delete S.fb.hiddenCust[p.cust];
  delete S.fb.hidden[id];
  fbLog('not_fit_undo', {id});
  render();
};

/* ---------- 3. «Неверно?» у данных из документации ---------- */
function fbDocRows(p){
  return DOC_CRITERIA_FIELDS.map(f=>({name:f, val:critValueOnProc(f, p)})).filter(r=>r.val!==null).slice(0, 6);
}
function fbWrongPop(name, cur){
  const f = FIELD_DEFS[name] || {};
  const vals = (f.values||[]).filter(v=>normRu(valueLabel(name, v))!==normRu(String(cur)));
  return `<div class="fbpop" onclick="event.stopPropagation()">
    <div class="fbph">Какое значение верное?</div>
    <div class="fbpo">${vals.map(v=>`<button class="fbchip" onclick="fbWrongSend('${jsq(name)}','${jsq(valueLabel(name, v))}')">${esc(valueLabel(name, v))}</button>`).join('')}
      <button class="fbchip" onclick="fbWrongSend('${jsq(name)}','в документации этого нет')">В документации этого нет</button></div>
    <div class="fbprow"><input class="fbin" id="fbWrongTxt" placeholder="Другое значение — по желанию" onkeydown="if(event.key==='Enter'){event.preventDefault();fbWrongSend('${jsq(name)}',this.value||'другое')}">
      <button class="fblink" onclick="fbWrongSend('${jsq(name)}',document.getElementById('fbWrongTxt').value||'другое')">Отправить</button>
      <button class="fblink muted" onclick="S.fb.wrongOpen=null;render()">Отмена</button></div>
  </div>`;
}
const fbCardOld = window.viewCard;
window.viewCard = function(){
  let html = fbCardOld();
  const p = displayProc(S.curProc), rows = fbDocRows(p);
  let k = -1;
  html = html.replace(/<li>([\s\S]*?)<\/li>/g, (m, inner)=>{
    k++; const r = rows[k]; if(!r) return m;
    const key = p.id+'|'+r.name, flagged = S.fb.flags[key], open = S.fb.wrongOpen===r.name;
    const tail = flagged
      ? `<span class="fbflag">· сообщили о неточности, спасибо</span>`
      : `<button class="fbwrong" onclick="event.stopPropagation();S.fb.wrongOpen=S.fb.wrongOpen==='${jsq(r.name)}'?null:'${jsq(r.name)}';render()">Неверно?</button>`;
    return `<li class="fbli ${open?'open':''}">${inner} ${tail}${open && !flagged ? fbWrongPop(r.name, r.val) : ''}</li>`;
  });
  /* «Не подходит» и в карточке — рядом с «Сохранить». */
  html = html.replace('<button class="sqb" onclick="toast(\'Отправка коллеге\')">', `<button class="sqb fbcardno" title="Не подходит — скрыть" onclick="fbHide('${p.id}')">Не подходит</button><button class="sqb" onclick="toast('Отправка коллеге')">`);
  return html;
};
window.fbWrongSend = (name, given)=>{
  const p = S.curProc; if(!p) return;
  S.fb.flags[p.id+'|'+name] = {given, at:Date.now()};
  S.fb.wrongOpen = null;
  fbLog('wrong_value', {reason:`${fieldLabel(name)} → ${given}`});
  render();
};

/* ---------- 4. «Нашли, что искали?» после сохранения ---------- */
function fbAskFound(){
  /* Не перебиваем: один раз за сессию, раз в неделю, не в онбординге, не
     пока бот думает и не пока открыта панель настройки. */
  if(S.fb.askedSession || !fbCooldownOk() || S.busy || S.onb || S.screen!=='chat') return;
  /* «Сохранить и перейти» уводит на экран подборки — чата там не видно.
     Не перебиваем там: спросим, когда человек вернётся в чат. */
  if(S.navScreen){ S.fb.pendingAsk = true; return; }
  if(S.chat.some(m=>m.x==='actions' && m.allFields)) return;
  S.fb.askedSession = true;
  S.chat.push({who:'bot', h:'', fb:{step:'ask', v:null, reasons:[], text:''}});
  fbLog('ask_found');
  render();
}
const FB_WHY = ['Мало подходящих закупок','Много лишнего','Бот не так понял запрос','Не хватает фильтра','Неточные данные в карточках'];
function fbFoundHtml(m, i){
  const f = m.fb;
  if(f.step==='done') return `<div class="fbq done">${f.v==='Да' ? 'Спасибо! Рады, что помогли найти.' : f.v===null ? 'Хорошо, не будем отвлекать.' : 'Спасибо — передали команде, будем улучшать.'}</div>`;
  if(f.step==='ask') return `<div class="fbq"><div class="fbqh">Пока вы здесь: нашли, что искали?<button class="fbx" title="Не сейчас" onclick="fbFound(${i},null)">✕</button></div>
    <div class="fbpo">${['Да','Частично','Нет'].map(v=>`<button class="fbchip big" onclick="fbFound(${i},'${v}')">${v}</button>`).join('')}</div></div>`;
  return `<div class="fbq"><div class="fbqh">Что помешало? Можно выбрать несколько</div>
    <div class="fbpo">${FB_WHY.map(r=>`<button class="fbchip ${f.reasons.includes(r)?'on':''}" onclick="fbWhy(${i},'${r}')">${r}</button>`).join('')}</div>
    <textarea class="fbin" id="fbWhyTxt" rows="2" placeholder="Что улучшить? — по желанию" oninput="S.chat[${i}].fb.text=this.value">${esc(f.text)}</textarea>
    <div class="fbprow"><button class="palgo" onclick="fbFoundSend(${i})">Отправить</button><button class="fblink muted" onclick="fbFoundSend(${i})">Пропустить</button></div></div>`;
}
window.fbFound = (i, v)=>{
  const f = S.chat[i].fb;
  f.v = v; fbSetCooldown();
  if(v===null){ f.step = 'done'; fbLog('found_dismiss'); }
  else if(v==='Да'){ f.step = 'done'; S.fb.answers.push({v, reasons:[]}); fbLog('found', {reason:v}); }
  else { f.step = 'why'; }
  render();
};
window.fbWhy = (i, r)=>{ const f = S.chat[i].fb; f.reasons = f.reasons.includes(r) ? f.reasons.filter(x=>x!==r) : f.reasons.concat([r]); render(); };
window.fbFoundSend = i=>{
  const f = S.chat[i].fb;
  f.step = 'done';
  S.fb.answers.push({v:f.v, reasons:f.reasons.slice(), text:f.text});
  fbLog('found', {reason:[f.v].concat(f.reasons).join(', ') + (f.text?` · «${f.text.slice(0,40)}»`:'')});
  render();
};
const fbMRenderOld = window.mRender;
window.mRender = function(m, fresh){
  if(m.fb){ const st = fresh ? '' : ' style="animation:none"'; return `<div class="m bot"${st}><div class="b">${fbFoundHtml(m, S.chat.indexOf(m))}</div></div>`; }
  return fbMRenderOld(m, fresh);
};
</script>
