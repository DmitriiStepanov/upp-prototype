    const sc = document.getElementById('chatSc'), m = sc && [...sc.querySelectorAll('.m.bot')].pop();
    if(m) sc.scrollTop += m.getBoundingClientRect().top - sc.getBoundingClientRect().top - 8;

}

/* ---------- «Настроить поиск» в чате (v10–v12, 29.09.2026) ----------
   История: v7 — карточки по образцу карусели критериев v3 (без «скролла в
   скролле», значение — во всплывающем окошке прямо у пилюли), страницами
   по 4; v8 — значение второй строкой, размер пилюли от выбора не зависит;
   v9 — все карточки сразу, поиск и по значениям, «будет N закупок», числа
   на вариантах с учётом выбранного, снятие фильтра черновиком.
   v10 — требования заказчика (29.09.2026):
   • все блоки и критерии на экране без прокрутки и листания (fgLayout);
   • значение под названием мелким шрифтом, место под него зарезервировано;
   • несколько значений — сколько влезает и «+N», полный список — в тултипе
     (fgTipShow). Несколько значений можно и выбрать — галочками (fgMulti).
   v11 — пилюли просторнее и легче. v12 — блоки выстроены строками: сверху
   основные параметры, снизу — из документации, блоки строки начинаются на
   одном уровне (замечание заказчика: «вторая линия блоков на разных
   уровнях»); поиск — сверху, в строке с текстом бота. */
/* Блоки панели. Основные — PALETTE_GROUPS, только «Сумма закупки» (НМЦ)
   переехала из «Оплаты» в «Параметры закупки» — это параметр закупки, а не
   условие оплаты (так же она стоит и в CUT_FILTERS), и оба больших блока
   теперь по 6 полей, а не 5 и 7. Критерии из документации (одна группа на
   18 полей) — пятью блоками по смыслу, не больше 4 полей в каждом: высоту
   строки задаёт самый высокий блок в ней. Что не попало в FG_DOC_SPLIT (если
   в DOC_CRITERIA_FIELDS появится новое поле) — отдельным блоком в конце. */
const FG_MOVE = {'НМЦ лота':'Параметры закупки'};
const FG_DOC_SPLIT = [
  {n:'Требования к заявке', items:['Опыт: требуется для допуска','Опыт: чем подтверждать (допуск)','Есть перечень обязательных документов','Срок КП']},
  {n:'Оценка заявок', items:['Метод оценки','Опыт: критерий оценки','Опыт: чем подтверждать (оценка)']},
  {n:'Обеспечение заявки', items:['Форма обеспечения заявки','Размер обеспечения заявки','Ограничения по банку']},
  {n:'Обеспечение исполнения', items:['Требуется обеспечение исполнения','Форма обеспечения исполнения','Размер обеспечения исполнения','Срок действия БГ']},
  {n:'Товар и поставка', items:['Национальный режим','Эквивалент','Срок поставки','Объемы / ед. изм.']},
];
function fgGroups(){
  const placed = new Set(FG_DOC_SPLIT.flatMap(x=>x.items));
  const main = PALETTE_GROUPS.filter(g=>!g.doc).map(g=>({n:g.n, doc:false,
    items:g.items.filter(it=>!FG_MOVE[it]).concat(Object.keys(FG_MOVE).filter(it=>FG_MOVE[it]===g.n))}));
  const docItems = PALETTE_GROUPS.filter(g=>g.doc).flatMap(g=>g.items);
  const doc = FG_DOC_SPLIT.map(x=>({n:x.n, doc:true, items:x.items.filter(it=>docItems.includes(it))}))
    .concat([{n:'Другое из документации', doc:true, items:docItems.filter(it=>!placed.has(it))}]);
  return main.concat(doc).map(g=>Object.assign(g, {items:g.items.filter(it=>FIELD_DEFS[it])})).filter(g=>g.items.length);
}
/* ---------- раскладка без прокрутки ----------
   Блоки — сеткой по строкам: сначала основные, с новой строки — из
   документации; все блоки строки начинаются на одном уровне, высота строки —
   по самому высокому блоку в ней. У всего в панели фиксированная высота
   (пилюля, заголовок блока, отступы — те же числа, что в CSS), поэтому
   высоту панели можно посчитать заранее, не рисуя. Колонок — не больше,
   чем блоков в строке (5), не уже colMin и по возможности не шире colMax;
   высота пилюли — из FG.pillH: сначала просторная, на тесном экране — ниже,
   если иначе не влезает. chrome — всё, что в сообщении кроме блоков:
   отступ сверху, строка с текстом и поиском, низ. Раскладка зависит только
   от размера окна — выбор значений её не меняет. */
const FG = {pillH:[38,36,34], pillGap:3, headH:20, rowGap:14, colGap:18, colMin:160, colMax:290, chrome:112};
function fgBlockH(n, ph){ return FG.headH + n*ph + (n-1)*FG.pillGap; }
function fgGridH(groups, n, ph){
  let h = 0, rows = 0;
  [false, true].forEach(doc=>{
    const gs = groups.filter(g=>g.doc===doc);
    for(let i=0; i<gs.length; i+=n){ h += fgBlockH(Math.max(...gs.slice(i, i+n).map(g=>g.items.length)), ph); rows++; }
  });
  return h + (rows-1)*FG.rowGap;
}
function fgLayout(groups){
  const sc = document.getElementById('chatSc');
  const W = sc ? sc.clientWidth - 48 : 880, H = sc ? sc.clientHeight : 640;
  const perRow = Math.max(groups.filter(g=>!g.doc).length, groups.filter(g=>g.doc).length);
  const cands = [];
  for(let n=1; n<=perRow; n++){
    const colW = (W - (n-1)*FG.colGap)/n;
    if(n>1 && colW < FG.colMin) break;
    cands.push({n, colW});
  }
  const fitW = cands.filter(c=>c.colW <= FG.colMax);
  const use = fitW.length ? fitW : cands.slice(-1);
  /* Сначала — самая просторная пилюля при любом допустимом числе колонок,
     и только если так не влезает — пилюля ниже. */
  for(const ph of FG.pillH) for(const c of use){
    const h = fgGridH(groups, c.n, ph);
    if(h <= H - FG.chrome) return Object.assign({W, H, ph, h}, c);
  }
  /* Не влезает никак — просторный вариант с наибольшим числом колонок:
     прокрутка всё равно будет, так хотя бы не тесно. */
  const c = use[use.length-1], ph = FG.pillH[0];
  return Object.assign({W, H, ph, h:fgGridH(groups, c.n, ph)}, c);
}
/* Размер чата поменялся без нового render() панели (окно потянули, открыли
   или закрыли список — колонка чата ещё и анимирует ширину): когда размер
   устоится, пересобираем раскладку. Порог больше ширины полосы прокрутки
   (до 17px в Windows): её появление/исчезновение само по себе раскладку не
   трогает — иначе они могли бы включать друг друга по кругу. */
let FG_RELAYOUT = null;
function fgCheckLayout(){
  clearTimeout(FG_RELAYOUT);
  FG_RELAYOUT = setTimeout(()=>{
    const p = document.querySelector('[data-fp]'), sc = document.getElementById('chatSc');
    if(p && sc && (Math.abs(sc.clientWidth-48 - (+p.dataset.w)) > 24 || Math.abs(sc.clientHeight - (+p.dataset.h)) > 24)) render();
  }, 250);
}
window.addEventListener('resize', fgCheckLayout);
/* Клик по названию поля — тот же попап у самой пилюли, что и в версии 6:
   один и тот же fieldPopoverHtml/panelFieldEditor работает и тут, и в
   «/»-палитре композера — он ничего не знает про то, кто его вызвал,
   только читает/пишет curTray() (пока открыт S.fpField — это S.panelTray). */
function openFieldInPanel(name){
  fgTipHide();
  S.trayOpen = false; S.paletteField = null; SLASH = null;
  S.fpField = S.fpField===name ? null : name;
  S.fpRight = false; S.fpUp = false; S.fpMaxH = null; S.fpOptQ = '';
  render();
  if(!S.fpField) return;
  /* Мерим сразу после render(), до отрисовки кадра, и запоминаем в
     S.fpRight/S.fpUp, чтобы следующий render() не сбросил положение. Чат
     не прокручиваем никогда: если попап не помещается ни снизу, ни сверху,
     он открывается туда, где места больше, и получает свою прокрутку
     (S.fpMaxH) — обычная прокрутка длинного списка значений внутри одного
     всплывающего окошка, как везде в приложении. */
  const pop = document.querySelector('.fgpop'); if(!pop) return;
  const box = (pop.closest('#chatSc') || pop.closest('.fgpanel')).getBoundingClientRect();
  const pill = pop.parentElement.getBoundingClientRect();
  const gap = 12, below = box.bottom - pill.bottom - gap, above = pill.top - box.top - gap, h = pop.offsetHeight;
  if(h > below && (h <= above || above > below)){ S.fpUp = true; pop.classList.remove('down'); pop.classList.add('up'); }
  const room = S.fpUp ? above : below;
  if(h > room){ S.fpMaxH = Math.max(120, Math.floor(room)); pop.style.maxHeight = S.fpMaxH+'px'; }
  if(pop.getBoundingClientRect().right > box.right - 8){ S.fpRight = true; pop.classList.add('fgright'); }
  const inp = pop.querySelector('input'); if(inp) inp.focus({preventScroll:true});
}

/* Клик по пустому месту панели закрывает окошко у пилюли (пилюли, окошко и

/* Поиск по панели — по названию поля и по его значениям (все слова

   поиска по полю неизменен — считаем один раз. */
const FG_SEARCH_TEXT = new Map();
function fgSearchText(it){
  if(!FG_SEARCH_TEXT.has(it)){
    const f = FIELD_DEFS[it] || {}, cut = CUT_BY_FIELD[it];
    const vals = cut ? trayOptsOf(cut).map(o=>o.l) : (f.values||[]).map(v=>valueLabel(it, v));
    FG_SEARCH_TEXT.set(it, normRu([paletteLabel(it), it].concat(vals).join(' ')));

function fgMatch(it, q){

/* ---------- значения поля ----------
   Какие поля можно заполнить несколькими значениями сразу: списки из трёх
   и больше вариантов «на равенство» (закон, регион, способ оплаты…).
   «Да/Нет», диапазоны сумм и сроков, «Все» — только одно значение. Ядро
   поиска несколько значений уже понимает (массив = ИЛИ, см. valList). */
function fgMulti(name){
  const cut = CUT_BY_FIELD[name];
  if(cut){ const l = trayOptsOf(cut); return l.length>=3 && l.every(o=>!o.o); }
  const f = FIELD_DEFS[name];
  if(!f || llmFieldKind(f)!=='enum' || f.ops[0]!=='Равен') return false;
  const vals = fgOpts(name).map(o=>normRu(o.v));
  return vals.length>=3 && !vals.some(v=>/^(да|нет|все|любые)/.test(v));
}
/* Варианты поля: у режущего фильтра — его варианты (с подписью и
   подсказкой), у обычного списка — значения из FIELD_DEFS. */
function fgOpts(name){
  const cut = CUT_BY_FIELD[name];
  if(cut) return trayOptsOf(cut);
  return ((FIELD_DEFS[name]||{}).values||[]).filter(v=>!/^(Указать|Ввести)\s/i.test(v)).map(v=>({l:valueLabel(name, v), v}));
}
/* Подписи значений строки условия — по одной на значение. */
function fgValueLabels(name, row){
  if(!row || row.v==null) return [];
  const f = FIELD_DEFS[name];
  if(name==='НМЦ лота' || (f && llmFieldKind(f)==='numeric')) return [critValDisplay(name, row.o, row.v)];
  const cut = CUT_BY_FIELD[name];
  return valList(row.v).map(x=>{
    const o = cut && trayOptsOf(cut).find(o=>normRu(String(o.v))===normRu(String(x)));
    return o ? o.l : valueLabel(name, x);
  });
}
/* Что показывает пилюля: черновик панели, иначе применённое. У отложенного
   снятия — применённое (оно показано зачёркнутым). */
function fgPillState(it){
  const idx = findFilterIdx(it);
  const queued = S.panelTray.find(t=>t.field===it);
  const unset = !!(queued && queued.remove);
  const row = queued && !unset ? queued.row : (idx>=0 ? S.filters[idx] : null);
  return {idx, queued, unset, labels:fgValueLabels(it, row)};
}
/* Сколько значений влезает в строку под названием: целиком, если все
   влезают; иначе первые, сколько поместится, и «+N» (крестик появляется
   только при наведении и места у текста не отнимает). Ширина символа —
   прикидка для 10.5px; если прикидка ошиблась, строку всё равно обрежет
   многоточие, а «+N» останется видно. cut — показано не всё (нужен тултип). */
function fgFitValues(labels, colW){
  const budget = Math.max(8, Math.floor((colW - 26) / 5.9));
  const all = labels.join(', ');
  if(all.length <= budget) return {text:all, more:0, cut:false};
  let k = 1;
  while(k+1 < labels.length && (labels.slice(0, k+1).join(', ') + ' +' + (labels.length-k-1)).length <= budget) k++;
  return {text:labels.slice(0, k).join(', '), more:labels.length-k, cut:true};
}
/* Пилюля поля — четыре состояния: пусто / выбрано, но не применено
   (queued) / уже реально в S.filters (filled) / применённое, которое в
   черновике снимают (unset). Открытое состояние — просто светлая подсветка
   (как hover), без рамки-кольца — та выглядела аляповато (замечание
   заказчика, 16.09.2026). */
function fgCarouselPill(it, q, colW){
  const {idx, queued, unset, labels} = fgPillState(it);
  const open = S.fpField===it;
  const f = FIELD_DEFS[it];
  const label = esc(paletteLabel(it));
  const fit = labels.length ? fgFitValues(labels, colW) : null;
  const state = unset ? 'unset' : queued ? 'queued' : idx>=0 ? 'filled' : '';
  const body = `<span class="fgl">${label}</span>` + (fit
    ? `<span class="fgv"><span class="fgv1">${esc(fit.text)}</span>${fit.more ? `<span class="fgmore">+${fit.more}</span>` : ''}</span>` : '');
  const tail = unset
    ? `<span class="fgx" title="Не снимать — оставить как было" onclick="event.stopPropagation();removePanelField('${jsq(it)}')">↺</span>`
    : queued
      ? `<span class="fgx" title="Убрать из выбранного" onclick="event.stopPropagation();removePanelField('${jsq(it)}')">✕</span>`
      : idx>=0
        ? `<span class="fgx" title="Снять фильтр" onclick="event.stopPropagation();panelUnsetField('${jsq(it)}')">✕</span>`
        : '';
  /* Показано не всё — полный список в тултипе (fgTipShow), родной title не
     нужен; всё влезло — title с названием целиком (оно могло обрезаться). */
  const title = !fit ? esc((f&&f.tip)||'') : fit.cut ? '' : `${label}: ${esc(labels.join(', '))}`;
  return `<span class="tfield crslpill ${state} ${open?'open':''} ${fit&&fit.cut?'fgmany':''} ${fgMatch(it, q)?'':'fgdim'}" data-f="${esc(it)}">
    <button type="button" ${title?`title="${title}"`:''} onclick="event.stopPropagation();openFieldInPanel('${jsq(it)}')"><span class="fgt">${body}</span>${tail}</button>
    ${open?fieldPopoverHtml(it):''}</span>`;
}
/* ---------- тултип со всеми значениями ----------
   Один элемент на страницу, в body — render() его не пересоздаёт. Показ по
   наведению на пилюлю, где показано не всё (.fgmany); пока открыто окошко
   выбора у какой-то пилюли — не показываем, чтобы не наслаивалось. */
let FG_TT = null;
function fgTipShow(el){
  const name = el.dataset.f;
  if(!FG_TT){ FG_TT = document.createElement('div'); FG_TT.className = 'fgtt'; document.body.appendChild(FG_TT); }
  if(FG_TT.style.display==='block' && FG_TT.dataset.f===name) return;
  const {queued, unset, labels} = fgPillState(name);
  const note = unset ? 'Будет снято после «Применить»' : queued ? 'Выбрано, применится по кнопке «Применить»' : '';
  FG_TT.innerHTML = `<div class="h">${esc(paletteLabel(name))}${labels.length>1 ? ` · ${labels.length} ${plural(labels.length,'значение','значения','значений')}` : ''}</div>`
    + (labels.length>1 ? `<ul>${labels.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>` : `<div>${esc(labels[0]||'')}</div>`)
    + (note ? `<div class="s">${note}</div>` : '');
  FG_TT.dataset.f = name;
  FG_TT.style.display = 'block';
  const r = el.getBoundingClientRect(), t = FG_TT.getBoundingClientRect();
  const top = window.innerHeight - r.bottom > t.height + 14 ? r.bottom + 6 : r.top - t.height - 6;
  FG_TT.style.top = Math.max(8, top)+'px';
  FG_TT.style.left = Math.max(8, Math.min(r.left, window.innerWidth - t.width - 8))+'px';
}
function fgTipHide(){ if(FG_TT && FG_TT.style.display!=='none'){ FG_TT.style.display = 'none'; FG_TT.dataset.f = ''; } }
document.addEventListener('mouseover', e=>{
  const el = e.target.closest ? e.target.closest('.crslpill.fgmany') : null;
  if(el && !S.fpField) fgTipShow(el); else fgTipHide();
});
document.addEventListener('scroll', fgTipHide, true);
document.addEventListener('mousedown', fgTipHide, true);
/* Черновик панели поверх применённых условий — то, что получится после
   «Применить». except — поле, варианты которого сейчас показывают: его
   прежнее значение для чисел на вариантах не учитываем. */
function panelPreviewRows(except){
  const touched = new Set(S.panelTray.map(t=>t.field));
  const rows = S.filters.filter(r=>r.f && !touched.has(r.f) && r.f!==except);
  S.panelTray.forEach(t=>{ if(!t.remove && t.field!==except) rows.push(t.row); });
  return rows;
}
function panelPreviewSet(except){ return computeN(panelPreviewRows(except)); }
/* Низ панели: поиск по параметрам, сколько закупок будет после
   «Применить», «Сбросить», «Применить». Кнопка есть всегда (неактивна без
   выбора), чтобы высота низа не прыгала. */
function fgFoundHtml(q, n){
  if(!normRu(q||'').trim()) return '<span class="fgfound"></span>';
  return `<span class="fgfound ${n?'':'none'}">${n ? `найдено ${n}` : 'нет такого'}</span>`;
}
function panelFootHtml(){
  const n = S.panelTray.length;
  let sum = `<span class="fgsum muted">Выберите значения — число закупок пересчитается сразу</span>`;
  if(n){
    const will = panelPreviewSet().length;
    sum = will
      ? `<span class="fgsum">Будет <b class="num">${fmt(will)}</b> ${buyWord(will)}<span class="fgwas">· сейчас ${fmt(S.workingSet.length)}</span></span>`
      : `<span class="fgsum"><span class="fgzero">Ничего не найдётся</span> — снимите что-нибудь из выбранного</span>`;
  }
  return `<div class="fgfoot" onclick="event.stopPropagation()">
    ${sum}<span class="sp"></span>
    ${n ? `<button type="button" class="fgreset" onclick="clearPanelTray()">Сбросить</button>` : ''}
    <button type="button" class="palgo" ${n?'':'disabled'} onclick="applyFilterPanel()">Применить${n?` · ${n}`:''}</button>
  </div>`;
}
/* Панель целиком — вместе с текстом сообщения (lead): поиск стоит справа в
   той же строке, что и текст бота (v12: «поиск логичнее сверху»), и не
   занимает отдельную строку по высоте. Блоки — одной сеткой: основные с
   первой строки, из документации — с новой (grid-column-start:1 у первого),
   так строки не перемешиваются, даже если колонок меньше пяти. */
function allFiltersPanelHtml(lead){
  const groups = fgGroups();
  const L = fgLayout(groups);
  const q = S.fpQuery || '';
  const found = groups.reduce((s,g)=>s + g.items.filter(it=>fgMatch(it, q)).length, 0);
  const firstDoc = groups.findIndex(g=>g.doc);
  const blocks = groups.map((g,i)=>`<div class="fgblk"${i===firstDoc?' style="grid-column-start:1"':''}>
      <div class="fghead" title="${esc(g.n)}${g.doc?' — определено по тексту документации закупки':''}">${esc(g.n)}</div>
      <div class="fgplist">${g.items.map(it=>fgCarouselPill(it, q, L.colW)).join('')}</div></div>`).join('');
  const search = `<div class="fgsearch" onclick="event.stopPropagation()"><span class="ic">🔍</span><input type="search" value="${esc(q)}"
      placeholder="Найти параметр или значение…" autocomplete="off"
      oninput="panelSearch(this.value)" onkeydown="panelSearchKey(event)" onfocus="panelSearchFocus()">${fgFoundHtml(q, found)}</div>`;
  return `<div class="fgpanel" data-fp data-w="${Math.round(L.W)}" data-h="${Math.round(L.H)}" onclick="panelBgClick()">
    <div class="fgtop"><div class="fglead">${lead||''}</div>${search}</div>
    <div class="fgcols" style="grid-template-columns:repeat(${L.n},minmax(0,1fr));--fgph:${L.ph}px">${blocks}</div>${panelFootHtml()}</div>`;
}
/* Ввод в поиске — без render(): иначе на каждую букву пересобиралось бы
   поле ввода и терялись фокус и курсор (тот же приём, что у filterFieldOpts).
   Запрос помним в S.fpQuery — следующий render() рисует панель уже с ним. */
window.panelSearch = (val)=>{
  S.fpQuery = val;
  const panel = document.querySelector('[data-fp]'); if(!panel) return;
  let n = 0;
  panel.querySelectorAll('.crslpill').forEach(el=>{
    const ok = fgMatch(el.dataset.f, val);
    el.classList.toggle('fgdim', !ok);
    if(ok) n++;
  });
  const f = panel.querySelector('.fgfound'); if(f) f.outerHTML = fgFoundHtml(val, n);
};
window.panelSearchKey = (e)=>{
  if(e.key==='Escape'){ e.preventDefault(); e.target.value = ''; panelSearch(''); return; }
  if(e.key!=='Enter') return;
  e.preventDefault();
  /* Совпадение по названию важнее совпадения по значению: «аванс» — это
     поле «Аванс», а не «Способ оплаты», у которого есть вариант «Аванс». */
  const vis = [...document.querySelectorAll('[data-fp] .crslpill:not(.fgdim)')];
  const words = normRu(e.target.value).trim().split(/\s+/).filter(Boolean);
  if(!words.length) return;
  const byName = vis.find(el=>{ const t = normRu(paletteLabel(el.dataset.f)); return words.every(w=>t.includes(w)); });
  const first = byName || vis[0];
  if(first) openFieldInPanel(first.dataset.f);
};
/* Фокус в поиске закрывает открытое окошко у пилюли. */
window.panelSearchFocus = ()=>{
  if(!S.fpField) return;
  S.fpField = null; render();
  const inp = document.querySelector('[data-fp] .fgsearch input');
  if(inp){ inp.focus({preventScroll:true}); const n = inp.value.length; inp.setSelectionRange(n, n); }
};
/* Крестик на применённой пилюле — такой же черновик, как выбор значения:
   снятие ждёт «Применить» вместе с остальным (см. remove:true в
   handleUserMessage), а не перезапускает поиск и не закрывает панель. */
function panelUnsetField(name){
  const i = findFilterIdx(name); if(i<0) return;
  fgPutDraft({field:name, remove:true, label:`${paletteLabel(name)}: ${fgValueLabels(name, S.filters[i]).join(', ')}`, valLabel:null});
  if(S.fpField===name) S.fpField = null;
  render();
}
/* Черновик поля — на то же место в S.panelTray (порядок = порядок выбора). */
function fgPutDraft(chip){
  const i = S.panelTray.findIndex(t=>t.field===chip.field);
  if(i>=0) S.panelTray[i] = chip; else S.panelTray.push(chip);
}
/* Несколько значений: набор значений поля целиком. Совпал с применённым —
   черновик не нужен; пустой — снятие применённого (или просто ничего). */
function panelSetValues(name, list){
  const def = FIELD_DEFS[name];
  const idx = findFilterIdx(name);
  const key = l=>l.map(x=>normRu(String(x))).sort().join('|');
  if(idx>=0 ? key(valList(S.filters[idx].v))===key(list) : !list.length){ removeChipByField(name, S.panelTray); return; }
  if(!list.length){ fgPutDraft({field:name, remove:true, label:`${paletteLabel(name)}: ${fgValueLabels(name, S.filters[idx]).join(', ')}`, valLabel:null}); return; }
  const labels = fgValueLabels(name, {v:list});
  fgPutDraft({field:name, label:`${paletteLabel(name)}: ${labels.join(', ')}`, valLabel:labels.join(', '),
    row:{f:name, o:def.ops[0], v:list.length>1 ? list.slice() : list[0], delta:def.delta}});
}
window.panelToggleValue = (name, i)=>{
  const o = fgOpts(name)[i]; if(!o) return;
  const cur = panelCurVal(name);
  const list = cur==null ? [] : valList(cur).slice();
  const k = list.findIndex(x=>normRu(String(x))===normRu(String(o.v)));
  if(k>=0) list.splice(k, 1); else list.push(o.v);
  panelSetValues(name, list);
  render();
  const inp = document.querySelector('.fgpop input');
  if(inp){ inp.focus({preventScroll:true}); const n = inp.value.length; inp.setSelectionRange(n, n); }
};
/* Выпадающий список у пилюли: название поля, подсказка простыми словами и
   сам выбор значения — как в композере, каждый клик по значению не
   применяется мгновенно, а копится в S.panelTray (см. panelApply*). */
function fieldPopoverHtml(name){
  const f = FIELD_DEFS[name];
  return `<div class="tpop ${S.fpUp?'up':'down'} fgpop ${S.fpRight?'fgright':''}" ${S.fpMaxH?`style="max-height:${S.fpMaxH}px"`:''} onclick="event.stopPropagation()">
    <div class="fgh">${esc(paletteLabel(name))}</div>${f&&f.tip?`<div class="fgtip">${esc(f.tip)}</div>`:''}
    <div>${panelFieldEditor(name)}</div></div>`;
}
function panelFieldEditor(name){
  if(fgMulti(name)) return panelMultiHtml(name);
  const cut = CUT_BY_FIELD[name];
  if(cut) return panelCutOptionsHtml(cut);
  const f = FIELD_DEFS[name]; if(!f) return '';
  return llmFieldKind(f)==='enum' ? panelEnumHtml(name, f)
    : llmFieldKind(f)==='numeric' ? panelNumericHtml(name, f)
    : panelTextHtml(name, f);
}
/* Текущее значение поля для редактора панели — сперва то, что уже отложено
   в лотке (S.panelTray, ещё не применено), иначе то, что уже реально в
   S.filters. Отложенное снятие — «значения нет». */
function panelTrayRow(name){ const t = S.panelTray.find(x=>x.field===name); return t ? (t.remove ? {v:null, o:null} : t.row) : null; }
function panelCurVal(name){
  const t = panelTrayRow(name); if(t) return t.v;
  const idx = findFilterIdx(name); return idx>=0 ? S.filters[idx].v : null;
}
function panelCurOp(name){
  const t = panelTrayRow(name); if(t) return t.o;
  const idx = findFilterIdx(name); return idx>=0 ? S.filters[idx].o : null;
}
/* Число на варианте — от черновика панели (применённое + уже выбранное
   здесь), а не только от применённого: выбрал 44-ФЗ — и цифры у регионов
   уже про 44-ФЗ. */
function fgOptRow(name, o){
  const cut = CUT_BY_FIELD[name];
  return cut ? rowFromOpt(cut, o) : {f:name, o:FIELD_DEFS[name].ops[0], v:o.v};
}
/* Список с галочками: клик добавляет/убирает значение, окошко остаётся
   открытым; «Готово» или клик мимо — закрыть. Строка поиска по значениям
   переживает render() (S.fpOptQ) — иначе после каждой галочки набранное
   «моск» стиралось бы. */
function panelMultiHtml(name){
  const opts = fgOpts(name), cut = CUT_BY_FIELD[name];
  const cur = panelCurVal(name);
  const on = new Set((cur==null ? [] : valList(cur)).map(x=>normRu(String(x))));
  const base = panelPreviewSet(name);
  const q = normRu(S.fpOptQ||'').trim();
  const search = (cut && cut.search) || opts.length > 8
    ? `<input placeholder="${cut&&cut.search?'Город или область…':'Найти значение…'}" value="${esc(S.fpOptQ||'')}"
        oninput="S.fpOptQ=this.value;filterTrayOpts(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();pickFirstTrayOpt(this)}">` : '';
  const body = opts.map((o,i)=>{
    const n = applyRows(base, [fgOptRow(name, o)]).length;
    const h = cut ? trayOptHint(cut, o) : '';
    const s = normRu(o.l);
    return `<button type="button" class="topt fgchk${on.has(normRu(String(o.v)))?' on':''}${n?'':' zero'}" data-s="${esc(s)}" ${q && !s.includes(q)?'style="display:none"':''}
      onclick="event.stopPropagation();panelToggleValue('${jsq(name)}',${i})"><span class="ck"></span>${esc(o.l)}<span class="th">${h?h+' · ':''}${fmt(n)} ${buyWord(n)}</span></button>`;
  }).join('');
  return `${search}<div class="tpl">${body}</div>
    <div class="fgpopfoot"><span>${on.size ? `Выбрано: ${on.size}` : 'Можно выбрать несколько'}</span><span class="sp"></span>
      <button type="button" class="palgo" onclick="event.stopPropagation();closePanelField()">Готово</button></div>`;
}
function panelCutOptionsHtml(cut){
  const list = trayOptsOf(cut);
  const base = panelPreviewSet(cut.field);
  const v = panelCurVal(cut.field);
  const curVal = v!=null ? valText(v) : null;
  const search = cut.search ? `<input placeholder="Город или область…" oninput="filterTrayOpts(this)"
    onkeydown="if(event.key==='Enter'){event.preventDefault();pickFirstTrayOpt(this)}">` : '';
  const body = list.map((o,i)=>{
    const n = applyRows(base, [rowFromOpt(cut, o)]).length;
    const h = trayOptHint(cut, o);
    const on = curVal!=null && normRu(curVal)===normRu(String(o.v)) ? ' on' : '';
    return `<button type="button" class="topt${on}${n?'':' zero'}" data-s="${esc(normRu(o.l))}" onclick="event.stopPropagation();panelApplyCut('${jsq(cut.key)}',${i})">${esc(o.l)}<span class="th">${h?h+' · ':''}${fmt(n)} ${buyWord(n)}</span></button>`;
  }).join('');
  return `${search}<div class="tpl">${body}</div>`;
}
function panelEnumHtml(name, f){
  const v = panelCurVal(name);
  const curVal = v!=null ? valText(v) : null;
  const base = panelPreviewSet(name);
  const body = fgOpts(name).map(o=>{
    const n = applyRows(base, [fgOptRow(name, o)]).length;
    return `<button type="button" class="topt ${curVal&&normRu(curVal)===normRu(o.v)?'on':''}${n?'':' zero'}"
    onclick="event.stopPropagation();panelApplyEnum('${jsq(name)}','${jsq(o.v)}')">${esc(o.l)}<span class="th">${fmt(n)} ${buyWord(n)}</span></button>`;
  }).join('');
  return `<div class="tpl">${body}</div>`;
}
function panelNumericHtml(name, f){
  const ops = f.ops.filter(o=>o!=='Диапазон');
  const curOp = panelCurOp(name) || ops[0];
  const v = panelCurVal(name);
  const curVal = v!=null ? valList(v)[0] : '';
  return `<div class="palnumrow">
    <select id="palOp2">${ops.map(o=>`<option value="${esc(o)}" ${o===curOp?'selected':''}>${esc(OP_LABEL[o]||o)}</option>`).join('')}</select>
    <input id="palNum2" placeholder="${esc(numericPlaceholder(name))}" value="${esc(String(curVal))}"
      oninput="document.getElementById('palErr2').hidden=true"
      onkeydown="if(event.key==='Enter'){event.preventDefault();panelApplyNumeric('${jsq(name)}')}">
    <button type="button" class="palgo" onclick="panelApplyNumeric('${jsq(name)}')">Выбрать</button>
  </div>
  <div id="palErr2" class="palerr" hidden></div>`;
}
function panelTextHtml(name, f){
  const v = panelCurVal(name);
  const ph = name==='ИНН заказчика' ? 'ИНН, 10 или 12 цифр' : name==='Категория ОКПД 2' ? 'например 41.20.40' : 'название организации';
  return `<div class="palnumrow">

  </div>
