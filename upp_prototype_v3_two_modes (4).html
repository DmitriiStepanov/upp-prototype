<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Умный поиск · Прототип по макетам Figma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8FC; --panel:#fff; --panel2:#FAFBFE;
  --line:#E6E9F1; --line2:#EEF1F7;
  --ink:#1B1E2B; --ink2:#4A5064; --ink3:#7A8296; --ink4:#A3AAB9;
  --blue:#2F5CE0; --blue-d:#2449C4; --blue-l:#EEF2FE; --blue-l2:#E3EAFD;
  --bub:#DCE7F9;
  --green:#1E9E5A; --green-bg:#E7F7EF;
  --red:#E5484D; --red-bg:#FDECEC;
  --amber:#B8760A; --amber-bg:#FFF4DE;
  --purple-bg:#EFF1FE; --purple:#5B5BD6;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Exo 2',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#D7DBE8;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

.app{height:100vh;display:flex;flex-direction:column}
.top{height:52px;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 18px;gap:14px;flex:none}
.logo{line-height:1.15}
.logo .n1{font-weight:800;font-size:15px;letter-spacing:-.01em}
.logo .n2{font-size:10.5px;color:var(--ink3)}
.top .sp{flex:1}
.ticons{display:flex;align-items:center;gap:4px}
.tic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--ink3);font-size:15px;position:relative}
.tic:hover{background:var(--blue-l);color:var(--blue)}
.tic .dot{position:absolute;top:1px;right:0px;background:var(--red);color:#fff;font-size:8.5px;
  font-weight:700;padding:1px 3px;border-radius:99px;line-height:1.3}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--green-bg);color:var(--green);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-left:4px;
  cursor:pointer;position:relative}
.avatar:hover{background:#D7F3E3}

.body{flex:1;display:flex;min-height:0}

.nav{width:230px;background:var(--panel);border-right:1px solid var(--line);flex:none;
  display:flex;flex-direction:column;transition:width .2s ease;overflow:hidden}
.nav.col{width:60px}
.nav .nsc{flex:1;overflow-y:auto;padding:12px 10px 14px}
.nnew{display:flex;align-items:center;justify-content:center;gap:8px;
  padding:10px;border:1px solid var(--line);border-radius:var(--r);color:var(--blue);
  font-size:13.5px;font-weight:600;background:var(--panel);margin-bottom:14px;width:100%}
.nnew:hover{border-color:var(--blue);background:var(--blue-l)}
.nrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;width:100%;
  text-align:left;color:var(--ink2);font-size:13.5px;white-space:nowrap;margin-bottom:1px}
.nrow:hover{background:var(--panel2)}
.nrow.on{background:var(--blue-l);color:var(--blue);font-weight:600}
.nrow .ic{width:17px;text-align:center;font-size:15px;flex:none;opacity:.85}
.nrow .tx{flex:1;overflow:hidden;text-overflow:ellipsis}
.nrow .cnt{font-size:11px;font-weight:700;background:var(--line2);color:var(--ink3);
  padding:1px 7px;border-radius:99px;flex:none}
.nrow.on .cnt{background:#fff;color:var(--blue)}
.nrow .chev{font-size:10px;color:var(--ink4);flex:none;transition:transform .15s}
.nrow .chev.open{transform:rotate(180deg)}
.nsub{padding-left:10px;margin-bottom:6px}
.nsubrow{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 16px;border-radius:8px;width:100%;
  text-align:left;font-size:13px;color:var(--ink2);white-space:nowrap}
.nsubrow:hover{background:var(--panel2)}
.nsubrow.on{background:var(--blue-l);color:var(--blue);font-weight:600}
.nsubrow .tx{flex:1;overflow:hidden;text-overflow:ellipsis}
.nsubrow .cnt{font-size:10.5px;font-weight:700;color:var(--ink4);flex:none}
.nav.col .tx,.nav.col .cnt,.nav.col .chev,.nav.col .nnew span{display:none}
.nav.col .nrow,.nav.col .nnew{justify-content:center;padding:9px 0}
.nav.col .nsub{display:none}
.navfoot{padding:8px;border-top:1px solid var(--line);flex:none}
.collapseb{width:100%;display:flex;align-items:center;justify-content:center;padding:7px;
  border-radius:7px;color:var(--ink4);font-size:13px}
.collapseb:hover{background:var(--panel2);color:var(--ink2)}

.cont{flex:1;min-width:0;display:flex;overflow:hidden}

/* ===== START ===== */
.start{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(180deg,#FBFBFE 0%,#F2F4FD 60%,#EFF1FC 100%)}
.start .in{width:100%;max-width:820px}
.start h1{font-size:32px;font-weight:700;letter-spacing:-.025em;text-align:center;margin-bottom:24px}
.qbox{background:#fff;border:1.5px solid var(--blue);border-radius:12px;padding:6px 6px 6px 18px;
  display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(47,92,224,.07)}
.qbox input{flex:1;border:none;outline:none;padding:12px 0;font-size:15px;background:none;color:var(--ink)}
.qbox input::placeholder{color:var(--ink4)}
.sendb{width:40px;height:40px;border-radius:9px;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.sendb:hover{background:var(--blue-d)}
.tip{margin-top:12px;background:#fff;border:1.5px solid var(--blue);border-radius:12px;
  padding:12px 16px;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--ink)}
.tip .x{color:var(--ink3);font-size:17px;padding:2px 5px;border-radius:6px;flex:none;margin-left:auto}
.tip .x:hover{background:var(--line2);color:var(--ink)}
.exam{margin-top:14px;text-align:center;font-size:13.5px;color:var(--ink3)}
.exam a{color:var(--blue);cursor:pointer;text-decoration:none}
.exam a:hover{text-decoration:underline}

/* ===== ONBOARD ===== */
.onb{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:60px;
  background:linear-gradient(180deg,#FBFBFE 0%,#F2F4FD 100%)}
.onb .in{max-width:640px;width:100%}
.onb h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-bottom:14px}
.onb .lead{font-size:14.5px;color:var(--ink2);line-height:1.6;margin-bottom:26px}
.onb .feat{display:flex;gap:14px;margin-bottom:20px}
.onb .fic{width:38px;height:38px;border-radius:9px;background:var(--blue-l);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.onb .ft{font-size:14.5px;font-weight:700;margin-bottom:3px}
.onb .fd{font-size:13px;color:var(--ink3);line-height:1.5}
.onb .go{margin-top:10px}

/* ===== CHAT ===== */
.chatcol{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);border-right:1px solid var(--line);
  transition:flex-basis .15s ease}
.chatcol.narrow{flex:0 1 340px}
.chatsc{flex:1;overflow-y:auto;padding:20px 24px 10px}
.chatin{padding:10px 24px 18px;flex:none}
.tabox{background:#fff;border:1.5px solid var(--blue);border-radius:12px;padding:11px 13px;
  display:flex;flex-direction:column;gap:8px;min-height:80px}
.tabox textarea{border:none;outline:none;resize:none;flex:1;font-size:14px;background:none;
  color:var(--ink);min-height:36px}
.tarow{display:flex;align-items:center;gap:8px}
.tarow .sp{flex:1}

.m{margin-bottom:16px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.m.me{display:flex;justify-content:flex-end}
.m.me .b{background:var(--bub);border-radius:12px;padding:10px 15px;font-size:13.5px;max-width:78%;line-height:1.5}
.m.bot .b{font-size:13.5px;line-height:1.6;max-width:92%}
.m.bot .b b{font-weight:600}
.typing{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:13px;margin-bottom:16px}
.tdots{display:flex;gap:3px}
.tdots i{width:6px;height:6px;border-radius:50%;background:var(--blue);opacity:.35;animation:bnc 1s infinite}
.tdots i:nth-child(2){animation-delay:.15s}
.tdots i:nth-child(3){animation-delay:.3s}
@keyframes bnc{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

.carw{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.carrow{display:flex;flex-wrap:wrap;gap:10px}
/* Низ карусели по скрину из Figma: стрелки листания вместе слева,
   «Продолжить» справа — раньше стрелки стояли по бокам от карточек,
   а кнопка «Продолжить» вообще пропадала, пока ничего не выбрано (вместо
   видимого disabled-состояния). */
.carfoot{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.carnavbtns{display:flex;gap:8px}
.carnb{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);
  color:var(--ink2);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.carnb:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-l)}
.carnb:disabled{opacity:.35;pointer-events:none}
.bcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;
  flex:1 1 170px;min-width:150px}
.bcard .bt{font-size:13px;font-weight:700;margin-bottom:9px}
.bcard .bl{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.cchip{border:1px solid var(--blue);border-radius:7px;padding:5px 9px;font-size:12px;
  color:var(--blue);background:#fff;position:relative;text-align:left;line-height:1.3}
.cchip:hover{background:var(--blue-l)}
.cchip.sel{background:var(--blue);color:#fff}
.sendb.muted{background:var(--panel2);color:var(--ink4);cursor:default}
.sendb.muted:hover{background:var(--panel2)}

.chiprow{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)}
.chiprow .lbl{font-size:11px;color:var(--ink4);width:100%;margin-bottom:1px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;
  font-size:12.5px;color:var(--ink2);font-weight:500}
.chip:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-l)}
.chip.muted{color:var(--ink4)}
/* «Назад» раньше был обычным чипом в общем ряду с вариантами ответа —
   визуально выглядел как ещё один вариант ответа, хотя по смыслу это
   навигация. Теперь стоит отдельной строкой НАД вариантами, со своим
   отступом и обводкой — не перепутать с ответом. */
.backrow{margin-top:6px}
.tipi{color:var(--ink4);cursor:help;font-size:12px}
.chip.back{border-color:var(--line);color:var(--ink3);font-weight:600;background:var(--panel2)}
.chip.back:hover{border-color:var(--ink2);color:var(--ink);background:var(--panel)}
.chip.prompt{border-style:dashed;color:var(--blue);background:var(--blue-l)}
.chip.prompt:hover{border-style:solid}

.ctac{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  display:flex;align-items:center;gap:12px;margin-top:10px;max-width:380px;cursor:pointer}
.ctac:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(47,92,224,.1)}
.ctac .ic{width:36px;height:36px;border-radius:9px;background:var(--blue-l);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.ctac .tx{flex:1;font-size:13.5px;font-weight:600;color:var(--blue)}
.ctac .cn{font-size:13.5px;color:var(--ink3);font-weight:600}

/* Применённые критерии над/под CTA — можно отменить конкретный (✕) или
   вернуться на шаг назад (← Назад), не открывая модалку «Критерии подбора». */
.critchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-width:420px}
.critchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:#fff;border-radius:99px;padding:5px 6px 5px 12px;font-size:12px;color:var(--ink2)}
.critx{border:none;background:var(--panel2);color:var(--ink3);width:17px;height:17px;border-radius:50%;
  font-size:11px;line-height:1;cursor:pointer;flex:none}
.critx:hover{background:var(--red);color:#fff}

.blist{margin-top:10px;padding-left:2px}
.blist li{font-size:13px;color:var(--ink2);margin-bottom:4px;list-style:none;padding-left:14px;position:relative}
.blist li::before{content:'•';position:absolute;left:2px;color:var(--ink4)}

.zerolink{color:var(--blue);text-decoration:none;font-weight:600;cursor:pointer}
.zerolink:hover{text-decoration:underline}
.infob{background:var(--blue-l);color:var(--ink2);border-radius:9px;padding:10px 13px;
  font-size:12.5px;line-height:1.5;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}

/* ===== RIGHT: Ход подбора ===== */
.rp{width:270px;flex:none;padding:14px 14px 14px 0;overflow-y:auto}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.pcard .t{font-size:13px;font-weight:700;margin-bottom:10px}
.prow2{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:8px}
.prow2 .l{color:var(--ink3)}
.prow2 .v{font-weight:700;color:var(--amber)}
.plist{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.pitem{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);padding:3px 0}
.pitem .nm{width:18px;height:18px;border-radius:5px;background:var(--blue-l);color:var(--blue);
  font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.pitem.ok .nm{background:var(--green-bg);color:var(--green)}
.pcta{margin-top:11px;width:100%;background:var(--blue);color:#fff;border-radius:9px;padding:9px;
  font-size:13px;font-weight:600;text-align:center}
.pcta:hover{background:var(--blue-d)}

/* ===== GRID ===== */
.gcol{width:620px;flex:1 1 620px;max-width:920px;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
.gh{padding:13px 15px 0;flex:none}
.gh1{display:flex;align-items:center;gap:9px}
.gh1 .x{width:24px;height:24px;border-radius:7px;color:var(--ink3);display:flex;
  align-items:center;justify-content:center;font-size:15px;flex:none}
.gh1 .x:hover{background:var(--line2);color:var(--ink)}
.gh1 .t{font-size:14.5px;font-weight:700;flex:1;letter-spacing:-.01em;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.gh1 .c{font-size:14.5px;color:var(--ink3);font-weight:600;flex:none}
.gh1 .kb{color:var(--ink4);font-size:15px;padding:2px 4px}
.gh2{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}
.gbtn{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);
  border-radius:99px;font-size:12.5px;color:var(--ink2);font-weight:500;background:#fff}
.gbtn:hover{border-color:var(--blue);color:var(--blue)}
.gbtn .bdg{background:var(--blue);color:#fff;font-size:10px;font-weight:700;
  padding:1px 6px;border-radius:99px;margin-left:1px}
.gsc{flex:1;overflow-y:auto;padding:10px 15px 60px;margin-top:8px}
.gpager{flex:none;display:flex;align-items:center;justify-content:center;gap:16px;
  padding:10px 15px;border-top:1px solid var(--line)}
.gpbtn{padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;
  font-size:12.5px;font-weight:600;color:var(--ink2)}
.gpbtn:hover{border-color:var(--blue);color:var(--blue)}
.gpbtn:disabled{opacity:.35;pointer-events:none}
.gpinfo{font-size:12px;color:var(--ink3);font-weight:500}
.prow{border-radius:10px;padding:10px 10px;cursor:pointer;display:flex;gap:10px;margin-bottom:2px;
  border:1px solid transparent}
.prow:hover{background:var(--panel2)}
.prow.on{background:var(--blue-l);border-color:var(--blue-l2)}
.cb{width:16px;height:16px;border:1.5px solid #C5CBDA;border-radius:5px;flex:none;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700;background:#fff}
.cb.on{background:var(--blue);border-color:var(--blue)}
.pin{flex:1;min-width:0}
.pr1{display:flex;gap:8px;align-items:flex-start}
.pr1 .nm{flex:1;font-size:12.5px;font-weight:600;line-height:1.4;letter-spacing:-.005em}
.pr1 .pz{font-size:12.5px;font-weight:600;white-space:nowrap;text-align:right}
.pr1 .pz.no{color:var(--ink3);font-weight:500;font-size:11.5px}
.pr2{display:flex;gap:6px;align-items:baseline;margin-top:3px;font-size:11px;color:var(--ink3);flex-wrap:wrap}
.pr3{display:flex;align-items:center;gap:6px;margin-top:4px}
.days{font-size:11px;color:var(--ink3);white-space:nowrap;font-weight:500}
.urg{color:var(--red);font-weight:600;font-size:11px}
.bulkbar{position:absolute;left:15px;right:15px;bottom:14px;background:var(--ink);color:#fff;
  border-radius:11px;padding:10px 14px;display:flex;align-items:center;gap:16px;
  box-shadow:0 8px 26px rgba(27,30,43,.25)}
.gcol{position:relative}
.bicon{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#fff;font-weight:500}
.bicon:hover{color:#8CB0FF}
.bicon.pri{font-weight:700}
.bulkbar .sp{flex:1}
.bcount{font-size:12px;color:#B9BFCC;font-weight:600}
.bx{color:#B9BFCC;font-size:16px}
.bx:hover{color:#fff}

/* ===== CARD ===== */
.ccol{width:420px;flex:none;background:#fff;display:flex;flex-direction:column;overflow:hidden;animation:slid .2s ease}
@keyframes slid{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.ch1{padding:13px 15px;display:flex;align-items:center;gap:8px;flex:none;flex-wrap:wrap}
.regn{border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:11.5px;color:var(--ink2);
  font-weight:500;display:flex;align-items:center;gap:5px}
.tagok{background:var(--green-bg);color:var(--green);font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px}
.ch1 .lot{font-size:12px;color:var(--ink3)}
.ch1 .sp{flex:1}
.csc{flex:1;overflow-y:auto;padding:0 16px 16px}
.ctit{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.35;margin-bottom:8px}
.ccust{font-size:13px;color:var(--blue);text-decoration:none;display:inline-block;margin-bottom:14px}
.ccust:hover{text-decoration:underline}
/* Аккуратнее, чем было: тонкая линия-разделитель между строками (а не
   голый список), значение справа обрезается многоточием, если слишком
   длинное (было — просто переносилось как попало и «плыло»), первая
   колонка не занимает больше половины ширины даже у длинных названий
   критериев. */
.ktab{width:100%;border-collapse:collapse;margin-bottom:12px}
.ktab tr{border-bottom:1px solid var(--line2)}
.ktab tr:last-child{border-bottom:none}
.ktab td{padding:8px 0;font-size:13px;vertical-align:baseline}
.ktab td:first-child{color:var(--ink3);padding-right:10px;max-width:55%}
.ktab td:last-child{text-align:right;font-weight:600;padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.morea{font-size:13px;color:var(--blue);cursor:pointer;display:inline-block;margin-bottom:14px}
.morea:hover{text-decoration:underline}
.docbox{background:var(--purple-bg);border-radius:12px;padding:13px 15px;margin-bottom:12px}

.spark{color:var(--purple);font-size:14px}
.docbox ul{padding-left:15px}
.docbox li{font-size:12.5px;color:var(--ink2);line-height:1.5;margin-bottom:4px}
.docbox a{color:var(--blue);text-decoration:none}
.docbox a:hover{text-decoration:underline}
.allcrit{font-size:12.5px;color:var(--blue);cursor:pointer;font-weight:500}
.allcrit:hover{text-decoration:underline}
.cfoot{padding:13px 15px;border-top:1px solid var(--line);display:flex;gap:8px;flex:none}
.bigb{flex:1;background:var(--blue);color:#fff;border-radius:10px;padding:11px;font-size:13.5px;
  font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.bigb:hover{background:var(--blue-d)}
.sqb{width:44px;border:1px solid var(--line);border-radius:10px;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;font-size:15px}
.sqb:hover{border-color:var(--blue);color:var(--blue)}

/* ===== FULL PAGES: Подборки / Шаблоны ===== */
.fpage{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--panel)}
.fph{padding:26px 32px 0;flex:none;display:flex;align-items:center;gap:16px}
.fph h1{font-size:26px;font-weight:700;letter-spacing:-.02em;flex:1}
.fbtn{display:flex;align-items:center;gap:8px;padding:9px 16px;background:var(--blue);color:#fff;
  border-radius:9px;font-size:13.5px;font-weight:600}
.fbtn:hover{background:var(--blue-d)}
.ftabs{display:flex;gap:22px;padding:18px 32px 0;border-bottom:1px solid var(--line);flex:none}
.ftab{padding-bottom:11px;font-size:13.5px;color:var(--ink3);font-weight:500;display:flex;gap:6px;
  border-bottom:2px solid transparent}
.ftab.on{color:var(--blue);border-color:var(--blue);font-weight:600}
.flist{flex:1;overflow-y:auto;padding:18px 32px}
.frow{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px 18px;margin-bottom:9px;
  display:flex;align-items:center;gap:13px;cursor:pointer}
.frow:hover{border-color:var(--blue)}
.frow.on{border-color:var(--blue);background:var(--blue-l)}
.frow .fi{width:36px;height:36px;border-radius:9px;background:var(--blue-l);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.frow .ftx{flex:1;min-width:0}
.frow .fn{font-size:14.5px;font-weight:600}
.frow .fmeta{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink4);margin-top:2px}
.frow .fdate{font-size:12.5px;color:var(--ink3);white-space:nowrap}
.fkb{color:var(--ink4);font-size:16px;padding:2px 4px;border-radius:6px;flex:none}
.fkb:hover{background:var(--line2);color:var(--ink)}

/* ===== side detail panel for folders/templates ===== */
.dcol{width:460px;flex:none;background:#fff;border-left:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;animation:slid .2s ease}
.dh{padding:16px 18px;display:flex;align-items:center;gap:10px;flex:none;border-bottom:1px solid var(--line)}
.dh .t{font-size:16px;font-weight:700;flex:1;letter-spacing:-.01em}
.dh .x{width:26px;height:26px;border-radius:7px;color:var(--ink3);display:flex;align-items:center;justify-content:center;font-size:16px}
.dh .x:hover{background:var(--line2);color:var(--ink)}
.dsc{flex:1;overflow-y:auto;padding:18px}
.frule{display:flex;padding:11px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.frule .fl{width:150px;color:var(--ink3);flex:none}
.frule .fo{width:80px;color:var(--ink4);flex:none}
.frule .fv{font-weight:600;color:var(--ink)}
.dactions{display:flex;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}
.dact{font-size:13px;color:var(--blue);font-weight:500;display:flex;align-items:center;gap:6px}
.dact:hover{text-decoration:underline}
.dact.pri{background:var(--blue-l);color:var(--blue);padding:9px 15px;border-radius:9px}
.dact.pri:hover{text-decoration:none;background:var(--blue-l2)}
.dact.danger{color:var(--red);margin-left:auto}

.efield{margin-bottom:14px}
.esearch{border:1px solid var(--line);border-radius:9px;padding:10px 13px;font-size:13px;color:var(--ink2);
  background:var(--panel2);display:flex;align-items:center;gap:8px;margin-bottom:16px}
.econd{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.econd .en{font-size:12.5px;color:var(--ink4);width:16px;flex:none}
.esel{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px;
  color:var(--ink2);display:flex;align-items:center;justify-content:space-between;background:#fff}
.esel.op{flex:0 0 90px}
.eadd{display:flex;align-items:center;gap:7px;color:var(--blue);font-size:13px;font-weight:500;margin:6px 0 20px}
.eadd:hover{text-decoration:underline}
.esave{background:var(--blue);color:#fff;padding:9px 18px;border-radius:9px;font-size:13.5px;font-weight:600}
.esave:hover{background:var(--blue-d)}
.ecancel{color:var(--ink3);font-size:13.5px;margin-left:12px}
.ecancel:hover{color:var(--ink)}

.req{display:none;font-size:9px;font-weight:700;color:var(--purple);background:var(--purple-bg);
  padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:1px}
body.reqs .req{display:inline-block}

/* ===== rail: progress + criteria link ===== */
:root{--rust:#9A3412;--rust-bg:#FBE4DA}
.pbar{height:6px;border-radius:99px;background:var(--rust-bg);overflow:hidden;margin-top:9px}
.pbar i{display:block;height:100%;border-radius:99px;transition:width .3s ease}
.pcrit{margin-top:13px;font-size:12.5px;color:var(--blue);font-weight:600;cursor:pointer;display:inline-block}
.pcrit:hover{text-decoration:underline}

/* ===== shared dropdown component (stable open/close) ===== */
.esel{position:relative}
.ddwrap{position:relative;display:inline-flex}
.ddtrig{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;
  font-size:12.5px;color:var(--ink2);gap:6px}
.ddmenu{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line);
  border-radius:9px;box-shadow:0 10px 28px rgba(27,30,43,.16);z-index:20;max-height:230px;overflow-y:auto;
  padding:4px;min-width:170px}
.ddmenu.up{top:auto;bottom:calc(100% + 4px)}
.ddopt{padding:7px 9px;font-size:12.5px;color:var(--ink2);border-radius:6px;white-space:nowrap}
.ddopt:hover{background:var(--blue-l);color:var(--blue)}
.ddopt.on{color:var(--blue);font-weight:600}
/* Выбор ПОЛЯ критерия — тот же .ddmenu, но со своим поиском сверху и
   группами по блокам (просьба заказчика, 18.08.2026): раньше это был
   сплошной нечитаемый список из ~35 названий. Список групп прокручивается
   отдельно от поля поиска, которое остаётся закреплено сверху. */
.fddmenu{padding:6px;min-width:250px;max-height:none;overflow:visible;display:flex;flex-direction:column;gap:6px}
.fddsearch{border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:12.5px;color:var(--ink);width:100%}
.fddsearch:focus{outline:2px solid var(--blue);outline-offset:1px}
.fddlist{max-height:260px;overflow-y:auto;padding-right:2px}
.fddgrp{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink4);
  padding:7px 9px 3px;margin-top:4px}
.fddgrp:first-child{margin-top:0}
.fddopt{white-space:normal}

/* ===== criteria modal ===== */
.modalbg{position:fixed;inset:0;background:rgba(27,30,43,.42);z-index:200;display:flex;
  align-items:center;justify-content:center;padding:24px}
/* ---------- спотлайт-тур по интерфейсу ----------
   Затемнение — НЕ один полноэкранный div с "дыркой" через clip-path (это
   ломается, если подсвечиваемый элемент лежит внутри overflow:hidden/auto
   родителя — .carw, например, живёт внутри прокручиваемой .chatsc). Вместо
   этого — 4 отдельных тёмных прямоугольника вокруг getBoundingClientRect()
   цели: работает всегда, независимо от вложенности и overflow. */
.tourlay{position:fixed;inset:0;z-index:1400;pointer-events:none}
.tourdim{position:fixed;background:rgba(15,17,26,.55);pointer-events:auto;transition:all .2s ease}
.tourring{position:fixed;border:2px solid var(--blue);border-radius:10px;
  box-shadow:0 0 0 4px rgba(47,92,224,.22);pointer-events:none;transition:all .2s ease}
/* Раньше сама подсвеченная область оставалась «дыркой» и в буквальном
   смысле кликабельной — можно было случайно взаимодействовать с реальным
   интерфейсом прямо во время тура (просьба заказчика, «заблокируй всё во
   время динамического онбординга»). Прозрачный блокирующий слой поверх
   ТОЙ ЖЕ области, что и .tourring, — сама подсветка видна как раньше
   (фон не меняем), но клик по ней теперь не доходит до настоящего
   элемента снизу, а просто листает тур дальше — так же, как клик по
   затемнению вокруг. */
.tourhole{position:fixed;background:transparent;pointer-events:auto;cursor:pointer}
.tourbub{position:fixed;background:#fff;border-radius:12px;padding:14px 16px;
  box-shadow:0 12px 32px rgba(27,30,43,.3);pointer-events:auto;z-index:1401}
.tourhead{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-weight:700;font-size:13.5px;margin-bottom:6px}
.tourdots{display:flex;gap:4px;flex:none}
.tourdots i{width:5px;height:5px;border-radius:50%;background:var(--line);display:block}
.tourdots i.on{background:var(--blue);width:14px;border-radius:3px}
.tourtext{font-size:12.5px;color:var(--ink2);line-height:1.5;margin-bottom:12px}
.tourfoot{display:flex;justify-content:flex-end;gap:8px}
.modalcard{background:#fff;border-radius:16px;width:100%;max-width:740px;max-height:86vh;
  overflow-y:auto;box-shadow:0 20px 60px rgba(27,30,43,.3);padding:20px 22px}
.mhead{display:flex;align-items:center;margin-bottom:14px}
.mtitle{font-size:17px;font-weight:700;flex:1;letter-spacing:-.01em}
.mx{font-size:18px;color:var(--ink3);width:28px;height:28px;border-radius:8px;display:flex;
  align-items:center;justify-content:center;flex:none}
.mx:hover{background:var(--line2);color:var(--ink)}
.mrow0{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:11px 14px;margin-bottom:14px;font-size:13px;color:var(--ink2)}
.mrow0 .mquery{flex:1}
.mrow0 .mcount{font-weight:700}
.crow{display:flex;align-items:center;gap:7px;padding:6px 4px;border-radius:9px;margin-bottom:7px}
.crow.warn{background:#FFF8EC}
.cidx{width:15px;color:var(--ink4);font-size:12.5px;flex:none}
.cdelta{color:var(--ink4);font-size:12px;width:58px;text-align:right;flex:none}
.ctotal{font-weight:700;font-size:13px;width:54px;text-align:right;flex:none}
.cwarn{color:var(--amber);flex:none;font-size:14px}
.ctrash{color:var(--ink4);font-size:14px;width:27px;height:27px;border-radius:7px;display:flex;
  align-items:center;justify-content:center;flex:none}
.ctrash:hover{background:var(--red-bg);color:var(--red)}
.mfoot{display:flex;align-items:center;margin-top:16px;gap:14px}
.sp2{flex:1}
.eval{font-size:12.5px;color:var(--ink2)}

/* ===== модалка «Сохранить процедуры» ===== */
.sffield{border:1.5px solid var(--line);border-radius:10px;padding:10px 13px;margin-bottom:14px;transition:border-color .15s}
.sffield.on{border-color:var(--blue)}
.sflabel{font-size:11.5px;color:var(--ink3);margin-bottom:4px}
.sfrow{display:flex;align-items:center;gap:8px}
.sfrow input{border:none;outline:none;flex:1;font-size:13.5px;color:var(--ink);background:none}

  display:flex;align-items:center;justify-content:center}

.sflist{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto}

  border:1.5px solid var(--line);cursor:pointer}

.sfitem.on{border-color:var(--blue);background:var(--blue-l)}
.sfi{font-size:16px;flex:none}
.sftx{flex:1;font-size:13.5px;font-weight:600;color:var(--ink)}
.sfcnt{font-size:12px;color:var(--ink3);flex:none}

.sfbtn{flex:1;padding:11px;border-radius:9px;font-size:13.5px;font-weight:600;
  border:1px solid var(--line);color:var(--ink2)}

.sfbtn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.sfbtn.pri:hover{background:var(--blue-d)}

/* ===== LANDING: открытая часть Росэлторг (точка входа до онбординга) ===== */
.land{height:100vh;overflow-y:auto;background:radial-gradient(circle at 78% 8%,rgba(255,255,255,.06),transparent 45%),
  linear-gradient(165deg,#0B1440 0%,#132873 46%,#0E1C58 100%);color:#fff}
.ltop{display:flex;align-items:center;gap:26px;padding:16px 34px;border-bottom:1px solid rgba(255,255,255,.08)}

  justify-content:center;font-size:13px}

.licons{display:flex;align-items:center;gap:6px;flex:none}

.lhero{padding:56px 24px 40px;text-align:center;max-width:900px;margin:0 auto}

.ltoggle .lsw{width:38px;height:22px;border-radius:99px;background:var(--blue);position:relative;flex:none}
.ltoggle .lsw i{position:absolute;top:2px;left:18px;width:18px;height:18px;border-radius:50%;background:#fff}
.lhero h1{font-size:38px;font-weight:700;letter-spacing:-.02em;margin-bottom:26px}
.ltabs{display:inline-flex;background:rgba(255,255,255,.08);border-radius:10px;padding:4px;gap:2px;margin-bottom:22px}
.ltabs button{padding:9px 20px;border-radius:8px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,.75)}
.ltabs button.on{background:#fff;color:var(--ink)}
.lbanner{background:linear-gradient(90deg,#3653D4,#6B4FE0);border-radius:13px;padding:15px 16px 15px 20px;
  display:flex;align-items:center;gap:16px;max-width:640px;margin:0 auto;cursor:pointer;

.lbanner .lbtxt span{display:block;font-size:12.5px;color:rgba(255,255,255,.85);margin-top:3px}
.lbtn{background:#fff;color:var(--ink);font-weight:600;font-size:13px;padding:9px 18px;border-radius:8px;flex:none}
.lbtn:hover{background:#EDF0FA}
.lstd{margin-top:14px;font-size:12.5px;color:rgba(255,255,255,.55)}
.lcards{display:flex;gap:14px;padding:0 24px 40px;max-width:1120px;margin:0 auto;overflow-x:auto}
.lcard{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;

/* ===== РЕЖИМ «КЛАССИЧЕСКИЕ ФИЛЬТРЫ» (добавлено 07.09.2026) =====
   Второй способ ввода тех же самых критериев: не диалогом, а привычной
   панелью. Никакой своей логики фильтрации — те же FIELD_DEFS/BLOCKS и те
   же REAL_FILTER_PRED через S.filters + recomputeWorkingSet(), что и в чате.
   Режимы переключаются в любой момент и делят одно состояние критериев. */
.navmode{padding:2px 2px 10px;border-bottom:1px solid var(--line2);margin-bottom:8px}
.navmode .modesw{display:flex;width:100%}
.navmode .modesw button{flex:1;padding:6px 6px}
.nav.col .navmode{display:none}
.modesw{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.modesw button{border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink3);background:transparent;border:none;cursor:pointer}
.modesw button:hover{color:var(--ink)}
.modesw button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(31,53,120,.10)}
.fpcol{width:312px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.fph{padding:12px 14px 10px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fph .t{font-weight:700;font-size:14px;flex:1}
.fph .rs{font-size:12px;color:var(--ink3);cursor:pointer;background:none;border:none}
.fph .rs:hover{color:var(--red)}
.fpq{padding:10px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.fpq input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13px;font-family:inherit}
.fpq input:focus{outline:none;border-color:var(--blue)}
.fpsc{flex:1;overflow-y:auto;padding:4px 0 30px}
.fpb{border-bottom:1px solid var(--line2)}
.fpbt{display:flex;align-items:center;gap:8px;padding:11px 14px;width:100%;text-align:left;font-weight:600;font-size:13px;background:none;border:none;cursor:pointer;font-family:inherit;color:var(--ink)}
.fpbt:hover{background:var(--panel2)}
.fpbt .cv{margin-left:auto;font-size:10px;color:var(--ink4)}
.fpbt .bd{font-size:11px;font-weight:700;background:var(--blue);color:#fff;padding:0 6px;border-radius:99px;line-height:16px}
.fpbody{padding:0 14px 12px;display:none}
.fpbody.on{display:block}
.fpf{padding:8px 0 6px}
.fpf+.fpf{border-top:1px dashed var(--line2)}
.fpl{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-bottom:6px}
.fpl b{font-weight:600}
.fpl .clr{margin-left:auto;font-size:11.5px;color:var(--ink4);background:none;border:none;cursor:pointer;font-family:inherit}
.fpl .clr:hover{color:var(--red)}
.fpo{display:flex;flex-wrap:wrap;gap:6px}
.fpo button{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12.5px;background:var(--panel);color:var(--ink2);cursor:pointer;font-family:inherit}

const MONTHS_RU=['янв.','февр.','мар.','апр.','мая','июн.','июл.','авг.','сен.','окт.','нояб.','дек.'];
function fakeDate(daysFromNow){
  const base=new Date(2026,7,10);
  const d=new Date(base.getTime()+daysFromNow*86400000);
  return String(d.getDate()).padStart(2,'0')+' '+MONTHS_RU[d.getMonth()]+' '+d.getFullYear()+' в 09:00 мск';

/* По интервью с пользователями (18.08.2026) — в реальности они часто ищут
   закупки на миллионы, а не только на сотни тысяч, как было раньше (базовый
   диапазон на запрос — 60 000–950 000, самая дорогая фиксированная категория
   — максимум 3.1 млн). Обычное равномерное распределение внутри одного
   диапазона это никогда не даст — сверху всегда будет то же самое макс.
   значение диапазона. Добавляем ~28% шанс попасть в отдельный «крупный»
   ценовой сегмент (от полутора базовых максимумов и минимум 2 млн — до
   45 млн), независимо от базового диапазона категории/запроса. */
function genPrice(rnd, baseMin, baseMax){
  if(rnd()<0.28){
    const bigMin = Math.max(baseMax*1.5, 2000000);
    const bigMax = Math.max(bigMin*3, 45000000);
    return Math.round((bigMin+rnd()*(bigMax-bigMin))/100)*100+0.99;
  }
  return Math.round((baseMin+rnd()*(baseMax-baseMin))/100)*100+0.99;
}
function mulberry32(seed){
  return function(){
    seed|=0; seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}

/* ---------- движок релевантности: запрос → ранжированный список процедур ----------
   Без обращения к внешним ИИ-сервисам (см. обсуждение) — детерминированные
   правила на JS: совпадение ключевых слов запроса с названием лота и тегами
   категории, плюс реальная фильтрация по месту/цене/типу торгов/ИНН при
   ответах на вопросы диалога (см. REAL_FILTER_PRED и addFilter). */
const STOPWORDS=new Set(['для','или','под','что','как','это','также','либо','нужно','надо','хочу','нам','вам',
 'поставка','поставки','поставку','услуга','услуги','услугу','оказание','выполнение','работы','работ','нужны','нужен']);
/* «ё» в свободном тексте пишут не всегда (а часто и не пишут вовсе — обычная
   практика для русского языка), а в захардкоженных названиях/значениях
   полей она то есть, то нет («Приемка» без ё в значении, «приёмки» с ё —
   как типично печатает человек). Без нормализации это два РАЗНЫХ слова для
   stemMatch (сравнение по первым символам, ё≠е как разные символы) — реальный
   баг, 18.08.2026: «оплата после приёмки товара» не находило поле «Событие
   для оплаты» (значение «Приемка») именно из-за этого. Нормализуем ё→е
   везде, где текст готовится к сравнению (tokenize/rawWords/labelWordsRaw). */
function normRu(s){ return String(s||'').toLowerCase().replace(/ё/g,'е'); }

     случайно совпадают внутри произвольного длинного слова (например «бла»
     внутри «областная») — это была реальная причина мусорных совпадений. */
  return normRu(s).replace(/[^a-zа-я0-9\s]/gi,' ').split(/\s+/)
    .filter(w=>w.length>3 && !STOPWORDS.has(w));
}
function stemMatch(a,b){
  const n=Math.min(5,a.length,b.length);
  return n>=4 && a.slice(0,n)===b.slice(0,n);
}
function matchScore(p, toks){
  /* заказчик специально не участвует в сопоставлении — имена заказчиков
     в демо-наборе случайны и только вносили шум, не сигнал релевантности.
     Сравнение — по «стеблю» слова (первые буквы), чтобы «компьютеры»
     находило тег «компьютер», «ноутбуки» — тег «ноутбук» и т.п. */
  const hayToks = tokenize(p.n+' '+(p.tags||[]).join(' '));
  let s=0;
  toks.forEach(t=>{ if(hayToks.some(h=>stemMatch(h,t))) s++; });
  return s;
}

   если запрос не совпадал ни с одним тегом, rankMatches() откатывался к
   показу всей базы целиком, без всякой связи с текстом запроса (это и была

   заказчиком). По прямой просьбе (10.08.2026, «пользователь должен мочь

   генерируется собственный набор процедур, названия которых реально
   содержат текст запроса в нескольких формулировках — не только у старых

   касается только текста названия под конкретный запрос, а не логики

  return [

    `Поставка ${low} по договору поставки`,
    `Организация поставки: ${low}`,
    `${capFirst(q)} — открытая процедура закупки`,
    `Проведение закупки: ${low}`,
    `Поставка ${low} для собственных нужд заказчика`,
    `Закупка по потребности: ${low}`,
    `${capFirst(q)} — запрос предложений`,
    `Поставка ${low} в рамках исполнения контракта`,
    `Приобретение ${low} для нужд предприятия`,

/* Строковое представление диапазона, которое мы сами кладём в фильтр как
   value: "min-max" (см. parseNumberRange/applyFreeAnswer/freeCriterionFromChat) —
   разбираем обратно, чтобы numMatches мог честно проверить ОБЕ границы, а не
   одну «примерно» (см. комментарий у parseNumberRange — реальный баг
   13.08.2026: «от 3 до 15 млн» распознавалось как «≈примерно 3 000 000»). */
function parseRangeStr(v){
  const m = String(v).trim().match(/^(-?\d+)\s*-\s*(-?\d+)$/);
  if(!m) return null;
  return {min:parseInt(m[1],10), max:parseInt(m[2],10)};

/* Достаём из текста ОДНО целое число, честно отбрасывая копейки/дробную
   часть в конце (", 99" или ".99") ПЕРЕД тем, как убирать остальные
   нецифровые символы. Раньше запятая просто выбрасывалась вместе с пробелами
   и валютой одним regex — «80 900,99 ₽» превращалось в «8090099», то есть
   значение раздувалось в ~100 раз и предикат «Равен»/±40% никогда не
   срабатывал даже на том самом числе, что показано на карточке (реальный
   баг 13.08.2026: self-consistency-тест — предикат «НМЦ лота» проваливался
   на 100% настоящих карточек). */

  let s = String(val).trim();

   например, «меньше 700000», набранное свободным текстом, не опознавалось
   никак (ни «до», ни «от», ни «бол» не встречались в слове «меньше») и
   попадало в дефолтную ветку «около ±40%» — то есть реально не фильтровало. */
function numMatches(actual, val, op){
  if(actual==null) return false;
  const range = parseRangeStr(val);
  if(range) return actual>=range.min && actual<=range.max;
  const num=parseAmount(val);
  if(!num) return true;
  const v = String(val).toLowerCase();
  const lessHint = op==='Меньше' || v.includes('до') || v.includes('мень') || v.includes('не более');
  const moreHint = op==='Больше' || v.includes('от ') || v.includes('бол') || v.includes('не менее');
  if(lessHint) return actual<=num;
  if(moreHint) return actual>=num;
  /* «Равен» (и «Диапазон» без второй границы, т.е. по факту одно число) —
     раньше здесь было ±40% «около», хотя пользователь просил ТОЧНОЕ
     значение и видел в чате подтверждение «равен» — то есть сам текст
     обещал точность, а предикат её не соблюдал (просьба заказчика,
     18.08.2026: «должно быть чётко всё, как пользователь просит»).
     Math.floor(actual) — деньги (p.nmck) всегда хранятся с копейками
     (…,99), parseAmount() их отбрасывает; сравниваем в тех же целых
     рублях, что и введённое число, а не приблизительно. */
  return Math.floor(actual)===num;
}
function priceMatches(nmck, val, op){ return numMatches(nmck, val, op); }
/* Общий предикат для полей да/нет: actual может быть boolean (true/false),
   уже строкой 'да'/'нет' или null/undefined (поле не заполнено — считаем
   это «нет», ровно как в PROC_FIELD_DISPLAY: `p.поле ? 'Да' : 'Нет'`
   показывает «Нет» и для null тоже). Раньше null обрывал сравнение через
   отдельный ранний `return false` ДО учёта wantYes/wantNo — то есть ответ
   «Нет» никогда не совпадал с процедурой, где поле было not-applicable/null,
   хотя на карточке эта же процедура честно показывала «Нет» (реальный баг
   13.08.2026, см. self-consistency-тест — «Ограничения по банку»). */
function boolMatch(actual, val){
  const wantYes = /^да$/i.test(String(val).trim());
  const wantNo = /^нет$/i.test(String(val).trim());
  const bool = typeof actual==='boolean' ? actual : /^да$/i.test(String(actual==null?'':actual).trim());
  if(wantYes) return bool;
  if(wantNo) return !bool;
  return true;
}
/* Равенство строкового enum-поля без учёта регистра (payment_type, delivery_mode и т.п.) */
function eqMatch(actual, val){
  return actual!=null && String(actual).toLowerCase()===String(val).toLowerCase();
}
/* Название организации без кавычек любого вида (типографские «…», обычные
   "…"/'…') и с одним пробелом — см. REAL_FILTER_PRED['Заказчик']. */
function normOrgName(s){
  return String(s||'').toLowerCase().replace(/[«»"'']/g,'').replace(/\s+/g,' ').trim();
}
/* ОКПД2 — реальный код классификатора на процедуре (p.okpd2), а не
   tokenize()-сравнение по тегам названия. Раньше «Категория ОКПД 2»
   фильтровалась через matchScore(p, tokenize(val)) — то есть сравнивала
   слова из введённого текста со словами в названии/тегах лота. Код вида
   «70.33.93.273» через tokenize() (только буквенно-цифровые токены длиной
   >3) превращается в отдельные обрубки «70», «33», «93», «273» — каждый
   короче 4 символов и отбрасывается фильтром длины, то есть toks всегда
   пуст и совпадений не бывает НИКОГДА, даже если введённый код в точности
   совпадает с тем, что показано на карточке (реальный баг 13.08.2026).
   Сравниваем сам код: точное совпадение или совпадение по началу (ввод
   более короткого/более общего кода вида «70.33» тоже должен находить
   полный «70.33.93.273»). */
function okpd2Norm(s){ return String(s||'').replace(/[^\d.]/g,''); }
function okpd2Match(actual, val){
  const a = okpd2Norm(actual), v = okpd2Norm(val);
  if(!a || !v) return false;
  return a===v || a.startsWith(v) || v.startsWith(a);
}
/* «Дата публикации торгов» / «Дата начала приёма заявок» — оба поля хранят
   «сколько дней назад» (p.pubDays/p.appStartDays), чипы и типичный свободный
   текст формулируются как «за последние N дней» → берём N из текста и
   сравниваем с реальным давностью. 'До' читается как «опубликовано не
   позже, чем N дней назад» (то есть СТАРШЕ точки отсчёта — daysAgo>=d),
   'После'/по умолчанию — «не раньше N дней назад» (СВЕЖЕЕ — daysAgo<=d),
   что соответствует формулировке чипов «За последние N дней». */
function agoMatch(daysAgo, val, op){
  const d = parseInt(String(val).match(/\d+/)?.[0]||'0', 10);
  if(!d) return true;
  if(op==='До') return daysAgo>=d;
  return daysAgo<=d;
}

/* Детерминированный (без LLM) разбор ДВУХ чисел с общей единицей измерения
   («от 3 до 15 млн», «с 30 по 60 дней», «700000-950000») — реальный случай
   13.08.2026: ввод «нмц от 3 до 15 млн» уходил в LLM, схема classify_answer
   умеет вернуть только ОДНО число, модель вернула 3 000 000 с оператором
   «Диапазон», а «Диапазон» без второй границы отображается как «≈примерно» —
   то есть вторая граница диапазона(«до 15 млн») терялась полностью и молча.
   Детерминированный путь пробуем ДО обращения к LLM для полей, где ops
   вообще допускает 'Диапазон' — то же архитектурное решение, что и у
   isMetaIntentOnly() (см. выше): там, где можно проверить надёжно в JS, не
   полагаемся на дисциплину модели.
   Единица измерения («млн»/«тыс») в русской речи обычно называется один раз,
   в конце («от 3 до 15 млн» — оба числа в миллионах) — если у второго числа
   есть суффикс, а у первого нет, применяем тот же множитель к обоим. */
function extractNumsWithUnit(text){
  const re=/(\d[\d\s]*(?:[.,]\d+)?)\s*(миллион\w*|млн\.?|тысяч\w*|тыс\.?)?/gi;
  const out=[]; let m;
  while((m=re.exec(text))){
    const digits=m[1].replace(/\s+/g,'');
    const val=parseFloat(digits.replace(',', '.'));
    if(isNaN(val)) continue;
    out.push({val, unit:(m[2]||'').toLowerCase(), index:m.index, len:m[0].length});
  }
  return out;
}
function unitMult(unit){
  if(unit.startsWith('млн')||unit.startsWith('миллион')) return 1e6;
  if(unit.startsWith('тыс')) return 1e3;
  return 1;
}
function parseNumberRange(text){
  const t=String(text||'').toLowerCase();
  const nums=extractNumsWithUnit(t);
  if(nums.length<2) return null;
  const [a,b]=nums;
  const between=t.slice(a.index+a.len, b.index);
  if(!/до|по|-|–|—/.test(between)) return null;
  const unit=a.unit||b.unit;
  const mult=unitMult(unit);
  const min=Math.round(Math.min(a.val,b.val)*mult);
  const max=Math.round(Math.max(a.val,b.val)*mult);
  if(!min && !max) return null;
  if(min===max) return null;
  return {min, max};
}
/* Категории обработки поля: 'enum' — выбрать одно из FIELD_DEFS[name].values,
   'numeric' — извлечь число под один из допустимых операторов, 'text' — поле
   и так свободный текст (заказчик/ИНН/ОКПД2/КСР) — там LLM не нужна, там уже
   работает содержательный substring-поиск по REAL_FILTER_PRED, а список
   допустимых значений в принципе не задан. */
function llmFieldKind(f){
  if(Array.isArray(f.values)) return 'enum';
  const numericOps=['Меньше','Больше','Диапазон','До','После'];
  if(f.ops.some(o=>numericOps.includes(o))) return 'numeric';
  return 'text';
}
/* ВАЖНО (реальный случай, 13.08.2026): на фразу «хочу уточнить график
   поставки» — где нет вообще никакой информации о значении, только
   намерение обсудить критерий — модель тем не менее вернула конкретное
   значение вместо recognized:false. Явный отдельный пункт про это ниже —
   раньше подразумевалось общей формулировкой «если не описывает вариант»,
   но, как показала практика, этого недостаточно: модель должна явно
   понимать, что «упоминание темы критерия» ≠ «указание значения». Это
   вторая линия защиты — первая (детерминированная, без обращения к LLM)
   в isMetaIntentOnly()/freeCriterionFromChat(). */
function buildLlmSystemPrompt(name, f){
  const hints = LLM_FIELD_HINTS[name];
  const antiGuess = 'Если пользователь просто называет тему/критерий или выражает намерение его обсудить/уточнить («хочу уточнить …», «расскажите про …», «что по …») — но НЕ указывает конкретное значение — это НЕ является ответом ни на один вариант. В этом случае recognized:false, даже если тема явно относится к вопросу. Никогда не выбирай правдоподобное значение только потому, что критерий упомянут — подставлять предположение вместо честного «не распознано» строго запрещено.';
  if(Array.isArray(f.values)){
    const lines = f.values.map(v=>{
      const h = hints && hints.values && hints.values[v];
      return `- "${v}"${h?' — '+h:''}`;
    }).join('\n');
    return ['Ты — модуль распознавания ответов в чате закупочной системы «Умный поиск».',
      'Пользователю задан вопрос анкеты, он ответил свободным текстом. Определи, какому из допустимых вариантов соответствует его сообщение.',
      `Вопрос: ${f.q}`,
      'Допустимые варианты:',
      lines,
      antiGuess,
      'Вызови функцию classify_answer: recognized=true и value из списка выше — только если сообщение однозначно называет конкретное значение.'
    ].join('\n');
  }
  const note = LLM_NUMERIC_NOTES[name] || '';
  return ['Ты — модуль распознавания ответов в чате закупочной системы «Умный поиск».',
    'Пользователю задан вопрос анкеты про числовой параметр, он ответил свободным текстом. Извлеки число и оператор сравнения.',
    `Вопрос: ${f.q}`,
    note ? `Пояснение: ${note}` : '',
    `Допустимые операторы: ${f.ops.join(', ')}.`,
    antiGuess,
    'Вызови функцию classify_answer: recognized=true и value с числом — только если в тексте реально есть распознаваемое число.'
  ].filter(Boolean).join('\n');
}
function extractJsonBlock(s){
  if(!s) return null;
  const m = s.match(/\{[\s\S]*\}/);
  if(!m) return null;
  try{ return JSON.parse(m[0]); }catch(e){ return null; }
}
function validateLlmResult(parsed, f){
  if(!parsed || typeof parsed!=='object') return {ok:true, value:null};
  /* recognized===false — модель сама сигнализирует «ничего из списка не
     подходит», а не подставляет первое/единственное допустимое значение
     просто потому, что схема требует его вернуть (см. buildLlmTool). */
  if(parsed.recognized===false) return {ok:true, value:null, confidence:parsed.confidence};
  if(Array.isArray(f.values)){
    if(parsed.value==null) return {ok:true, value:null};
    const hit = f.values.find(v=>v.toLowerCase()===String(parsed.value).trim().toLowerCase());
    return {ok:true, value: hit || null, confidence: parsed.confidence};
  }
  if(parsed.value===null || parsed.value===undefined || parsed.value==='') return {ok:true, value:null};
  const op = f.ops.includes(parsed.op) ? parsed.op : f.ops[0];
  return {ok:true, value:String(parsed.value), op, confidence:parsed.confidence};
}
/* Схема function calling для конкретного поля. Раньше просили модель просто
   «ответь JSON-ом» текстом — эта модель (metamentor/qwen через прокси)
   систематически съезжала на генерацию делового письма вместо классификации,
   независимо от формулировки промпта (проверено вживую несколькими заходами:
   с рассуждениями, без них, с response_format:json_object — везде мимо
   задачи). Форсированный вызов функции с enum-схемой параметров идёт по
   отдельному пути в модели/раздатчике и на практике даёт верную
   классификацию (проверено на реальных ответах прокси).
   ВАЖНО: у enum-параметра schema.value всегда должен быть валидный вариант —
   если допустимых значений мало (в пределе одно, как было у «Региона
   заказчика»), форсированный tool_choice буквально не оставляет модели
   другого выхода, кроме как вернуть этот единственный вариант, даже если он
   не подходит («Москва» → «Ярославская обл.»). Поэтому добавлено отдельное
   булево поле recognized — модель обязана явно сказать «не подходит ни один
   вариант», а не подгонять ответ под то, что есть в схеме. */
function buildLlmTool(name, f){
  if(Array.isArray(f.values)){
    return {type:'function', function:{
      name:'classify_answer',
      description:`Классифицирует ответ пользователя на вопрос «${f.q}» в одно из допустимых значений критерия «${name}». Если ответ не соответствует НИ ОДНОМУ варианту — recognized:false, значение value не важно.`,
      parameters:{
        type:'object',
        properties:{
          recognized:{type:'boolean', description:'true — ответ однозначно соответствует одному из допустимых вариантов; false — не соответствует ни одному.'},
          value:{type:'string', enum:f.values, description:'Одно из допустимых значений, дословно (учитывается только при recognized=true).'},
          confidence:{type:'number', description:'Уверенность классификации от 0 до 1.'}
        },
        required:['recognized','value','confidence']
      }
    }};
  }
  return {type:'function', function:{
    name:'classify_answer',
    description:`Извлекает числовое значение и оператор сравнения из ответа пользователя на вопрос «${f.q}» (критерий «${name}»). Если в тексте нет распознаваемого числа — recognized:false.`,
    parameters:{
      type:'object',
      properties:{
        recognized:{type:'boolean', description:'true — в тексте есть распознаваемое число; false — числа нет.'},
        value:{type:'number', description:'Извлечённое число (учитывается только при recognized=true).'},
        op:{type:'string', enum:f.ops, description:'Оператор сравнения.'},
        confidence:{type:'number', description:'Уверенность от 0 до 1.'}
      },
      required:['recognized','value','op','confidence']
    }
  }};
}
async function llmExtract(text, name, f){
  if(!LLM_CFG.apiKey) return {ok:false, reason:'API-ключ не настроен'};
  const sys = buildLlmSystemPrompt(name, f) + '\nОбязательно используй функцию classify_answer для ответа — не отвечай обычным текстом.';
  const tool = buildLlmTool(name, f);
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), LLM_CFG.timeoutMs);
  try{
    const res = await fetch(LLM_CFG.baseUrl.replace(/\/+$/,'')+'/v1/chat/completions', {
      method:'POST',
      headers:{'Authorization':'Bearer '+LLM_CFG.apiKey, 'Content-Type':'application/json'},
      signal: controller.signal,
      body: JSON.stringify({
        model: LLM_CFG.model, temperature:0, max_tokens:250,
        chat_template_kwargs:{enable_thinking:false},
        tools:[tool], tool_choice:'auto',
        messages:[{role:'system',content:sys},{role:'user',content:text}]
      })
    });
    clearTimeout(timer);
    if(!res.ok){
      let detail='';
      try{ const j=await res.json(); detail = j.error && j.error.message ? j.error.message : ''; }catch(e){}
      return {ok:false, reason:`HTTP ${res.status}${detail?': '+detail:''}`};
    }
    const data = await res.json();
    const msg = data && data.choices && data.choices[0] && data.choices[0].message;
    const call = msg && msg.tool_calls && msg.tool_calls[0];
    if(!call) return {ok:false, reason:'модель не вызвала функцию классификации'};
    let parsed;
    try{ parsed = JSON.parse(call.function.arguments); }catch(e){ return {ok:false, reason:'не удалось разобрать аргументы функции'}; }
    return validateLlmResult(parsed, f);
  }catch(err){
    clearTimeout(timer);
    return {ok:false, reason: err && err.name==='AbortError' ? 'превышено время ожидания' : ((err && err.message) || 'сетевая ошибка')};
  }
}

/* ---------- shared stable dropdown component ----------
   Единственный источник состояния открытого меню — S.openDD.
   Закрытие по клику вне обрабатывается ОДНИМ обработчиком на document
   (см. конец файла), навешанным один раз, а не при каждом рендере —
   именно повторное навешивание на каждый рендер и повторные закрытия
   «в тот же клик» были причиной мерцания меню. */
function toggleDD(id){ S.openDD = (S.openDD===id) ? null : id; render(); }
function ddField(id, kind, scope, idx, value, options){
  const open = S.openDD===id;
  /* Для оператора (kind==='o') показываем понятную словесную формулировку
     (OP_LABEL), а не служебное название («Больше» → «больше или равно») —
     внутреннее значение (что реально сохраняется и участвует в
     REAL_FILTER_PRED) не меняется, меняется только то, что видит человек. */
  const disp = v => kind==='o' ? (OP_LABEL[v]||v) : v;
  return `<span class="esel ${kind==='o'?'op':''}" data-dd="${id}">
    <button type="button" class="ddtrig" onclick="event.stopPropagation();toggleDD('${id}')">
      <span>${esc(disp(value)||'—')}</span><span style="color:var(--ink4)">▾</span></button>
    ${open?`<div class="ddmenu">${options.map(o=>`<div class="ddopt ${o===value?'on':''}"
      onclick="event.stopPropagation();selectDD('${scope}','${kind}',${idx},'${esc(o).replace(/'/g,"\\'")}')">${esc(disp(o))}</div>`).join('')}</div>`:''}
  </span>`;
}
/* scope различает, какой массив редактируется одним и тем же переиспользуемым
   набором дропдаунов: 'chat' — S.filters (живой подбор), 'tpl' — черновик
   редактирования шаблона, 'folder' — критерии внутри конкретной подборки. */
function scopeArr(scope){
  if(scope==='tpl') return S.curTplRules;
  if(scope==='folder') return S.folderFilters;
  return S.filters;
}
/* Выбор ПОЛЯ критерия — раньше был обычным ddField() со сплошным списком
   из ~35 названий без группировки, которые невозможно было быстро найти
   (просьба заказчика, 18.08.2026). Отдельный дропдаун: те же группы, что
   и в «Ход подбора» (BLOCKS), плюс поиск по вводу текста (фильтрует список
   на лету, без render() — чтобы не сбрасывать фокус ввода при печати, тот
   же приём, что и у setFilterVal). Поля, уже занятые ДРУГИМИ строками того
   же набора критериев, скрыты — незачем предлагать выбрать критерий
   дважды. */
function fieldGroupsFor(scope, currentValue){
  const used = new Set(scopeArr(scope).map(r=>r.f).filter(f=>f && f!==currentValue));
  return BLOCKS.map(b=>({n:b.n, items:b.items.filter(it=>FIELD_DEFS[it] && !used.has(it))}))
    .filter(g=>g.items.length);
}
function fieldOptRow(scope, idx, it, value){
  return `<div class="ddopt fddopt ${it===value?'on':''}" data-s="${esc(normRu(fieldLabel(it)))}"
    onclick="selectDD('${scope}','f',${idx},'${esc(it).replace(/'/g,"\\'")}')">${esc(fieldLabel(it))}</div>`;
}
function fieldGroupRow(scope, idx, g, value){
  return `<div class="fddgrp">${esc(g.n)}</div>${g.items.map(it=>fieldOptRow(scope,idx,it,value)).join('')}`;
}
function fieldDD(id, scope, idx, value){
  const open = S.openDD===id;
  const groups = fieldGroupsFor(scope, value);
  const optsHtml = groups.map(g=>fieldGroupRow(scope,idx,g,value)).join('');
  return `<span class="esel fsel" data-dd="${id}">
    <button type="button" class="ddtrig" onclick="event.stopPropagation();toggleDD('${id}')">
      <span>${value?esc(fieldLabel(value)):'<span style="color:var(--ink4)">Выберите критерий</span>'}</span><span style="color:var(--ink4)">▾</span></button>
    ${open?`<div class="ddmenu fddmenu" onclick="event.stopPropagation()">
      <input class="fddsearch" placeholder="Найти критерий…" oninput="filterFieldOpts(this)">
      <div class="fddlist">${optsHtml}</div>
    </div>`:''}
  </span>`;
}
/* Прямая правка DOM без render() — печать в поле поиска не должна сбрасывать
   фокус (тот же приём, что и у setFilterVal ниже). Два прохода по списку:
   сначала скрываем/показываем сами пункты по совпадению подстроки, затем
   скрываем заголовок группы целиком, если в ней не осталось видимых пунктов. */
function filterFieldOpts(input){
  const q = normRu(input.value).trim();
  const list = input.nextElementSibling;
  if(!list) return;
  let curGroup=null, curGroupVisible=false;
  Array.from(list.children).forEach(el=>{
    if(el.classList.contains('fddgrp')){
      if(curGroup) curGroup.style.display = curGroupVisible ? '' : 'none';
      curGroup=el; curGroupVisible=false;
    } else {
      const match = !q || el.getAttribute('data-s').includes(q);
      el.style.display = match ? '' : 'none';
      if(match) curGroupVisible=true;
    }
  });
  if(curGroup) curGroup.style.display = curGroupVisible ? '' : 'none';
}
function valueField(id, scope, idx, r){
  const def = FIELD_DEFS[r.f];
  if(def && Array.isArray(def.values)) return ddField(id,'v',scope,idx,r.v,def.values);
  const setter = `scopeArr('${scope}')[${idx}].v=this.value`;
  return `<input class="esel eval" value="${esc(r.v)}" oninput="${setter}">`;
}
function selectDD(scope, kind, idx, value){
  const arr = scopeArr(scope);
  if(kind==='f'){ const def=FIELD_DEFS[value]; arr[idx] = {f:value, o:def.ops[0], v:def.values?def.values[0]:'', delta:def.delta}; }
  else if(kind==='o'){ arr[idx].o = value; }
  else if(kind==='v'){ arr[idx].v = value; }
  S.openDD=null; render();
}

/* ---------- criteria (filters) list ---------- */
/* Единая точка правды для «сколько процедур сейчас подходит» — прогоняем
   реальную базу через движок relevantности (rankMatches) и затем через
   настоящие предикаты (REAL_FILTER_PRED) для каждого применённого критерия
   по порядку. Раньше счётчик двигался по вручную заданным «весам» (delta),
   вообще не привязанным к реальной базе, — отсюда и ощущение бутафории.
   Раньше также был «предохранитель»: если конкретный шаг сужал список до
   0, мы тихо оставляли прошлый (непустой) шаг, чтобы грид не показывал
   пусто. По прямой просьбе заказчика (12.08.2026) это убрано — «если
   результат равен нулю, сервис должен прямо писать, что торгов нет», а
   не маскировать ноль под «почти ничего». Настоящий ноль на каком-то шаге
   теперь так и остаётся нулём — по нему (первому пустому этапу) честно
   определяется, какой именно критерий обнулил выборку, см.
   zeroCauseFilter(). */
function computeStages(){
  let ws = rankMatches(S.query);
  const stages = [];
  S.filters.forEach(r=>{
    const pred = REAL_FILTER_PRED[r.f];
    if(pred){
      ws = ws.filter(id=>{ const p=PROCS_BY_ID.get(id); return p && pred(p, r.v, r.o); });
    }
    stages.push({filter:r, ws});
  });
  return stages;
}
/* Строки running-счётчика в модалке «Критерии подбора» — настоящие числа
   на каждом шаге (computeStages), без какой-либо развилки по фазе — фазы
   больше нет. */
function critRunning(){
  let prevReal = rankMatches(S.query).length;
  return computeStages().map(s=>{
    const realTotal = s.ws.length;
    const delta = Math.max(0, prevReal-realTotal);
    prevReal = realTotal;
    return {...s.filter, total:realTotal, realTotal, delta};
  });
}
function addFilter(f, o, v, delta){
  S.filters.push({f, o, v, delta});
  const pred = REAL_FILTER_PRED[f];
  if(pred){
    /* Раньше здесь стоял «if(narrowed.length)» — реальный ноль тихо
       игнорировался, и S.workingSet оставался прежним. Теперь честно
       применяем, даже если совпадений не осталось — см. комментарий у
       computeStages(). */
    S.workingSet = S.workingSet.filter(id=>{ const p=PROCS_BY_ID.get(id); return p && pred(p, v, o); });
  }
  S.total = currentTotal();
}
/* Раньше новая строка сразу получала первое неиспользуемое поле и его
   дефолтное значение — пользователь должен был заметить и поменять то, что
   подставилось само, вместо того чтобы осознанно выбрать критерий (просьба
   заказчика, 18.08.2026). Теперь строка стартует пустой (f:null) — critRow()
   в этом случае показывает только выбор поля, без оператора/значения/итога,
   пока критерий не выбран. */
function addFilterRow(){
  S.filters.push({f:null, o:null, v:'', delta:0});
  render();
}
function removeFilterRow(i){ S.filters.splice(i,1); render(); }
function setFilterVal(i,v){ S.filters[i].v=v; } /* без render() — чтобы не сбрасывать фокус при вводе текста */
function openCritModal(){ S.critModalOpen=true; S.openDD=null; render(); }
function closeCritModal(){ S.critModalOpen=false; S.openDD=null; render(); }
/* Модалка допускает произвольные правки (добавить/удалить/поменять любую
   строку, не только последнюю), поэтому по «Применить» пересчитываем
   список кандидатов с нуля от исходного запроса — прогоняя через реальные
   предикаты ВСЕ текущие критерии по порядку, а не пытаясь инкрементально
   поправить прежний S.workingSet. */
function recomputeWorkingSet(){
  const stages = computeStages();
  S.workingSet = stages.length ? stages[stages.length-1].ws : rankMatches(S.query);
}
function applyCrit(){
  recomputeWorkingSet();
  S.total = currentTotal();
  closeCritModal();
}
function critRow(r,i){
  if(!r.f){
    return `<div class="crow">
      <span class="cidx">${i+1}.</span>
      ${fieldDD('cf'+i,'chat',i,null)}
      <span style="flex:1;color:var(--ink4);font-size:12px">Сначала выберите критерий</span>
      <button class="ctrash" onclick="removeFilterRow(${i})">🗑</button>
    </div>`;
  }
  const warn = r.realTotal!=null && r.realTotal<=5;
  return `<div class="crow ${warn?'warn':''}">
    <span class="cidx">${i+1}.</span>
    ${fieldDD('cf'+i,'chat',i,r.f)}
    ${ddField('co'+i,'o','chat',i,r.o,opsFor(r.f))}
    ${valueField('cv'+i,'chat',i,r)}
    <span class="cdelta num">−${fmt(r.delta)}</span>
    <span class="ctotal num">${fmt(r.total)}</span>
    ${warn?'<span class="cwarn" title="Риск нулевой выборки">⚠</span>':''}
    <button class="ctrash" onclick="removeFilterRow(${i})">🗑</button>
  </div>`;
}
function renderCritModal(){
  const rows = critRunning();
  return `<div class="modalbg" onclick="if(event.target===this)closeCritModal()">
    <div class="modalcard">
      <div class="mhead"><span class="mtitle">Критерии подбора</span><button class="mx" onclick="closeCritModal()">×</button></div>
      <div class="mrow0"><span>🔍</span><span class="mquery">Запрос: ${esc(S.query||'')}</span><span class="mcount num">${fmt(rankMatches(S.query).length)}</span></div>
      ${rows.map((r,i)=>critRow(r,i)).join('')}
      <div class="eadd" onclick="addFilterRow()">⊕ Добавить</div>
      <div class="mfoot">
        <button class="ecancel" style="margin-left:0" onclick="openSaveTemplateModal()">Сохранить критерии</button>
        <span class="sp2"></span>
        <button class="esave" onclick="applyCrit()">Применить</button>
      </div>
    </div>
  </div>`;
}

/* ---------- сохранение текущего набора критериев в шаблон ----------
   Тот же набор проставленных значений фильтров (S.filters + сам запрос),
   что уже используется в модалке «Критерии подбора» — сохраняем как шаблон
   на странице «Шаблоны подбора», чтобы потом запустить с ним новый подбор
   (см. startFromTemplate()). Доступно и из кебаба «⋮» в гриде, и из самой
   модалки критериев («Сохранить критерии»). */
function openSaveTemplateModal(){
  S.saveTplName = (S.query||'Новый шаблон').trim();
  S.saveTplOpen = true;
  S.openDD = null;
  render();
}
function closeSaveTemplateModal(){ S.saveTplOpen=false; render(); }
function doSaveTemplate(){
  const name = (S.saveTplName||'').trim();
  if(!name){ toast('Введите название шаблона'); return; }
  const rules = [{f:'Запрос', o:'Равен', v:S.query||''}, ...S.filters.map(r=>({f:r.f, o:r.o, v:r.v}))];
  const existing = TEMPLATES.find(t=>t.n===name);
  if(existing) existing.rules = rules;
  else TEMPLATES.unshift({n:name, c:S.filters.length, d:'Сегодня', rules});
  S.saveTplOpen = false;
  toast(`Шаблон «${name}» сохранён`);
  render();
}
function renderSaveTemplateModal(){
  const rows = [{f:'Запрос', o:'Равен', v:S.query||''}, ...S.filters.map(r=>({f:r.f, o:r.o, v:r.v}))];

/* render() вызывается на КАЖДЫЙ клик где угодно в приложении (галочка в гриде,
   выбор чипа критерия и т.д.), и renderNav() раньше безусловно пересобирала
   #navSc (список Чаты/Подборки/Шаблоны) при каждом таком вызове — то есть левое
   меню целиком заменялось новым DOM-узлом на любой чужой клик, даже когда в
   самом меню ничего не изменилось. Полная замена innerHTML на каждый чих и
   создавала впечатление, что меню «само» открывается-закрывается. Пересобираем
   его, только когда реально изменилось то, что на него влияет. */
let _navSig = null;
function renderNav(){
  const sig = S.screen+'|'+S.navScreen+'|'+S.activeChat+'|'+S.openChats+'|'+S.total+'|'+CHATS.length+'|'+S.mode;
  if(sig===_navSig) return;
  _navSig = sig;
  const el=document.getElementById('navSc');
  let h = `<button class="nnew" onclick="newChat()"><span>+</span><span>Новый чат</span></button>`;
  /* Переключатель способа ввода — одно постоянное место для обоих режимов
     (левое меню), чтобы он не «переезжал» между панелью фильтров, рейлом и
     шапкой выдачи. Показываем только в самом подборе. */
  if(S.screen==='chat' && !S.navScreen){
    h += `<div class="navmode">${modeSwitch()}</div>`;
  }
  h += `<button class="nrow ${!S.navScreen&&S.screen==='chat'?'on':''}" onclick="S.openChats=!S.openChats;render()">
    <span class="ic">▤</span><span class="tx">Чаты</span>
    <span class="chev ${S.openChats?'open':''}">▾</span></button>`;
  if(S.openChats){
    if(!CHATS.length){
      h += `<div class="nsub"><div style="padding:6px 10px 6px 16px;font-size:12px;color:var(--ink4)">Пока нет чатов — начните с запроса выше</div></div>`;
    } else {
      h += `<div class="nsub">` + CHATS.map(c=>`
        <button class="nsubrow ${S.screen==='chat'&&!S.navScreen&&c.id===S.activeChat?'on':''}" onclick="openChat('${c.id}')">
          <span class="tx">${esc(c.n)}</span><span class="cnt num">${fmt(c.id===S.activeChat?S.total:c.c)}</span></button>`).join('') + `</div>`;
    }
  }
  h += `<button class="nrow ${S.navScreen==='folders'?'on':''}" onclick="go('folders')">
    <span class="ic">🔖</span><span class="tx">Подборки</span></button>`;
  h += `<button class="nrow ${S.navScreen==='templates'?'on':''}" onclick="go('templates')">
    <span class="ic">📄</span><span class="tx">Шаблоны подбора</span></button>`;
  el.innerHTML = h;
}

/* ---------- ONBOARDING TOUR: спотлайт по реальному интерфейсу ----------
   По выбору заказчика (18.08.2026) — не отдельный экран-макет, а короткий
   (4 шага) тур ПОВЕРХ настоящего интерфейса: подсвечивается один реальный
   элемент за раз (поле ввода → «Ход подбора» → блоки критериев → счётчик
   в рейле), с текстовой подсказкой и «Далее/Пропустить». Стартует один раз
   за сессию сразу после первого запроса (когда карусель критериев, рейл и
   поле ввода уже одновременно на экране) и доступен повторно из меню
   профиля. TOUR_EVER_STARTED — модульный флаг (не часть S/reset()), чтобы
   переключение между чатами не запускало тур заново. */
let TOUR_EVER_STARTED = false;
const TOUR_STEPS = [
 {sel:'#freeIn', title:'Пишите как обычно',
  text:'Отвечайте на вопросы или сразу пишите то, что важно — например, «нужна отсрочка платежа на 30 дней».'},
 {sel:'.rp .pcard', title:'Ход подбора',
  text:'Здесь видно, какие критерии уже учтены, а какие ещё предстоит уточнить.'},
 {sel:'.carw', title:'Уточняйте по блокам',
  text:'Можно выбрать один или сразу несколько критериев для уточнения — не обязательно по одному.'},
 {sel:'.rp .pcta', title:'Подборка всегда под рукой',
  text:'Здесь видно, сколько процедур сейчас подходит. Открыть подборку можно в любой момент, не дожидаясь конца уточнений.'},
];
/* Блокирующий слой (.tourhole/.tourdim) перехватывает МЫШЬ, но если на
   момент старта тура фокус уже стоял в поле ввода (#freeIn), с клавиатуры
   в него всё ещё можно печатать в обход визуальной блокировки — «заблокируй
   ВСЁ во время тура» касается и этого. Снимаем фокус явно на каждом шаге. */
function blurActive(){
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
function startTour(){
  if(!document.querySelector(TOUR_STEPS[0].sel) && !TOUR_STEPS.slice(1).some(s=>document.querySelector(s.sel))) return;
  TOUR_EVER_STARTED = true;
  S.tourStep = 0;
  blurActive();
  render();
}
function tourNext(){
  if(S.tourStep==null) return;
  const next = S.tourStep+1;
  if(next>=TOUR_STEPS.length){ endTour(); return; }
  blurActive();
  S.tourStep = next;
  render();
}
function endTour(){ S.tourStep=null; render(); }
/* Не у каждого шага гарантированно есть цель на экране в момент показа
   (например, карусель критериев пользователь уже мог закрыть/пройти) —
   молча пропускаем шаги без цели, а не показываем пустой тур. */
function renderTourLayer(){
  if(S.tourStep==null) return '';
  let idx = S.tourStep;
  let el = document.querySelector(TOUR_STEPS[idx].sel);
  while(!el && idx<TOUR_STEPS.length-1){ idx++; el = document.querySelector(TOUR_STEPS[idx].sel); }
  if(!el){ S.tourStep=null; return ''; }
  if(idx!==S.tourStep) S.tourStep = idx;
  const step = TOUR_STEPS[idx];
  const r = el.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  const pad = 6;
  const top = Math.max(0, r.top-pad), left = Math.max(0, r.left-pad);
  const right = Math.min(vw, r.right+pad), bottom = Math.min(vh, r.bottom+pad);
  const rects = `<div class="tourdim" style="left:0;top:0;width:100%;height:${top}px" onclick="tourNext()"></div>
    <div class="tourdim" style="left:0;top:${bottom}px;width:100%;height:${Math.max(0,vh-bottom)}px" onclick="tourNext()"></div>
    <div class="tourdim" style="left:0;top:${top}px;width:${left}px;height:${Math.max(0,bottom-top)}px" onclick="tourNext()"></div>
    <div class="tourdim" style="left:${right}px;top:${top}px;width:${Math.max(0,vw-right)}px;height:${Math.max(0,bottom-top)}px" onclick="tourNext()"></div>
    <div class="tourring" style="left:${left}px;top:${top}px;width:${right-left}px;height:${bottom-top}px"></div>
    <div class="tourhole" style="left:${left}px;top:${top}px;width:${right-left}px;height:${bottom-top}px" onclick="tourNext()"></div>`;
  const bubbleW = 280;
  const belowFits = bottom+150<vh;
  const bubTop = belowFits ? bottom+12 : Math.max(12, top-152);
  const bubLeft = Math.min(Math.max(left,12), Math.max(12,vw-bubbleW-12));
  const last = idx===TOUR_STEPS.length-1;
  return `<div class="tourlay">${rects}
    <div class="tourbub" style="top:${bubTop}px;left:${bubLeft}px;width:${bubbleW}px">
      <div class="tourhead">${esc(step.title)}<span class="tourdots">${TOUR_STEPS.map((_,i)=>`<i class="${i===idx?'on':''}"></i>`).join('')}</span></div>
      <div class="tourtext">${esc(step.text)}</div>
      <div class="tourfoot">
        <button class="chip muted" onclick="endTour()">Пропустить</button>
        <button class="chip" onclick="tourNext()">${last?'Понятно':'Далее →'}</button>
      </div>
    </div>
  </div>`;
}

/* Чаты не предзаполнены — каждый чат в списке слева появляется только когда
   пользователь реально отправил запрос. При переключении между чатами
   сохраняем и восстанавливаем их состояние (вопросы, критерии, счётчик),
   а не запускаем один и тот же сценарий заново поверх чужой истории. */
function snapshotChat(){
  if(!S.activeChat) return;
  const entry = CHATS.find(c=>c.id===S.activeChat);
  if(!entry) return;
  entry.state = {
    query:S.query, chat:S.chat, total:S.total, picked:S.picked,
    filters:S.filters, usedItems:S.usedItems, skipped:S.skipped, queue:S.queue, qi:S.qi,
    curField:S.curField, animatedCount:S.animatedCount, history:S.history, carPage:S.carPage,
    workingSet:S.workingSet, gridPage:S.gridPage,
  };
  entry.c = S.total;
}
function startS(){
  snapshotChat();
  const v=(document.getElementById('qIn').value||'Поставляем строительные материалы. Плитку, клей, сухие смеси, краску.').trim();
  const matched=rankMatches(v); /* настоящий пакет процедур под этот запрос (см. genQueryProcs — ровно QUERY_BATCH_SIZE) */
  S.activeChat=null; S.navScreen=null;
  S.screen='chat'; S.mode=S.startMode||'chat'; S.query=v; S.chat=[]; S.animatedCount=0; S.picked=[];
  S.filters=[]; S.usedItems=[]; S.skipped=[]; S.queue=[]; S.qi=0; S.curField=null; S.history=[]; S.carPage=0;
  S.workingSet=matched; S.total=matched.length;
  S.gridOpen=false; S.cardOpen=false; S.checked=[]; S.gridPage=0;
  const chatId='c'+Date.now()+Math.floor(Math.random()*1000);
  CHATS.unshift({id:chatId, n:v.length>22?v.slice(0,20)+'…':v, c:S.total, state:null});
  S.activeChat=chatId;
  if(S.mode==='filters'){
    /* Режим фильтров: сразу показываем выдачу и панель критериев — без
       вопросов бота. Сам чат при этом не теряется: переключатель в шапке
       панели возвращает диалог с уже проставленными критериями. */
    S.gridOpen=true;
    render();
    return;
  }
  say('me', esc(v));
  render();

    say('bot', `Понял. Ищу закупки по запросу «${esc(v)}».<br><span style="color:var(--ink3);font-size:12.5px">Найдено <b class="num">${fmt(S.total)}</b> процедур</span><br><b>Выберите несколько критериев, по которым нужно уточнить поиск:</b>`, 'carousel');
    render();
    /* Спотлайт-тур — один раз за сессию, ровно в момент, когда поле ввода,
       рейл «Ход подбора» и карусель критериев уже одновременно на экране
       (см. TOUR_STEPS). Небольшая задержка — чтобы не накладываться на
       анимацию появления сообщения. */
    if(!TOUR_EVER_STARTED) setTimeout(()=>startTour(), 500);
  }, 900);
}
/* Запуск нового подбора по сохранённому шаблону критериев — тот же набор
   проставленных значений фильтров, что был сохранён (см. doSaveTemplate()),
   применяется сразу: запрос заново прогоняется через движок relevantности,
   каждый критерий шаблона — через настоящий предикат (там, где он есть),
   без повторных вопросов, сразу к результату. */
function startFromTemplate(name){
  const t = TEMPLATES.find(x=>x.n===name);
  if(!t) return;
  snapshotChat();
  const queryRule = t.rules.find(r=>r.f==='Запрос');
  const query = queryRule ? queryRule.v : '';
  const filterRules = t.rules.filter(r=>r.f!=='Запрос');
  const chatId='c'+Date.now()+Math.floor(Math.random()*1000);
  S.navScreen=null; S.activeChat=chatId; S.screen='chat'; S.query=query;
  S.chat=[]; S.animatedCount=0; S.picked=[];
  S.filters=[]; S.usedItems=[]; S.skipped=[]; S.queue=[]; S.qi=0; S.curField=null; S.history=[]; S.carPage=0;
  S.gridOpen=false; S.cardOpen=false; S.checked=[]; S.gridPage=0;
  let ws = rankMatches(query);
  filterRules.forEach(r=>{
    const def = FIELD_DEFS[r.f];
    S.filters.push({f:r.f, o:r.o, v:r.v, delta: def?def.delta:200});
    S.usedItems.push(r.f);
    const pred = REAL_FILTER_PRED[r.f];
    /* Раньше здесь стоял тот же «предохранитель», что и во всех остальных
       местах приложения когда-то (if(narrowed.length) ws=narrowed) — реальный
       ноль от одного из критериев шаблона тихо игнорировался, и подборка
       оставалась на предыдущем (непустом) шаге. По тому же принципу, что и
       everywhere else в этой сессии — честный ноль остаётся нулём. */
    if(pred){ ws = ws.filter(id=>{ const p=PROCS_BY_ID.get(id); return p && pred(p, r.v, r.o); }); }
  });
  S.workingSet = ws; S.total = ws.length;
  CHATS.unshift({id:chatId, n:(query||name).length>22?(query||name).slice(0,20)+'…':(query||name), c:S.total, state:null});
  say('me', `Начать подбор по шаблону «${esc(name)}»`);
  render();
  /* Раньше — безусловный finishGood(): даже настоящий ноль/огромная
     неотфильтрованная выборка от шаблона показывались как «Готово, я собрал
     подборку». continueOrFinish() — та же честная развилка, что и везде:
     ноль/мало → showZero()/showLow(), всё ещё большая → предложить уточнить
     дальше, только по-настоящему узкая — CTA. */
  botThink(()=>{ continueOrFinish(); }, 800);
}
