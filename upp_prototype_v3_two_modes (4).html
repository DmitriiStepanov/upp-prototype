function addFolderFilterRow(){
  S.folderFilters.push({f:null, o:null, v:'', delta:0}); /* см. addFilterRow() — строка стартует пустой */
  render();
}
function removeFolderFilterRow(i){ S.folderFilters.splice(i,1); render(); }
function folderCritRunning(){
  let arr = folderBaseProcs();
  let prev = arr.length;
  return S.folderFilters.map(r=>{
    const pred = REAL_FILTER_PRED[r.f];
    if(pred){ arr = arr.filter(p=>pred(p, r.v, r.o)); }
    const total = arr.length;
    const delta = Math.max(0, prev-total);
    prev = total;
    return {...r, total, delta};
  });
}
function folderCritRow(r,i){
  if(!r.f){
    return `<div class="crow">
      <span class="cidx">${i+1}.</span>
      ${fieldDD('ff'+i,'folder',i,null)}
      <span style="flex:1;color:var(--ink4);font-size:12px">Сначала выберите критерий</span>
      <button class="ctrash" onclick="removeFolderFilterRow(${i})">🗑</button>
    </div>`;
  }
  const warn = r.total<=2;
  return `<div class="crow ${warn?'warn':''}">
    <span class="cidx">${i+1}.</span>
    ${fieldDD('ff'+i,'folder',i,r.f)}
    ${ddField('fo'+i,'o','folder',i,r.o,opsFor(r.f))}
    ${valueField('fv'+i,'folder',i,r)}
    <span class="cdelta num">−${fmt(r.delta)}</span>
    <span class="ctotal num">${fmt(r.total)}</span>
    ${warn?'<span class="cwarn" title="Риск нулевой выборки">⚠</span>':''}
    <button class="ctrash" onclick="removeFolderFilterRow(${i})">🗑</button>
  </div>`;
}
function renderFolderCritModal(){
  const base = folderBaseProcs();
  const rows = folderCritRunning();
  return `<div class="modalbg" onclick="if(event.target===this)closeFolderCritModal()">
    <div class="modalcard">
      <div class="mhead"><span class="mtitle">Критерии подборки «${esc(S.curFolder)}»</span><button class="mx" onclick="closeFolderCritModal()">×</button></div>
      <div class="mrow0"><span>🔖</span><span class="mquery">Всего в подборке (${S.folderItemsTab==='active'?'активные':'в архиве'})</span><span class="mcount num">${fmt(base.length)}</span></div>
      ${rows.map((r,i)=>folderCritRow(r,i)).join('')}
      <div class="eadd" onclick="addFolderFilterRow()">⊕ Добавить</div>
      <div class="mfoot"><span class="sp2"></span><button class="esave" onclick="closeFolderCritModal()">Готово</button></div>
    </div>
  </div>`;
}
function viewFolderGrid(){
  const f = findFolder(S.curFolder);
  const shown = f.items.filter(i=>S.folderItemsTab==='active' ? !i.archived : i.archived);
  let procs = shown.map(i=>PROCS_BY_ID.get(i.id)).filter(Boolean);
  procs = sortArr(applyFolderFilters(procs));
  const activeN = f.items.filter(i=>!i.archived).length;
  const archN = f.items.filter(i=>i.archived).length;
  return `<div class="gcol" style="width:auto;flex:1;border-right:1px solid var(--line)">
    <div class="gh">
      <div class="gh1">
        <button class="x" onclick="S.curFolder=null;render()">×</button>
        <span class="t">${esc(S.curFolder)}</span><span class="c num">${fmt(procs.length)}</span>
        <button class="kb" onclick="createFolder()" title="Создать папку">⊕</button>
      </div>
      <div class="gh2">
        ${sortBtn()}
        <button class="gbtn" onclick="openFolderCritModal()">☰ Критерии<span class="bdg num">${S.folderFilters.length}</span></button>
        <span class="sp"></span>
        <button class="gbtn" style="${S.folderItemsTab==='active'?'border-color:var(--blue);color:var(--blue)':''}" onclick="S.folderItemsTab='active';S.checked=[];render()">Активные ${activeN}</button>
        <button class="gbtn" style="${S.folderItemsTab==='archived'?'border-color:var(--blue);color:var(--blue)':''}" onclick="S.folderItemsTab='archived';S.checked=[];render()">В архиве ${archN}</button>
      </div>
    </div>
    <div class="gsc">
      ${S.folderItemsTab==='archived'?`<div class="infob">ℹ️ Здесь — процедуры из этой подборки с истёкшим сроком подачи заявок или перемещённые вручную. Их можно вернуть назад в активные.</div>`:''}
      ${procs.length?procs.map(p=>prow(p,{folder:S.curFolder, archived:S.folderItemsTab==='archived'})).join(''):
      `<div style="padding:30px 6px;color:var(--ink4);font-size:13px;text-align:center">${S.folderItemsTab==='active'?(S.folderFilters.length?'Нет процедур, подходящих под критерии':'В подборке пока ничего нет'):'В архиве подборки пусто'}</div>`}</div>
    ${S.checked.length?bulkFolder():''}
  </div>`;
}

/* ---------- TEMPLATES ---------- */
function viewTemplates(){
  return `<div style="display:flex;flex-direction:row;overflow:hidden;flex:1;min-width:0">
    <div class="fpage" style="width:${S.curTemplate?'420px':'100%'};flex:none;${S.curTemplate?'border-right:1px solid var(--line)':''}">
      <div class="fph"><h1>Шаблоны подбора</h1></div>
      <div class="flist" style="padding-top:18px">
        ${TEMPLATES.map(t=>`<div class="frow ${S.curTemplate===t.n?'on':''}" onclick="openTemplate('${esc(t.n)}')">
          <div class="ftx"><div class="fn">${esc(t.n)}</div></div>
          <div class="fdate num">${t.c}</div><div class="fdate">${t.d}</div>
          <button class="fkb" onclick="event.stopPropagation()">⋮</button>
        </div>`).join('')}
      </div>
    </div>
    ${S.curTemplate?viewTemplateDetail():''}
  </div>`;
}
function openTemplate(n){ S.curTemplate=n; S.templateEdit=false; render(); }
/* тот же принцип, что и у карточки процедуры (см. openCard/viewCard) — переигрываем
   анимацию появления панели только когда реально меняется её содержимое (открыли другой
   шаблон / вошли в режим редактирования), а не при каждом клике внутри неё самой
   (например, при открытии/закрытии выпадающего списка поля критерия). */
function dcolFresh(key){ const fresh = S.dcolAnimKey!==key; S.dcolAnimKey=key; return fresh; }
function viewTemplateDetail(){
  const t = TEMPLATES.find(x=>x.n===S.curTemplate);
  if(S.templateEdit) return viewTemplateEdit(t);
  const fresh = dcolFresh('view:'+S.curTemplate);
  return `<div class="dcol" style="width:auto;flex:1;${fresh?'':'animation:none'}">
    <div class="dh"><span class="t">${esc(t.n)}</span><button class="x" onclick="S.curTemplate=null;render()">×</button></div>
    <div class="dsc">
      ${t.rules.map(r=>`<div class="frule"><div class="fl">${r.f}</div><div class="fo">${r.o}</div><div class="fv">${esc(r.v)}</div></div>`).join('')}
      <div class="dactions">
        <div class="dact pri" onclick="startFromTemplate('${esc(t.n)}')">💬 Начать новый подбор</div>
        <div class="dact" onclick="toast('Шаблон продублирован')">⧉ Дублировать</div>
        <div class="dact" onclick="startTplEdit(t)">Редактировать</div>
        <div class="dact" onclick="toast('Переименование')">Переименовать</div>
        <div class="dact danger" onclick="toast('Шаблон удалён')">🗑 Удалить</div>
      </div>
    </div>
  </div>`;
}
function startTplEdit(t){ S.templateEdit=true; S.openDD=null; S.curTplRules=t.rules.slice(1).map(r=>({...r})); render(); }
function addTplRule(){
  S.curTplRules.push({f:null, o:null, v:''}); /* см. addFilterRow() — строка стартует пустой */
  render();
}
function saveTplEdit(n){
  const t = TEMPLATES.find(x=>x.n===n);
  t.rules = [t.rules[0], ...S.curTplRules];
  S.templateEdit=false; S.curTplRules=null;
  toast('Шаблон сохранён'); render();
}
function viewTemplateEdit(t){
  const fresh = dcolFresh('edit:'+S.curTemplate);
  return `<div class="dcol" style="width:auto;flex:1;${fresh?'':'animation:none'}">
    <div class="dh"><span class="t">${esc(t.n)}</span><button class="x" onclick="S.templateEdit=false;S.curTplRules=null;render()">×</button></div>
    <div class="dsc">
      <div class="esearch">🔍 Запрос: ${esc(t.rules[0].v)}</div>
      ${S.curTplRules.map((r,i)=>r.f?`<div class="econd">
        <span class="en">${i+1}.</span>
        ${fieldDD('tf'+i,'tpl',i,r.f)}
        ${ddField('to'+i,'o','tpl',i,r.o,opsFor(r.f))}
        ${valueField('tv'+i,'tpl',i,r)}
        <button class="ctrash" onclick="S.curTplRules.splice(${i},1);render()">🗑</button>
      </div>`:`<div class="econd">
        <span class="en">${i+1}.</span>
        ${fieldDD('tf'+i,'tpl',i,null)}
        <span style="flex:1;color:var(--ink4);font-size:12px">Сначала выберите критерий</span>
        <button class="ctrash" onclick="S.curTplRules.splice(${i},1);render()">🗑</button>
      </div>`).join('')}
      <div class="eadd" onclick="addTplRule()">⊕ Добавить</div>
      <div><button class="esave" onclick="saveTplEdit('${esc(t.n)}')">Сохранить</button>
      <button class="ecancel" onclick="S.templateEdit=false;S.curTplRules=null;render()">Отмена</button></div>
    </div>
  </div>`;
}

/* ---------- misc ---------- */
function toast(t){
  const d=document.createElement('div');
  d.textContent=t;
  d.style.cssText='position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#1B1E2B;'+
    'color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;z-index:300;box-shadow:0 8px 26px rgba(0,0,0,.25)';
  document.body.appendChild(d); setTimeout(()=>d.remove(),2000);
}
document.getElementById('burger').onclick=()=>{ S.navCol=!S.navCol; render(); };

/* Единственный на весь документ обработчик "клик вне — закрыть меню".
   Важно: он навешан ОДИН раз при загрузке, а не заново на каждый render() —
   если бы он пересоздавался при каждом рендере, клики множились бы и
   меню открывалось/закрывалось само по себе. Срабатывает на mousedown
   (до перерисовки DOM по клику), поэтому не путается в новых/старых узлах. */
document.addEventListener('mousedown', (e)=>{
  if(S.openDD!==null && !e.target.closest('[data-dd]')){ S.openDD=null; S.sortPendingField=null; render(); }
});

render();
</script>
</body>
