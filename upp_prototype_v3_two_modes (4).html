/* ---------- WORK AREA ---------- */
/* Переключение способа ввода. Критерии (S.filters), запрос и выборка —
   общие для обоих режимов, поэтому ничего не сбрасываем и не пересчитываем:

function setMode(m){

  if(m==='filters'){ S.gridOpen=true; }

/* ---------- панель классических фильтров ----------
   Одно поле = один критерий из FIELD_DEFS, сгруппированы теми же BLOCKS,
   что и карусель в чате. Значение пишется в ту же S.filters, что и ответы
   бота, и применяется тем же recomputeWorkingSet(). */
function fpFilterOf(name){ return S.filters.find(r=>r.f===name) || null; }
function fpApply(){ recomputeWorkingSet(); S.total=currentTotal(); if(S.gridPage) S.gridPage=0; render(); }
function fpSet(name, val, op){
  const d=FIELD_DEFS[name]||{}; const cur=fpFilterOf(name);
  if(cur){ cur.v=val; cur.o=op||cur.o||(d.ops?d.ops[0]:'Равен'); }
  else { S.filters.push({f:name, o:op||(d.ops?d.ops[0]:'Равен'), v:val, delta:d.delta||0}); }
  if(!S.usedItems.includes(name)) S.usedItems.push(name);
  fpApply();
}
function fpToggle(name, val){
  const cur=fpFilterOf(name);
  if(cur && String(cur.v)===String(val)){ fpClear(name); return; }
  fpSet(name, val);
}
function fpClear(name){
  S.filters = S.filters.filter(r=>r.f!==name);
  S.usedItems = S.usedItems.filter(x=>x!==name);
  fpApply();
}
function fpOp(name, op){ const cur=fpFilterOf(name); if(cur){ cur.o=op; fpApply(); } }
function fpNum(name, raw){
  const v=String(raw||'').trim();
  if(!v){ fpClear(name); return; }
  const d=FIELD_DEFS[name]||{}; const cur=fpFilterOf(name);
  fpSet(name, v, cur?cur.o:(d.ops?d.ops[0]:'Равен'));
}
function fpBlockToggle(id){ S.fpOpen[id]=!S.fpOpen[id]; render(); }
function fpReset(){ S.filters=[]; S.usedItems=[]; S.skipped=[]; fpApply(); }
function fpRequery(v){
  const q=String(v||'').trim(); if(!q || q===S.query) return;
  S.query=q; S.workingSet=rankMatches(q); recomputeWorkingSet(); S.total=currentTotal(); S.gridPage=0;
  const ch=CHATS.find(c=>c.id===S.activeChat); if(ch){ ch.n = q.length>22?q.slice(0,20)+'…':q; ch.c=S.total; }
  render();
}
/* Готовые варианты для числовых полей и дат берём из тех же chips, что бот
   предлагает в диалоге, — чтобы формулировки в обоих режимах совпадали.
   Оператор для дат задаём явно: agoMatch/«Окончание приема заявок» читают
   его, а не только текст. */
const FP_PRESET_OP = {
  'Дата публикации торгов':'После', 'Дата начала приёма заявок':'После', 'Окончание приема заявок':'До',
};
function fpField(name){
  const d=FIELD_DEFS[name]; if(!d) return '';
  const cur=fpFilterOf(name);
  const label=d.label||name;
  const tip=d.tip?`<span class="tipi" title="${esc(d.tip)}">i</span>`:'';
  let body='';
  if(Array.isArray(d.values) && d.values.length){
    const many=d.values.length>8, key='fpmore_'+name;
    const shown = (many && !S[key]) ? d.values.slice(0,6) : d.values;
    const list = (many && !S[key] && cur && !shown.includes(cur.v)) ? [cur.v].concat(shown.slice(0,5)) : shown;
    body=`<div class="fpo">${list.map(v=>`<button class="${cur&&String(cur.v)===String(v)?'on':''}" onclick="fpToggle('${esc(name)}','${esc(v)}')">${esc(v)}</button>`).join('')}</div>
      ${many?`<button class="fpmore" onclick="S['${esc(key)}']=!S['${esc(key)}'];render()">${S[key]?'свернуть':'ещё '+(d.values.length-list.length)+'…'}</button>`:''}`;
  } else {
    const ops=d.ops||['Равен'];
    const op=cur?cur.o:ops[0];
    const presetOp=FP_PRESET_OP[name];
    body=`<div class="fpnum">

function viewWork(){
  /* Режим «классические фильтры»: слева панель критериев, справа та же

  if(S.mode==='filters'){

    if(S.cardOpen) h += viewCard();

     заново каждый раз. У сообщений в CSS стоит анимация появления (.m{animation:fade}),
     и она проигрывалась заново для ВСЕХ прошлых сообщений на каждый чих — это и было

     для сообщений, которых ещё не было на экране (индекс >= S.animatedCount). */
  const already = S.animatedCount||0;
  const chatHtml = S.chat.map((m,i)=>mRender(m, i>=already)).join('');

function mRender(m, fresh){
  const st = fresh ? '' : ' style="animation:none"';

  let extra='';
  if(m.x==='carousel') extra=carousel();
  else if(m.x==='question') extra=questionChips();
  else if(m.x==='cta') extra=ctaCard();
  else if(m.x==='more') extra=moreBlock();
  else if(m.x==='zero'){
    /* Настоящий ноль — просьба заказчика (13.08.2026, уточнено 13.08.2026):
       кнопка не должна незаметно сносить сразу несколько критериев за
       один клик. Сначала честно ищем ОДИН критерий, чьё снятие само по
       себе уже даёт непустой результат (singleFilterFixIndex) — если
       находится, кнопка снимает ровно его (removeFilterAt). Если такого

       кнопка прямо называет, сколько и какие будут сняты (removeZeroCause),
       вместо того чтобы удалить несколько молча. Архив — вторично,
       приглушённой кнопкой в стиле «Назад» (chip.back), не крупным CTA. */
    const single = singleFilterFixIndex();
    const causeIdx = zeroCauseIndex();
    const backBtn = S.history.length ? `<button class="chip back" onclick="goBack()">← Назад</button>` : '';
    let removeBtn = '';
    if(single>=0){
      removeBtn = `<button class="bigb" style="width:100%;margin-top:10px" onclick="removeFilterAt(${single})">✕ Убрать критерий «${esc(S.filters[single].f)}»</button>`;
    } else if(causeIdx>=0){
      const names = S.filters.slice(causeIdx).map(r=>r.f);
      removeBtn = `<button class="bigb" style="width:100%;margin-top:10px" onclick="removeZeroCause()">✕ Убрать несколько критериев (${names.length}): «${names.map(n=>esc(n)).join('», «')}»</button>`;
    }
    extra = `${removeBtn}

        <button class="chip back" onclick="keepArchive()">📦 Показать архивные процедуры</button>
        ${backBtn}
      </div>`;
  }
  else if(m.x==='low'){
    /* Мало, но не ноль — без архива (просьба заказчика): единственное
       действие здесь — попробовать убрать критерий, который сузил сильнее
       всего, плюс общий «Назад» (просьба заказчика, 13.08.2026). */
    const lastF = S.filters[S.filters.length-1];
    const backBtn = S.history.length ? `<button class="chip back" onclick="goBack()">← Назад</button>` : '';
    extra = (lastF||backBtn) ? `<div class="chiprow">${lastF?`<button class="chip" onclick="removeCriterion()">Убрать критерий «${esc(lastF.f)}»</button>`:''}${backBtn}</div>` : '';
  }
  return `<div class="m bot"${st}><div class="b">${m.h}${extra}</div></div>`;
}
function typing(){ return `<div class="typing"><span class="tdots"><i></i><i></i><i></i></span>Анализирую запрос…</div>`; }
function say(who,h,x){ S.chat.push({who,h,x:x||null}); }
function botThink(fn,ms){ S.busy=true; render(); setTimeout(()=>{ S.busy=false; fn(); }, ms||800); }
function scrollChat(){ const e=document.getElementById('chatSc'); if(e) e.scrollTop=e.scrollHeight; }

/* ---------- CAROUSEL: выбор блоков/критериев ----------
   Порядок клика по чипам = S.picked (обычный массив, порядок вставки).
   Он же становится: (1) порядком нумерации на самих чипах и
   (2) порядком, в котором дальше задаются вопросы (S.queue).
   Блоков всего 8, показываем по 4 (2 страницы) — постранично через
   S.carPage, а не листанием одного бесконечного ряда, чтобы 4-й и 5-й
   блок не оказывались одновременно и на первой, и на второй странице. */
/* По макету из Figma — 3 блока на страницу (было 4), а стрелки листания
   и кнопка «Продолжить» — в одну строку внизу: стрелки вместе слева,
   кнопка справа (раньше стрелки стояли по бокам от карточек, а кнопка
   вообще пропадала, пока ничего не выбрано, — теперь видна всегда, просто
   неактивна). */
const CAR_PAGE_SIZE = 4;
const CAR_PAGES = Math.ceil(BLOCKS.length/CAR_PAGE_SIZE);
function carPage(delta){
  S.carPage = Math.max(0, Math.min(CAR_PAGES-1, (S.carPage||0)+delta));
  render();
}
/* label/tip — на нескольких полях (см. таблицу «Критерии УПП») пробуем
   более понятные названия и тултипы вместо сырого технического имени
   поля. Внутренний ключ (S.filters/BLOCKS/REAL_FILTER_PRED) не трогаем —
   меняется только то, что видит пользователь. */
function fieldLabel(name){ const f=FIELD_DEFS[name]; return (f&&f.label)||name; }
/* Слова видимого названия поля БЕЗ фильтра по длине tokenize() (>3 символа) —
   короткие аббревиатуры вроде «ИНН» (3 буквы) и «КСР» (3 буквы, внутри
   «Классификатор строительных ресурсов (КСР)») через tokenize() отсекаются
   целиком, из-за чего эти поля были в принципе невозможно найти по
   свободному тексту («ИНН 7612345678» → toks=["7612345678"], «инн»
   потерялось, ни exact-, ни scored-проход угадывания поля их не видел —
   реальный баг 13.08.2026, найден в ходе аудита «проверь все фильтры»). */
function labelWordsRaw(name){
  return normRu(fieldLabel(name)).split(/[^a-zа-я0-9]+/).filter(Boolean);
}
function rawWords(s){
  return normRu(s).split(/[^a-zа-я0-9]+/).filter(Boolean);
}
/* Убираем из текста слова названия поля (целиком, без учёта регистра) —
   используется, когда САМО название/аббревиатуру поля пользователь печатает
   вперемешку со значением («ОКПД2 70.33.93.273», «заказчик ООО Ромашка»):
   без этого шага «ОКПД2» приклеивало цифру «2» к началу кода (после
   которую все нецифровые/неточечные символы вырезаются), а «заказчик»
   ломал substring-поиск по названию организации (реальный баг 13.08.2026). */
function stripLabelWords(text, name){
  let s = ' '+String(text||'')+' ';
  labelWordsRaw(name).forEach(w=>{
    if(w.length<2) return;
    const re = new RegExp('([^a-zа-яё0-9]|^)'+w+'([^a-zа-яё0-9]|$)', 'gi');
    s = s.replace(re, '$1$2');
  });
  return s.trim().replace(/\s+/g,' ');
}
function carousel(){
  const page = S.carPage||0;
  const pageBlocks = BLOCKS.slice(page*CAR_PAGE_SIZE, page*CAR_PAGE_SIZE+CAR_PAGE_SIZE);
  const cards = pageBlocks.map(b=>{
    const items = b.items.filter(it=>!S.usedItems.includes(it));
    const body = items.length ? items.map(it=>{
        const key=b.id+'|'+it; const idx=S.picked.indexOf(key); const sel=idx>=0;
        const tip = FIELD_DEFS[it] && FIELD_DEFS[it].tip;
        /* Раньше подсказка висела на title у самой кнопки — по вашему
           тесту не открывалась (нативный title внутри <button> у части
           браузеров/окружений либо не всплывает, либо требует слишком
           долгого наведения без движения мыши). Теперь — тот же явный
           значок ⓘ с title, что уже рабочий в вопросах анкеты
           (askQuestion()) — видимая, кликабельная по наведению подсказка,
           а не невидимый атрибут. stopPropagation — чтобы наведение/клик
           по значку не переключал выбор чипа. */
        const tipIcon = tip ? ` <span class="tipi" title="${esc(tip)}" onclick="event.stopPropagation()">ⓘ</span>` : '';
        return `<button class="cchip ${sel?'sel':''}" onclick="togglePick('${key}')">${sel?`<span style="opacity:.8;margin-right:5px">${idx+1}</span>`:''}${esc(fieldLabel(it))}${tipIcon}</button>`;
      }).join('') : `<div style="font-size:11.5px;color:var(--ink4)">Учтено ✓</div>`;
    return `<div class="bcard"><div class="bt">${b.n}</div><div class="bl">${body}</div></div>`;
  }).join('');
  const canContinue = S.picked.length>0;
  return `<div class="carw">
    <div class="carrow">${cards}</div>
    ${backRow()}
    <div class="carfoot">
      <div class="carnavbtns">
        <button class="carnb" onclick="carPage(-1)" ${page<=0?'disabled':''}>‹</button>
        <button class="carnb" onclick="carPage(1)" ${page>=CAR_PAGES-1?'disabled':''}>›</button>
      </div>
      <button class="sendb ${canContinue?'':'muted'}" style="width:auto;border-radius:8px;padding:8px 16px;font-size:12.5px;font-weight:600"
        ${canContinue?'onclick="confirmPick()"':'disabled'}>Продолжить</button>
    </div>
  </div>`;
}
function togglePick(key){ const i=S.picked.indexOf(key); i>=0?S.picked.splice(i,1):S.picked.push(key); render(); }
function confirmPick(){
  const names = S.picked.map(k=>k.split('|')[1]);
  say('me', names.join(', '));
  const last=S.chat.filter(m=>m.x==='carousel').pop(); if(last) last.x=null;
  S.queue = names.filter(n=>FIELD_DEFS[n]);
  names.forEach(n=>{ if(!S.usedItems.includes(n)) S.usedItems.push(n); });
  S.qi = 0;
  S.picked=[]; render();
  botThink(()=>{ nextQuestion(); }, 800);
}
function nextQuestion(){
  if(S.qi < S.queue.length) askQuestion(); else afterQueue();
}
/* Выделено из askQuestion() — используется и им, и goBack() (см. там), когда
   нужно честно переспросить конкретное поле напрямую, а не через S.queue[qi]. */
function pushQuestionMsg(name){
  const f = FIELD_DEFS[name];
  /* Защита от «двух одновременных активных вопросов» — реальный баг,
     найден фазз-тестированием 18.08.2026: если где-то до этого сообщение
     с прошлым вопросом не было очищено (x всё ещё 'question'), questionChips()
     всё равно рисует чипы ТЕКУЩЕГО S.curField под ЕГО (старым) текстом —
     на экране вопрос от одного поля, а варианты ответа от другого. Вместо
     того чтобы полагаться на то, что каждый вызывающий код аккуратно
     почистил предыдущий вопрос, чистим здесь безусловно, при показе
     любого нового. */
  S.chat.forEach(m=>{ if(m.x==='question') m.x=null; });
  S.curField = name;
  const tip = f.tip ? ` <span class="tipi" title="${esc(f.tip)}">ⓘ</span>` : '';
  say('bot', `<b>${f.q}</b>${tip}${f.d?`<div style="margin-top:4px;color:var(--ink3);font-size:12.5px">${f.d}</div>`:''}`, 'question');
  render();
}
function askQuestion(){
  pushQuestionMsg(S.queue[S.qi]);
}
function questionChips(){
  const f = FIELD_DEFS[S.curField]; if(!f) return '';
  const opts=[...f.chips,'Не важно','Пропустить вопрос','К списку вопросов'];
  const back = S.history.length ? `<div class="backrow"><button class="chip back" onclick="goBack()">← Назад</button></div>` : '';
  /* «Указать заказчика» / «Ввести ИНН заказчика» / «Указать категорию» и т.п. —
     не готовый ответ, а подсказка «впишите значение в поле ниже». Раньше клик
     по ней вёл себя как обычный чип и подставлял этот текст-подсказку в
     качестве значения фильтра — человек ничего не написал, а фильтр как будто
     появлялся. Такие чипы теперь не отвечают на вопрос, а просто передают
     фокус в поле ввода, чтобы человек напечатал реальное значение сам. */
  return `${back}<div class="chiprow">${opts.map(c=>{
    const isPrompt = /^(Указать|Ввести)\s/i.test(c);
    if(isPrompt) return `<button class="chip prompt" onclick="focusFreeInput()">✎ ${c}</button>`;
    return `<button class="chip ${/Пропустить|К списку|Не важно/.test(c)?'muted':''}" onclick="answerQ('${esc(c)}')">${c}</button>`;
  }).join('')}</div>`;
}
function focusFreeInput(){
  const el = document.getElementById('freeIn');
  if(el){ el.focus(); }
}
function answerQ(val){
  const name = S.curField; const f = FIELD_DEFS[name];
  /* снимок «до ответа» — по нему кнопка «Назад» откатывает 1-3 шага подряд */
  /* f:S.curField — САМО поле, вопрос по которому сейчас активен, а не
     только его позиция (qi) в S.queue. S.queue — не стабильный массив: он
     может измениться уже ПОСЛЕ этого снимка (вставка нового вопроса из
     свободного текста через S.queue.splice, или вообще полная замена при
     новом выборе блока критериев через confirmPick). Старый qi тогда
     указывал бы в текущем S.queue на случайное, не то поле — goBack()
     показывал текст одного вопроса, а чипы (которые строятся из
     S.curField на момент рендера) — от другого (реальный баг, найден
     фазз-тестированием, 18.08.2026). qi всё ещё сохраняем как запасной
     вариант для случая, когда поле уже не найти ни в каком S.queue. */
  S.history.push({qi:S.qi, f:S.curField, filtersLen:S.filters.length, usedLen:S.usedItems.length, skippedLen:S.skipped.length, chatLen:S.chat.length});
  say('me', val);
  const last=S.chat.filter(m=>m.x==='question').pop(); if(last) last.x=null;
  render();
  if(val==='К списку вопросов'){
    S.qi = S.queue.length;
    return botThink(()=>{ afterQueue(); }, 700);
  }
  if(val!=='Не важно' && val!=='Пропустить вопрос'){
    addFilter(name, f.ops[0], val, f.delta);
    checkZero();
    if(S.workingSet.length<=5) return; // checkZero уже показал сообщение — дальше не идём
  } else {
    /* «Не важно»/«Пропустить вопрос» не создают фильтр, но вопрос всё
       равно считается закрытым — иначе блок в railSteps() никогда не
       получит галочку, если пользователь осознанно пропустил критерий. */
    if(!S.skipped.includes(name)) S.skipped.push(name);
  }
  advanceAfterAnswer();
}
function advanceAfterAnswer(){ S.qi++; botThink(()=>{ nextQuestion(); }, 850); }
/* Свободный текстовый ответ на вопрос анкеты (в отличие от клика по чипу —
   answerQ() — здесь заранее неизвестно, какому значению соответствует текст).
   Для полей со свободным текстом (заказчик/ИНН/ОКПД2/КСР) LLM не нужна —
   там и так работает содержательный substring-поиск, число подходящих
   вариантов не ограничено. Для enum- и числовых полей — обращаемся к LLM,
   с честным отказом на текст «как есть», если сервис недоступен. */
async function freeAnswerToQuestion(text){
  const name = S.curField; const f = FIELD_DEFS[name];
  const kind = llmFieldKind(f);
  /* f:S.curField — САМО поле, вопрос по которому сейчас активен, а не
     только его позиция (qi) в S.queue. S.queue — не стабильный массив: он
     может измениться уже ПОСЛЕ этого снимка (вставка нового вопроса из
     свободного текста через S.queue.splice, или вообще полная замена при
     новом выборе блока критериев через confirmPick). Старый qi тогда
     указывал бы в текущем S.queue на случайное, не то поле — goBack()
     показывал текст одного вопроса, а чипы (которые строятся из
     S.curField на момент рендера) — от другого (реальный баг, найден
     фазз-тестированием, 18.08.2026). qi всё ещё сохраняем как запасной
     вариант для случая, когда поле уже не найти ни в каком S.queue. */
  S.history.push({qi:S.qi, f:S.curField, filtersLen:S.filters.length, usedLen:S.usedItems.length, skippedLen:S.skipped.length, chatLen:S.chat.length});
  say('me', esc(text));
  const last=S.chat.filter(m=>m.x==='question').pop(); if(last) last.x=null;
  if(kind==='text'){
    render();
    /* Убираем слова названия поля из значения — см. stripLabelWords: без
       этого «ОКПД2 70.33.93.273», напечатанное в ответ на активный вопрос,
       сохраняло бы «2» из самого слова «ОКПД2» слева от кода. */
    addFilter(name, f.ops[0], stripLabelWords(text, name) || text, f.delta);
    checkZero();
    if(S.workingSet.length<=5) return;
    advanceAfterAnswer();
    return;
  }
  /* Диапазон («от 3 до 15 млн») — детерминированно, до LLM, см.
     parseNumberRange(). */
  if(kind==='numeric' && f.ops.includes('Диапазон')){
    const range = parseNumberRange(text);
    if(range){
      render();
      applyFreeAnswer(name, f, text, {ok:true, value:`${range.min}-${range.max}`, op:'Диапазон'});
      return;
    }
  }
  S.busy = true; render();
  const result = await llmExtract(text, name, f);
  S.busy = false;
  applyFreeAnswer(name, f, text, result);
}
/* «Не менее 60 дней» и «60 дней» — разные условия, но подтверждение боту
   раньше показывало для обоих просто «60» (оператор терялся, если он
   совпадал с ops[0] у поля). Теперь для числовых полей оператор всегда
   виден рядом со значением — символом, а не служебным названием. */
/* «Больше»/«Меньше» — служебные названия операторов (REAL_FILTER_PRED/
   numMatches трактуют их включительно: «Больше» = ≥, «Меньше» = ≤ — см.
   numMatches). Раньше это никак не отражалось в тексте: «Не менее 60
   дней» подтверждалось как «Больше» (или вообще без оператора — если он
   совпадал с ops[0] у поля), а «больше» по-русски читается как строгое
   «>», не «не менее» (≥) — путало пользователя. Теперь везде, где
   оператор показывается человеку (подтверждение в чате, дропдаун в
   «Критериях подбора»), — однозначная словесная формулировка, а не голое
   служебное название. */
/* «Диапазон» без второй границы (одно число, не настоящий "от–до") раньше
   подписывался «≈ примерно» — но numMatches теперь сравнивает точно (см.
   комментарий там), а подпись обещала неточность, которой на самом деле
   нет (просьба заказчика, 18.08.2026: «должно быть чётко всё, как
   пользователь просит»). Настоящий диапазон "min-max" вообще не заходит в
   OP_LABEL — он форматируется отдельно в numValLabel() как «от X до Y». */
const OP_LABEL = {'Больше':'больше или равно','Меньше':'меньше или равно','Равен':'равен','Диапазон':'равен','До':'до','После':'после'};
/* Значение может быть настоящим диапазоном "min-max" (см. parseNumberRange) —
   для него «≈ примерно» (OP_LABEL['Диапазон']) вводит в заблуждение: обе
   границы известны точно, показываем «от X до Y», а не приближение. */
function numValLabel(op, value){
  const range = parseRangeStr(value);
  if(range) return `от ${fmt(range.min)} до ${fmt(range.max)}`;
  return `${OP_LABEL[op]||op} ${esc(String(value))}`;
}
function applyFreeAnswer(name, f, rawText, result){
  if(result.ok && result.value!=null && result.value!==''){
    const op = result.op || f.ops[0];
    const kind = llmFieldKind(f);
    const shown = kind==='numeric'
      ? numValLabel(op, result.value)
      : esc(String(result.value));
    say('bot', `Понял «${esc(rawText)}» как: <b>${shown}</b>`);
    addFilter(name, op, result.value, f.delta);
    render();
    checkZero();
    if(S.workingSet.length<=5) return;
    advanceAfterAnswer();
    return;
  }
  /* Раньше при нераспознанном ответе сырой текст всё равно подставлялся как
     «значение» критерия (addFilter(name, f.ops[0], rawText, ...)) — для полей
     с закрытым списком вариантов (enum) это создавало фильтр со значением,
     которого в принципе не может быть у процедуры («Москва» как «Регион
     заказчика», когда LLM не смогла её сопоставить), и REAL_FILTER_PRED либо
     молча ни с чем не совпадал, либо совпадал случайно. Для enum-полей текст
     из ответа пользователя в фильтр больше НЕ попадает — вместо этого
     переспрашиваем и снова показываем те же варианты (тот же вопрос остаётся
     открытым, S.qi не двигается). Для числовых — тоже не подставляем текст
     "как есть" вместо числа, а просим уточнить. */
  const reason = !result.ok
    ? `сервис распознавания недоступен (${esc(result.reason||'ошибка сети')})`
    : 'не удалось сопоставить ответ ни с одним из допустимых вариантов';
  const kind = llmFieldKind(f);
  S.chat.forEach(m=>{ if(m.x==='question') m.x=null; }); /* см. pushQuestionMsg() — та же защита от двух активных вопросов сразу */
  if(kind==='enum'){
    say('bot', `Не смог распознать «${esc(rawText)}» — ${reason}.<br>Выберите один из вариантов ниже или переформулируйте ответ.`, 'question');
  } else {
    say('bot', `Не смог извлечь число из «${esc(rawText)}» — ${reason}.<br>Уточните значение или выберите готовый вариант ниже.`, 'question');
  }
  render();
}
function goBack(){
  if(!S.history.length) return;
  const cp = S.history.pop();
  S.filters.length = cp.filtersLen; S.usedItems.length = cp.usedLen; S.skipped.length = cp.skippedLen||0; S.chat.length = cp.chatLen;
  /* S.workingSet тоже нужно откатить, а не только S.filters — иначе после
     «Назад» список кандидатов остаётся сужен по уже отменённому ответу.
     Пересчитываем с нуля от исходного запроса по оставшимся критериям. */
  recomputeWorkingSet();
  S.total = currentTotal();
  /* Восстанавливаем поле НАПРЯМУЮ (cp.f), а не через S.queue[cp.qi] — см.
     комментарий у S.history.push(). Позицию в очереди ищем по имени поля в
     ТЕКУЩЕМ S.queue (могла сместиться из-за вставки нового вопроса), а не
     доверяем старому числовому индексу; если поля в очереди уже нет вовсе
     (она была заменена целиком другим набором блоков) — используем старый
     qi как запасной вариант. */
  S.curField = cp.f;
  const idxInQueue = S.queue.indexOf(cp.f);
  S.qi = idxInQueue>=0 ? idxInQueue : cp.qi;
  /* Раньше здесь безусловно превращали ПОСЛЕДНЕЕ сообщение в чате в
     «активный вопрос» (lastMsg.x='question'), предполагая, что усечение
     чата по chatLen всегда честно возвращает именно то сообщение с
     вопросом по cp.f. Это ломалось, если между вопросом и ответом выборка
     успевала обнулиться/сильно сократиться (checkZero прерывает очередь,
     НЕ продвигая qi) — тогда «последним» после усечения оказывалось
     сообщение совсем другого типа (карусель/CTA), и «Назад» показывал ЕГО
     текст с чипами от cp.f — рассинхрон вопроса и вариантов ответа
     (реальный баг, найден фазз-тестированием 18.08.2026). Теперь честно
     проверяем: похоже ли последнее сообщение на вопрос именно по cp.f —
     если нет, просто переспрашиваем его заново, а не подменяем чужое
     сообщение. */
  const f = FIELD_DEFS[cp.f];
  const lastMsg = S.chat[S.chat.length-1];
  const looksRight = f && lastMsg && lastMsg.who==='bot' && lastMsg.h.includes(esc(f.q));
  S.animatedCount = Math.min(S.animatedCount, S.chat.length);
  S.busy = false;
  if(looksRight){ lastMsg.x = 'question'; render(); }
  else if(f){ pushQuestionMsg(cp.f); }
  else { render(); }
}
/* Единая точка «что показать после того, как выборка изменилась» — ноль/мало,
   уже достаточно узко (<=GOOD_ENOUGH) или критериев для уточнения больше не
   осталось → CTA (finishGood), иначе — предложить уточнить ещё. Раньше это
   решение принимал только afterQueue() (после прохождения всей очереди
   вопросов), а во всех местах, где выборка меняется ПОСЛЕ уже показанного
   CTA (снятие критерия при нуле/малом результате, снятие критерия чипом на
   CTA, запуск по шаблону) — стояла грубая проверка «<=5 → мало, иначе сразу
   Готово», игнорирующая GOOD_ENOUGH: могло получиться, что после снятия
   критерия остаётся, скажем, 6000 процедур, а бот всё равно бодро говорит
   «Готово, я собрал подборку», хотя тот же самый размер выборки в обычном
   потоке (afterQueue) продолжил бы спрашивать критерии дальше — нечестная
   рассинхронизация одного и того же решения (найдено сквозным тестированием
   разных сценариев, 13.08.2026). */
function continueOrFinish(){
  if(S.workingSet.length<=5) return handleSmallResult();
  const remaining = BLOCKS.some(b=>b.items.some(it=>!S.usedItems.includes(it)));
  if(S.workingSet.length<=GOOD_ENOUGH || !remaining){
    finishGood();
  } else {
    S.carPage=0;
    say('bot', `Понял. Выборка процедур всё ещё большая.<br><span style="color:var(--ink3);font-size:12.5px">Найдено <b class="num">${fmt(S.total)}</b> процедур</span><br><b>Уточните ещё несколько критериев из списка</b>`, 'carousel');
    render();
  }
}
function afterQueue(){ continueOrFinish(); }
/* Проверяем обнуление сразу после каждого ответа (а не только когда пройдены
   все вопросы очереди) — чтобы не заставлять докликивать оставшиеся вопросы,
   если выборка уже обнулилась, скажем, на 7-м из 10. */
function checkZero(){
  if(S.workingSet.length<=5){
    /* Прерываем очередь честно, а не тихо «замораживаем» qi посреди
       недопройденного вопроса — иначе S.qi продолжает указывать на уже
       обработанное поле, из-за чего S.curField расходится с тем, что
       реально показано в чате (zero/low-сообщение вместо вопроса) — а это
       путает всё, что дальше читает S.qi/S.curField (goBack, повторный
       выбор блока и т.п.; реальный баг, найден фазз-тестированием,
       18.08.2026). Само поле, вопрос по которому был прерван, остаётся
       отвеченным/пропущенным честно — через S.filters/S.usedItems, как и
       раньше, к очереди оно больше не относится. */
    S.qi = S.queue.length;
    botThink(()=>{ handleSmallResult(); }, 700);
  }
}
/* «Ноль» и «мало, но не ноль» — РАЗНЫЕ сообщения (просьба заказчика,
   12.08.2026): при настоящем нуле нельзя говорить «почти нет» — только
   прямо «торгов нет», с указанием критерия, который обнулил выборку, и
   предложением архива. При просто малом непустом результате (скажем, 4
   процедуры) — архив предлагать НЕ нужно, это не тот сценарий. */
function handleSmallResult(){
  if(S.workingSet.length===0) showZero(); else showLow();
}
/* Первый (по порядку применения) этап, на котором пересечение стало
   пустым — раз дальше по пустому множеству фильтровать уже нечего, это и
   есть критерий, который обнулил выборку. Без предположений/угадывания —
   реальный перебор реальных предикатов (computeStages), тот же, что
   используется в модалке «Критерии подбора». Индекс нужен отдельно от
   имени — по нему честно откатываем именно до этой точки (см.
   removeZeroCause()), а не наугад убираем последний применённый фильтр,
   который мог быть вообще ни при чём. */
function zeroCauseIndex(){
  const stages = computeStages();
  return stages.findIndex(s=>s.ws.length===0);
}
function zeroCauseFilter(){
  const idx = zeroCauseIndex();
  return idx>=0 ? S.filters[idx].f : null;
}
/* Раньше кнопка «убрать критерий» при нуле всегда откатывала критерий-
   виновника И ВСЁ, что было применено после него (см. removeZeroCause) —
   гарантированно работало, но иногда сносило сразу несколько критериев
   за один клик, что выглядело неожиданно резко. Теперь сначала честно
   пробуем найти ОДИН критерий, чьё снятие само по себе (при сохранении
   всех остальных) уже даёт непустой результат — пробуем сперва самого
   виновника (обычно самый ожидаемый вариант), потом остальные по порядку.
   Если такой единственный критерий находится — снимаем только его.
   Если нет (к нулю приводит СОЧЕТАНИЕ нескольких критериев, а не один) —
   -1, и тогда единственный рабочий вариант — снять несколько сразу
   (removeZeroCause), но об этом теперь честно предупреждаем в тексте, а
   не тихо удаляем много без объяснения. */
function singleFilterFixIndex(){
  if(!S.filters.length) return -1;
  const causeIdx = zeroCauseIndex();
  const order = [causeIdx, ...S.filters.map((_,i)=>i).filter(i=>i!==causeIdx)];
  for(const i of order){
    if(i<0) continue;
    let ws = rankMatches(S.query);
    S.filters.forEach((r,j)=>{
      if(j===i) return;
      const pred = REAL_FILTER_PRED[r.f];
      if(pred) ws = ws.filter(id=>{ const p=PROCS_BY_ID.get(id); return p && pred(p, r.v, r.o); });
    });
    if(ws.length>0) return i;
  }
  return -1;
}
/* Снимает РОВНО один критерий по индексу — используется, когда
   singleFilterFixIndex() нашёл, что этого достаточно (в отличие от
   removeCriterion(), которая всегда снимает последний, и removeZeroCause(),
   которая может снять несколько). */
function removeFilterAt(idx){
  const rem = S.filters[idx];
  if(!rem) return;
  S.filters.splice(idx,1);
  const ui = S.usedItems.indexOf(rem.f); if(ui>=0) S.usedItems.splice(ui,1);
  const si = S.skipped.indexOf(rem.f); if(si>=0) S.skipped.splice(si,1);
  recomputeWorkingSet();
  S.total = currentTotal();
  say('me', `Убрать критерий «${esc(rem.f)}»`);
  const last=S.chat.filter(m=>m.x==='zero'||m.x==='low').pop(); if(last) last.x=null;
  render();
  botThink(()=>{ continueOrFinish(); }, 850);
}
/* Настоящий ноль — «торгов нет», без «почти», с точным виновником
   (zeroCauseFilter) и большой кнопкой перехода в архив (см. mRender:
   m.x==='zero') — доступ к архиву предлагаем ТОЛЬКО здесь, не в showLow(). */
function showZero(){
  const single = singleFilterFixIndex();
  let extra = '';
  if(single>=0){
    extra = `<br>Критерий «${esc(S.filters[single].f)}» полностью исключил все совпадения.`;
  } else {
    const causeIdx = zeroCauseIndex();
    if(causeIdx>=0){
      const names = S.filters.slice(causeIdx).map(r=>r.f);
      extra = `<br>К нулю привело сочетание нескольких критериев: «${names.map(n=>esc(n)).join('», «')}» — снять придётся не один, а сразу несколько.`;
    }
  }
  say('bot', `По вашим критериям процедур нет.${extra}`, 'zero');
  render();

/* «Мало, но не ноль» — без предложения архива (просьба заказчика): в
   сценарии «осталось 4 процедуры» это не обнуление, а нормальный (пусть и
   узкий) результат — архив здесь неуместен. */
function showLow(){
  const lastF = S.filters[S.filters.length-1];
  say('bot', `Найдено <b class="num">${fmt(S.workingSet.length)}</b> процедур.<br>В данный момент почти нет торгов, отвечающих на сто процентов вашим критериям.${lastF?`<br>Критерий «${esc(lastF.f)}» сильно сократил результаты выборки.`:''}`, 'low');
  render();
}
function removeCriterion(){
  const rem = S.filters.pop();
  /* Как и в removeAppliedFilter() — отмена критерия должна убирать поле и
     из usedItems, иначе оно навсегда останется «выбранным для уточнения»
     в глазах railSteps()/hasMoreCriteria(), хотя сам критерий уже снят. */
  if(rem){
    const ui = S.usedItems.indexOf(rem.f); if(ui>=0) S.usedItems.splice(ui,1);
    const si = S.skipped.indexOf(rem.f); if(si>=0) S.skipped.splice(si,1);
  }
  recomputeWorkingSet();
  S.total = currentTotal();
  say('me', rem?`Убрать критерий «${rem.f}»`:'Убрать последний критерий');
  const last=S.chat.filter(m=>m.x==='zero'||m.x==='low').pop(); if(last) last.x=null;
  render();
  /* Убрали критерий — не факт, что это сразу решило дело: перепроверяем
     заново (может, ноль/мало сохранились из-за другого критерия), а не
     бодро идём в finishGood() вслепую, как было раньше. */
  botThink(()=>{ continueOrFinish(); }, 850);
}
/* Для настоящего нуля (просьба заказчика, 13.08.2026): предлагаем не
   наугад «убрать последний критерий» (как removeCriterion() — тот мог
   быть вообще ни при чём), а гарантированно вернуть хотя бы одну
   процедуру — убираем именно критерий-виновника (zeroCauseIndex) И всё,
   что было применено ПОСЛЕ него: те более поздние критерии применялись
   уже к пустому множеству, их эффект на самом деле неизвестен, оставлять
   их как есть означало бы снова рисковать нулём. */
function removeZeroCause(){
  const idx = zeroCauseIndex();
  if(idx<0) return;
  const removed = S.filters.slice(idx).map(r=>r.f);
  S.filters.length = idx;
  removed.forEach(name=>{
    const ui = S.usedItems.indexOf(name); if(ui>=0) S.usedItems.splice(ui,1);
    const si = S.skipped.indexOf(name); if(si>=0) S.skipped.splice(si,1);
  });
  recomputeWorkingSet();
  S.total = currentTotal();
  say('me', removed.length>1 ? `Убрать критерии: ${removed.map(n=>`«${esc(n)}»`).join(', ')}` : `Убрать критерий «${esc(removed[0])}»`);
  const last=S.chat.filter(m=>m.x==='zero'||m.x==='low').pop(); if(last) last.x=null;
  render();
  botThink(()=>{ continueOrFinish(); }, 850);
}
/* «← Назад» — везде, где есть что отменить (S.history), а не только в
   вопросе анкеты и на CTA, как было раньше (просьба заказчика,
   13.08.2026). goBack() всегда откатывает к состоянию ПЕРЕД последним
   отвеченным вопросом анкеты — это верно независимо от того, что показано
   на экране прямо сейчас (карусель, приглашение уточнить, «почти
   ничего»/«ничего не найдено»), потому что запись в S.history делается
   именно в момент ответа на вопрос, а не при каждом клике вообще. */
function backRow(){
  return S.history.length ? `<div class="backrow"><button class="chip back" onclick="goBack()">← Назад</button></div>` : '';
}
/* По просьбе заказчика (13.08.2026) — клик по «Показать архивные процедуры»
   ничего реально не переключает (архивных данных в этом прототипе нет),
   а просто показывает то же информационное сообщение (toast), что и в
   остальных местах приложения при похожей ситуации — например, конец
   реальных данных при перелистывании грида (см. gridPage()). Ничего в
   состоянии не меняется — ни S.workingSet, ни чат, поэтому и render() не
   нужен, как и в gridPage(). */
function keepArchive(){
  toast('Здесь появятся архивные процедуры по вашим критериям — в этом прототипе архивных данных пока нет.');
}
function finishGood(){
  say('bot', `Готово. Я собрал подборку по вашим требованиям.`, 'cta');
  render();
  setTimeout(()=>botThink(()=>{ say('bot','Хотите сделать подборку точнее? Я могу дополнительно проверить:','more'); render(); }, 700), 100);
}
function ctaCard(){
  /* Число на CTA — всегда S.total = S.workingSet.length (см. currentTotal()) —
     настоящее, ровно то же, что покажет грид при открытии. */
  const q=(S.query||'').trim(); const short=q.length>28?q.slice(0,26)+'…':q;
  /* Раньше отменить критерий или вернуться на шаг назад можно было, только
     пока открыт сам вопрос анкеты (чип «← Назад» жил внутри questionChips()) —
     как только появлялся CTA, кнопка «Назад» пропадала совсем, а отменить
     конкретный уже применённый критерий можно было только через модалку
     «Критерии подбора». Теперь оба действия доступны прямо под CTA. */
  /* Для числовых критериев показываем словесный оператор/диапазон
     (numValLabel), а не голое сохранённое значение — иначе, например,
     диапазон «3000000-15000000» выглядел бы как случайное число с
     дефисом, а «не менее 60» превращалось обратно в голое «60». */
  const chips = S.filters.map((r,i)=>{
    const fdef = FIELD_DEFS[r.f];
    const valDisp = (fdef && llmFieldKind(fdef)==='numeric') ? numValLabel(r.o, r.v) : esc(String(r.v));
    return `<span class="critchip">${esc(r.f)}: ${valDisp}<button class="critx" onclick="event.stopPropagation();removeAppliedFilter(${i})" title="Убрать критерий">✕</button></span>`;
  }).join('');
  const backBtn = S.history.length ? `<button class="chip back" onclick="event.stopPropagation();goBack()">← Назад</button>` : '';
  return `<div class="ctac" onclick="openGrid()">
    <div class="ic">🔍</div><div class="tx">${esc(short||'Подборка')}</div><div class="cn num">${fmt(S.total)}</div></div>
    ${(chips||backBtn)?`<div class="critchips">${chips}${backBtn}</div>`:''}`;
}
/* Отмена конкретного (не обязательно последнего) уже применённого критерия
   прямо из чата, без открытия модалки. Как и removeCriterion() (сценарий
   «выборка обнулилась») — снимаем критерий и заново прогоняем реальные
   предикаты по остальным (recomputeWorkingSet), а не подгоняем счётчик руками. */
function removeAppliedFilter(i){
  const rem = S.filters[i];
  if(!rem) return;
  S.filters.splice(i,1);
  const ui = S.usedItems.indexOf(rem.f);
  if(ui>=0) S.usedItems.splice(ui,1);
  const si = S.skipped.indexOf(rem.f);
  if(si>=0) S.skipped.splice(si,1);
  recomputeWorkingSet();
  S.total = currentTotal();
  say('me', `Убрать критерий «${rem.f}»`);
  render();
  botThink(()=>{ continueOrFinish(); }, 700);
}
function freeT(){
  const el=document.getElementById('freeIn'); const t=(el.value||'').trim(); if(!t||S.busy) return;
  el.value='';
  const pendingQ = S.chat.filter(m=>m.x==='question').pop();
  if(pendingQ) return freeAnswerToQuestion(t);
  /* Раньше «да» в ответ на «Хотите сделать подборку точнее?» падало в общую
     ветку ниже — бот отвечал «Учёл. Продолжим уточнение через блоки
     критериев ниже.», но сами блоки никогда не показывались. Теперь
     утвердительный ответ реально открывает карусель (как кнопка ниже). */
  const pendingMore = S.chat.filter(m=>m.x==='more').pop();
  if(pendingMore && /^(да|конечно|давай|хочу|ага|уточн|точнее)/i.test(t)) return answerMore(true, t);
  /* Ни открытого вопроса анкеты, ни prompt «точнее?» — значит, пользователь
     сам, по своей инициативе, написал что-то в свободном поле (например,
     сразу про национальный режим, не дожидаясь, пока до него дойдёт
     очередь блоков). Пытаемся понять, к какому критерию это относится. */
  return freeCriterionFromChat(t);
}
/* ---------- свободный критерий из чата (не ответ на активный вопрос) ----------
   Простая, не ИИ-эвристика для угадывания ПОЛЯ (по совпадению слов с
   названием/вопросом поля — та же tokenize()/stemMatch(), что уже
   используется для сопоставления запроса с процедурами), плюс уже готовый
   и проверенный пайплайн LLM-распознавания ЗНАЧЕНИЯ (llmExtract) — для поля
   он и так умеет честно отвечать «не понял» вместо угадывания. Намеренно
   один критерий за сообщение — не пытаемся разобрать несколько критериев
   в одной фразе, это usability-сложность, которую пока не просили решать. */
function fieldSearchText(name){
  const f = FIELD_DEFS[name];
  /* fieldLabel(name) — то, что пользователь реально ВИДИТ и печатает
     («Способ выбора победителя»), а не внутренний технический ключ поля
     («Метод оценки») — раньше здесь стоял голый name, и переименованные
     по CSV поля (12.08.2026) с этого момента вообще перестали угадываться
     (или угадывались как другое поле, у которого случайно совпало слово
     в СТАРОМ ключе — «Способ выбора победителя» находило «Способ оплаты»,
     потому что оба ключа начинаются на «Способ», хотя показываемое
     название «Метод оценки» с этим текстом вообще не пересекалось). */
  const parts = [fieldLabel(name), name, f.q||''];
  if(Array.isArray(f.values)) parts.push(...f.values);
  return parts.join(' ');
}
/* Сырой счёт совпавших токенов (сколько слов из текста нашлось в имени/
   вопросе/значениях поля) был обманчив на составных названиях: «Тип
   торгов» и «Статус торгов» оба содержат слово «торгов» — при вводе «Тип
   торгов» токенизируется только «торгов» (само «тип» короче 4 букв и
   отсекается), и оба поля получали одинаковый счёт 1 — честная ничья, но
   неправильная, ведь пользователь буквально написал название критерия.
   Считаем ДОЛЮ покрытия — сколько токенов САМОГО ИМЕНИ поля нашлось в
   тексте (matched / общее число токенов имени), а не сколько токенов
   текста нашлось хоть где-то. Для «Тип торгов» (имя целиком — один
   значимый токен «торгов») это будет 1/1=100%, для «Статус торгов»
   (два токена «статус»+«торгов») — 1/2=50%: явный перевес у точного поля. */
function fieldNameCoverage(name, toks){
  const nameToks = tokenize(fieldLabel(name)); /* по видимому названию, не по техническому ключу — см. комментарий в fieldSearchText() */
  if(!nameToks.length) return 0;
  const matched = nameToks.filter(h=>toks.some(t=>stemMatch(h,t))).length;
  return matched/nameToks.length;
}
function fieldMatchScore(name, toks){
  const hay = tokenize(fieldSearchText(name));
  let s = 0;
  toks.forEach(t=>{ if(hay.some(h=>stemMatch(h,t))) s++; });
  return s;
}
/* Совпадение конкретно с одним из ДОПУСТИМЫХ ЗНАЧЕНИЙ поля (а не просто с
   его названием/вопросом) — гораздо более сильный сигнал: значение вроде
   «отсрочка» буквально называет конкретный ответ, а не просто упоминает
   тему. Реальный случай (18.08.2026): «нужна отсрочка платежа на 30 дней» —
   слово «отсрочка» точно совпадает со значением поля «Способ оплаты», а
   слово «платежа» лишь стеммится с частью НАЗВАНИЯ другого поля («Этапность
   платежей»/«Этапы оплаты») — без разделения по силе сигнала оба поля
   получали одинаковый fieldMatchScore, попадали в ничью и guessFieldFromText
   честно, но неудачно, отказывался угадывать вовсе (см. ниже). */
function fieldValueScore(name, toks){
  const f = FIELD_DEFS[name];
  const vals = Array.isArray(f.values) ? f.values : [];
  if(!vals.length) return 0;
  /* Не «сколько слов из текста нашлось хоть где-то среди значений» (тогда
     частичное совпадение с ОДНИМ словом многословного значения — «платежей»
     из «График платежей» — весило бы наравне с полным совпадением
     однословного значения «Отсрочка», что и создавало ложную ничью выше).
     А максимальная ДОЛЯ покрытия по каждому отдельному значению — полное
     совпадение с целым значением весит больше, чем совпадение с частью
     составного. */
  let best = 0;
  vals.forEach(v=>{
    const vToks = tokenize(v);
    if(!vToks.length) return;
    const matched = vToks.filter(vt=>toks.some(t=>stemMatch(vt,t))).length;
    best = Math.max(best, matched/vToks.length);
  });
  return best;
}
/* Угадываем только среди ещё НЕ отвеченных полей (S.usedItems) — если
   критерий уже проставлен, менять его через свободный текст не пытаемся:
   для этого уже есть модалка «Критерии подбора» и ✕ на чипе критерия.
   Возвращаем null, если ничего не совпало или совпадение неоднозначно —
   лучше честно не угадать, чем выбрать не то поле. Два прохода:
   1) точное/подстрочное совпадение с названием поля — сильный сигнал,
      пользователь буквально написал имя критерия («Тип торгов»);
   2) иначе — по доле покрытия имени поля (см. fieldNameCoverage), а при
      равенстве долей — по количеству реально совпавших слов (fieldMatchScore). */
function guessFieldFromText(text){
  const toks = tokenize(text);
  const rawToks = rawWords(text); /* без ограничения по длине — см. labelWordsRaw */
  if(!toks.length && !rawToks.length) return null;
  const candidates = Object.keys(FIELD_DEFS).filter(n=>!S.usedItems.includes(n));
  const norm = normRu(text).trim();
  /* Сверяем и с видимым названием (label), и со старым техническим ключом
     (name) — второе на случай, если пользователь всё же напечатал старую
     формулировку по памяти. Плюс — отдельно точное совпадение по ЦЕЛОМУ
     слову-аббревиатуре из явного списка («ИНН», «КСР» — tokenize() режет их
     по длине >3 символа, поэтому без отдельной проверки эти поля вообще не
     находились по свободному тексту, см. labelWordsRaw).
     ВАЖНО: список именно ЯВНЫЙ (не «любое слово короче N символов») —
     сначала пробовали общее правило по длине (сначала «>=3» — реальный баг,
     18.08.2026: обычное слово «продукции» длиннее 3 букв тоже считалось
     точным совпадением и путало «Тип продукции»/«Категория ОКПД 2»; потом
     «<=3» — тоже реальный баг: короткие предлоги «на»/«по»/«до» и т.п.
     длиной 2-3 буквы есть почти в любой фразе и есть в лейблах случайных
     полей — тоже создавали ложные точные совпадения). Обычные слова любой
     длины и так находятся штатным scored-путём ниже
     (fieldNameCoverage/fieldMatchScore/fieldValueScore) — этот список нужен
     ТОЛЬКО для настоящих аббревиатур, которые иначе не увидит вообще
     ничего. */
  const FIELD_ABBREVS = new Set(['инн','кср','окпд2','нмц','бг','мсп','соно']);
  const exact = candidates.filter(n=>norm.includes(normRu(fieldLabel(n))) || norm.includes(normRu(n))
    || labelWordsRaw(n).some(w=>FIELD_ABBREVS.has(w) && rawToks.includes(w)));
  if(exact.length===1) return exact[0];
  if(exact.length>1){
    /* Название одного поля целиком входит в название другого (редко, но
       возможно) — берём самое длинное/специфичное совпадение по видимому
       названию. */
    exact.sort((a,b)=>fieldLabel(b).length-fieldLabel(a).length);
    return exact[0];
  }
  const scored = candidates
    .map(n=>({n, cov:fieldNameCoverage(n, toks), s:fieldMatchScore(n, toks), vs:fieldValueScore(n, toks)}))
    .filter(x=>x.s>0);
  if(!scored.length) return null;
  /* Совпадение с конкретным значением поля (vs) — приоритетнее покрытия
     названия/общего счёта: «отсрочка» точно называет вариант ответа, это
     сильнее, чем случайное пересечение слов в названии другого поля. */
  scored.sort((a,b)=>b.vs-a.vs || b.cov-a.cov || b.s-a.s);
  if(scored.length>1 && scored[0].vs===scored[1].vs && scored[0].cov===scored[1].cov && scored[0].s===scored[1].s) return null;
  return scored[0].n;
}
/* Реальный кейс (13.08.2026): «хочу уточнить график поставки» → поле
   угадалось верно («Режим поставки»), но САМОГО значения в тексте физически
   нет — только намерение обсудить критерий. LLM тем не менее вернула
   «Партиями» — вопреки инструкции признаться, что не распознала (см.
   validateLlmResult/recognized). Это ровно тот случай, который принцип
   проекта запрещает: подставлять правдоподобное значение вместо честного
   «не знаю». Отсекаем такие фразы ДЕТЕРМИНИРОВАННО, ДО обращения к LLM —
   не полагаемся на дисциплину модели там, где можно проверить в JS.
   Логика: убираем из токенов текста токены названия поля (label считается,
   не техническое имя — то, что пользователь реально печатает) и известные
   «намеренческие» глаголы/слова («хочу», «уточнить», «указать», «задать»,
   «узнать», «важно» и т.п. по стеблю) — если после этого не осталось ни
   одного токена, значит содержательной информации о ЗНАЧЕНИИ в тексте нет. */
const META_INTENT_STEMS=['уточн','указа','задат','задай','узна','определ','выбер','выбра','интерес','важн','сообщ','напиш','ввод','введ','вписа','поставь','настро','измен','поменя','хотел','хочет'];
function isMetaIntentOnly(text, name){
  /* Числовой код/номер (ОКПД2, ИНН и т.п.) — это уже само по себе значение,
     а не «намерение обсудить критерий». Но tokenize() режет группы цифр
     короче 4 символов (задумано для слов, не для кодов «70.33.93.273» —
     каждая группа между точками короче 4) — без этой проверки текст вида
     «ОКПД2 70.33.93.273» после вычитания токенов названия поля оставался
     совсем пустым, и реальный код ошибочно считался «намерением без
     значения» (реальный баг 13.08.2026, тот же класс, что и матчинг по
     ОКПД2 в REAL_FILTER_PRED — см. okpd2Match). Двух цифр подряд достаточно,
     чтобы не спутать с «критерий номер 2» и т.п. */
  if(/\d{2,}/.test(text)) return false;
  const toks = tokenize(text);
  if(!toks.length) return true;
  const labelToks = new Set(tokenize(fieldLabel(name)).concat(tokenize(name)));
  const remaining = toks.filter(t=>!labelToks.has(t) && !META_INTENT_STEMS.some(stem=>t.startsWith(stem)));
  return remaining.length===0;
}
async function freeCriterionFromChat(text){
  say('me', esc(text));
  render();
  const name = guessFieldFromText(text);
  if(!name){
    /* Поле не угадано вообще — не гадаем и не отделываемся общей фразой,
       а прямо показываем блоки критериев, чтобы пользователь уточнил сам
       (то же самое, что делает кнопка «Уточнить ещё критерии»). */
    botThink(()=>{
      if(hasMoreCriteria()) manualRefine();
      else say('bot','Кажется, вы уже указали все доступные критерии.');
      render();
    }, 700);
    return;
  }
  const f = FIELD_DEFS[name];
  /* Поле угадано, но в тексте нет самого значения — только намерение
     («хочу уточнить график поставки») — см. isMetaIntentOnly(). Не идём
     ни в addFilter() с сырым текстом (для text-полей), ни в LLM (для
     enum/numeric, где модель на практике может всё равно угадать
     правдоподобное значение вместо честного «не распознано») — сразу
     задаём этот критерий как обычный вопрос анкеты, с готовыми чипами. */
  if(isMetaIntentOnly(text, name)){
    if(!S.usedItems.includes(name)) S.usedItems.push(name);
    S.queue.splice(S.qi, 0, name);
    S.curField = name;
    askQuestion();
    return;
  }
  const kind = llmFieldKind(f);
  if(kind==='text'){
    /* См. stripLabelWords: реальный кейс 13.08.2026 — «ОКПД2 70.33.93.273»
       без очистки сохранял «2» из слова «ОКПД2» слева от кода, код переставал
       совпадать с настоящим значением на карточке. */
    const cleanVal = stripLabelWords(text, name) || text;
    addFilter(name, f.ops[0], cleanVal, f.delta);
    if(!S.usedItems.includes(name)) S.usedItems.push(name);
    botThink(()=>{ say('bot', `Понял — добавил критерий «${esc(name)}»: ${esc(cleanVal)}`); render(); checkZero(); }, 700);
    return;
  }
  /* Диапазон («от 3 до 15 млн») — детерминированно, до LLM, см.
     parseNumberRange() (реальный случай 13.08.2026: «нмц от 3 до 15 млн»
     теряло вторую границу и отображалось как «≈ примерно 3 000 000»). */
  if(kind==='numeric' && f.ops.includes('Диапазон')){
    const range = parseNumberRange(text);
    if(range){
      const value = `${range.min}-${range.max}`;
      addFilter(name, 'Диапазон', value, f.delta);
      if(!S.usedItems.includes(name)) S.usedItems.push(name);
      say('bot', `Понял — добавил критерий «${esc(name)}»: <b>${numValLabel('Диапазон', value)}</b>`);
      render();
      checkZero();
      return;
    }
  }
  S.busy = true; render();
  const result = await llmExtract(text, name, f);
  S.busy = false;
  if(result.ok && result.value!=null && result.value!==''){
    const op = result.op || f.ops[0];
    const shown = kind==='numeric'
      ? numValLabel(op, result.value)
      : esc(String(result.value));
    addFilter(name, op, result.value, f.delta);
    if(!S.usedItems.includes(name)) S.usedItems.push(name);
    say('bot', `Понял — добавил критерий «${esc(name)}»: <b>${shown}</b>`);
    render();
    checkZero();
    return;
  }
  /* Поле угадали, а конкретное значение из текста — нет: не молчим и не
     сбрасываем попытку, а задаём этот же вопрос как обычный, с готовыми
     чипами-вариантами (вставляем его следующим в очередь — дальше это
     обрабатывается совершенно штатно через answerQ()/freeAnswerToQuestion(),
     без какого-либо специального кода). Отдельно помечаем поле в
     usedItems — обычно это делает confirmPick() в момент выбора чипа в
     карусели, но здесь мы вставляем вопрос в очередь В ОБХОД confirmPick(),
     и без этой строчки блок с этим критерием никогда не появлялся в
     «Ходе подбора» (railSteps строит список именно из usedItems) — то
     самое расхождение с выбором через кнопки в блоках, о котором сообщили. */
  if(!S.usedItems.includes(name)) S.usedItems.push(name);
  S.queue.splice(S.qi, 0, name);
  S.curField = name;
  askQuestion();
}
function moreBlock(){
  return `<ul class="blist">${['требования к участнику;','заказчиков;','критерии оценки;','национальный режим;','ТЗ и спецификацию;','наличие эквивалента;','ОКПД2 / КСР;','сроки поставки;','срок действия КП.']
    .map(x=>`<li>${x}</li>`).join('')}</ul>
    ${backRow()}
    <div class="chiprow">
      <button class="chip" onclick="answerMore(true)">Да, уточнить</button>
      <button class="chip muted" onclick="answerMore(false)">Нет, покажите что есть</button>
    </div>`;
}
function answerMore(yes, rawText){
  say('me', esc(rawText || (yes?'Да, уточните':'Нет, покажите что есть')));
  const last=S.chat.filter(m=>m.x==='more').pop(); if(last) last.x=null;
  render();
  if(!yes){
    /* Раньше клик по «Нет, покажите что есть» ничего не делал: чипы
       прятались, а дальше — тишина. CTA-карточка технически уже была
       выше в чате (см. finishGood()/ctaCard), но пользователю никак не
       подсказывалось, что именно там и есть результат — выглядело так,
       будто кнопка ни к чему не ведёт (реальный баг, 13.08.2026). Раз
       пользователь прямо попросил «покажите что есть» — открываем грид
       сразу, а не оставляем искать CTA глазами по прокрутке чата выше. */
    botThink(()=>{ openGrid(); }, 500);
    return;
  }
  botThink(()=>{
    if(hasMoreCriteria()) manualRefine();
    else say('bot','Больше критериев для уточнения не осталось — это уже максимально узкая подборка по имеющимся параметрам.');
    render();
  }, 700);
}


/* ---------- RAIL: Ход подбора ---------- */
/* Статус — по настоящему S.workingSet, никакой развилки по фазе (её
   больше нет). Цвет/подпись/pct здесь чисто косметические — за РЕШЕНИЯ
   (когда обнулять выборку, когда показывать CTA) отвечают
   afterQueue()/checkZero(). */
function statusInfo(){
  if(S.workingSet.length<=5) return {label:'Требует внимания', color:'var(--red)', pct:92};
  if(S.workingSet.length<=GOOD_ENOUGH) return {label:'Уточнение', color:'var(--amber)', pct:88};
  if(S.filters.length>0) return {label:'Начало подбора', color:'var(--rust)', pct:Math.min(30, 8+S.filters.length*6)};
  return {label:'Начало подбора', color:'var(--rust)', pct:8};
}
function hasMoreCriteria(){ return BLOCKS.some(b=>b.items.some(it=>!S.usedItems.includes(it))); }
function manualRefine(){
  if(S.busy || !hasMoreCriteria()) return;
  S.carPage=0;
  say('bot', `Хорошо, вот ещё критерии, которыми можно уточнить подборку:`, 'carousel');
  render();
  scrollChat();
}
/* Раньше здесь были два жёстко зашитых шага («Параметры закупки»,
   «Сроки и графики») с проверками, вообще не привязанными к тому, что
   реально выбрал пользователь. Теперь список в «Ходе подбора» строится
   динамически из того, какие блоки критериев пользователь фактически
   выбрал для уточнения (через карусель), и в том порядке, в котором он
   их выбирал — а не из фиксированного списка из двух пунктов.

   Источник правды — S.usedItems: поле попадает туда в момент, когда
   пользователь выбрал его чипом в карусели и нажал «Продолжить»
   (см. confirmPick), то есть usedItems и есть «критерии, отмеченные для
   уточнения». Блок появляется в списке при первом же попавшем туда поле
   из этого блока — порядок блоков в списке следует порядку появления их
   полей в usedItems, который, в свою очередь, следует порядку клика по
   чипам (S.picked → confirmPick). Пример из требований («выбрал
   Заказчика и Тип торгов» → блоки «Заказчик, Параметры закупки» именно
   в этом порядке) воспроизводится этой логикой без каких-либо дополнительных
   допущений.

   Галочка у блока — когда ВСЕ поля этого блока, что пользователь выбрал
   для уточнения, уже обработаны: либо у них реально есть значение в
   S.filters, либо они осознанно пропущены («Не важно» / «Пропустить
   вопрос» — S.skipped). Раньше «обработано» определялось косвенно —
   через позицию поля в активной очереди вопросов (не встречается среди
   ещё не заданных, S.queue от S.qi и дальше). Это ломалось в ровно
   одном, но частом случае: если ответ на вопрос сразу обнулял выборку
   (total<=5), answerQ()/freeAnswerToQuestion() останавливались ДО
   advanceAfterAnswer() (чтобы не заставлять отвечать на остальные
   вопросы поверх уже показанного «почти ничего не найдено»), а значит
   S.qi не увеличивался — поле формально оставалось «текущим вопросом»
   в S.queue, хотя фильтр по нему уже был реально применён. Из-за этого,
   например, «Тип предмета: Работы» (когда это резко сужало выборку)
   не получало галочку, хотя ответ засчитался. Теперь «обработано»
   смотрит прямо на факт (S.filters/S.skipped), а не на то, продвинулся
   ли указатель активной очереди — поэтому от порядка вопросов и от
   прерывания на обнулении больше не зависит.

   Если пользователь отменяет уже проставленный критерий (кнопка ✕ на
   чипе критерия — removeAppliedFilter, «Назад» — goBack, «Убрать
   критерий» на обнулившейся выборке — removeCriterion), поле удаляется
   из usedItems (и, если было, из skipped), и при следующем рендере блок
   либо снимает галочку (если в блоке остались другие выбранные поля),
   либо пропадает из списка целиком (если это было единственное
   выбранное поле блока) — это и есть «убрать из списка при отмене» из
   требований. */
function fieldResolved(name){
  return S.filters.some(r=>r.f===name) || S.skipped.includes(name);
}
function railSteps(){
  const order = []; const seen = new Set();
  S.usedItems.forEach(it=>{
    const b = BLOCKS.find(bl=>bl.items.includes(it));
    if(b && !seen.has(b.id)){ seen.add(b.id); order.push(b); }
  });
  return order.map(b=>{
    const touched = b.items.filter(it=>S.usedItems.includes(it));
    const done = touched.length>0 && touched.every(fieldResolved);
    return {id:b.id, name:b.n, done};
  });
}
function viewRail(){
  const st = statusInfo();
  const steps = railSteps();
  return `<div class="rp"><div class="pcard">
    <div class="t">Ход подбора</div>
    <div class="prow2"><span class="l">Статус</span><span class="v" style="color:${st.color}">${st.label}</span></div>
    <div class="pbar"><i style="width:${st.pct}%;background:${st.color}"></i></div>
    ${steps.length?`<div class="plist" style="margin-top:12px">
      ${steps.map((s,i)=>`<div class="pitem ${s.done?'ok':''}"><span class="nm">${s.done?'✓':(i+1)}</span>${esc(s.name)}</div>`).join('')}
    </div>`:''}
    <div class="pcrit" onclick="openCritModal()">Критерии подбора: <b class="num">${S.filters.length}</b></div>
    ${hasMoreCriteria()?`<div class="pcrit" onclick="manualRefine()">⊕ Уточнить ещё критерии</div>`:''}
    <div class="pcta" onclick="openGrid()">${fmt(S.total)} процедур</div>
  </div></div>`;
}

/* ---------- отражение ответов диалога в выдаче ----------
   То, что человек указал в диалоге, влияет ТОЛЬКО на выбор процедур
   (S.workingSet), а не на содержимое самих карточек — см. displayProc()
   ниже. filterVal/filterOp здесь больше не нужны и намеренно убраны. */
/* База процедур (PROCS) неизменна и никогда не редактируется под запрос —
   что человек ввёл в диалоге, влияет ТОЛЬКО на то, какие процедуры попадают
   в S.workingSet (см. rankMatches/REAL_FILTER_PRED/addFilter), а не на то,
   что написано в самих карточках. Раньше здесь была «косметическая»
   подмена: если у конкретной позиции реального совпадения с ответом не
   было, в карточку вместо настоящих данных подставлялся сырой текст
   ответа (например, введённое наименование заказчика) — то есть база как
   будто редактировалась под пользователя. Это и создавало путаницу.
   displayProc() теперь ничего не подменяет — только готовит служебное
   nmckDisplay (текстовое представление цены) для рендера. */
function displayProc(p){
  return { ...p, nmckDisplay: p.nmck===null ? null : money(p.nmck) };
}

/* ---------- GRID ---------- */
/* Поля сортировки — по скриншоту макета. Двухуровневое меню: сначала поле,
   потом направление (по возрастанию / по убыванию) — оба списка видны
   одновременно, второй справа от первого, выбор направления применяет
   сортировку сразу. null-значения (например, нет обеспечения) всегда в
   конце списка независимо от направления. */
const SORT_FIELDS={
 nmck:{label:'НМЦК', get:p=>p.nmck},
 end:{label:'Дата приема предложений', get:p=>p.days},
 pub:{label:'Дата публикации', get:p=>p.pubDays},
 region:{label:'Регион', get:p=>p.place},
 cust:{label:'Заказчик', get:p=>p.cust},
 backing:{label:'Размер обеспечения', get:p=>p.contractBackingSize},
 advance:{label:'Размер аванса', get:p=>p.prepaidExpense},
};
function openGrid(){ S.gridOpen=true; S.gridPage=0; render(); }
function sortArr(arr){
  const def = SORT_FIELDS[S.sortField] || SORT_FIELDS.pub;
  const dir = S.sortDir==='asc' ? 1 : -1;
  arr.sort((a,b)=>{
    const av=def.get(a), bv=def.get(b);
    const aNull = av===null || av===undefined;
    const bNull = bv===null || bv===undefined;
    if(aNull && bNull) return 0;
    if(aNull) return 1; /* без значения — всегда в конце */
    if(bNull) return -1;
    if(typeof av==='string') return dir*av.localeCompare(bv,'ru');
    return dir*(av-bv);
  });
  return arr;
}
/* Используется для папок/шаблонов — сортировка по ВСЕМ процедурам без привязки к запросу текущего чата. */
function sortedProcs(){ return sortArr(PROCS.slice()); }
/* Используется в живом гриде выдачи — только то, что реально относится к текущему запросу
   и прошедшим фильтрам (см. rankMatches/REAL_FILTER_PRED), а не весь каталог. */
function sortedResultProcs(){
  /* Раньше пустой S.workingSet тихо подменялся всем каталогом («чтобы не
     показывать пустоту») — это ровно то нечестное поведение, от которого
     теперь явно отказались (см. комментарий у computeStages()): честный
     ноль остаётся нулём и здесь, viewGrid() показывает пустое состояние
     явно, а не весь каталог вместо результата. */
  const ids = S.workingSet || [];
  const arr = ids.map(id=>PROCS_BY_ID.get(id)).filter(Boolean);
  return sortArr(arr);
}
function sortLabel(){
  const def = SORT_FIELDS[S.sortField] || SORT_FIELDS.pub;
  return `${def.label} (${S.sortDir==='asc'?'по возр.':'по убыв.'})`;
}
function toggleSortMenu(){
  if(S.openDD==='sort'){ S.openDD=null; S.sortPendingField=null; }
  else { S.openDD='sort'; S.sortPendingField=null; }
  render();
}
function pickSortField(key){ S.sortPendingField=key; render(); }
function pickSortDir(dir){
  S.sortField=S.sortPendingField; S.sortDir=dir;
  S.sortPendingField=null; S.openDD=null; render();
}
function sortBtn(){
  const open = S.openDD==='sort';
  return `<span class="gbtn ddwrap" data-dd="sort" style="padding:0;position:relative">
    <button type="button" style="padding:6px 11px;display:flex;align-items:center;gap:6px" onclick="event.stopPropagation();toggleSortMenu()">↕ ${sortLabel()}</button>
    ${open?`<div class="ddmenu">${Object.keys(SORT_FIELDS).map(k=>`<div class="ddopt ${(S.sortPendingField?S.sortPendingField===k:S.sortField===k)?'on':''}"
      onclick="event.stopPropagation();pickSortField('${k}')">${SORT_FIELDS[k].label}</div>`).join('')}</div>`:''}
    ${S.sortPendingField?`<div class="ddmenu" style="left:calc(100% + 8px);top:0;min-width:170px">
      <div class="ddopt" onclick="event.stopPropagation();pickSortDir('asc')">по возрастанию</div>
      <div class="ddopt" onclick="event.stopPropagation();pickSortDir('desc')">по убыванию</div>
    </div>`:''}
  </span>`;
}
function selectAllVisible(){ S.checked = sortedResultProcs().map(p=>p.id); render(); }
function gridKebab(){
  const open = S.openDD==='gridkebab';
  return `<span class="ddwrap" data-dd="gridkebab" style="position:relative">
    <button class="kb" onclick="event.stopPropagation();toggleDD('gridkebab')">⋮</button>
    ${open?`<div class="ddmenu" style="right:0;left:auto;min-width:210px">
      <div class="ddopt" onclick="event.stopPropagation();S.openDD=null;selectAllVisible()">✓ Выбрать все</div>
      <div class="ddopt" onclick="event.stopPropagation();S.openDD=null;openSaveTemplateModal()">📄 Сохранить критерии</div>
    </div>`:''}
  </span>`;
}
/* Грид открывает РЕАЛЬНЫЕ процедуры (S.workingSet) постранично, а не
   одним длинным списком. GRID_PAGE_SIZE — сколько карточек на странице. */
const GRID_PAGE_SIZE = 20;
/* Перелистывание вперёд за пределы того, что реально сгенерировано под
   запрос (см. genQueryProcs) — не рисуем пустую страницу и не выдумываем
   дополнительные строки, а показываем то же информационное сообщение
   (toast), что и в остальных местах приложения, и остаёмся на последней
   странице с настоящими карточками. Кнопка «Далее» намеренно не блокируется
   заранее (в отличие от «Назад») — по просьбе заказчика (10.08.2026):
   «если пользователь захочет открыть выборку до существенного сужения —
   просто показываем грид с тем, что есть, а на next-е — информационное
   сообщение», а не подряд задизейбленную кнопку. */
function gridPage(delta){
  const totalPagesReal = Math.max(1, Math.ceil(sortedResultProcs().length/GRID_PAGE_SIZE));
  const next = (S.gridPage||0) + delta;
  if(delta>0 && next>=totalPagesReal){
    toast('Показаны все процедуры, доступные по вашим критериям сейчас — новые обновляются в реальном времени.');
    return;
  }
  S.gridPage = Math.max(0, Math.min(totalPagesReal-1, next));
  render();
}
function viewGrid(){
  const list = sortedResultProcs();
  const totalPagesReal = Math.max(1, Math.ceil(list.length/GRID_PAGE_SIZE));
  const page = Math.min(S.gridPage||0, totalPagesReal-1);
  const pageList = list.slice(page*GRID_PAGE_SIZE, page*GRID_PAGE_SIZE+GRID_PAGE_SIZE);
  return `<div class="gcol">
    <div class="gh">
      <div class="gh1">
        ${S.mode==='filters'?'':`<button class="x" onclick="S.gridOpen=false;S.cardOpen=false;S.cardAnimId=null;render()">×</button>`}
        <span class="t">${esc((S.query||'Подборка').trim())}</span><span class="c num">${fmt(list.length)}</span>
        ${gridKebab()}
      </div>
      <div class="gh2">
        ${sortBtn()}
        <button class="gbtn" onclick="openCritModal()">☰ Критерии<span class="bdg num">${S.filters.length}</span></button>

      </div>
    </div>
    <div class="gsc">
      ${list.length ? pageList.map(p=>prow(p)).join('') : `<div style="padding:30px 6px;color:var(--ink4);font-size:13px;text-align:center">По этим критериям процедур нет.</div>`}
    </div>
    ${list.length?`<div class="gpager">
      <button class="gpbtn" onclick="gridPage(-1)" ${page<=0?'disabled':''}>‹ Назад</button>
      <span class="gpinfo">Стр. ${page+1}</span>
      <button class="gpbtn" onclick="gridPage(1)">Далее ›</button>
    </div>`:''}
    ${S.checked.length?bulkLive():''}
  </div>`;
}
function prow(p0, ctx){
  const p = displayProc(p0);
  const on=S.curProc&&S.curProc.id===p.id;
  const ck=S.checked.includes(p.id);
  const long=p.n.length>58;
  const nm=long?esc(p.n.slice(0,56))+'…':esc(p.n);
  const kebab = ctx ? `<span class="ddwrap" data-dd="fk-${p.id}" style="position:relative;margin-left:auto" onclick="event.stopPropagation()">
      <button class="fkb" onclick="event.stopPropagation();toggleDD('fk-${p.id}')">⋮</button>
      ${S.openDD==='fk-'+p.id?`<div class="ddmenu" style="right:0;left:auto;min-width:200px">
        ${ctx.archived
          ?`<div class="ddopt" onclick="event.stopPropagation();restoreFromArchive('${esc(ctx.folder)}','${p.id}')">↩ Вернуть из архива</div>`
          :`<div class="ddopt" onclick="event.stopPropagation();archiveItem('${esc(ctx.folder)}','${p.id}')">📦 В архив</div>`}
        <div class="ddopt" style="color:var(--red)" onclick="event.stopPropagation();removeFromFolder('${esc(ctx.folder)}','${p.id}')">🗑 Удалить из подборки</div>
      </div>`:''}
    </span>` : '';
  return `<div class="prow ${on?'on':''}" onclick="openCard('${p.id}')">
    <span class="cb ${ck?'on':''}" onclick="event.stopPropagation();chk('${p.id}')">${ck?'✓':''}</span>
    <div class="pin">
      <div class="pr1"><div class="nm">${nm}</div>
        <div class="pz ${p.nmckDisplay===null?'no':''}">${p.nmckDisplay===null?'НМЦ не указано':esc(p.nmckDisplay)}</div>${kebab}</div>
      <div class="pr2"><span>${esc(p.cust)}</span><span>·</span><span>${esc(p.tt)}</span><span>·</span><span>${esc(p.place)}</span></div>
      <div class="pr3">
        ${p.urgent?'<span class="urg">Успейте подать предложение</span>':`<span class="days">${p.days<1?Math.round(p.days*24)+' ч.':p.days+' дн.'}</span>`}
      </div>
    </div>
  </div>`;
}
function chk(id){ const i=S.checked.indexOf(id); i>=0?S.checked.splice(i,1):S.checked.push(id); render(); }

/* ---------- сохранение процедур в подборку (папку) ----------
   Всплывающее окно вместо выпадающего меню: заголовок с числом выбранных
   процедур, поле «Новая подборка» с предзаполненным именем вида
   «Запрос_ДД_ММ_ГГГГ» и список уже существующих подборок как альтернативных
   получателей — клик по подборке выбирает её (переключатель: повторный клик
   снимает выбор и возвращает к созданию новой). */
function defaultFolderName(){
  const q = (S.query||'Подборка').trim().replace(/\s+/g,' ');
  const short = q.length>40 ? q.slice(0,40) : q;
  const d = new Date();
  const pad = n=>String(n).padStart(2,'0');
  return `${short}_${pad(d.getDate())}_${pad(d.getMonth()+1)}_${d.getFullYear()}`;
}
function openSaveModal(ids){
  if(!ids || !ids.length) return;
  S.saveIds = ids.slice();
  S.saveSelectedFolder = null;
  S.saveNewName = defaultFolderName();
  S.saveModalOpen = true;
  S.openDD = null;
  render();
}
function closeSaveModal(){ S.saveModalOpen=false; render(); }
function selectSaveFolder(name){ S.saveSelectedFolder = (S.saveSelectedFolder===name?null:name); render(); }
function doSave(navigate){
  let target = S.saveSelectedFolder;
  if(!target){
    const name = (S.saveNewName||'').trim();
    if(!name){ toast('Введите название подборки'); return; }
    if(!findFolder(name)) FOLDERS_ACTIVE.unshift({n:name, d:'Сегодня', items:[]});
    target = name;
  }
  saveToFolder(target, S.saveIds, /*silent*/true);
  S.saveModalOpen = false;
  if(navigate){ S.navScreen='folders'; openFolder(target); }
  else { toast(`Сохранено в «${target}»`); render(); }
}
function renderSaveModal(){
  const usingExisting = !!S.saveSelectedFolder;
  return `<div class="modalbg" onclick="if(event.target===this)closeSaveModal()">
    <div class="modalcard" style="max-width:560px">
      <div class="mhead"><span class="mtitle">Сохранить процедуры <span class="num" style="color:var(--ink3)">${S.saveIds.length}</span></span>
        <button class="mx" onclick="closeSaveModal()">×</button></div>
      <div class="sffield ${usingExisting?'':'on'}">
        <div class="sflabel">Новая подборка <span style="color:var(--red)">*</span></div>

function saveToFolder(folderName, ids, silent){
  const f = findFolder(folderName);
  let added=0;
  ids.forEach(id=>{ if(!f.items.some(i=>i.id===id)){ f.items.push({id, archived:false}); added++; } });
  S.openDD=null; S.checked=[];
  if(!silent) toast(added ? `Сохранено в «${folderName}» (${added})` : `Уже есть в «${folderName}»`);
  render();
}
function archiveItem(folderName,id){ const f=findFolder(folderName); const it=f.items.find(i=>i.id===id); if(it) it.archived=true; S.openDD=null; render(); }
function restoreFromArchive(folderName,id){ const f=findFolder(folderName); const it=f.items.find(i=>i.id===id); if(it) it.archived=false; S.openDD=null; render(); }
function removeFromFolder(folderName,id){ const f=findFolder(folderName); f.items=f.items.filter(i=>i.id!==id); S.checked=S.checked.filter(x=>x!==id); S.openDD=null; render(); }

   на обычной высоте экрана это не помещается. Делим на две колонки

   защита на случай маленького окна/особо длинного списка (по просьбе

  const p = displayProc(S.curProc);

    <thead><tr style="font-size:10px;text-transform:uppercase;color:var(--ink4);text-align:left">
      <th style="padding:0 8px 6px">Критерий</th><th style="padding:0 8px 6px">Значение</th><th style="padding:0 8px 6px">Источник</th><th style="padding:0 8px 6px">В подборе</th></tr></thead>
    <tbody>${rowsHtml(arr)}</tbody>

  const html = `<div style="position:fixed;inset:0;background:rgba(27,30,43,.42);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px" onclick="if(event.target===this)this.remove()">
    <div style="background:#fff;border-radius:16px;width:100%;max-width:1040px;max-height:94vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(27,30,43,.3)">

        <span style="font-size:15px;font-weight:700;flex:1">Все критерии</span>
        <button onclick="this.closest('div[style*=fixed]').remove()" style="font-size:18px;color:var(--ink3)">×</button></div>
      <div style="padding:14px 20px;display:flex;gap:20px;overflow-y:auto">
        <div style="flex:1;min-width:0">${tableHtml(rowData.slice(0,mid))}</div>
        <div style="flex:1;min-width:0;border-left:1px solid var(--line);padding-left:20px">${tableHtml(rowData.slice(mid))}</div>
      </div>
    </div></div>`;
  const d=document.createElement('div'); d.innerHTML=html; document.body.appendChild(d.firstElementChild);
}

/* ---------- фильтрация и критерии ВНУТРИ подборки ----------
   Те же дропдауны поля/оператора/значения (ddField/valueField/selectDD,
   scope='folder' → S.folderFilters), тот же движок реальных предикатов
   (REAL_FILTER_PRED), что и в живом гриде выдачи — только применяются не
   ко всей базе, а к процедурам, которые УЖЕ сохранены в этой подборке. */
function folderBaseProcs(){
  const f = findFolder(S.curFolder);
  if(!f) return [];
  const shown = f.items.filter(i=>S.folderItemsTab==='active' ? !i.archived : i.archived);
  return shown.map(i=>PROCS_BY_ID.get(i.id)).filter(Boolean);
}
function applyFolderFilters(arr){
  /* Тот же «предохранитель», что был везде в основном поиске (тихо
     оставлял предыдущий непустой шаг при настоящем нуле) — убран по тому
     же принципу: честный ноль внутри подборки тоже должен остаться нулём,
     а не молча откатываться на шаг назад (найдено сквозным аудитом,
     13.08.2026). */
  S.folderFilters.forEach(r=>{
    const pred = REAL_FILTER_PRED[r.f];
    if(pred){ arr = arr.filter(p=>pred(p, r.v, r.o)); }
  });
  return arr;
}
